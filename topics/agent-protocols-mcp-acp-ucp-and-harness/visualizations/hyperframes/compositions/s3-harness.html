    <div class="badge">Knowledge Book · Agent protocols</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 1760 660">
        <defs>
          <marker id="s3-ah-g" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#aab3c2"/></marker>
          <marker id="s3-ah-r" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#ff4d6d"/></marker>
          <marker id="s3-ah-gr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#3dba7a"/></marker>

        <path id="s3-t2" d="M 640 330 L 715 330" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah-g)" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s3-t3" d="M 890 140 L 890 235" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah-g)" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s3-t4" d="M 890 520 L 890 425" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah-g)" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s3-t5" d="M 1060 300 L 1175 300" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah-g)" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s3-t7" d="M 1180 370 L 1065 370" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah-r)" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s3-t6" d="M 1490 340 L 1615 340" fill="none" stroke="#3dba7a" stroke-width="6" stroke-linecap="round" marker-end="url(#s3-ah-gr)" stroke-dasharray="0 9999" opacity="0"/>

      <div id="s3-cap2" class="cap"><b class="g">Verify</b> смотрит на side effect — тесты, hooks, браузер, — а не на слова агента: <b class="r">fail</b> → ещё круг</div>
      <div id="s3-cap3" class="cap key">Протоколы — провода, harness выбирает и ограничивает их. Не промптить сильнее, а чинить harness</div>

<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const box = (id, t) => tl.fromTo(id, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, t);
    const arrow = (id, len, t, d = 0.4) => tl.fromTo(id, { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": len + " 9999" }, duration: d, ease: "power2.inOut" }, t);
    const packet = (id, dx, t, d = 0.7) => {
      tl.set(id, { x: 0 }, t); tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t);
      tl.to(id, { x: dx, duration: d, ease: "power1.inOut" }, t + 0.2);
      tl.to(id, { opacity: 0, duration: 0.2 }, t + 0.2 + d);
    };

    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-hrect", { opacity: 0 }, { opacity: 0.8, duration: 0.6 }, 0.3);
    tl.fromTo("#s3-hlbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.5);
    // Компоненты harness по схеме README: задача → rules → loop; MCP и guardrails входят в loop
    box("#s3-task", 0.5);
    arrow("#s3-t1", 95, 1.0); box("#s3-rules", 1.3);
    arrow("#s3-t2", 75, 1.8);
    tl.fromTo("#s3-loop", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 2.1);
    box("#s3-mcp", 2.6); arrow("#s3-t3", 95, 2.9);
    box("#s3-guard", 3.1); arrow("#s3-t4", 95, 3.4);
    cap("#s3-cap1", 0.6, 5.0);
    box("#s3-verify", 3.8); arrow("#s3-t5", 115, 4.1);
    tl.fromTo("#s3-done", { opacity: 0, y: 24 }, { opacity: 0.45, y: 0, duration: 0.5, ease: "power2.out" }, 4.4);

    // Круг 1: loop → verify → fail → обратно в loop
    cap("#s3-cap2", 5.2, 9.6);
    packet("#s3-pk1", 120, 5.4, 0.7);
    tl.to("#s3-verify", { borderColor: "#ff4d6d", duration: 0.3 }, 6.3);
    tl.fromTo("#s3-vfail", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.3);
    arrow("#s3-t7", 115, 6.5); tl.fromTo("#s3-lfail", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.7);
    packet("#s3-pk2", -120, 6.9, 0.7);
    tl.fromTo("#s3-loop", { scale: 1 }, { scale: 1.06, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 7.7);
    // Круг 2: pass → Done
    packet("#s3-pk3", 120, 8.4, 0.7);
    tl.to("#s3-vfail", { opacity: 0, duration: 0.3 }, 9.3);
    tl.to("#s3-lfail", { opacity: 0, duration: 0.3 }, 9.3);
    tl.to("#s3-t7", { opacity: 0, duration: 0.3 }, 9.3);
    tl.to("#s3-verify", { borderColor: "#3dba7a", duration: 0.3 }, 9.3);
    tl.fromTo("#s3-vpass", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.3);
    arrow("#s3-t6", 125, 9.6); tl.fromTo("#s3-lpass", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.8);
    packet("#s3-pk4", 130, 9.9, 0.6);
    tl.to("#s3-done", { opacity: 1, duration: 0.4 }, 10.6);
    tl.fromTo("#s3-done", { scale: 1 }, { scale: 1.1, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 10.7);

    // Ключевая идея + формула из README
    cap("#s3-cap3", 9.9, 0);
    tl.fromTo("#s3-formula", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 10.8);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 13.5);
    window.__timelines["s3"] = tl;
  })();
</script>
