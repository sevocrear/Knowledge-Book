<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-wrap .title { font-size: 42px; }
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 10px; width: 700px; }
  #s1-c1 .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 30px; }
  #s1-c1 .row span:first-child { color: #aab3c2; }
  #s1-c1 .row b { color: #4a9eff; }
  #s1-c2 { left: 1060px; top: 370px; width: 700px; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Почему Random Search бьёт Grid Search?</div></div>
    <div class="badge">Knowledge Book · Hyperparameter tuning</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <!-- панель Grid -->
        <g id="s1-gpanel" opacity="0">
          <text x="240" y="44" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700">Grid Search · 3 × 3 = 9 точек</text>
          <rect x="40" y="62" width="400" height="400" rx="14" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
          <line x1="173.3" y1="62" x2="173.3" y2="462" stroke="#2a3140" stroke-width="2"/>
          <line x1="306.7" y1="62" x2="306.7" y2="462" stroke="#2a3140" stroke-width="2"/>
          <line x1="40" y1="195.3" x2="440" y2="195.3" stroke="#2a3140" stroke-width="2"/>
          <line x1="40" y1="328.7" x2="440" y2="328.7" stroke="#2a3140" stroke-width="2"/>
          <text x="22" y="262" text-anchor="middle" fill="#aab3c2" font-size="22" transform="rotate(-90 22 262)">неважный гиперпараметр ↑</text>
        </g>
        <!-- панель Random -->
        <g id="s1-rpanel" opacity="0">
          <text x="740" y="44" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700">Random Search · 9 точек</text>
          <rect x="540" y="62" width="400" height="400" rx="14" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
        </g>
        <!-- полосы качества (иллюстративно) под панелями -->
        <g id="s1-gstrip" opacity="0">
          <line x1="40" y1="600" x2="440" y2="600" stroke="#aab3c2" stroke-width="3"/>
          <text x="240" y="640" text-anchor="middle" fill="#aab3c2" font-size="22">важный гиперпараметр →</text>
          <text x="44" y="518" fill="#aab3c2" font-size="18">качество (иллюстративно)</text>
        </g>
        <g id="s1-rstrip" opacity="0">
          <line x1="540" y1="600" x2="940" y2="600" stroke="#aab3c2" stroke-width="3"/>
          <text x="740" y="640" text-anchor="middle" fill="#aab3c2" font-size="22">важный гиперпараметр →</text>
          <text x="544" y="518" fill="#aab3c2" font-size="18">качество (иллюстративно)</text>
        </g>
        <polyline id="s1-gcurve" points="" fill="none" stroke="#3dba7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999" opacity="0"/>
        <polyline id="s1-rcurve" points="" fill="none" stroke="#3dba7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999" opacity="0"/>
        <g id="s1-gproj"></g>
        <g id="s1-rproj"></g>
        <g id="s1-gpts"></g>
        <g id="s1-rpts"></g>
        <g id="s1-peak" opacity="0">
          <polygon points="304,586 296,572 312,572" fill="#ff4d6d"/>
          <text x="178" y="558" text-anchor="middle" fill="#ff4d6d" font-size="22" font-weight="700">пик пропущен →</text>
        </g>
        <g id="s1-rpeak" opacity="0">
          <text x="650" y="558" text-anchor="middle" fill="#3dba7a" font-size="22" font-weight="700">рядом с пиком →</text>
        </g>
        <text id="s1-gcnt" x="240" y="490" text-anchor="middle" fill="#4a9eff" font-size="26" font-weight="700" opacity="0">3 уникальных значения</text>
        <text id="s1-rcnt" x="740" y="490" text-anchor="middle" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0">9 уникальных значений</text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Grid Search: n<sup>d</sup> экспериментов</div>
        <div class="row"><span>d = 2, n = 5</span><b>25</b></div>
        <div class="row"><span>d = 3, n = 5</span><b>125</b></div>
        <div class="row"><span>d = 5, n = 5</span><b>3 125</b></div>
        <div class="row"><span>d = 8, n = 5</span><b>390 625</b></div>
        <div style="font-size:24px;color:#aab3c2;margin-top:8px">пример: learning_rate ∈ {0.001, 0.01, 0.1} × max_depth ∈ {3, 5, 7} → 9 комбинаций</div></div>
      <div id="s1-c2" class="card"><div class="h">Random Search · Bergstra &amp; Bengio, 2012</div>
        <div class="f">n<sup>d</sup> точек → n<sup>d</sup> уникальных значений <span class="o">каждого</span> гиперпараметра</div>
        <div style="font-size:26px;color:#aab3c2;margin-top:8px">если реально важны d<sub>eff</sub> ≪ d — экспоненциально эффективнее сетки</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap"><b class="b">Grid Search</b> перебирает все комбинации сетки: 3 × 3 = 9 экспериментов, а при d гиперпараметрах — <b>n<sup>d</sup></b></div>
      <div id="s1-cap2" class="cap">Проекция на <b>важную ось</b>: у сетки лишь <b class="b">3</b> уникальных значения — пик качества «между узлами» <b class="r">пропущен</b></div>
      <div id="s1-cap3" class="cap"><b class="o">Random Search</b>: те же 9 точек дают <b class="o">9</b> уникальных значений важного параметра и попадают ближе к пику</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    // Панели: grid x 40..440, random x 540..940; y 62..462 (v=0 внизу). Полоса качества: базовая y=600, высота 95.
    const px = (x0, u) => x0 + 400 * u, py = v => 462 - 400 * v;
    const q = u => Math.exp(-Math.pow((u - 0.66) / 0.13, 2));          // «качество» как функция важного параметра (иллюстративно)
    const qy = u => 600 - 95 * q(u);
    const curvePts = x0 => { const a = []; for (let i = 0; i <= 40; i++) { const u = i / 40; a.push(`${px(x0, u).toFixed(1)},${qy(u).toFixed(1)}`); } return a.join(" "); };
    const curveLen = x0 => { let s = 0; for (let i = 1; i <= 40; i++) s += Math.hypot(10, qy(i / 40) - qy((i - 1) / 40)); return s.toFixed(1); };
    document.getElementById("s1-gcurve").setAttribute("points", curvePts(40));
    document.getElementById("s1-rcurve").setAttribute("points", curvePts(540));

    // Точки сетки: 3 уникальных значения по каждой оси; случайные точки: 9 уникальных значений (детерминированные координаты).
    const gridU = [1 / 6, 0.5, 5 / 6];
    const gridPts = []; gridU.forEach(u => gridU.forEach(v => gridPts.push([u, v])));
    const randPts = [[0.66, 0.18], [0.21, 0.72], [0.86, 0.45], [0.08, 0.30], [0.58, 0.88], [0.47, 0.12], [0.95, 0.78], [0.34, 0.55], [0.74, 0.62]];
    const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); parent.appendChild(el); return el; };
    const build = (pts, x0, color, pre) => {
      const gp = document.getElementById(`s1-${pre}pts`), gj = document.getElementById(`s1-${pre}proj`);
      const dots = pts.map(([u, v], i) => mk("circle", { id: `s1-${pre}p${i}`, cx: px(x0, u).toFixed(1), cy: py(v).toFixed(1), r: 11, fill: color, opacity: 0 }, gp));
      // Уникальные значения по важной оси: у сетки 3 (столбцы), у random 9.
      const us = [...new Set(pts.map(p => p[0]))].sort((a, b) => a - b);
      const cols = us.map((u, i) => {
        const g = mk("g", { id: `s1-${pre}col${i}`, opacity: 0 }, gj);
        const x = px(x0, u).toFixed(1);
        mk("line", { x1: x, y1: py(Math.max(...pts.filter(p => p[0] === u).map(p => p[1]))).toFixed(1), x2: x, y2: 600, stroke: color, "stroke-width": 2, "stroke-opacity": 0.45 }, g);
        mk("rect", { x: (px(x0, u) - 3).toFixed(1), y: 594, width: 6, height: 20, rx: 2, fill: color }, g);
        mk("circle", { cx: x, cy: qy(u).toFixed(1), r: 7, fill: "#0f1117", stroke: color, "stroke-width": 3 }, g);
        return g;
      });
      return { dots, cols };
    };
    const G = build(gridPts, 40, "#4a9eff", "g");
    const Rn = build(randPts, 540, "#ff7a2f", "r");

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-gpanel", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.3);
    G.dots.forEach((el, i) => tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.7 + 0.08 * i));
    cap("#s1-cap1", 0.6, 4.6);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.2);
    // Проекция сетки на важную ось.
    cap("#s1-cap2", 4.8, 8.8);
    tl.fromTo("#s1-gstrip", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.9);
    tl.fromTo("#s1-gcurve", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.0);
    tl.fromTo("#s1-gcurve", { attr: { "stroke-dasharray": "0 9999" } }, { immediateRender: false, attr: { "stroke-dasharray": curveLen(40) + " 9999" }, duration: 0.9, ease: "power2.inOut" }, 5.0);
    G.cols.forEach((g, i) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.35 }, 5.8 + 0.3 * i));
    tl.fromTo("#s1-gcnt", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.8);
    tl.fromTo("#s1-peak", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.2);
    // Random Search.
    tl.fromTo("#s1-rpanel", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 7.4);
    Rn.dots.forEach((el, i) => tl.fromTo(el, { opacity: 0, scale: 0.4, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 7.7 + 0.08 * i));
    cap("#s1-cap3", 9.0, 13.1);
    tl.fromTo("#s1-rstrip", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.1);
    tl.fromTo("#s1-rcurve", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 9.2);
    tl.fromTo("#s1-rcurve", { attr: { "stroke-dasharray": "0 9999" } }, { immediateRender: false, attr: { "stroke-dasharray": curveLen(540) + " 9999" }, duration: 0.9, ease: "power2.inOut" }, 9.2);
    Rn.cols.forEach((g, i) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.9 + 0.12 * i));
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.8);
    tl.fromTo("#s1-rcnt", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.1);
    tl.fromTo("#s1-rpeak", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.4);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.45 }, 13.5);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
