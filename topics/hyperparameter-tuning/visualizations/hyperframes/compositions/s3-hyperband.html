<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-wrap .title { font-size: 42px; }
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 0px; width: 700px; font-size: 27px; }
  #s3-c1 .h { font-size: 22px; }
  #s3-c1 .row { display: flex; justify-content: space-between; padding: 2px 0; opacity: 0.45; }
  #s3-c1 .row span:first-child { color: #aab3c2; }
  #s3-c1 .row b { color: #ff7a2f; }
  #s3-c2 { left: 1060px; top: 350px; width: 700px; font-size: 27px; line-height: 1.3; }
  #s3-c2 .f { font-size: 32px; margin-top: 6px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Зачем обрывать слабые конфигурации рано?</div></div>
    <div class="badge">Knowledge Book · Hyperparameter tuning</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <g id="s3-ax" opacity="0">
          <line x1="80" y1="520" x2="930" y2="520" stroke="#aab3c2" stroke-width="3"/>
          <line x1="80" y1="520" x2="80" y2="60" stroke="#aab3c2" stroke-width="3"/>
          <text x="90" y="52" fill="#aab3c2" font-size="22">val accuracy ↑</text>
          <text x="80" y="556" text-anchor="middle" fill="#aab3c2" font-size="22">старт</text>
          <text x="285" y="556" text-anchor="middle" fill="#aab3c2" font-size="22">1 эпоха</text>
          <text x="490" y="556" text-anchor="middle" fill="#aab3c2" font-size="22">2 эпохи</text>
          <text x="695" y="556" text-anchor="middle" fill="#aab3c2" font-size="22">4 эпохи</text>
          <text x="900" y="556" text-anchor="middle" fill="#aab3c2" font-size="22">8 эпох</text>
          <text x="505" y="600" text-anchor="middle" fill="#aab3c2" font-size="22">бюджет удваивается каждый раунд · 8 конфигураций (иллюстративно)</text>
        </g>
        <g id="s3-curves"></g>
        <g id="s3-cuts"></g>
        <g id="s3-cut1" opacity="0"><line x1="285" y1="520" x2="285" y2="96" stroke="#ff4d6d" stroke-width="2" stroke-dasharray="8 8"/><text x="285" y="114" text-anchor="middle" fill="#ff4d6d" font-size="22" font-weight="700">оставить 4</text></g>
        <g id="s3-cut2" opacity="0"><line x1="490" y1="520" x2="490" y2="96" stroke="#ff4d6d" stroke-width="2" stroke-dasharray="8 8"/><text x="490" y="114" text-anchor="middle" fill="#ff4d6d" font-size="22" font-weight="700">оставить 2</text></g>
        <g id="s3-cut3" opacity="0"><line x1="695" y1="520" x2="695" y2="96" stroke="#ff4d6d" stroke-width="2" stroke-dasharray="8 8"/><text x="695" y="114" text-anchor="middle" fill="#ff4d6d" font-size="22" font-weight="700">оставить 1</text></g>
        <g id="s3-win" opacity="0"><circle cx="900" cy="132.8" r="16" fill="none" stroke="#3dba7a" stroke-width="4"/><text x="906" y="180" text-anchor="end" fill="#3dba7a" font-size="24" font-weight="700">победитель</text></g>
        <g id="s3-cntbox" opacity="0"><rect x="540" y="40" width="390" height="44" rx="10" fill="#161a24" stroke="#2a3140" stroke-width="2"/>
          <text x="554" y="70" fill="#aab3c2" font-size="24">живых конфигураций:</text></g>
        <text id="s3-n8" x="916" y="72" text-anchor="end" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>8</text>
        <text id="s3-n4" x="916" y="72" text-anchor="end" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>4</text>
        <text id="s3-n2" x="916" y="72" text-anchor="end" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>2</text>
        <text id="s3-n1" x="916" y="72" text-anchor="end" fill="#3dba7a" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>1</text>
      </svg>
      <div id="s3-c1" class="card"><div class="h">Successive Halving (Jamieson, Talwalkar 2016)</div>
        <div id="s3-r0" class="row"><span>раунд 0: 64 конфигурации × 1 эпоха</span><b>→ 32</b></div>
        <div id="s3-r1" class="row"><span>раунд 1: 32 × 2 эпохи</span><b>→ 16</b></div>
        <div id="s3-r2" class="row"><span>раунд 2: 16 × 4 эпохи</span><b>→ 8</b></div>
        <div id="s3-r3" class="row"><span>раунд 3: 8 × 8 эпох</span><b>→ 4</b></div>
        <div id="s3-r4" class="row"><span>раунд 4: 4 × 16 эпох</span><b>→ 2</b></div>
        <div id="s3-r5" class="row"><span>раунд 5: 2 × 32 эпохи</span><b>→ 1 победитель</b></div></div>
      <div id="s3-c2" class="card"><div class="h">Hyperband · Li et al., 2018</div>
        <div>несколько brackets Successive Halving: от <b class="o">81</b> конфигураций × 1 эпоха до <b class="o">5</b> × 81 эпоха</div>
        <div class="f"><span class="p">BOHB</span> = <span class="p">TPE</span> (умный выбор λ) + <span class="o">Hyperband</span> (раннее отсечение)</div>
        <div style="font-size:24px;color:#aab3c2;margin-top:6px">Optuna: pruning ≈ Successive Halving / Hyperband</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">Bayesian Optimization тратит <b>полный бюджет</b> на каждую λ. Successive Halving стартует много конфигураций с малым бюджетом: <b class="o">64 × 1 эпоха</b></div>
      <div id="s3-cap2" class="cap">Каждый раунд оставляем <b class="g">лучшую половину</b> и <b>удваиваем бюджет</b>: 64 → 32 → 16 → 8 → 4 → 2 → 1 победитель</div>
      <div id="s3-cap3" class="cap key">Hyperband гоняет несколько таких раундов с разным стартовым бюджетом; <b class="p">BOHB</b> = TPE (умный выбор λ) + Hyperband (раннее отсечение)</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    // Ось: чекпоинты x = [старт, 1, 2, 4, 8 эпох]; accuracy 0..1 → y 520..80. Кривые иллюстративные, детерминированные.
    const CX = [80, 285, 490, 695, 900], Y = a => 520 - 440 * a;
    const accs = [
      [0.10, 0.62, 0.74, 0.82, 0.88], [0.10, 0.58, 0.70, 0.79], [0.10, 0.50, 0.63], [0.10, 0.46, 0.55],
      [0.10, 0.38], [0.10, 0.30], [0.10, 0.22], [0.10, 0.13]];
    const colors = ["#3dba7a", "#4a9eff", "#b48ce6", "#2dd4bf", "#ff7a2f", "#ffd166", "#ff4d6d", "#8ec5ff"];
    const gc = document.getElementById("s3-curves"), gx = document.getElementById("s3-cuts");
    const curves = accs.map((a, i) => {
      const pts = []; // по 4 промежуточных точки на сегмент, вогнутая форма (быстрый рост в начале эпохи)
      for (let s = 0; s < a.length; s++) {
        if (s === 0) { pts.push([CX[0], Y(a[0])]); continue; }
        for (let k = 1; k <= 4; k++) { const t = k / 4; const e = 1 - Math.pow(1 - t, 2); pts.push([CX[s - 1] + (CX[s] - CX[s - 1]) * t, Y(a[s - 1] + (a[s] - a[s - 1]) * e)]); }
      }
      const cum = [0]; for (let j = 1; j < pts.length; j++) cum.push(cum[j - 1] + Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]));
      const el = document.createElementNS(NS, "polyline"); el.setAttribute("id", `s3-cv${i}`);
      el.setAttribute("points", pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" "));
      el.setAttribute("fill", "none"); el.setAttribute("stroke", colors[i]); el.setAttribute("stroke-width", 5); el.setAttribute("stroke-linecap", "round"); el.setAttribute("stroke-linejoin", "round"); el.setAttribute("stroke-dasharray", "0 9999"); el.setAttribute("opacity", "0");
      gc.appendChild(el);
      const lenAt = s => cum[4 * s].toFixed(1);   // длина до чекпоинта s
      let mark = null;
      if (a.length < 5) { mark = document.createElementNS(NS, "text"); mark.setAttribute("id", `s3-x${i}`); mark.setAttribute("x", CX[a.length - 1]); mark.setAttribute("y", (Y(a[a.length - 1]) + 10).toFixed(1));
        mark.setAttribute("text-anchor", "middle"); mark.setAttribute("fill", "#ff4d6d"); mark.setAttribute("font-size", "24"); mark.setAttribute("font-weight", "700"); mark.setAttribute("opacity", "0"); mark.textContent = "✕"; gx.appendChild(mark); }
      return { el, lenAt, mark, rounds: a.length - 1 };
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-ax", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.3);
    tl.fromTo("#s3-cntbox", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
    tl.fromTo("#s3-n8", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
    cap("#s3-cap1", 0.6, 4.6);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.2);
    // Раунды: рисуем сегмент, затем отсечение половины.
    curves.forEach(c => tl.fromTo(c.el, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.9));
    const segT = [0.9, 3.9, 6.3, 8.6], cutT = [3.0, 5.6, 7.9], cutIds = ["#s3-cut1", "#s3-cut2", "#s3-cut3"], cnt = ["#s3-n8", "#s3-n4", "#s3-n2", "#s3-n1"], rows = ["#s3-r0", "#s3-r1", "#s3-r2"];
    for (let s = 0; s < 4; s++) {
      curves.forEach(c => { if (c.rounds >= s + 1) tl.to(c.el, { attr: { "stroke-dasharray": c.lenAt(s + 1) + " 9999" }, duration: 1.6, ease: "power1.inOut" }, segT[s]); });
      if (s < 3) {
        tl.fromTo(cutIds[s], { opacity: 0 }, { opacity: 1, duration: 0.35 }, cutT[s]);
        tl.fromTo(rows[s], { opacity: 0.45 }, { opacity: 1, duration: 0.35 }, cutT[s]);
        curves.forEach(c => { if (c.rounds === s + 1) { tl.to(c.el, { opacity: 0.22, duration: 0.5 }, cutT[s] + 0.1); tl.fromTo(c.mark, { opacity: 0, scale: 0.4, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, cutT[s] + 0.1); } });
        tl.to(cnt[s], { opacity: 0, duration: 0.3 }, cutT[s] + 0.2); tl.to(cnt[s + 1], { opacity: 1, duration: 0.3 }, cutT[s] + 0.2);
      }
    }
    cap("#s3-cap2", 4.8, 9.0);
    ["#s3-r3", "#s3-r4", "#s3-r5"].forEach((id, i) => tl.fromTo(id, { opacity: 0.45 }, { opacity: 1, duration: 0.35 }, 8.6 + 0.3 * i));
    tl.fromTo("#s3-win", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 10.3);
    cap("#s3-cap3", 9.3, 0);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.6);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 13.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
