<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 20px; width: 700px; }
  #s1-c2 { left: 1060px; top: 320px; width: 700px; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Что делает triplet loss?</div></div>
    <div class="badge">Knowledge Book · Metric learning</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <rect x="8" y="8" width="964" height="644" rx="18" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
        <text x="28" y="44" fill="#aab3c2" font-size="24">пространство эмбеддингов z = f(x), ‖z‖₂ = 1 (иллюстративно)</text>
        <!-- фоновые точки других объектов -->
        <g opacity="0.35" fill="#aab3c2">
          <circle cx="760" cy="120" r="6"/><circle cx="820" cy="420" r="6"/><circle cx="700" cy="560" r="6"/>
          <circle cx="120" cy="520" r="6"/><circle cx="880" cy="250" r="6"/><circle cx="640" cy="90" r="6"/>
        </g>
        <!-- граница D_ap + m -->
        <circle id="s1-ring" cx="400" cy="340" r="268.9" fill="none" stroke="#ff7a2f" stroke-width="4" stroke-dasharray="16 12" opacity="0"/>
        <text id="s1-ring-lbl" x="604" y="540" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0">D<tspan font-size="18" dy="6">ap</tspan><tspan dy="-6"> + m</tspan></text>
        <!-- расстояния -->
        <line id="s1-lap" x1="400" y1="340" x2="560" y2="260" stroke="#3dba7a" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <line id="s1-lan" x1="400" y1="340" x2="280" y2="230" stroke="#ff4d6d" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <text id="s1-dap" x="500" y="330" fill="#3dba7a" font-size="28" font-weight="700" opacity="0">D<tspan font-size="20" dy="6">ap</tspan></text>
        <text id="s1-dan" x="290" y="300" text-anchor="end" fill="#ff4d6d" font-size="28" font-weight="700" opacity="0">D<tspan font-size="20" dy="6">an</tspan></text>
        <!-- точки -->
        <g id="s1-ga" opacity="0"><circle cx="400" cy="340" r="16" fill="#4a9eff"/><text x="400" y="392" text-anchor="middle" fill="#4a9eff" font-size="30" font-weight="700">a · якорь</text></g>
        <g id="s1-gp" opacity="0"><circle id="s1-p" cx="560" cy="260" r="14" fill="#3dba7a"/><text id="s1-p-lbl" x="582" y="250" fill="#3dba7a" font-size="30" font-weight="700">p · тот же класс</text></g>
        <g id="s1-gn" opacity="0"><circle id="s1-n" cx="280" cy="230" r="14" fill="#ff4d6d"/><text id="s1-n-lbl" x="250" y="206" fill="#ff4d6d" font-size="30" font-weight="700">n · чужой класс</text></g>
        <!-- статус лосса -->
        <text id="s1-st1" x="950" y="628" text-anchor="end" fill="#ff4d6d" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>L &gt; 0: n ближе якоря, чем p</text>
        <text id="s1-st2" x="950" y="628" text-anchor="end" fill="#3dba7a" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>L = 0: D<tspan font-size="20" dy="6">an</tspan><tspan dy="-6"> ≥ D</tspan><tspan font-size="20" dy="6">ap</tspan><tspan dy="-6"> + m</tspan></text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Triplet loss (FaceNet, 2015)</div>
        <div class="f">L = max(0, <span class="g">D<sub>ap</sub></span> − <span class="r">D<sub>an</sub></span> + <span class="o">m</span>)</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">D<sub>ap</sub> — расстояние якорь–positive, D<sub>an</sub> — якорь–negative, m — margin</div></div>
      <div id="s1-c2" class="card"><div class="h">Требование относительное</div>
        <div class="f"><span class="r">D<sub>an</sub></span> ≥ <span class="g">D<sub>ap</sub></span> + <span class="o">m</span> &nbsp;⇒&nbsp; L = 0</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">абсолютные расстояния не фиксируются; типично m = 0.2 (FaceNet), 0.3 (re-ID)</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Якорь <b class="b">a</b>, positive <b class="g">p</b> (тот же класс) и negative <b class="r">n</b> (чужой): лосс сравнивает расстояния <b class="g">D<sub>ap</sub></b> и <b class="r">D<sub>an</sub></b></div>
      <div id="s1-cap2" class="cap"><b>L = max(0, D<sub>ap</sub> − D<sub>an</sub> + m)</b>: negative должен быть дальше positive хотя бы на margin <b class="o">m</b></div>
      <div id="s1-cap3" class="cap">Градиент <b class="g">тянет p</b> к якорю и <b class="r">толкает n</b> за границу D<sub>ap</sub> + m; как только условие выполнено — лосс = 0</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Координаты (иллюстративные, px в viewBox): якорь a, p и n до/после шага градиента.
    const A = [400, 340];
    const P0 = [560, 260], P1 = [490, 300];   // D_ap: 178.9 → 98.5
    const N0 = [280, 230], N1 = [160, 160];   // D_an: 162.8 → 300.0
    const M = 90;                              // margin m (иллюстративно)
    const d = (u, v) => Math.hypot(u[0] - v[0], u[1] - v[1]);
    const R0 = d(A, P0) + M, R1 = d(A, P1) + M; // 268.9 → 188.5

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-ga", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    tl.fromTo("#s1-gp", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
    tl.fromTo("#s1-gn", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
    cap("#s1-cap1", 0.6, 4.6);
    tl.fromTo("#s1-lap", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": d(A, P0).toFixed(1) + " 9999" }, duration: 0.6, ease: "power2.inOut" }, 1.7);
    tl.fromTo("#s1-dap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.2);
    tl.fromTo("#s1-lan", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": d(A, N0).toFixed(1) + " 9999" }, duration: 0.6, ease: "power2.inOut" }, 2.2);
    tl.fromTo("#s1-dan", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.7);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.0);
    // Граница D_ap + m и статус лосса
    cap("#s1-cap2", 4.8, 8.6);
    tl.fromTo("#s1-ring", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 5.0);
    tl.fromTo("#s1-ring-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.4);
    tl.fromTo("#s1-st1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.8);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.2);
    // Шаг градиента: p стягивается к a, n выталкивается за границу; граница сжимается вместе с D_ap.
    cap("#s1-cap3", 8.8, 12.5);
    const T = 9.2, D = 2.0, E = "power2.inOut";
    tl.to("#s1-p", { attr: { cx: P1[0], cy: P1[1] }, duration: D, ease: E }, T);
    tl.to("#s1-p-lbl", { attr: { x: P1[0] + 22, y: P1[1] - 10 }, duration: D, ease: E }, T);
    tl.to("#s1-lap", { attr: { x2: P1[0], y2: P1[1], "stroke-dasharray": d(A, P1).toFixed(1) + " 9999" }, duration: D, ease: E }, T);
    tl.to("#s1-dap", { attr: { x: 455, y: 362 }, duration: D, ease: E }, T);
    tl.to("#s1-n", { attr: { cx: N1[0], cy: N1[1] }, duration: D, ease: E }, T);
    tl.to("#s1-n-lbl", { attr: { x: 176, y: 138 }, duration: D, ease: E }, T);
    tl.to("#s1-lan", { attr: { x2: N1[0], y2: N1[1], "stroke-dasharray": d(A, N1).toFixed(1) + " 9999" }, duration: D, ease: E }, T);
    tl.to("#s1-dan", { attr: { x: 365, y: 232 }, duration: D, ease: E }, T);
    tl.fromTo("#s1-ring", { scale: 1, svgOrigin: "400 340" }, { scale: R1 / R0, svgOrigin: "400 340", duration: D, ease: E, immediateRender: false }, T);
    tl.to("#s1-ring-lbl", { attr: { x: 547, y: 483 }, duration: D, ease: E }, T);
    tl.to("#s1-st1", { opacity: 0, duration: 0.4 }, 10.6);
    tl.to("#s1-st2", { opacity: 1, duration: 0.4 }, 10.6);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 12.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
