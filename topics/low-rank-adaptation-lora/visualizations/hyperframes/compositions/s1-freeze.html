<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 30px; width: 700px; }
  #s1-c2 { left: 1060px; top: 330px; width: 700px; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Почему не обучать все веса W?</div></div>
    <div class="badge">Knowledge Book · LoRA</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <text id="s1-wttl" x="198" y="112" text-anchor="middle" fill="#4a9eff" font-size="40" font-weight="700">W</text>
        <text id="s1-wdim" x="198" y="520" text-anchor="middle" fill="#aab3c2" font-size="28">d × k</text>
        <text id="s1-dlbl" x="10" y="330" text-anchor="middle" fill="#aab3c2" font-size="28">d</text>
        <text id="s1-klbl" x="198" y="140" text-anchor="middle" fill="#aab3c2" font-size="24">k</text>
        <g id="s1-w"></g>
        <g id="s1-dw" opacity="0"></g>
        <text id="s1-dwlbl" x="198" y="560" text-anchor="middle" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0" data-layout-allow-overlap>ΔW во всех d × k ячейках</text>
        <text id="s1-frz" x="198" y="560" text-anchor="middle" fill="#4a9eff" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>заморожена (grad = 0)</text>
        <text id="s1-plus" x="398" y="344" text-anchor="middle" fill="#f0f4ff" font-size="44" font-weight="700" opacity="0">+</text>
        <text id="s1-bttl" x="454" y="112" text-anchor="middle" fill="#3dba7a" font-size="40" font-weight="700" opacity="0">B</text>
        <text id="s1-brl" x="454" y="140" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">r</text>
        <g id="s1-b" opacity="0"></g>
        <text id="s1-bdim" x="454" y="520" text-anchor="middle" fill="#aab3c2" font-size="28" opacity="0">d × r</text>
        <text id="s1-dot" x="504" y="344" text-anchor="middle" fill="#f0f4ff" font-size="44" font-weight="700" opacity="0">·</text>
        <text id="s1-attl" x="698" y="272" text-anchor="middle" fill="#b48ce6" font-size="40" font-weight="700" opacity="0">A</text>
        <text id="s1-arl" x="886" y="338" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">r</text>
        <g id="s1-a" opacity="0"></g>
        <text id="s1-adim" x="698" y="392" text-anchor="middle" fill="#aab3c2" font-size="28" opacity="0">r × k</text>
        <text id="s1-eq" x="698" y="470" text-anchor="middle" fill="#ff7a2f" font-size="34" font-weight="700" opacity="0">ΔW = B · A</text>
        <text id="s1-rk" x="698" y="514" text-anchor="middle" fill="#aab3c2" font-size="26" opacity="0">rank ΔW = r ≪ min(d, k)</text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Full fine-tuning</div><div class="f">W<sub>new</sub> = W + <span class="o">ΔW</span></div><div style="font-size:28px;color:#aab3c2;margin-top:8px">обновляются все d × k весов слоя; на каждую задачу — своя копия модели</div></div>
      <div id="s1-c2" class="card"><div class="h">Гипотеза LoRA</div><div class="f"><span class="o">ΔW</span> = <span class="g">B</span> · <span class="p">A</span>,&nbsp; rank r ≪ min(d, k)</div><div style="font-size:28px;color:#aab3c2;margin-top:8px">B — d × r, A — r × k; r обычно из {1, 2, 4, 8, 16, 32, 64}, старт — r = 8</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Full fine-tuning обновляет всю матрицу <b class="b">W</b> (d × k) — на каждую задачу нужна своя копия модели</div>
      <div id="s1-cap2" class="cap">LoRA <b class="b">замораживает W</b> (градиент = 0) и учит только добавку <b class="o">ΔW</b></div>
      <div id="s1-cap3" class="cap">Гипотеза: у ΔW низкий ранг r ≪ min(d, k) ⇒ <b class="o">ΔW = B · A</b>, где <b class="g">B</b> — d × r, <b class="p">A</b> — r × k</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const cell = (g, id, x, y, fill, op) => {
      const el = document.createElementNS(NS, "rect");
      el.setAttribute("id", id); el.setAttribute("x", x); el.setAttribute("y", y);
      el.setAttribute("width", "22"); el.setAttribute("height", "22"); el.setAttribute("rx", "4");
      el.setAttribute("fill", fill); if (op !== undefined) el.setAttribute("opacity", op);
      g.appendChild(el); return el;
    };
    const N = 14, R = 2, S = 24;
    // W: 14×14 клеток (иллюстративно: d × k), ΔW-оверлей поверх, B: 14×2, A: 2×14.
    const gW = document.getElementById("s1-w"), gD = document.getElementById("s1-dw");
    const gB = document.getElementById("s1-b"), gA = document.getElementById("s1-a");
    const wCells = [], dCells = [], bCells = [], aCells = [];
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      wCells.push([cell(gW, `s1-w-${i}-${j}`, 30 + S * j, 150 + S * i, "#1e3a5f", 0), i, j]);
      dCells.push([cell(gD, `s1-d-${i}-${j}`, 30 + S * j, 150 + S * i, "#ff7a2f", 0), i, j]);
    }
    for (let i = 0; i < N; i++) for (let j = 0; j < R; j++) bCells.push([cell(gB, `s1-b-${i}-${j}`, 430 + S * j, 150 + S * i, "#3dba7a", 0), i, j]);
    for (let i = 0; i < R; i++) for (let j = 0; j < N; j++) aCells.push([cell(gA, `s1-a-${i}-${j}`, 530 + S * j, 306 + S * i, "#b48ce6", 0), i, j]);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    // W появляется по диагоналям
    wCells.forEach(([el, i, j]) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3 + 0.03 * (i + j)));
    cap("#s1-cap1", 0.6, 4.8);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.2);
    // Full FT: ΔW «загорается» во всех ячейках, построчно
    tl.fromTo("#s1-dw", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.8);
    dCells.forEach(([el, i, j]) => tl.fromTo(el, { opacity: 0 }, { opacity: 0.85, duration: 0.25 }, 1.9 + 0.06 * i + 0.012 * j));
    tl.fromTo("#s1-dwlbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.4);
    // Заморозка: оверлей ΔW гаснет, W остаётся синей
    cap("#s1-cap2", 5.0, 9.0);
    tl.to("#s1-dw", { opacity: 0, duration: 0.7, ease: "power2.inOut" }, 5.4);
    tl.to("#s1-dwlbl", { opacity: 0, duration: 0.4 }, 5.4);
    tl.fromTo("#s1-frz", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.9);
    tl.fromTo("#s1-w", { scale: 1, svgOrigin: "198 318" }, { scale: 0.97, svgOrigin: "198 318", duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, 5.6);
    // Разложение: + B · A
    cap("#s1-cap3", 9.2, 13.5);
    tl.fromTo("#s1-plus", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.4);
    tl.fromTo("#s1-b", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 9.5);
    bCells.forEach(([el, i, j]) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 9.5 + 0.04 * i + 0.05 * j));
    tl.fromTo("#s1-bttl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.6);
    tl.fromTo("#s1-brl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.6);
    tl.fromTo("#s1-bdim", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.0);
    tl.fromTo("#s1-dot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.2);
    tl.fromTo("#s1-a", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 10.3);
    aCells.forEach(([el, i, j]) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 10.3 + 0.04 * j + 0.05 * i));
    tl.fromTo("#s1-attl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.4);
    tl.fromTo("#s1-arl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.4);
    tl.fromTo("#s1-adim", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.8);
    tl.fromTo("#s1-eq", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.2);
    tl.fromTo("#s1-rk", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.6);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 11.4);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
