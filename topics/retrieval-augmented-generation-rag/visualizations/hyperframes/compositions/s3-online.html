<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 1760px; height: 660px; display: block; }
  #s3-store { position: absolute; left: 0px; top: 60px; width: 540px; height: 500px; border-radius: 20px; background: #161a24; border: 2px solid #2a3140; overflow: hidden; }
  #s3-map { position: absolute; left: 0; top: 0; width: 540px; height: 500px; display: block; }
  #s3-store-hd { position: absolute; left: 0px; top: 12px; font-size: 30px; font-weight: 700; color: #f0f4ff; }
  #s3-q { position: absolute; left: 600px; top: 40px; width: 500px; padding: 16px 28px; border-radius: 22px; background: #161a24; border: 2px solid #4a9eff; font-size: 28px; white-space: nowrap; line-height: 1.3; color: #e6ebf5; opacity: 0; }
  #s3-q .h { font-size: 22px; color: #aab3c2; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  #s3-qe { position: absolute; left: 600px; top: 166px; width: 560px; font-size: 24px; line-height: 1.3; color: #aab3c2; opacity: 0; white-space: nowrap; }
  #s3-qe b { color: #b48ce6; font-weight: 600; }
  #s3-prompt { position: absolute; left: 600px; top: 230px; width: 460px; height: 290px; border-radius: 20px; background: #161a24; border: 2px solid #ff7a2f; opacity: 0; }
  #s3-prompt .h { position: absolute; left: 30px; top: 18px; font-size: 24px; color: #ff7a2f; letter-spacing: 0.08em; text-transform: uppercase; }
  .s3-line { position: absolute; left: 30px; font-size: 30px; line-height: 1.3; color: #e6ebf5; }
  .s3-line span { color: #aab3c2; }
  .s3-pill { position: absolute; top: 336px; width: 118px; height: 40px; border-radius: 999px; background: rgba(255, 122, 47, 0.16); border: 2px solid #ff7a2f; color: #ff7a2f;
    font-size: 24px; font-weight: 700; line-height: 40px; text-align: center; opacity: 0; }
  #s3-llm { position: absolute; left: 1160px; top: 330px; width: 170px; height: 100px; border-radius: 22px; background: #1e3a5f; border: 3px solid #4a9eff;
    display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800; color: #f0f4ff; opacity: 0; }
  #s3-ans { position: absolute; left: 1400px; top: 230px; width: 360px; height: 330px; border-radius: 20px; background: #161a24; border: 2px solid #3dba7a; opacity: 0; }
  #s3-ans .h { position: absolute; left: 28px; top: 18px; font-size: 24px; color: #3dba7a; letter-spacing: 0.08em; text-transform: uppercase; }
  #s3-ans-txt { position: absolute; left: 28px; top: 60px; width: 304px; font-size: 26px; white-space: nowrap; line-height: 1.3; color: #e6ebf5; opacity: 0; }
  #s3-src-lbl { position: absolute; left: 28px; top: 148px; font-size: 24px; color: #aab3c2; opacity: 0; }
  .s3-src { position: absolute; top: 186px; width: 100px; height: 38px; text-align: center; border-radius: 999px; border: 2px solid #3dba7a; color: #3dba7a; background: rgba(61, 186, 122, 0.12);
    font-size: 22px; font-weight: 700; line-height: 38px; opacity: 0; }
  #s3-post { position: absolute; left: 28px; top: 240px; width: 304px; font-size: 22px; line-height: 1.3; color: #aab3c2; opacity: 0; }
  .s3-stage-lbl { position: absolute; font-size: 22px; color: #aab3c2; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Online: retrieval → augmentation → generation</div></div>
    <div class="badge">Knowledge Book · RAG</div>
    <div class="stage">
      <div id="s3-store-hd">Vector Store <span style="color:#aab3c2;font-weight:400;font-size:24px">· проиндексирован offline</span></div>
      <div id="s3-store">
        <svg id="s3-map" viewBox="0 0 540 500">
          <g stroke="#2a3140" stroke-width="1.5">
            <line x1="0" y1="125" x2="540" y2="125"/><line x1="0" y1="250" x2="540" y2="250"/><line x1="0" y1="375" x2="540" y2="375"/>
            <line x1="135" y1="0" x2="135" y2="500"/><line x1="270" y1="0" x2="270" y2="500"/><line x1="405" y1="0" x2="405" y2="500"/>
          </g>
          <g id="s3-idx" fill="#4a9eff" opacity="0.85"></g>
          <g id="s3-topk" stroke="#f0f4ff" stroke-width="3" stroke-linecap="round">
            <line id="s3-k1" x1="320" y1="160" x2="290" y2="170" stroke-dasharray="0 9999"/>
            <line id="s3-k2" x1="320" y1="160" x2="330" y2="120" stroke-dasharray="0 9999"/>
            <line id="s3-k3" x1="320" y1="160" x2="350" y2="190" stroke-dasharray="0 9999"/>
          </g>
          <g id="s3-new"></g>
          <g fill="#ff7a2f" font-size="20" font-weight="700">
            <text x="346" y="127">chunk 1</text>
            <text x="274" y="177" text-anchor="end">chunk 2</text>
            <text x="366" y="197">chunk 3</text>
            <text x="216" y="307">chunk 4</text>
          </g>
          <circle id="s3-qdot" cx="320" cy="160" r="11" fill="#0f1117" stroke="#f0f4ff" stroke-width="4" opacity="0"/>
          <text id="s3-qlbl" x="304" y="150" text-anchor="end" fill="#f0f4ff" font-size="22" font-weight="700" opacity="0">query</text>
          <text id="s3-klbl" x="250" y="238" text-anchor="middle" fill="#f0f4ff" font-size="22" font-weight="700" opacity="0">Top-K (cosine), K = 3</text>
        </svg>
      </div>
      <svg id="s3-svg" viewBox="0 0 1760 660">
        <defs>
          <marker id="s3-ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#aab3c2"/></marker>
          <marker id="s3-ah-p" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#b48ce6"/></marker>
        </defs>
        <path id="s3-ar-q" d="M 594 92 C 520 92 470 220 340 220" fill="none" stroke="#b48ce6" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" marker-end="url(#s3-ah-p)" opacity="0"/>
        <path id="s3-ar-p" d="M 1068 385 L 1150 385" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" marker-end="url(#s3-ah)" opacity="0"/>
        <path id="s3-ar-l" d="M 1338 385 L 1390 385" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" marker-end="url(#s3-ah)" opacity="0"/>
      </svg>
      <div id="s3-q"><div class="h">1 · retrieval · запрос (query)</div>Что в нашем регламенте v3.2?</div>
      <div id="s3-qe"><b>query embedding</b>: та же модель, что при индексации</div>
      <div id="s3-prompt">
        <div class="h">2 · augmentation · промпт</div>
        <div id="s3-pl1" class="s3-line" style="top:56px" data-layout-allow-overlap>Context:</div>
        <div id="s3-pl2" class="s3-line" style="top:162px">Question: <span>[вопрос]</span></div>
        <div id="s3-pl3" class="s3-line" style="top:212px">Answer: <span>…</span></div>
      </div>
      <div id="s3-p1" class="s3-pill" style="left:632px" data-layout-allow-overlap>chunk 1</div>
      <div id="s3-p2" class="s3-pill" style="left:762px" data-layout-allow-overlap>chunk 2</div>
      <div id="s3-p3" class="s3-pill" style="left:892px" data-layout-allow-overlap>chunk 3</div>
      <div id="s3-llm">LLM</div>
      <div id="s3-lbl3" class="s3-stage-lbl" style="left:1160px;top:296px">3 · generation</div>
      <div id="s3-ans">
        <div class="h">ответ</div>
        <div id="s3-ans-txt">По регламенту v3.2: …<br/>— строго по контексту</div>
        <div id="s3-src-lbl">источники:</div>
        <div id="s3-s1" class="s3-src" style="left:28px">chunk 1</div>
        <div id="s3-s3" class="s3-src" style="left:140px">chunk 3</div>
        <div id="s3-post">post-processing: источники, проверка качества</div>
      </div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">Запрос векторизуем <b>той же моделью</b> и ищем ближайшие chunks: <b class="b">cosine</b> / dot product / L2; берём <b>Top-K</b></div>
      <div id="s3-cap2" class="cap"><b class="o">Augmentation</b>: собираем промпт = Context: [найденные chunks] + Question: [вопрос]</div>
      <div id="s3-cap3" class="cap"><b class="g">Generation</b>: LLM отвечает по контексту; post-processing добавляет ссылки на источники и проверку качества</div>
      <div id="s3-cap4" class="cap key">RAG = индексация offline + retrieval → augmentation → generation online: актуальные и приватные данные без переобучения, ответ с источниками</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    // Та же карта, что в сцене 2: проиндексированные векторы + 4 chunk-вектора.
    const idx = [[90,110],[130,80],[160,140],[110,170],[200,100],
                 [440,220],[470,270],[400,290],[480,320],[430,350],[390,245],
                 [140,380],[180,420],[110,440],[230,390],[260,450]];
    const gi = document.getElementById("s3-idx");
    idx.forEach(([x, y], i) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("id", `s3-i${i}`); c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", "8"); gi.appendChild(c); });
    const land = [[330, 120], [290, 170], [350, 190], [200, 300]];
    const gn = document.getElementById("s3-new");
    land.forEach(([x, y], i) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("id", `s3-n${i + 1}`); c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", "10"); c.setAttribute("fill", "#ff7a2f"); c.setAttribute("stroke", "#f0f4ff"); c.setAttribute("stroke-width", "0"); gn.appendChild(c); });
    const arqLen = document.getElementById("s3-ar-q").getTotalLength().toFixed(1);
    // Пилюли chunk 1/2/3 летят из своих точек на карте (координаты сцены = карта + (0, 60)) в строку Context.
    // Центры пилюль: (691, 356), (821, 356), (951, 356); точки: chunk1 (330,180), chunk2 (290,230), chunk3 (350,250).
    const fly = [[-361, -176], [-531, -126], [-601, -106]];

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    // 1. Retrieval
    tl.fromTo("#s3-q", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.4);
    cap("#s3-cap1", 0.6, 5.4);
    tl.fromTo("#s3-ar-q", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": arqLen + " 9999" }, duration: 0.7, ease: "power2.inOut" }, 1.0);
    tl.fromTo("#s3-qe", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.3);
    tl.fromTo("#s3-qdot", { opacity: 0, attr: { r: 40 } }, { opacity: 1, attr: { r: 11 }, duration: 0.6, ease: "power2.out" }, 1.7);
    tl.fromTo("#s3-qlbl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.1);
    [["#s3-k1", 31.6, "#s3-n2"], ["#s3-k2", 41.2, "#s3-n1"], ["#s3-k3", 42.4, "#s3-n3"]].forEach(([ln, len, dot], i) => {
      tl.fromTo(ln, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": len + " 9999" }, duration: 0.35, ease: "power2.inOut" }, 2.5 + 0.2 * i);
      tl.to(dot, { attr: { r: 13, "stroke-width": 3 }, duration: 0.35 }, 2.7 + 0.2 * i);
    });
    tl.fromTo("#s3-klbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.3);
    // 2. Augmentation
    tl.fromTo("#s3-prompt", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.9);
    cap("#s3-cap2", 5.6, 9.6);
    fly.forEach(([dx, dy], i) => {
      tl.fromTo(`#s3-p${i + 1}`, { opacity: 0, x: dx, y: dy, scale: 0.5 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.8, ease: "power2.inOut" }, 5.9 + 0.25 * i);
    });
    tl.fromTo("#s3-pl2", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 7.3);
    tl.fromTo("#s3-pl3", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 7.8);
    // 3. Generation
    tl.fromTo("#s3-ar-p", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "82 9999" }, duration: 0.4, ease: "power2.inOut" }, 9.0);
    tl.fromTo("#s3-llm", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 9.3);
    tl.fromTo("#s3-lbl3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.5);
    cap("#s3-cap3", 9.8, 13.6);
    tl.fromTo("#s3-ar-l", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "52 9999" }, duration: 0.35, ease: "power2.inOut" }, 10.0);
    tl.fromTo("#s3-ans", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 10.3);
    tl.fromTo("#s3-ans-txt", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 10.8);
    tl.fromTo("#s3-src-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.5);
    tl.fromTo("#s3-s1", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 11.7);
    tl.fromTo("#s3-s3", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 12.0);
    tl.fromTo("#s3-post", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 12.5);
    cap("#s3-cap4", 13.8, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.45 }, 17.55);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
