<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 0px; width: 700px; }
  #s2-c2 { left: 1060px; top: 210px; width: 700px; font-size: 28px; }
  #s2-c2 .li { padding: 3px 0; }
  #s2-c2 .li .k { color: #f0f4ff; font-weight: 600; }
  #s2-c3 { left: 1060px; top: 455px; width: 700px; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Что делает балансировщик?</div></div>
    <div class="badge">Knowledge Book · System Design</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <!-- клиенты -->
        <text id="s2-cl-lbl" x="130" y="168" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0">1000 клиентов</text>
        <g id="s2-clients"></g>
        <text id="s2-lam" x="125" y="378" text-anchor="middle" fill="#4a9eff" font-size="30" font-weight="700" opacity="0">λ = 400/с</text>
        <line id="s2-ar1" x1="236" y1="270" x2="258" y2="270" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <polygon id="s2-ah1" points="256,260 270,270 256,280" fill="#aab3c2" opacity="0"/>
        <!-- запросы (под боксами) -->
        <g id="s2-dots"></g>
        <!-- балансировщик -->
        <g id="s2-lb" opacity="0">
          <rect x="270" y="220" width="230" height="100" rx="14" fill="#161a24" stroke="#b48ce6" stroke-width="4"/>
          <text x="385" y="262" text-anchor="middle" fill="#f0f4ff" font-size="22" font-weight="700">балансировщик</text>
          <text x="385" y="296" text-anchor="middle" fill="#aab3c2" font-size="21">L7 · round-robin</text>
        </g>
        <!-- шина к репликам -->
        <line id="s2-bus0" x1="500" y1="270" x2="530" y2="270" stroke="#2a3140" stroke-width="5" stroke-dasharray="0 9999"/>
        <line id="s2-bus1" x1="530" y1="270" x2="530" y2="108" stroke="#2a3140" stroke-width="5" stroke-dasharray="0 9999"/>
        <line id="s2-bus2" x1="530" y1="270" x2="530" y2="448" stroke="#2a3140" stroke-width="5" stroke-dasharray="0 9999"/>
        <line id="s2-bus3" x1="530" y1="108" x2="940" y2="108" stroke="#2a3140" stroke-width="5" stroke-dasharray="0 9999"/>
        <line id="s2-bus4" x1="530" y1="448" x2="940" y2="448" stroke="#2a3140" stroke-width="5" stroke-dasharray="0 9999"/>
        <g id="s2-reps"></g>
        <!-- автоскейл -->
        <g id="s2-auto" opacity="0">
          <rect x="560" y="206" width="416" height="156" rx="14" fill="#161a24" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="12 8"/>
          <text x="580" y="240" fill="#2dd4bf" font-size="24" font-weight="700">автоскейл смотрит на:</text>
        </g>
        <text id="s2-au1" x="580" y="278" fill="#3dba7a" font-size="23" font-weight="600" opacity="0">✓ глубину очереди</text>
        <text id="s2-au2" x="580" y="312" fill="#3dba7a" font-size="23" font-weight="600" opacity="0">✓ GPU util (SM)</text>
        <g id="s2-au3" opacity="0">
          <text x="580" y="346" fill="#aab3c2" font-size="23" font-weight="600">✗ CPU util<tspan font-size="20" font-weight="400"> — почти не загружен</tspan></text>
          <line x1="606" y1="338" x2="700" y2="338" stroke="#aab3c2" stroke-width="3"/>
        </g>
        <!-- итог -->
        <g id="s2-zone" opacity="0">
          <rect x="250" y="560" width="726" height="56" rx="14" fill="rgba(61,186,122,0.14)" stroke="#3dba7a" stroke-width="3"/>
          <text x="613" y="596" text-anchor="middle" fill="#3dba7a" font-size="23" font-weight="700">ρ = 0.8 &lt; 1: зелёная зона — 0 дропов, p99 ≈ 39 мс</text>
        </g>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Реплики</div>
        <div class="f">ρ на ноду = 400 / (10 · 50) = <span class="g">0.8</span></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px"><span class="b">λ</span> делится на N = 10 реплик по <span class="g">μ</span> = 50/с</div></div>
      <div id="s2-c2" class="card"><div class="h">Балансировка</div>
        <div class="li"><span class="k">round-robin</span> или <span class="k">least-loaded</span></div>
        <div class="li"><span class="k">health-check</span>: GPU отвечает за SLO</div>
        <div class="li"><span class="k">backpressure + таймаут</span>, не FIFO без лимита</div></div>
      <div id="s2-c3" class="card"><div class="h">Результат симуляции</div>
        <div>1000 клиентов на 10 GPU:</div>
        <div><span class="g">0 дропов, p99 ≈ 39 мс</span></div></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Горизонтальные реплики + балансировщик: <b class="b">λ</b> делится на N нод, ρ каждой = 400 / (10 · 50) = <b class="g">0.8</b></div>
      <div id="s2-cap2" class="cap">Автоскейл — по <b class="t">глубине очереди и GPU util</b>, а не по CPU: у GPU-сервиса CPU почти не загружен</div>
      <div id="s2-cap3" class="cap">Итог из симуляции: 1000 клиентов на 10 GPU — <b class="g">0 дропов, p99 ≈ 39 мс</b>; система снова в зелёной зоне <b class="g">ρ &lt; 1</b></div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    // Клиенты 5×4
    const gC = document.getElementById("s2-clients");
    const dots = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) {
      const el = document.createElementNS(NS, "circle");
      el.setAttribute("id", `s2-cl-${r}-${c}`);
      el.setAttribute("cx", 45 + c * 40); el.setAttribute("cy", 210 + r * 40);
      el.setAttribute("r", "10"); el.setAttribute("fill", "#4a9eff"); el.setAttribute("opacity", "0");
      gC.appendChild(el); dots.push(el);
    }
    // 10 реплик: 2 ряда × 5, ширина 72, шаг 86; ряд 1 центр y=108, ряд 2 центр y=448
    const gR = document.getElementById("s2-reps");
    const reps = [];
    const rows = [60, 400];
    for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) {
      const i = r * 5 + c, x = 560 + c * 86, y = rows[r];
      const g = document.createElementNS(NS, "g");
      g.setAttribute("id", `s2-rep-${i}`); g.setAttribute("opacity", "0");
      g.innerHTML = `<rect id="s2-rb-${i}" x="${x}" y="${y}" width="72" height="96" rx="10" fill="#161a24" stroke="#4a9eff" stroke-width="3"/>
        <text x="${x + 36}" y="${y + 30}" text-anchor="middle" fill="#f0f4ff" font-size="22" font-weight="700">GPU</text>
        <text x="${x + 36}" y="${y + 56}" text-anchor="middle" fill="#3dba7a" font-size="18" font-weight="600">ρ 0.8</text>
        <rect x="${x + 10}" y="${y + 68}" width="52" height="14" rx="4" fill="#0f1117" stroke="#2a3140" stroke-width="2"/>
        <rect id="s2-rf-${i}" x="${x + 11}" y="${y + 69}" width="0" height="12" rx="3" fill="#3dba7a"/>`;
      gR.appendChild(g); reps.push({ g, i, cx: x - 6, rowY: r === 0 ? 108 : 448 });
    }
    // Запросы: по одному на реплику, round-robin
    const gD = document.getElementById("s2-dots");
    const reqs = reps.map(({ i }) => {
      const el = document.createElementNS(NS, "circle");
      el.setAttribute("id", `s2-rq-${i}`); el.setAttribute("cx", "215"); el.setAttribute("cy", "270");
      el.setAttribute("r", "8"); el.setAttribute("fill", "#ff7a2f"); el.setAttribute("opacity", "0");
      gD.appendChild(el); return el;
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-cl-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    dots.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.4 + i * 0.03));
    tl.fromTo("#s2-lam", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.9);
    tl.fromTo("#s2-ar1", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "22 9999" }, duration: 0.3, ease: "power2.inOut" }, 0.9);
    tl.fromTo("#s2-ah1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.15);
    tl.fromTo("#s2-lb", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.1);
    tl.fromTo("#s2-bus0", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "30 9999" }, duration: 0.25 }, 1.4);
    tl.fromTo("#s2-bus1", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "162 9999" }, duration: 0.3 }, 1.6);
    tl.fromTo("#s2-bus2", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "178 9999" }, duration: 0.3 }, 1.6);
    tl.fromTo("#s2-bus3", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "410 9999" }, duration: 0.5 }, 1.85);
    tl.fromTo("#s2-bus4", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "410 9999" }, duration: 0.5 }, 1.85);
    reps.forEach(({ g, i }) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.9 + (i % 5) * 0.1 + Math.floor(i / 5) * 0.05));
    reps.forEach(({ i }) => tl.fromTo(`#s2-rf-${i}`, { attr: { width: 0 } }, { attr: { width: 40 }, duration: 0.6, ease: "power2.out" }, 2.6 + i * 0.05));
    cap("#s2-cap1", 0.6, 5.0);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.4);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.6);
    // Запросы клиент → балансировщик → шина → реплика (round-robin), конечное число повторов
    const cycle = gsap.timeline();
    reps.forEach(({ cx, rowY, i }) => {
      const el = reqs[i], t = i * 0.12;
      cycle.fromTo(el, { opacity: 0, attr: { cx: 215, cy: 270 } }, { opacity: 1, attr: { cx: 385, cy: 270 }, duration: 0.3, ease: "none" }, t);
      cycle.to(el, { attr: { cx: 530, cy: 270 }, duration: 0.18, ease: "none" }, t + 0.3);
      cycle.to(el, { attr: { cx: 530, cy: rowY }, duration: 0.2, ease: "none" }, t + 0.48);
      cycle.to(el, { attr: { cx: cx, cy: rowY }, duration: 0.3, ease: "none" }, t + 0.68);
      cycle.to(el, { opacity: 0, duration: 0.15 }, t + 0.98);
    });
    // цикл ≈ 2.4 с; окно 2.8…13.6 = 10.8 с → repeat = floor(10.8 / 2.4) − 1 = 3
    cycle.to({}, { duration: 0.01 }, 2.39);
    tl.add(cycle.repeat(3), 2.8);
    // Автоскейл
    cap("#s2-cap2", 5.2, 9.4);
    tl.fromTo("#s2-auto", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.4);
    tl.fromTo("#s2-au1", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 5.9);
    tl.fromTo("#s2-au2", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 6.3);
    tl.fromTo("#s2-au3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.9);
    // Итог
    cap("#s2-cap3", 9.6, 14.3);
    tl.fromTo("#s2-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.8);
    reps.forEach(({ i }) => tl.to(`#s2-rb-${i}`, { attr: { stroke: "#3dba7a" }, duration: 0.5 }, 10.0 + i * 0.05));
    tl.fromTo("#s2-zone", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 }, 10.3);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.45 }, 14.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
