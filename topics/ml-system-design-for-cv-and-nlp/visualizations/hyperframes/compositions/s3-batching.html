<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  @property --n { syntax: "<integer>"; inherits: true; initial-value: 0; }
  #s3-bars { position: absolute; left: 0; top: 300px; width: 480px; height: 360px; opacity: 0; }
  #s3-bars .ttl { position: absolute; left: 0; top: 0; font-size: 24px; color: #aab3c2; letter-spacing: 0.02em; }
  #s3-bars .axis { position: absolute; left: 0; right: 0; bottom: 84px; height: 2px; background: #2a3140; }
  #s3-bars .bar { position: absolute; bottom: 86px; width: 140px; border-radius: 12px 12px 4px 4px; }
  #s3-bars .bar-val { position: absolute; width: 236px; bottom: 96px; font-size: 30px; font-weight: 700; text-align: center; color: #f0f4ff; opacity: 0; }
  #s3-bars .bar-val::before { counter-reset: n var(--n); content: "≈ " counter(n) " items/s"; }
  #s3-bars .bar-lbl { position: absolute; bottom: 10px; width: 236px; font-size: 20px; color: #aab3c2; text-align: center; line-height: 1.2; }
  #s3-bars .tag { position: absolute; top: 38px; width: 236px; font-size: 22px; font-weight: 700; text-align: center; opacity: 0; }
  #s3-c1 { left: 1060px; top: 0px; width: 700px; }
  #s3-c2 { left: 1060px; top: 232px; width: 700px; }
  #s3-c3 { left: 1060px; top: 442px; width: 700px; font-size: 30px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Зачем dynamic batching?</div></div>
    <div class="badge">Knowledge Book · System Design</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <!-- одна GPU-нода -->
        <g id="s3-node" opacity="0">
          <rect x="8" y="8" width="964" height="268" rx="18" fill="none" stroke="#2a3140" stroke-width="3" stroke-dasharray="14 10"/>
          <text x="28" y="42" fill="#aab3c2" font-size="24">одна GPU-нода за балансировщиком</text>
          <text x="128" y="262" text-anchor="middle" fill="#4a9eff" font-size="22" font-weight="700">запросы λ = 250/с</text>
        </g>
        <g id="s3-bucket" opacity="0">
          <rect x="250" y="82" width="290" height="160" rx="14" fill="#161a24" stroke="#ff7a2f" stroke-width="4"/>
          <text x="395" y="72" text-anchor="middle" fill="#ff7a2f" font-size="24" font-weight="700">сборщик пачек · ждать ≤ 8 мс</text>
          <text x="395" y="266" text-anchor="middle" fill="#aab3c2" font-size="22">max B = 8</text>
        </g>
        <g id="s3-slots"></g>
        <line id="s3-ar" x1="548" y1="162" x2="622" y2="162" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <polygon id="s3-ah" points="620,152 634,162 620,172" fill="#aab3c2" opacity="0"/>
        <g id="s3-kernel" opacity="0">
          <rect id="s3-kbox" x="640" y="82" width="320" height="160" rx="14" fill="#161a24" stroke="#4a9eff" stroke-width="4"/>
          <text x="800" y="140" text-anchor="middle" fill="#f0f4ff" font-size="32" font-weight="700">GPU kernel</text>
          <text x="800" y="184" text-anchor="middle" fill="#aab3c2" font-size="22">один запуск на B = 8</text>
          <text x="800" y="266" text-anchor="middle" fill="#aab3c2" font-size="22">T(B) = T₀ + t<tspan font-size="16" dy="4">item</tspan><tspan dy="-4"> · B</tspan></text>
        </g>
        <g id="s3-req"></g>
        <!-- график T(B) и B/T(B) -->
        <g id="s3-chart" opacity="0">
          <line x1="570" y1="610" x2="964" y2="610" stroke="#aab3c2" stroke-width="3"/>
          <line x1="570" y1="610" x2="570" y2="330" stroke="#aab3c2" stroke-width="3"/>
          <text x="770" y="648" text-anchor="middle" fill="#aab3c2" font-size="22">размер пачки B →</text>
          <text x="576" y="322" fill="#aab3c2" font-size="20">↑ условные единицы</text>
        </g>
        <polyline id="s3-lineT" points="" fill="none" stroke="#ff7a2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999"/>
        <polyline id="s3-lineQ" points="" fill="none" stroke="#3dba7a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999"/>
        <text id="s3-legT" x="958" y="556" text-anchor="end" fill="#ff7a2f" font-size="24" font-weight="700" opacity="0">T(B) — почти линейно</text>
        <text id="s3-legQ" x="958" y="592" text-anchor="end" fill="#3dba7a" font-size="24" font-weight="700" opacity="0">B / T(B) — растёт</text>
      </svg>
      <div id="s3-bars">
        <div class="ttl">λ = 250/с на одну GPU · items/s</div>
        <div class="axis"></div>
        <div id="s3-tag1" class="tag" style="left:0;color:#ff4d6d">~59 % таймаутов</div>
        <div id="s3-bar1" class="bar" style="left:48px;height:0px;background:#ff7a2f"></div>
        <div id="s3-val1" class="bar-val" style="left:0;--n:0"></div>
        <div class="bar-lbl" style="left:0">без пачки:<br/>GPU занят overhead'ом</div>
        <div id="s3-tag2" class="tag" style="left:244px;color:#3dba7a">0 дропов</div>
        <div id="s3-bar2" class="bar" style="left:292px;height:0px;background:#3dba7a"></div>
        <div id="s3-val2" class="bar-val" style="left:244px;--n:0"></div>
        <div class="bar-lbl" style="left:244px">dynamic batching:<br/>B ≤ 8, ждать ≤ 8 мс</div>
      </div>
      <div id="s3-c1" class="card"><div class="h">Время ядра</div>
        <div class="f">T(B) = <span class="o">T₀</span> + t<sub>item</sub> · B</div>
        <div style="font-size:26px;color:#aab3c2;margin-top:8px">T₀ — overhead запуска ядра, t<sub>item</sub> · B — линейная часть</div></div>
      <div id="s3-c2" class="card"><div class="h">Пропускная способность</div>
        <div class="f">B / T(B) <span class="g">растёт с B</span></div>
        <div style="font-size:26px;color:#aab3c2;margin-top:8px">пока влезает память; ждём ≤ 8 мс → полные SM'ы</div></div>
      <div id="s3-c3" class="card"><div class="h">Так делают</div>
        <div><span class="b">Triton Inference Server</span> · <span class="b">TensorRT</span></div>
        <div>batched <span class="b">ONNX Runtime</span> <span style="font-size:24px;color:#aab3c2">— батчер внутри ноды</span></div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">GPU любит пачки: <b>T(B) = T₀ + t<sub>item</sub>·B</b> — фиксированный <b class="o">overhead ядра</b> плюс почти линейная часть</div>
      <div id="s3-cap2" class="cap">λ = 250/с: без пачки ≈ 100 items/s и <b class="r">~59 % таймаутов</b>; с батчингом (B ≤ 8, ждать ≤ 8 мс) <b class="g">≈ 250 items/s и 0 дропов</b></div>
      <div id="s3-cap3" class="cap key">Закон очередей <b>ρ = λ/μ &lt; 1</b> → реплики + балансировщик + автоскейл по очереди → <b class="g">dynamic batching</b> на ноде (Triton, TensorRT, ONNX Runtime)</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    // Слоты сборщика: 2 ряда × 4
    const gS = document.getElementById("s3-slots");
    const slotPos = [];
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) {
      const i = r * 4 + c, x = 268 + c * 66, y = 100 + r * 66;
      const el = document.createElementNS(NS, "rect");
      el.setAttribute("id", `s3-slot-${i}`);
      el.setAttribute("x", x); el.setAttribute("y", y); el.setAttribute("width", "50"); el.setAttribute("height", "50");
      el.setAttribute("rx", "8"); el.setAttribute("fill", "#0f1117"); el.setAttribute("stroke", "#2a3140"); el.setAttribute("stroke-width", "2"); el.setAttribute("opacity", "0");
      gS.appendChild(el); slotPos.push([x + 25, y + 25]);
    }
    // Запросы (8 точек)
    const gR = document.getElementById("s3-req");
    const reqs = slotPos.map((_, i) => {
      const el = document.createElementNS(NS, "circle");
      el.setAttribute("id", `s3-rq-${i}`); el.setAttribute("cx", "40"); el.setAttribute("cy", "162");
      el.setAttribute("r", "12"); el.setAttribute("fill", "#4a9eff"); el.setAttribute("opacity", "0");
      gR.appendChild(el); return el;
    });
    // График: T(B) = T₀ + t·B (T₀ = 4, t = 0.5 усл. ед.), throughput = B / T(B); B = 0…8
    const X = (B) => 570 + B * 48, Y = (v) => 610 - v * 250;
    const ptsT = [], ptsQ = [];
    for (let B = 0; B <= 8; B++) { const T = 4 + 0.5 * B; ptsT.push([X(B), Y(T / 8)]); ptsQ.push([X(B), Y(B / T)]); }
    const polyLen = (p) => { let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return s.toFixed(1); };
    const fmt = (p) => p.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    document.getElementById("s3-lineT").setAttribute("points", fmt(ptsT));
    document.getElementById("s3-lineQ").setAttribute("points", fmt(ptsQ));
    const H = 0.6; // px на item/s: 250 → 150 px

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-node", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    tl.fromTo("#s3-bucket", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.5);
    slotPos.forEach((_, i) => tl.fromTo(`#s3-slot-${i}`, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.6 + i * 0.04));
    tl.fromTo("#s3-ar", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "74 9999" }, duration: 0.3, ease: "power2.inOut" }, 0.9);
    tl.fromTo("#s3-ah", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.15);
    tl.fromTo("#s3-kernel", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.0);
    cap("#s3-cap1", 0.6, 4.8);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.9);
    // Цикл сборки пачки: 8 запросов → слоты → один запуск ядра. Цикл 2.0 с; окно 1.2…13.4 → repeat = floor(12.2/2.0) − 1 = 5
    const cycle = gsap.timeline();
    reqs.forEach((el, i) => {
      const [sx, sy] = slotPos[i], t = i * 0.12, y0 = 162 + ((i % 3) - 1) * 34;
      cycle.fromTo(el, { opacity: 0, attr: { cx: 40, cy: y0 } }, { opacity: 1, attr: { cx: sx, cy: sy }, duration: 0.45, ease: "power2.out" }, t);
      cycle.to(el, { attr: { cx: 800, cy: 162 }, duration: 0.25, ease: "power2.in" }, 1.42);
      cycle.to(el, { opacity: 0, duration: 0.12 }, 1.62);
    });
    cycle.fromTo("#s3-kbox", { attr: { fill: "#161a24" } }, { attr: { fill: "#1e3a5f" }, duration: 0.14, yoyo: true, repeat: 1 }, 1.6);
    cycle.to({}, { duration: 0.01 }, 1.99);
    tl.add(cycle.repeat(5), 1.2);
    // График
    tl.fromTo("#s3-chart", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.6);
    tl.fromTo("#s3-lineT", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": polyLen(ptsT) + " 9999" }, duration: 1.0, ease: "power1.inOut" }, 2.0);
    tl.fromTo("#s3-legT", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.6);
    tl.fromTo("#s3-lineQ", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": polyLen(ptsQ) + " 9999" }, duration: 1.2, ease: "power1.inOut" }, 2.8);
    tl.fromTo("#s3-legQ", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.5);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.8);
    // Столбики: 100 vs 250 items/s
    cap("#s3-cap2", 5.0, 9.6);
    tl.fromTo("#s3-bars", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 5.2);
    tl.fromTo("#s3-bar1", { height: 0 }, { height: 100 * H, duration: 0.8, ease: "power2.out" }, 5.5);
    tl.fromTo("#s3-val1", { opacity: 0, y: 0, "--n": 0 }, { opacity: 1, y: -100 * H, "--n": 100, snap: "--n", duration: 0.8, ease: "power2.out" }, 5.5);
    tl.fromTo("#s3-tag1", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4 }, 6.4);
    tl.fromTo("#s3-bar2", { height: 0 }, { height: 250 * H, duration: 0.9, ease: "power2.out" }, 7.0);
    tl.fromTo("#s3-val2", { opacity: 0, y: 0, "--n": 0 }, { opacity: 1, y: -250 * H, "--n": 250, snap: "--n", duration: 0.9, ease: "power2.out" }, 7.0);
    tl.fromTo("#s3-tag2", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4 }, 7.9);
    // Ключевая идея
    cap("#s3-cap3", 9.9, 0);
    tl.fromTo("#s3-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 10.3);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.45 }, 14.55);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
