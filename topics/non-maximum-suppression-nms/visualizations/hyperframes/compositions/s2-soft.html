<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 0px; width: 700px; }
  #s2-c1 .f { font-size: 32px; }
  #s2-c2 { left: 1060px; top: 180px; width: 700px; }
  #s2-c2 .f { font-size: 33px; }
  #s2-bars { position: absolute; left: 1060px; top: 435px; width: 700px; height: 230px; opacity: 0; }
  #s2-bars .ttl { position: absolute; left: 0; top: 0; font-size: 24px; color: #aab3c2; letter-spacing: 0.06em; text-transform: uppercase; }
  #s2-bars .axis { position: absolute; left: 0; right: 0; bottom: 68px; height: 2px; background: #2a3140; }
  .s2-bar { position: absolute; bottom: 70px; width: 130px; height: 0px; border-radius: 12px 12px 4px 4px; }
  .s2-val { position: absolute; bottom: 80px; width: 130px; font-size: 30px; font-weight: 700; text-align: center; color: #f0f4ff; opacity: 0; }
  .s2-lbl { position: absolute; bottom: 0px; width: 170px; font-size: 22px; color: #aab3c2; text-align: center; line-height: 1.2; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Что Soft-NMS делает иначе?</div></div>
    <div class="badge">Knowledge Book · NMS</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <defs>
          <radialGradient id="s2-gr1" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#5b6c8f"/><stop offset="1" stop-color="#2a3550"/></radialGradient>
          <radialGradient id="s2-gr2" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#8f6b5b"/><stop offset="1" stop-color="#4a3428"/></radialGradient>
        </defs>
        <g id="s2-img" opacity="0">
          <rect x="20" y="10" width="620" height="640" rx="18" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
          <text x="330" y="46" text-anchor="middle" fill="#aab3c2" font-size="22">два объекта вплотную (иллюстративно)</text>
          <ellipse cx="290" cy="325" rx="100" ry="160" fill="url(#s2-gr1)"/>
          <ellipse cx="350" cy="335" rx="100" ry="145" fill="url(#s2-gr2)"/>
        </g>
        <g id="s2-bA" opacity="0">
          <rect x="170" y="150" width="240" height="350" fill="none" stroke="#4a9eff" stroke-width="5"/>
          <text x="170" y="138" fill="#4a9eff" font-size="26" font-weight="700">A · 0.9</text>
        </g>
        <g id="s2-bB" opacity="0">
          <rect x="230" y="175" width="240" height="320" fill="none" stroke="#ff7a2f" stroke-width="5"/>
          <text id="s2-lB1" x="230" y="527" fill="#ff7a2f" font-size="26" font-weight="700" data-layout-allow-overlap>B · 0.8</text>
          <text id="s2-lB2" x="230" y="527" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0" data-layout-allow-overlap>B · 0.8 → 0.35</text>
        </g>
        <g id="s2-inter" opacity="0">
          <rect x="230" y="175" width="180" height="320" fill="rgba(255,77,109,0.3)" stroke="#ff4d6d" stroke-width="2"/>
          <text x="330" y="578" text-anchor="middle" fill="#ff4d6d" font-size="27" font-weight="700">IoU(A, B) ≈ 0.56 &gt; τ<tspan font-size="18" dy="6">nms</tspan><tspan dy="-6"> = 0.5</tspan></text>
        </g>
        <text id="s2-hard" x="330" y="626" text-anchor="middle" fill="#ff4d6d" font-size="27" font-weight="700" opacity="0" data-layout-allow-overlap>✗ hard NMS: B удалён, объект потерян</text>
        <text id="s2-soft" x="330" y="626" text-anchor="middle" fill="#3dba7a" font-size="27" font-weight="700" opacity="0" data-layout-allow-overlap>✓ Soft-NMS: B остаётся со score 0.35</text>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Hard NMS</div>
        <div class="f">IoU(A, B) &gt; τ<sub>nms</sub> → <span class="r">s<sub>B</sub> = 0</span>, B удалён</div>
        <div style="font-size:24px;color:#aab3c2;margin-top:8px">жёсткое решение «дубликат / нет» по порогу</div></div>
      <div id="s2-c2" class="card"><div class="h">Soft-NMS (в статье Bodla et al., 2017)</div>
        <div class="f">линейно: s<sub>B</sub> ← s<sub>B</sub> · (1 − <span class="o">IoU</span>)</div>
        <div class="f" style="margin-top:6px">гаусс: s<sub>B</sub> ← s<sub>B</sub> · exp(−<span class="o">IoU</span>² / σ)</div>
        <div style="font-size:24px;color:#aab3c2;margin-top:8px">чем сильнее перекрытие, тем ниже score соседа</div></div>
      <div id="s2-bars">
        <div class="ttl">score бокса B после подавления</div>
        <div class="axis"></div>
        <div id="s2-bar0" class="s2-bar" style="left:20px;background:#aab3c2"></div>
        <div id="s2-val0" class="s2-val" style="left:20px">0.8</div>
        <div class="s2-lbl" style="left:0px">до<br/>подавления</div>
        <div id="s2-bar1" class="s2-bar" style="left:190px;background:#ff4d6d"></div>
        <div id="s2-val1" class="s2-val" style="left:190px;color:#ff4d6d">0</div>
        <div class="s2-lbl" style="left:170px">hard NMS<br/>удалён</div>
        <div id="s2-bar2" class="s2-bar" style="left:360px;background:#ff7a2f"></div>
        <div id="s2-val2" class="s2-val" style="left:360px">0.35</div>
        <div class="s2-lbl" style="left:340px">Soft-NMS<br/>линейный</div>
        <div id="s2-bar3" class="s2-bar" style="left:530px;background:#3dba7a"></div>
        <div id="s2-val3" class="s2-val" style="left:530px">0.43</div>
        <div class="s2-lbl" style="left:510px">Soft-NMS<br/>гаусс, σ = 0.5</div>
      </div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Два объекта рядом: их боксы перекрываются с <b class="r">IoU &gt; τ<sub>nms</sub></b>. Жёсткий NMS удалит бокс <b class="o">B</b> — настоящий объект потерян</div>
      <div id="s2-cap2" class="cap"><b>Soft-NMS</b> не удаляет соседа, а <b class="o">понижает его score</b> тем сильнее, чем больше IoU: линейно или гауссом</div>
      <div id="s2-cap3" class="cap">B выживает со score <b>0.35 / 0.43</b> и остаётся в результате. Но порог, σ и <b>O(N²)</b> никуда не делись: это всё ещё постобработка <b class="o">вне сети</b></div>
    </div>
  </div>
</div>
<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const show = (id, t, d = 0.4) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);
    const H = 90; // px на score = 1.0
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    show("#s2-img", 0.3, 0.6);
    show("#s2-bA", 0.9);
    show("#s2-bB", 1.2);
    cap("#s2-cap1", 0.6, 5.2);
    // IoU = 57600 / 103200 ≈ 0.56 при боксах A 240×350 и B 240×320 (см. storyboard.md)
    show("#s2-inter", 1.8, 0.5);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.6);
    tl.to("#s2-bB", { opacity: 0.15, duration: 0.5 }, 3.4);
    show("#s2-hard", 3.5);
    // Soft-NMS: бокс B возвращается с пониженным score.
    cap("#s2-cap2", 5.4, 9.8);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.6);
    tl.to("#s2-bB", { opacity: 1, duration: 0.5 }, 6.4);
    tl.to("#s2-lB1", { opacity: 0, duration: 0.4 }, 6.4);
    tl.to("#s2-lB2", { opacity: 1, duration: 0.4 }, 6.4);
    tl.to("#s2-hard", { opacity: 0, duration: 0.4 }, 6.4);
    show("#s2-soft", 6.6);
    // Столбики: 0.8 → hard 0 / linear 0.8·(1−0.56) = 0.35 / gauss 0.8·exp(−0.56²/0.5) = 0.43
    tl.fromTo("#s2-bars", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 7.6);
    const bar = (i, v, t) => {
      tl.fromTo("#s2-bar" + i, { height: 0 }, { height: Math.max(4, v * H), duration: 0.7, ease: "power2.out" }, t);
      tl.fromTo("#s2-val" + i, { opacity: 0, y: 0 }, { opacity: 1, y: -Math.max(4, v * H), duration: 0.7, ease: "power2.out" }, t);
    };
    bar(0, 0.8, 8.0); bar(1, 0, 8.5); bar(2, 0.35, 9.0); bar(3, 0.43, 9.5);
    cap("#s2-cap3", 10.0, 14.5);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 14.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
