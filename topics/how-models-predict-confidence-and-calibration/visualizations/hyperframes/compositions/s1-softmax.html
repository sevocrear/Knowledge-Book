<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-chart { position: absolute; left: 0; top: 0; width: 980px; height: 660px; }
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  .s1-hdr { position: absolute; top: 14px; font-size: 26px; color: #aab3c2; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0; }
  .s1-cls { position: absolute; left: 0; width: 120px; height: 56px; line-height: 56px; font-size: 30px; color: #e6ebf5; opacity: 0; }
  .s1-chip { position: absolute; left: 140px; width: 150px; height: 56px; line-height: 52px; box-sizing: border-box; border: 2px solid #2a3140; border-radius: 14px; background: #161a24; font-size: 28px; font-style: italic; color: #f0f4ff; text-align: center; opacity: 0; }
  .s1-bar { position: absolute; left: 380px; width: 0px; height: 56px; border-radius: 6px 14px 14px 6px; background: #4a9eff; }
  .s1-val { position: absolute; left: 392px; width: 120px; height: 56px; line-height: 56px; font-size: 30px; font-weight: 700; color: #f0f4ff; opacity: 0; }
  .s1-val::before { counter-reset: n var(--n); content: counter(n) "%"; }
  @property --n { syntax: "<integer>"; inherits: true; initial-value: 0; }
  #s1-ring { position: absolute; left: 372px; top: 62px; width: 570px; height: 72px; box-sizing: border-box; border: 3px solid #ff7a2f; border-radius: 18px; opacity: 0; }
  #s1-foot { position: absolute; left: 0; top: 600px; width: 980px; font-size: 28px; color: #ff7a2f; text-align: center; opacity: 0; }
  #s1-c1 { left: 1060px; top: 20px; width: 700px; }
  #s1-c2 { left: 1060px; top: 300px; width: 700px; }
  .s1-mini { position: relative; height: 40px; margin-top: 12px; font-size: 28px; line-height: 40px; }
  .s1-mini .lb { position: absolute; left: 0; width: 240px; color: #aab3c2; }
  .s1-mini .bg { position: absolute; left: 250px; top: 6px; width: 0px; height: 28px; border-radius: 6px; }
  .s1-mini .nm { position: absolute; left: 560px; width: 80px; font-weight: 700; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Откуда берётся уверенность модели?</div></div>
    <div class="badge">Knowledge Book · Calibration</div>
    <div class="stage">
      <div id="s1-chart">
        <svg id="s1-svg" viewBox="0 0 980 660">
          <line id="s1-ar0" x1="302" y1="98" x2="366" y2="98" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
          <line id="s1-ar1" x1="302" y1="228" x2="366" y2="228" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
          <line id="s1-ar2" x1="302" y1="358" x2="366" y2="358" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
          <line id="s1-ar3" x1="302" y1="488" x2="366" y2="488" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
        </svg>
        <div id="s1-h1" class="s1-hdr" style="left:140px">logits z<sub>k</sub></div>
        <div id="s1-h2" class="s1-hdr" style="left:380px">softmax → p<sub>k</sub></div>
        <div id="s1-cls0" class="s1-cls" style="top:70px">кот</div>
        <div id="s1-cls1" class="s1-cls" style="top:200px">собака</div>
        <div id="s1-cls2" class="s1-cls" style="top:330px">лиса</div>
        <div id="s1-cls3" class="s1-cls" style="top:460px">волк</div>
        <div id="s1-chip0" class="s1-chip" style="top:70px">z = 4.2</div>
        <div id="s1-chip1" class="s1-chip" style="top:200px">z = 1.0</div>
        <div id="s1-chip2" class="s1-chip" style="top:330px">z = 0</div>
        <div id="s1-chip3" class="s1-chip" style="top:460px">z = −1.0</div>
        <div id="s1-bar0" class="s1-bar" style="top:70px"></div>
        <div id="s1-bar1" class="s1-bar" style="top:200px"></div>
        <div id="s1-bar2" class="s1-bar" style="top:330px"></div>
        <div id="s1-bar3" class="s1-bar" style="top:460px"></div>
        <div id="s1-val0" class="s1-val" style="top:70px;--n:94"></div>
        <div id="s1-val1" class="s1-val" style="top:200px;--n:4"></div>
        <div id="s1-val2" class="s1-val" style="top:330px;--n:1"></div>
        <div id="s1-val3" class="s1-val" style="top:460px;--n:1"></div>
        <div id="s1-ring"></div>
        <div id="s1-foot">уверенность = max<sub>k</sub> p<sub>k</sub> = 0.94 (логиты иллюстративные)</div>
      </div>
      <div id="s1-c1" class="card"><div class="h">Softmax</div>
        <div class="f">p<sub>k</sub> = e<sup>z<sub>k</sub></sup> / Σ<sub>j</sub> e<sup>z<sub>j</sub></sup></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">z<sub>k</sub> — logit класса k; p<sub>k</sub> ∈ [0, 1], Σ p<sub>k</sub> = 1</div></div>
      <div id="s1-c2" class="card"><div class="h">Overconfident</div>
        <div class="s1-mini"><span class="lb">предсказано</span><div id="s1-m1" class="bg" style="background:#4a9eff"></div><span class="nm b">0.95</span></div>
        <div class="s1-mini"><span class="lb">верно на деле</span><div id="s1-m2" class="bg" style="background:#ff4d6d"></div><span class="nm r">0.70</span></div>
        <div style="font-size:26px;color:#aab3c2;margin-top:12px">из ответов с уверенностью 0.95 правильны лишь 70%</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Классификатор выдаёт для каждого класса число <b class="b">z<sub>k</sub></b> — logit; softmax превращает их в «вероятности» <b>p<sub>k</sub></b></div>
      <div id="s1-cap2" class="cap"><b>Уверенность</b> — это максимальная p<sub>k</sub>. Здесь <b class="o">0.94</b>: модель почти не сомневается, что это кот</div>
      <div id="s1-cap3" class="cap">Но уверенность ≠ правильность: при p = 0.95 верны лишь <b class="r">70%</b> ответов — модель <b class="r">overconfident</b></div>
    </div>
  </div>
</div>
<script>
  (() => {
    // softmax([4.2, 1.0, 0, -1.0]) = [0.942, 0.038, 0.014, 0.005] — иллюстративные логиты.
    const P = [0.942, 0.038, 0.014, 0.005], W = 560;
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-h1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    [0, 1, 2, 3].forEach(i => {
      tl.fromTo(`#s1-cls${i}`, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.4 + 0.15 * i);
      tl.fromTo(`#s1-chip${i}`, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0.55 + 0.15 * i);
    });
    cap("#s1-cap1", 0.6, 4.6);
    tl.fromTo("#s1-h2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.0);
    [0, 1, 2, 3].forEach(i => {
      tl.fromTo(`#s1-ar${i}`, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "64 9999" }, duration: 0.4, ease: "power2.out" }, 2.0 + 0.15 * i);
      const w = Math.max(6, P[i] * W);
      tl.fromTo(`#s1-bar${i}`, { width: 0 }, { width: w, duration: 0.8, ease: "power2.out" }, 2.3 + 0.15 * i);
      tl.fromTo(`#s1-val${i}`, { opacity: 0, x: 0 }, { opacity: 1, x: w, duration: 0.8, ease: "power2.out" }, 2.3 + 0.15 * i);
    });
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.6);
    cap("#s1-cap2", 4.8, 8.8);
    tl.fromTo("#s1-ring", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 5.0);
    tl.fromTo("#s1-foot", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.2);
    cap("#s1-cap3", 9.0, 12.5);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.2);
    tl.fromTo("#s1-m1", { width: 0 }, { width: 0.95 * 300, duration: 0.8, ease: "power2.out" }, 9.6);
    tl.fromTo("#s1-m2", { width: 0 }, { width: 0.70 * 300, duration: 0.8, ease: "power2.out" }, 9.9);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 12.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
