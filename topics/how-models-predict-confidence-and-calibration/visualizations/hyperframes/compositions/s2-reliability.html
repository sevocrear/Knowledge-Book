<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 20px; width: 700px; }
  #s2-c2 { left: 1060px; top: 320px; width: 700px; }
  #s2-ece { font-size: 32px; color: #ff7a2f; font-weight: 700; margin-top: 10px; opacity: 0; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title" style="font-size:42px">Как измерить калибровку: reliability diagram?</div></div>
    <div class="badge">Knowledge Book · Calibration</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <line id="s2-ax" x1="130" y1="570" x2="730" y2="570" stroke="#aab3c2" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <line id="s2-ay" x1="130" y1="570" x2="130" y2="90" stroke="#aab3c2" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <g id="s2-ticks" opacity="0" fill="#aab3c2" font-size="24">
          <text x="130" y="606" text-anchor="middle">0</text><text x="430" y="606" text-anchor="middle">0.5</text><text x="730" y="606" text-anchor="middle">1.0</text>
          <text x="112" y="579" text-anchor="end">0</text><text x="112" y="339" text-anchor="end">0.5</text><text x="112" y="99" text-anchor="end">1.0</text>
          <text x="430" y="648" text-anchor="middle" font-size="26">уверенность conf(B<tspan font-size="18" dy="6">m</tspan><tspan dy="-6">)</tspan></text>
          <text x="40" y="330" text-anchor="middle" font-size="26" transform="rotate(-90 40 330)">точность acc(B<tspan font-size="18" dy="6">m</tspan><tspan dy="-6">)</tspan></text>
        </g>
        <g id="s2-bars"></g>
        <g id="s2-gaps"></g>
        <line id="s2-diag" x1="130" y1="570" x2="730" y2="90" stroke="#3dba7a" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <text id="s2-diag-lbl" x="730" y="74" text-anchor="end" fill="#3dba7a" font-size="24" font-weight="700" opacity="0">идеал: acc = conf</text>
        <g id="s2-legend" opacity="0" font-size="24">
          <rect x="150" y="100" width="22" height="22" rx="4" fill="#4a9eff"/><text x="184" y="119" fill="#e6ebf5">acc(B<tspan font-size="17" dy="5">m</tspan><tspan dy="-5">) — доля верных в бине</tspan></text>
          <rect x="150" y="138" width="22" height="22" rx="4" fill="#ff4d6d" fill-opacity="0.55" stroke="#ff4d6d" stroke-width="2"/><text x="184" y="157" fill="#e6ebf5">|acc − conf| — разрыв калибровки</text>
        </g>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Reliability diagram</div>
        <div>10 бинов по уверенности p ∈ [0, 1]. В бине <span class="b">B<sub>m</sub></span>: <b>conf</b> — средняя уверенность, <b>acc</b> — доля верных ответов</div></div>
      <div id="s2-c2" class="card"><div class="h">Expected Calibration Error</div>
        <div class="f" style="font-size:32px">ECE = Σ<sub>m</sub> |B<sub>m</sub>|/N · |acc(B<sub>m</sub>) − conf(B<sub>m</sub>)|</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">|B<sub>m</sub>|/N — доля объектов в бине</div>
        <div id="s2-ece">здесь ECE ≈ 0.24 (иллюстративно)</div></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Разбиваем предсказания на бины по уверенности (например, 10 бинов от 0 до 1) и в каждом считаем <b>conf</b> и <b>acc</b></div>
      <div id="s2-cap2" class="cap">Идеал — диагональ <b class="g">acc = conf</b>. Здесь столбики ниже неё: модель уверена сильнее, чем права — <b class="r">overconfident</b></div>
      <div id="s2-cap3" class="cap">Разрыв <b class="r">|acc − conf|</b> в каждом бине — ошибка калибровки; ECE взвешивает её долей объектов в бине <b>|B<sub>m</sub>|/N</b></div>
      <div id="s2-cap4" class="cap"><b class="o">ECE ≈ 0.24</b>: чем меньше, тем ближе вероятности к фактам. Как уменьшить ECE, не переобучая модель?</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Иллюстративная overconfident-модель: точность в каждом бине ниже средней уверенности.
    const X0 = 130, Y0 = 570, W = 600, H = 480, NB = 10;
    const acc = [0.05, 0.08, 0.12, 0.18, 0.25, 0.33, 0.42, 0.50, 0.60, 0.70];
    const gb = document.getElementById("s2-bars"), gg = document.getElementById("s2-gaps");
    const bars = [], gaps = [];
    for (let i = 0; i < NB; i++) {
      const conf = 0.05 + 0.1 * i, x = X0 + (W / NB) * i + 6, bw = W / NB - 12;
      const b = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      b.setAttribute("id", `s2-bar${i}`); b.setAttribute("x", x); b.setAttribute("width", bw);
      b.setAttribute("y", Y0); b.setAttribute("height", 0); b.setAttribute("rx", 4); b.setAttribute("fill", "#4a9eff");
      gb.appendChild(b); bars.push([b, acc[i] * H]);
      const g = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      g.setAttribute("id", `s2-gap${i}`); g.setAttribute("x", x); g.setAttribute("width", bw);
      g.setAttribute("y", Y0 - conf * H); g.setAttribute("height", 0); g.setAttribute("fill", "#ff4d6d"); g.setAttribute("fill-opacity", "0.55");
      g.setAttribute("stroke", "#ff4d6d"); g.setAttribute("stroke-width", "2");
      gg.appendChild(g); gaps.push([g, (conf - acc[i]) * H]);
    }
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-ax", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "600 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#s2-ay", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "480 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.5);
    tl.fromTo("#s2-ticks", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.0);
    cap("#s2-cap1", 0.6, 4.4);
    bars.forEach(([b, h], i) => tl.fromTo(b, { attr: { y: Y0, height: 0 } }, { attr: { y: Y0 - h, height: h }, duration: 0.6, ease: "power2.out" }, 1.3 + 0.15 * i));
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.6);
    tl.fromTo("#s2-legend", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.2);
    tl.fromTo("#s2-diag", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "768.4 9999" }, duration: 1.0, ease: "power2.inOut" }, 4.6);
    tl.fromTo("#s2-diag-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.4);
    cap("#s2-cap2", 4.6, 8.4);
    gaps.forEach(([g, h], i) => tl.fromTo(g, { attr: { height: 0 } }, { attr: { height: h }, duration: 0.6, ease: "power2.out" }, 8.7 + 0.12 * i));
    cap("#s2-cap3", 8.6, 12.2);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.0);
    tl.fromTo("#s2-ece", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 12.4);
    cap("#s2-cap4", 12.4, 15.5);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 15.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
