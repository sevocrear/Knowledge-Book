<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 0px; width: 700px; }
  #s1-c2 { left: 1060px; top: 170px; width: 700px; }
  #s1-c3 { left: 1060px; top: 462px; width: 700px; }
  .s1-note { font-size: 27px; color: #aab3c2; margin-top: 8px; line-height: 1.3; }
  #s1-gauge { position: relative; margin-top: 18px; height: 60px; }
  #s1-track { position: absolute; left: 0; top: 10px; width: 600px; height: 14px; border-radius: 7px; background: #2a3140; }
  #s1-fill { position: absolute; left: 0; top: 10px; width: 600px; height: 14px; border-radius: 7px; background: #ff7a2f; transform-origin: 0 50%; }
  #s1-mark { position: absolute; left: -12px; top: 5px; width: 24px; height: 24px; border-radius: 50%; background: #ff7a2f; border: 3px solid #f0f4ff; box-sizing: border-box; }
  #s1-g0 { position: absolute; left: 0; top: 34px; font-size: 22px; color: #aab3c2; }
  #s1-g5 { position: absolute; right: 36px; top: 34px; font-size: 22px; color: #aab3c2; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Как измерить «запутанность» узла?</div></div>
    <div class="badge">Knowledge Book · Decision trees</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <rect id="s1-node" x="60" y="12" width="870" height="608" rx="24" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-dasharray="0 9999"/>
        <text id="s1-node-lbl" x="495" y="652" text-anchor="middle" fill="#2dd4bf" font-size="26" font-weight="700" opacity="0">узел S (корень): 20 объектов</text>
        <path id="s1-axis" d="M 90 30 L 90 590 L 900 590" fill="none" stroke="#aab3c2" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <text x="906" y="598" fill="#aab3c2" font-size="24">x₁</text>
        <text x="100" y="40" fill="#aab3c2" font-size="24">x₂</text>
        <g id="s1-pts"></g>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Доли классов в узле</div>
        <div class="f"><span class="b">p₁</span> = 16/20 = <span class="b">0.8</span>,&nbsp;&nbsp; <span class="o">p₂</span> = 4/20 = <span class="o">0.2</span></div></div>
      <div id="s1-c2" class="card"><div class="h">Индекс Джини (Gini impurity)</div>
        <div class="f">G = 1 − Σ<sub>k</sub> p<sub>k</sub>²</div>
        <div class="f" style="margin-top:4px">= 1 − (0.8² + 0.2²) = <b class="o">0.32</b></div>
        <div id="s1-gauge"><div id="s1-track"></div><div id="s1-fill"></div><div id="s1-mark"></div>
          <div id="s1-g0">0 — чистый узел</div><div id="s1-g5">0.5 — поровну (1 − 1/K)</div></div></div>
      <div id="s1-c3" class="card"><div class="h">Энтропия Шеннона (Entropy)</div>
        <div class="f">H = −Σ<sub>k</sub> p<sub>k</sub> log₂ p<sub>k</sub> ≈ <b class="o">0.72 бит</b></div>
        <div class="s1-note">чистый узел → 0 бит; поровну → log₂ K = 1 бит</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Корень S: 20 объектов, 16 <b class="b">синих</b> и 4 <b class="o">оранжевых</b> → p₁ = 0.8, p₂ = 0.2 (точки иллюстративно)</div>
      <div id="s1-cap2" class="cap">Джини: G = 1 − Σ p<sub>k</sub>² = 1 − (0.64 + 0.04) = <b>0.32</b>. Чистый узел → 0, классы поровну → 0.5 (максимум 1 − 1/K)</div>
      <div id="s1-cap3" class="cap">Энтропия: H = −Σ p<sub>k</sub> log₂ p<sub>k</sub> ≈ <b>0.72 бит</b>. Оба критерия: чем <b class="t">меньше примесь</b>, тем однороднее узел</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Иллюстративная выборка: 16 синих + 4 оранжевых, координаты в SVG (x₁ → 90 + 81·x, x₂ → 590 − 56·y).
    const blue = [[154.8,500.4],[195.3,231.6],[243.9,388.4],[284.4,119.6],[349.2,522.8],[381.6,287.6],[438.3,422.0],[486.9,164.4],[535.5,478.0],[414.0,80.4],[219.6,69.2],[559.8,310.0],[324.9,203.6],[162.9,343.6],[681.3,455.6],[794.7,382.8]];
    const orange = [[673.2,147.6],[762.3,237.2],[819.0,102.8],[721.8,74.8]];
    const g = document.getElementById("s1-pts");
    const ids = [];
    const mk = (pts, color, tag) => pts.forEach(([x, y], i) => {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      el.setAttribute("id", `s1-${tag}${i}`); el.setAttribute("cx", x); el.setAttribute("cy", y);
      el.setAttribute("r", "11"); el.setAttribute("fill", color); el.setAttribute("opacity", "0");
      g.appendChild(el); ids.push(el);
    });
    mk(blue, "#4a9eff", "b"); mk(orange, "#ff7a2f", "o");

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-axis", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "1370 9999" }, duration: 0.8, ease: "power2.inOut" }, 0.3);
    ids.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.8 + 0.07 * i));
    tl.fromTo("#s1-node", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "2956 9999" }, duration: 1.0, ease: "power2.inOut" }, 2.3);
    tl.fromTo("#s1-node-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.0);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.2);
    cap("#s1-cap1", 0.6, 4.6);
    // Джини: шкала 0…0.5, маркер едет к 0.32 (0.64 длины трека).
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.0);
    tl.fromTo("#s1-fill", { scaleX: 0 }, { scaleX: 0.64, duration: 1.2, ease: "power2.inOut" }, 5.6);
    tl.fromTo("#s1-mark", { x: 0 }, { x: 384, duration: 1.2, ease: "power2.inOut" }, 5.6);
    cap("#s1-cap2", 4.8, 8.8);
    tl.fromTo("#s1-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.2);
    cap("#s1-cap3", 9.0, 12.5);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 12.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
