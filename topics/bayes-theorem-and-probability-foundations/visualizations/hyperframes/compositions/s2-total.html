<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 20px; width: 700px; }
  #s2-c2 { left: 1060px; top: 330px; width: 700px; }
  #s2-c1 .ln, #s2-c2 .ln { font-size: 32px; line-height: 1.4; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Как найти P(+), если Ω разбито на гипотезы?</div></div>
    <div class="badge">Knowledge Book · Байес</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <g id="s2-grid"></g>
        <g id="s2-lg1" opacity="0">
          <rect x="690" y="44" width="36" height="36" rx="6" fill="#1e3a5f" stroke="#4a9eff" stroke-width="3"/>
          <text x="742" y="62" fill="#f0f4ff" font-size="26" font-weight="600">здоров · H₂</text>
          <text x="742" y="94" fill="#aab3c2" font-size="24">P(H₂) = 0.99</text>
        </g>
        <g id="s2-lg2" opacity="0">
          <rect x="690" y="134" width="36" height="36" rx="6" fill="#ff7a2f"/>
          <text x="742" y="152" fill="#f0f4ff" font-size="26" font-weight="600">болен · H₁</text>
          <text x="742" y="184" fill="#aab3c2" font-size="24">P(H₁) = 0.01</text>
        </g>
        <g id="s2-lg3" opacity="0">
          <rect x="690" y="244" width="36" height="36" rx="6" fill="#161a24" stroke="#ff4d6d" stroke-width="4"/>
          <text x="708" y="273" text-anchor="middle" fill="#f0f4ff" font-size="30" font-weight="700">+</text>
          <text x="742" y="262" fill="#f0f4ff" font-size="26" font-weight="600">тест «+»</text>
          <text x="742" y="294" fill="#aab3c2" font-size="24">P(+|H₁) = 0.99</text>
          <text x="742" y="326" fill="#aab3c2" font-size="24">P(+|H₂) = 0.05</text>
        </g>
        <text id="s2-note" x="40" y="655" fill="#aab3c2" font-size="24" opacity="0">на 100 человек: ≈ 1 больной и ≈ 5 здоровых с «+» (иллюстративно)</text>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Разбиение Ω на гипотезы</div>
        <div class="ln"><span class="o">H₁</span> = болен: &nbsp;P(H₁) = 0.01</div>
        <div class="ln"><span class="b">H₂</span> = здоров: &nbsp;P(H₂) = 0.99</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">H₁ ∩ H₂ = ∅, &nbsp;H₁ ∪ H₂ = Ω — полная группа событий</div></div>
      <div id="s2-c2" class="card"><div class="h">Формула полной вероятности</div>
        <div class="f">P(+) = Σ<sub>i</sub> P(+|H<sub>i</sub>) · P(H<sub>i</sub>)</div>
        <div class="ln" style="margin-top:6px">= <span class="o">0.99 · 0.01</span> + <span class="b">0.05 · 0.99</span></div>
        <div class="ln">= <span class="o">0.0099</span> + <span class="b">0.0495</span> = <b>0.0594</b></div></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Медицинский тест. Разбиваем Ω на гипотезы: <b class="o">H₁</b> «болен» — 1% людей, <b class="b">H₂</b> «здоров» — 99%. Вместе они покрывают всё Ω</div>
      <div id="s2-cap2" class="cap">Чувствительность 99%: «+» у больного. Специфичность 95%: «+» ещё у <b class="r">5% здоровых</b> — ложноположительные</div>
      <div id="s2-cap3" class="cap">Собираем «+» по кускам разбиения: P(+) = Σ P(+|H<sub>i</sub>)·P(H<sub>i</sub>) = <b class="o">0.0099</b> + <b class="b">0.0495</b> = <b>0.0594</b></div>
      <div id="s2-cap4" class="cap">Большая часть плюсов — от здоровых: <b class="b">0.0495</b> из 0.0594. Prior болезни мал, поэтому ложных «+» больше, чем настоящих</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const grid = document.getElementById("s2-grid");
    const X0 = 40, Y0 = 30, S = 54, PITCH = 60;
    const SICK = 45, FP = [17, 32, 58, 73, 91];   // индексы клеток: 1 больной, 5 ложноположительных (детерминированно)
    const cells = [];
    for (let i = 0; i < 100; i++) {
      const r = Math.floor(i / 10), c = i % 10, x = X0 + c * PITCH, y = Y0 + r * PITCH;
      const grp = document.createElementNS(NS, "g"); grp.setAttribute("id", `s2-g${i}`); grp.setAttribute("opacity", "0");
      const base = document.createElementNS(NS, "rect");
      base.setAttribute("x", x); base.setAttribute("y", y); base.setAttribute("width", S); base.setAttribute("height", S); base.setAttribute("rx", "8"); base.setAttribute("fill", "#2a3140");
      grp.appendChild(base);
      const ov = document.createElementNS(NS, "rect"); ov.setAttribute("id", `s2-o${i}`);
      ov.setAttribute("x", x); ov.setAttribute("y", y); ov.setAttribute("width", S); ov.setAttribute("height", S); ov.setAttribute("rx", "8"); ov.setAttribute("opacity", "0");
      if (i === SICK) { ov.setAttribute("fill", "#ff7a2f"); } else { ov.setAttribute("fill", "#1e3a5f"); ov.setAttribute("stroke", "#4a9eff"); ov.setAttribute("stroke-width", "2"); }
      grp.appendChild(ov);
      if (i === SICK || FP.includes(i)) {
        const pg = document.createElementNS(NS, "g"); pg.setAttribute("id", `s2-p${i}`); pg.setAttribute("opacity", "0");
        const fr = document.createElementNS(NS, "rect");
        fr.setAttribute("x", x); fr.setAttribute("y", y); fr.setAttribute("width", S); fr.setAttribute("height", S); fr.setAttribute("rx", "8"); fr.setAttribute("fill", "none"); fr.setAttribute("stroke", "#ff4d6d"); fr.setAttribute("stroke-width", "5");
        pg.appendChild(fr);
        const tx = document.createElementNS(NS, "text");
        tx.setAttribute("x", x + S / 2); tx.setAttribute("y", y + S / 2 + 13); tx.setAttribute("text-anchor", "middle"); tx.setAttribute("font-size", "38"); tx.setAttribute("font-weight", "700");
        tx.setAttribute("fill", i === SICK ? "#0f1117" : "#f0f4ff"); tx.textContent = "+";
        pg.appendChild(tx);
        grp.appendChild(pg);
      }
      grid.appendChild(grp);
      cells.push({ i, grp, ov, r, c });
    }

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    cells.forEach(c => tl.fromTo(c.grp, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3 + 0.012 * c.i));
    cap("#s2-cap1", 0.6, 4.6);
    // Разбиение: 99 здоровых (синие) и 1 больной (оранжевый)
    cells.forEach(c => { if (c.i !== SICK) tl.fromTo(c.ov, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.8 + 0.006 * c.i); });
    tl.fromTo("#s2-lg1", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.4 }, 2.0);
    tl.fromTo(`#s2-o${SICK}`, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.7);
    tl.fromTo(`#s2-g${SICK}`, { scale: 1, svgOrigin: "367 297" }, { scale: 1.35, svgOrigin: "367 297", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.7);
    tl.fromTo("#s2-lg2", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.4 }, 2.9);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.2);
    // Тест: «+» у больного и у 5 здоровых
    cap("#s2-cap2", 4.8, 8.6);
    tl.fromTo(`#s2-p${SICK}`, { opacity: 0 }, { opacity: 1, duration: 0.35 }, 5.0);
    tl.fromTo("#s2-lg3", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.4 }, 5.2);
    FP.forEach((i, k) => tl.fromTo(`#s2-p${i}`, { opacity: 0 }, { opacity: 1, duration: 0.35 }, 6.0 + 0.3 * k));
    // Полная вероятность: сумма по кускам
    cap("#s2-cap3", 8.8, 12.0);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.0);
    tl.fromTo(`#s2-p${SICK}`, { scale: 1, svgOrigin: "367 297" }, { scale: 1.3, svgOrigin: "367 297", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 9.6);
    FP.forEach((i, k) => {
      const r = Math.floor(i / 10), c = i % 10, ox = X0 + c * PITCH + S / 2, oy = Y0 + r * PITCH + S / 2;
      tl.fromTo(`#s2-p${i}`, { scale: 1, svgOrigin: `${ox} ${oy}` }, { scale: 1.3, svgOrigin: `${ox} ${oy}`, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 10.4 + 0.15 * k);
    });
    cap("#s2-cap4", 12.2, 14.5);
    tl.fromTo("#s2-note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 12.4);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 14.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
