    const GX = 40, GY = 50, CELL = 40;
    AB.forEach((ab, L) => {
      const g = document.getElementById(`s1-L${L}`), sa = Math.sqrt(ab), sb = Math.sqrt(1 - ab);
      X0.forEach((v, i) => { const r = document.createElementNS(NS, "rect");
        r.setAttribute("id", `s1-L${L}c${i}`); r.setAttribute("x", GX + CELL * (i % 8) + 1); r.setAttribute("y", GY + CELL * Math.floor(i / 8) + 1);

    const tl = gsap.timeline({ paused: true });
