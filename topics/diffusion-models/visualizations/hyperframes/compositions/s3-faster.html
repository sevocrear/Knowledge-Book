<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 20px; width: 700px; }
  #s3-c2 { left: 1060px; top: 320px; width: 700px; }
  #s3-c1 .f { font-size: 32px; }
  #s3-c2 .li { font-size: 30px; line-height: 1.4; }
  #s3-c2 .li b { color: #4a9eff; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Как ускорить: DDIM и latent diffusion?</div></div>
    <div class="badge">Knowledge Book · Diffusion</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <defs>
          <marker id="s3-ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#aab3c2"/></marker>
          <mask id="s3-m1"><rect id="s3-m1r" x="60" y="40" width="0" height="30" fill="#fff"/></mask>
        </defs>
        <text id="s3-t1" x="60" y="34" fill="#4a9eff" font-size="24" font-weight="700" opacity="0">DDPM: все T = 1000 шагов, t = T, T−1, …, 1</text>
        <line x1="60" y1="56" x2="920" y2="56" stroke="#4a9eff" stroke-width="12" stroke-dasharray="2.6 6" mask="url(#s3-m1)"/>
        <text id="s3-t2" x="60" y="104" fill="#ff7a2f" font-size="24" font-weight="700" opacity="0">DDIM: подпоследовательность, 50 шагов (step = T / 50 = 20)</text>
        <g id="s3-dots"></g>
        <path id="s3-ax" d="M 60 176 L 920 176" stroke="#2a3140" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <text id="s3-axl" x="60" y="208" fill="#aab3c2" font-size="22" opacity="0">t = T (шум)</text>
        <text id="s3-axr" x="920" y="208" text-anchor="end" fill="#aab3c2" font-size="22" opacity="0">t = 0 (данные)</text>

        <text id="s3-ld" x="490" y="292" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">Latent Diffusion (Stable Diffusion): диффузия не в пикселях, а в латенте VAE</text>
        <g id="s3-Gin" opacity="0"></g>
        <text id="s3-lin" x="82" y="490" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">изображение</text>
        <path id="s3-p1" d="M 142 400 L 172 400" stroke="#aab3c2" stroke-width="3" fill="none" stroke-dasharray="0 9999" marker-end="url(#s3-ah)" opacity="0"/>
        <g id="s3-enc" opacity="0"><rect x="182" y="340" width="140" height="120" rx="16" fill="#161a24" stroke="#3dba7a" stroke-width="3"/>
          <text x="252" y="392" text-anchor="middle" fill="#3dba7a" font-size="22" font-weight="700">1 · VAE</text><text x="252" y="422" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="700">encoder</text></g>
        <path id="s3-p2" d="M 332 400 L 362 400" stroke="#aab3c2" stroke-width="3" fill="none" stroke-dasharray="0 9999" marker-end="url(#s3-ah)" opacity="0"/>
        <g id="s3-lat" opacity="0"><rect x="372" y="340" width="260" height="120" rx="16" fill="#161a24" stroke="#ff7a2f" stroke-width="3"/>
          <text x="546" y="382" text-anchor="middle" fill="#ff7a2f" font-size="22" font-weight="700">2 · diffusion</text><text x="546" y="410" text-anchor="middle" fill="#f0f4ff" font-size="22">в латентном</text><text x="546" y="436" text-anchor="middle" fill="#f0f4ff" font-size="22">пространстве</text></g>
        <g id="s3-Z0" opacity="0"></g><g id="s3-Z1" opacity="0"></g>
        <text id="s3-lz" x="426" y="490" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">латент z, 4×4</text>
        <path id="s3-p3" d="M 642 400 L 672 400" stroke="#aab3c2" stroke-width="3" fill="none" stroke-dasharray="0 9999" marker-end="url(#s3-ah)" opacity="0"/>
        <g id="s3-dec" opacity="0"><rect x="682" y="340" width="140" height="120" rx="16" fill="#161a24" stroke="#b48ce6" stroke-width="3"/>
          <text x="752" y="392" text-anchor="middle" fill="#b48ce6" font-size="22" font-weight="700">3 · VAE</text><text x="752" y="422" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="700">decoder</text></g>
        <path id="s3-p4" d="M 832 400 L 862 400" stroke="#aab3c2" stroke-width="3" fill="none" stroke-dasharray="0 9999" marker-end="url(#s3-ah)" opacity="0"/>
        <g id="s3-Gout" opacity="0"></g>
        <text id="s3-lout" x="924" y="490" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">пиксели</text>
        <text id="s3-sub" x="490" y="560" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">латент меньше по размерности → быстрее и меньше памяти</text>
        <text id="s3-sub2" x="490" y="600" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">(8×8 → 4×4 иллюстративно; ε<tspan font-size="16" dy="5">θ</tspan><tspan dy="-5"> работает с z, а не с пикселями)</tspan></text>
      </svg>
      <div id="s3-c1" class="card"><div class="h">DDIM (Song et al., 2021)</div>
        <div class="f">x<sub>t−1</sub> = √ᾱ<sub>t−1</sub>·<span class="b">x̂₀</span> + √(1−ᾱ<sub>t−1</sub>)·<span class="o">ε<sub>θ</sub>(x<sub>t</sub>, t)</span></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">при η = 0 — детерминированно и обратимо; 20–50 шагов вместо 1000 (DDPM)</div></div>
      <div id="s3-c2" class="card"><div class="h">Latent Diffusion (Rombach et al., 2022)</div>
        <div class="li"><b>1.</b> VAE encoder: изображение → латент<br/><b>2.</b> diffusion в латентном пространстве<br/><b>3.</b> VAE decoder: латент → изображение</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">быстрее, меньше памяти, высокое качество — основа Stable Diffusion</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">DDPM идёт все <b class="b">T = 1000</b> шагов. <b class="o">DDIM</b> берёт подпоследовательность: 20–50 шагов, при η = 0 — детерминированно</div>
      <div id="s3-cap2" class="cap"><b>Latent diffusion</b>: VAE encoder сжимает картинку в латент, диффузия идёт там, VAE decoder возвращает пиксели</div>
      <div id="s3-cap3" class="cap key">Diffusion = учимся убирать шум: forward добавляет гауссовский шум по β<sub>t</sub>, сеть ε<sub>θ</sub> его предсказывает; DDIM и латент делают генерацию быстрой</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const X0 = [-0.6,-0.6,-0.6,-0.6,-0.6,-0.6,-0.6,-0.6,-1,-1,-1,0.2,0.2,-1,-1,-1,-1,-1,0.2,1,1,0.2,-1,-1,-1,0.2,1,1,1,1,0.2,-1,-1,0.2,1,1,1,1,0.2,-1,-1,-1,0.2,1,1,0.2,-1,-1,-1,-1,-1,0.2,0.2,-1,-1,-1,-0.6,-0.6,-0.6,-0.6,-0.6,-0.6,-0.6,-0.6];
    const EPS = [-0.26,0.51,-0.23,-0.32,-0.93,-0.21,1.11,0.42,1.04,0.25,0.39,0.19,-1.67,0.86,0.51,0.5]; // фиксированный шум для латента 4×4
    const col = v => { const u = (Math.max(-1, Math.min(1, v)) + 1) / 2; const c0 = [26, 32, 48], c1 = [207, 227, 255];
      return "#" + c0.map((a, k) => Math.round(a + (c1[k] - a) * u).toString(16).padStart(2, "0")).join(""); };
    const grid = (gid, x, y, cell, n, vals) => { const g = document.getElementById(gid);
      vals.forEach((v, i) => { const r = document.createElementNS(NS, "rect"); r.setAttribute("id", `${gid}c${i}`);
        r.setAttribute("x", x + cell * (i % n) + 1); r.setAttribute("y", y + cell * Math.floor(i / n) + 1);
        r.setAttribute("width", cell - 2); r.setAttribute("height", cell - 2); r.setAttribute("rx", 3); r.setAttribute("fill", col(v)); g.appendChild(r); }); };
    // Латент 4×4 — среднее по блокам 2×2 (иллюстративная «VAE-компрессия»).
    const Z = []; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) Z.push((X0[16 * r + 2 * c] + X0[16 * r + 2 * c + 1] + X0[16 * r + 8 + 2 * c] + X0[16 * r + 9 + 2 * c]) / 4);
    grid("s3-Gin", 30, 348, 13, 8, X0);
    grid("s3-Gout", 872, 348, 13, 8, X0);
    grid("s3-Z0", 392, 366, 17, 4, Z);
    grid("s3-Z1", 392, 366, 17, 4, Z.map((v, i) => 0.28 * v + 0.96 * EPS[i]));   // z при t = 500 (ᾱ = 0.0786)
    // 50 шагов DDIM на оси t.
    const dots = document.getElementById("s3-dots");
    const dot = []; for (let i = 0; i < 50; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("id", `s3-d${i}`);
      c.setAttribute("cx", (60 + 860 * i / 49).toFixed(1)); c.setAttribute("cy", 128); c.setAttribute("r", 6); c.setAttribute("fill", "#ff7a2f"); c.setAttribute("opacity", "0"); dots.appendChild(c); dot.push(c); }

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const draw = (id, len, t, d = 0.35) => tl.fromTo(id, { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": len + " 9999" }, duration: d, ease: "power2.inOut" }, t);
    const show = (id, t, d = 0.4) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    show("#s3-t1", 0.4);
    tl.fromTo("#s3-m1r", { attr: { width: 0 } }, { attr: { width: 860 }, duration: 1.4, ease: "none" }, 0.6);
    show("#s3-t2", 1.6);
    dot.forEach((c, i) => tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.8 + 0.03 * i));
    draw("#s3-ax", 860, 2.0, 0.8);
    show("#s3-axl", 2.2); show("#s3-axr", 2.4);
    cap("#s3-cap1", 0.6, 4.4);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.6);
    // Latent diffusion: image → VAE encoder → z (шумим и расшумляем) → VAE decoder → image.
    cap("#s3-cap2", 4.6, 8.8);
    show("#s3-ld", 4.6);
    show("#s3-Gin", 4.8); show("#s3-lin", 4.9);
    draw("#s3-p1", 30, 5.1);
    tl.fromTo("#s3-enc", { opacity: 0, scale: 0.9, svgOrigin: "252 400" }, { opacity: 1, scale: 1, svgOrigin: "252 400", duration: 0.4, ease: "power2.out" }, 5.3);
    draw("#s3-p2", 30, 5.6);
    tl.fromTo("#s3-lat", { opacity: 0, scale: 0.9, svgOrigin: "502 400" }, { opacity: 1, scale: 1, svgOrigin: "502 400", duration: 0.4, ease: "power2.out" }, 5.8);
    show("#s3-Z0", 6.0); show("#s3-lz", 6.1);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.2);
    tl.fromTo("#s3-Z1", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 6.5);   // forward в латенте
    tl.to("#s3-Z1", { opacity: 0, duration: 0.8, ease: "power1.inOut" }, 7.3);                        // reverse: ε_θ убирает шум
    draw("#s3-p3", 30, 8.0);
    tl.fromTo("#s3-dec", { opacity: 0, scale: 0.9, svgOrigin: "752 400" }, { opacity: 1, scale: 1, svgOrigin: "752 400", duration: 0.4, ease: "power2.out" }, 8.2);
    draw("#s3-p4", 30, 8.5);
    show("#s3-Gout", 8.7); show("#s3-lout", 8.8);
    show("#s3-sub", 9.0); show("#s3-sub2", 9.3);
    cap("#s3-cap3", 9.1, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 12.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
