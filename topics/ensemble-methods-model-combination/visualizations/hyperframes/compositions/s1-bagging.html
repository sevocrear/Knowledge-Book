<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 0px; width: 700px; }
  #s1-c2 { left: 1060px; top: 220px; width: 700px; }
  #s1-c3 { left: 1060px; top: 440px; width: 700px; }
  .card .f { font-size: 32px; }
  .s1-sub { font-size: 25px; color: #aab3c2; margin-top: 8px; line-height: 1.3; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Bagging: зачем усреднять много моделей?</div></div>
    <div class="badge">Knowledge Book · Ensembles</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <!-- обучающий набор D -->
        <text id="s1-d-lbl" x="140" y="150" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0">набор D</text>
        <text id="s1-d-lbl2" x="140" y="180" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">N объектов</text>
        <g id="s1-d"></g>
        <g id="s1-arrows"></g>
        <!-- бутстрэп-выборки -->
        <g id="s1-boxes"></g>
        <g id="s1-samples"></g>
        <g id="s1-trees"></g>
        <g id="s1-agg" opacity="0">
          <rect x="842" y="266" width="128" height="128" rx="16" fill="#161a24" stroke="#3dba7a" stroke-width="4"/>
          <text x="906" y="318" text-anchor="middle" fill="#f0f4ff" font-size="44" font-weight="800">ŷ</text>
          <text x="906" y="350" text-anchor="middle" fill="#aab3c2" font-size="20">среднее /</text>
          <text x="906" y="374" text-anchor="middle" fill="#aab3c2" font-size="20">голосование</text>
        </g>
        <g id="s1-legend" opacity="0">
          <circle cx="302" cy="642" r="9" fill="#4a9eff"/><text x="320" y="649" fill="#aab3c2" font-size="22">объект взят впервые</text>
          <circle cx="640" cy="642" r="9" fill="#ff7a2f"/><text x="658" y="649" fill="#aab3c2" font-size="22">повтор (с возвращением)</text>
        </g>
        <g id="s1-rf" opacity="0">
          <text x="530" y="626" text-anchor="middle" fill="#3dba7a" font-size="24" font-weight="600">Random Forest: на сплите только m = √p случайных признаков</text>
          <text x="530" y="652" text-anchor="middle" fill="#3dba7a" font-size="24" font-weight="600">→ деревья декоррелированы (ρ ↓), variance ещё ниже</text>
        </g>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Bootstrap (Breiman, 1996)</div>
        <div class="f">D<sub>i</sub> — выборка из D <span class="o">с возвращением</span></div>
        <div class="s1-sub">|D<sub>i</sub>| = N; в каждой ≈ 63.2% уникальных объектов, остальные ≈ 36.8% — Out-of-Bag (OOB)</div></div>
      <div id="s1-c2" class="card"><div class="h">Агрегация M независимых моделей</div>
        <div class="f">ŷ = (1/M)·Σ<sub>i</sub> f<sub>i</sub>(x) &nbsp;или&nbsp; mode{f<sub>i</sub>(x)}</div>
        <div class="s1-sub">регрессия — среднее M ответов, классификация — голосование большинства</div></div>
      <div id="s1-c3" class="card"><div class="h">Почему падает variance</div>
        <div class="f">Var(ŷ) = <span class="o">ρ</span>·σ² + (1 − <span class="o">ρ</span>)·σ²/M</div>
        <div class="s1-sub">ρ = 0 → σ²/M (в M раз меньше); ρ = 1 → σ² (выигрыша нет)</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap"><b>Bagging</b>: из набора D делаем M бутстрэп-выборок <b>с возвращением</b> — в каждой ≈ <b class="b">63.2%</b> уникальных объектов, остальные — <b>OOB</b></div>
      <div id="s1-cap2" class="cap">На каждой D<sub>i</sub> — <b class="g">независимая модель f<sub>i</sub></b> (учатся параллельно); ответы <b>усредняем</b> или <b>голосуем</b></div>
      <div id="s1-cap3" class="cap">Усреднение снижает <b class="o">variance</b>: чем менее коррелированы модели (ρ → 0), тем ближе к σ²/M. <b class="g">Random Forest</b> декоррелирует деревья случайными признаками</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    // Обучающий набор: 20 объектов (иллюстративно), сетка 5×4.
    const dPos = i => [60 + 40 * (i % 5), 200 + 40 * Math.floor(i / 5)];
    const gD = document.getElementById("s1-d");
    const dDots = [];
    for (let i = 0; i < 20; i++) {
      const [x, y] = dPos(i);
      const el = document.createElementNS(NS, "circle");
      el.setAttribute("id", `s1-d-${i}`); el.setAttribute("cx", x); el.setAttribute("cy", y);
      el.setAttribute("r", "10"); el.setAttribute("fill", "#4a9eff"); el.setAttribute("opacity", "0");
      gD.appendChild(el); dDots.push(el);
    }
    // Три бутстрэп-выборки (по 20 слотов, 13 уникальных ≈ 65%) — индексы фиксированы, без Math.random.
    const samples = [
      [0, 1, 1, 3, 4, 4, 6, 7, 7, 7, 9, 10, 12, 12, 13, 15, 16, 16, 16, 19],
      [2, 2, 3, 5, 5, 6, 8, 8, 9, 11, 11, 11, 13, 14, 14, 15, 17, 17, 18, 19],
      [0, 0, 2, 4, 5, 5, 7, 8, 10, 10, 11, 12, 12, 12, 15, 16, 16, 17, 17, 18],
    ];
    const yc = [120, 330, 540];
    const gB = document.getElementById("s1-boxes"), gS = document.getElementById("s1-samples"), gT = document.getElementById("s1-trees");
    const flights = []; // [el, fromX, fromY, toX, toY, sampleIdx, slot]
    samples.forEach((idx, s) => {
      const y0 = yc[s];
      const box = document.createElementNS(NS, "g");
      box.setAttribute("id", `s1-box-${s}`); box.setAttribute("opacity", "0");
      box.innerHTML = `<rect x="320" y="${y0 - 62}" width="220" height="124" rx="14" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
        <text x="308" y="${y0 + 10}" text-anchor="end" fill="#f0f4ff" font-size="28" font-weight="700">D<tspan font-size="20" dy="6">${s + 1}</tspan></text>`;
      gB.appendChild(box);
      const seen = new Set();
      idx.forEach((i, j) => {
        const [fx, fy] = dPos(i);
        const tx = 350 + 40 * (j % 5), ty = y0 - 45 + 30 * Math.floor(j / 5);
        const rep = seen.has(i); seen.add(i);
        const el = document.createElementNS(NS, "circle");
        el.setAttribute("id", `s1-s${s}-${j}`); el.setAttribute("cx", fx); el.setAttribute("cy", fy);
        el.setAttribute("r", "9"); el.setAttribute("fill", rep ? "#ff7a2f" : "#4a9eff"); el.setAttribute("opacity", "0");
        gS.appendChild(el); flights.push([el, fx, fy, tx, ty, s, j]);
      });
      // Дерево f_i
      const tr = document.createElementNS(NS, "g");
      tr.setAttribute("id", `s1-tree-${s}`); tr.setAttribute("opacity", "0");
      const rx = 655, ry = y0 - 48;
      tr.innerHTML = `<line x1="${rx}" y1="${ry}" x2="${rx - 30}" y2="${ry + 40}" stroke="#3dba7a" stroke-width="4"/><line x1="${rx}" y1="${ry}" x2="${rx + 30}" y2="${ry + 40}" stroke="#3dba7a" stroke-width="4"/>
        <line x1="${rx - 30}" y1="${ry + 40}" x2="${rx - 45}" y2="${ry + 80}" stroke="#3dba7a" stroke-width="4"/><line x1="${rx - 30}" y1="${ry + 40}" x2="${rx - 15}" y2="${ry + 80}" stroke="#3dba7a" stroke-width="4"/>
        <line x1="${rx + 30}" y1="${ry + 40}" x2="${rx + 15}" y2="${ry + 80}" stroke="#3dba7a" stroke-width="4"/><line x1="${rx + 30}" y1="${ry + 40}" x2="${rx + 45}" y2="${ry + 80}" stroke="#3dba7a" stroke-width="4"/>
        <circle cx="${rx}" cy="${ry}" r="9" fill="#3dba7a"/><circle cx="${rx - 30}" cy="${ry + 40}" r="8" fill="#3dba7a"/><circle cx="${rx + 30}" cy="${ry + 40}" r="8" fill="#3dba7a"/>
        <circle cx="${rx - 45}" cy="${ry + 80}" r="7" fill="#161a24" stroke="#3dba7a" stroke-width="3"/><circle cx="${rx - 15}" cy="${ry + 80}" r="7" fill="#161a24" stroke="#3dba7a" stroke-width="3"/>
        <circle cx="${rx + 15}" cy="${ry + 80}" r="7" fill="#161a24" stroke="#3dba7a" stroke-width="3"/><circle cx="${rx + 45}" cy="${ry + 80}" r="7" fill="#161a24" stroke="#3dba7a" stroke-width="3"/>
        <text x="${rx + 62}" y="${y0 + 10}" fill="#3dba7a" font-size="30" font-weight="700">f<tspan font-size="20" dy="6">${s + 1}</tspan></text>`;
      gT.appendChild(tr);
    });
    // Стрелки: шафт (рисуется через stroke-dasharray) + отдельный наконечник-полигон.
    const gA = document.getElementById("s1-arrows");
    const arrows = {};
    const mkArrow = (id, x0, y0, x1, y1, col) => {
      const ang = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0);
      const bx = x1 - 14 * Math.cos(ang), by = y1 - 14 * Math.sin(ang), nx = -Math.sin(ang) * 7, ny = Math.cos(ang) * 7;
      const p = document.createElementNS(NS, "path");
      p.setAttribute("id", `${id}-l`); p.setAttribute("d", `M ${x0} ${y0} L ${bx.toFixed(1)} ${by.toFixed(1)}`);
      p.setAttribute("fill", "none"); p.setAttribute("stroke", col); p.setAttribute("stroke-width", "5"); p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-dasharray", "0 9999"); p.setAttribute("opacity", "0");
      const h = document.createElementNS(NS, "polygon");
      h.setAttribute("id", `${id}-h`); h.setAttribute("fill", col); h.setAttribute("opacity", "0");
      h.setAttribute("points", `${x1} ${y1} ${(bx + nx).toFixed(1)} ${(by + ny).toFixed(1)} ${(bx - nx).toFixed(1)} ${(by - ny).toFixed(1)}`);
      gA.appendChild(p); gA.appendChild(h); arrows[id] = (len - 14).toFixed(1);
    };
    const drawArrow = (tl, id, t, dur) => {
      tl.fromTo(`#${id}-l`, { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": arrows[id] + " 9999" }, duration: dur, ease: "power2.inOut" }, t);
      tl.fromTo(`#${id}-h`, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t + dur - 0.1);
    };
    [["s1-ar-d1", 248, 232, 316, 128], ["s1-ar-d2", 248, 262, 316, 322], ["s1-ar-d3", 248, 292, 316, 528]].forEach(a => mkArrow(...a, "#aab3c2"));
    [["s1-ar-t1", 548, 120, 596, 120], ["s1-ar-t2", 548, 330, 596, 330], ["s1-ar-t3", 548, 540, 596, 540]].forEach(a => mkArrow(...a, "#aab3c2"));
    [["s1-ar-a1", 776, 128, 838, 300], ["s1-ar-a2", 776, 330, 838, 330], ["s1-ar-a3", 776, 532, 838, 360]].forEach(a => mkArrow(...a, "#3dba7a"));

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-d-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    tl.fromTo("#s1-d-lbl2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.4);
    dDots.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.4 + 0.03 * i));
    cap("#s1-cap1", 0.6, 5.0);
    // Выборки: стрелка → рамка → объекты «летят» из D в слоты (повторы — оранжевые)
    [0, 1, 2].forEach(s => {
      const t = 1.2 + 0.95 * s;
      drawArrow(tl, `s1-ar-d${s + 1}`, t, 0.4);
      tl.fromTo(`#s1-box-${s}`, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t + 0.25);
    });
    flights.forEach(([el, fx, fy, tx, ty, s, j]) => {
      const t = 1.55 + 0.95 * s + 0.03 * j;
      tl.fromTo(el, { opacity: 0, attr: { cx: fx, cy: fy } }, { opacity: 1, attr: { cx: tx, cy: ty }, duration: 0.55, ease: "power2.inOut" }, t);
    });
    tl.fromTo("#s1-legend", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.9);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.6);
    // Деревья
    cap("#s1-cap2", 5.2, 9.0);
    [1, 2, 3].forEach((n, s) => {
      const t = 5.4 + 0.45 * s;
      drawArrow(tl, `s1-ar-t${n}`, t, 0.3);
      tl.fromTo(`#s1-tree-${s}`, { opacity: 0 }, { opacity: 1, duration: 0.45 }, t + 0.2);
    });
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.6);
    [1, 2, 3].forEach((n, s) => drawArrow(tl, `s1-ar-a${n}`, 7.2 + 0.2 * s, 0.45));
    tl.fromTo("#s1-agg", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 7.7);
    // Variance + Random Forest
    cap("#s1-cap3", 9.2, 13.5);
    tl.fromTo("#s1-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.4);
    tl.to("#s1-legend", { opacity: 0, duration: 0.3 }, 10.6);
    tl.fromTo("#s1-rf", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 10.9);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
