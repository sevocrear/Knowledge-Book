<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 0px; width: 700px; }
  #s3-c2 { left: 1060px; top: 300px; width: 700px; }
  #s3-c1 .f, #s3-c2 .f { font-size: 33px; }
  .s3-note { font-size: 25px; color: #aab3c2; margin-top: 8px; line-height: 1.3; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Почему PPO обрезает отношение политик?</div></div>
    <div class="badge">Knowledge Book · Deep RL</div>
    <div class="stage">
      <!-- График L^CLIP от r_t(θ): x = 120 + (r − 0.5)·760, y = 330 − L·180 (Â = ±1, иллюстративно) -->
      <svg id="s3-svg" viewBox="0 0 980 660">
        <defs>
          <marker id="s3-ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#aab3c2"/></marker>
        </defs>
        <line id="s3-one" x1="500" y1="40" x2="500" y2="620" stroke="#2a3140" stroke-width="2" opacity="0"/>
        <!-- ε-трубка [1−ε, 1+ε] -->
        <g id="s3-tube" opacity="0">
          <rect x="348" y="40" width="304" height="580" fill="rgba(74,158,255,0.09)"/>
          <line x1="348" y1="40" x2="348" y2="620" stroke="#4a9eff" stroke-width="3" stroke-dasharray="12 10"/>
          <line x1="652" y1="40" x2="652" y2="620" stroke="#4a9eff" stroke-width="3" stroke-dasharray="12 10"/>
          <text x="500" y="70" text-anchor="middle" fill="#4a9eff" font-size="24" font-weight="700">ε = 0.2: [0.8, 1.2]</text>
        </g>
        <!-- оси -->
        <line id="s3-ax" x1="90" y1="330" x2="910" y2="330" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999" marker-end="url(#s3-ah)"/>
        <line id="s3-ay" x1="120" y1="620" x2="120" y2="30" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999" marker-end="url(#s3-ah)"/>
        <g id="s3-axlbl" opacity="0">
          <rect x="316" y="340" width="64" height="30" fill="#0f1117"/><rect x="484" y="340" width="32" height="30" fill="#0f1117"/><rect x="620" y="340" width="64" height="30" fill="#0f1117"/>
          <text x="930" y="338" fill="#aab3c2" font-size="26">r<tspan font-size="18">t</tspan></text>
          <text x="140" y="42" fill="#aab3c2" font-size="26">L<tspan font-size="18" baseline-shift="super">CLIP</tspan></text>
          <text x="500" y="362" text-anchor="middle" fill="#f0f4ff" font-size="24" font-weight="700">1</text>
          <text x="348" y="362" text-anchor="middle" fill="#4a9eff" font-size="24" font-weight="700">1−ε</text>
          <text x="652" y="362" text-anchor="middle" fill="#4a9eff" font-size="24" font-weight="700">1+ε</text>
          <text x="500" y="394" text-anchor="middle" fill="#aab3c2" font-size="22" stroke="#0f1117" stroke-width="8" paint-order="stroke">r<tspan font-size="16">t</tspan> = 1 — политика не изменилась</text>
        </g>
        <!-- Â > 0: L = r·Â до 1+ε, дальше плато (длины 546.7 + 228 = 774.7) -->
        <polyline id="s3-cgh" points="652,114 880,60" fill="none" stroke="#aab3c2" stroke-width="3" stroke-dasharray="6 10" opacity="0"/>
        <polyline id="s3-cg" points="120,240 652,114 880,114" fill="none" stroke="#3dba7a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <text id="s3-lg" x="668" y="220" fill="#3dba7a" font-size="26" font-weight="700" opacity="0">Â<tspan font-size="18">t</tspan> &gt; 0</text>
        <text id="s3-lg2" x="668" y="252" fill="#aab3c2" font-size="21" opacity="0">без clip: r·Â растёт дальше</text>
        <circle id="s3-pt1" cx="500" cy="150" r="13" fill="#ff7a2f" stroke="#0f1117" stroke-width="3" opacity="0"/>
        <g id="s3-z1" opacity="0">
          <rect x="690" y="120" width="180" height="42" rx="10" fill="#0f1117" stroke="#ff7a2f" stroke-width="3"/>
          <text x="780" y="150" text-anchor="middle" fill="#ff7a2f" font-size="24" font-weight="700">градиент = 0</text>
        </g>
        <!-- Â < 0: плато (1−ε)·Â слева, дальше L = r·Â (длины 228 + 546.7) -->
        <polyline id="s3-crh" points="120,420 348,474" fill="none" stroke="#aab3c2" stroke-width="3" stroke-dasharray="6 10" opacity="0"/>
        <polyline id="s3-cr" points="120,474 348,474 880,600" fill="none" stroke="#ff4d6d" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <text id="s3-lr" x="560" y="612" fill="#ff4d6d" font-size="26" font-weight="700" stroke="#0f1117" stroke-width="8" paint-order="stroke" opacity="0">Â<tspan font-size="18">t</tspan> &lt; 0</text>
        <text id="s3-lr2" x="560" y="644" fill="#aab3c2" font-size="21" stroke="#0f1117" stroke-width="8" paint-order="stroke" opacity="0">без clip: штраф был бы меньше</text>
        <circle id="s3-pt2" cx="500" cy="510" r="13" fill="#ff7a2f" stroke="#0f1117" stroke-width="3" opacity="0"/>
        <g id="s3-z2" opacity="0">
          <rect x="140" y="500" width="180" height="42" rx="10" fill="#0f1117" stroke="#ff7a2f" stroke-width="3"/>
          <text x="230" y="530" text-anchor="middle" fill="#ff7a2f" font-size="24" font-weight="700">градиент = 0</text>
        </g>
      </svg>
      <div id="s3-c2" class="card"><div class="h">Отношение вероятностей</div>
        <div class="f"><span class="o">r<sub>t</sub>(θ)</span> = π<sub>θ</sub>(a<sub>t</sub>|s<sub>t</sub>) / π<sub>θ<sub>old</sub></sub>(a<sub>t</sub>|s<sub>t</sub>)</div>
        <div class="s3-note">новая политика / политика, собравшая данные; k_epochs = 10 проходов по одному батчу — без clip политика убежала бы от θ<sub>old</sub></div></div>
      <div id="s3-c1" class="card"><div class="h">Целевая функция PPO (clipped)</div>
        <div class="f">L<sup>CLIP</sup>(θ) = 𝔼<sub>t</sub>[ min( <span class="o">r<sub>t</sub>(θ)</span>·Â<sub>t</sub>,</div>
        <div class="f" style="padding-left:150px">clip(<span class="o">r<sub>t</sub>(θ)</span>, 1−ε, 1+ε)·Â<sub>t</sub> ) ]</div>
        <div class="s3-note">ε — параметр обрезки, обычно 0.1–0.2; в реализации из README: eps_clip = 0.2</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap"><b class="o">r<sub>t</sub>(θ)</b> = π<sub>θ</sub>(a<sub>t</sub>|s<sub>t</sub>) / π<sub>θold</sub>(a<sub>t</sub>|s<sub>t</sub>): во сколько раз новая политика изменила вероятность выбранного действия</div>
      <div id="s3-cap2" class="cap">Если <b class="g">Â<sub>t</sub> &gt; 0</b>, выгодно растить r<sub>t</sub> — но выше <b class="b">1+ε</b> выигрыш обрезан: градиент 0, политика не убегает от старой</div>
      <div id="s3-cap3" class="cap">Если <b class="r">Â<sub>t</sub> &lt; 0</b> — симметрично: ниже <b class="b">1−ε</b> штраф не растёт; min(…) всегда берёт пессимистичную из двух оценок</div>
      <div id="s3-cap4" class="cap key">PPO = policy gradient «на поводке»: шаг политики ограничен ε-трубкой вокруг старой. Стабильно и просто — стартовый выбор для роботов и игр</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const show = (id, t, d = 0.45) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-ax", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "820 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#s3-ay", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "590 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.5);
    show("#s3-one", 0.9, 0.4);
    show("#s3-axlbl", 1.0);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);
    cap("#s3-cap1", 0.6, 4.2);
    show("#s3-tube", 1.6, 0.6);
    // Â > 0 — зелёная кривая
    tl.fromTo("#s3-cg", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "774.7 9999" }, duration: 1.1, ease: "power2.inOut" }, 2.4);
    show("#s3-cgh", 3.4);
    show("#s3-lg", 3.3); show("#s3-lg2", 3.5);
    cap("#s3-cap2", 4.4, 7.8);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.5);
    // точка едет по кривой: r 1 → 1.2 (подъём), затем по плато до r = 1.42
    show("#s3-pt1", 4.7, 0.3);
    tl.to("#s3-pt1", { attr: { cx: 652, cy: 114 }, duration: 1.0, ease: "power1.inOut" }, 4.9);
    tl.to("#s3-pt1", { attr: { cx: 820, cy: 114 }, duration: 1.0, ease: "power1.inOut" }, 5.9);
    tl.fromTo("#s3-z1", { opacity: 0, scale: 0.8, svgOrigin: "780 141" }, { opacity: 1, scale: 1, svgOrigin: "780 141", duration: 0.4, ease: "back.out(1.6)" }, 6.7);
    // Â < 0 — красная кривая
    cap("#s3-cap3", 8.0, 10.6);
    tl.fromTo("#s3-cr", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "774.7 9999" }, duration: 1.1, ease: "power2.inOut" }, 8.0);
    show("#s3-crh", 9.0);
    show("#s3-lr", 8.9); show("#s3-lr2", 9.1);
    show("#s3-pt2", 9.0, 0.3);
    tl.to("#s3-pt2", { attr: { cx: 348, cy: 474 }, duration: 0.9, ease: "power1.inOut" }, 9.2);
    tl.to("#s3-pt2", { attr: { cx: 200, cy: 474 }, duration: 0.9, ease: "power1.inOut" }, 10.1);
    tl.fromTo("#s3-z2", { opacity: 0, scale: 0.8, svgOrigin: "230 521" }, { opacity: 1, scale: 1, svgOrigin: "230 521", duration: 0.4, ease: "back.out(1.6)" }, 10.8);
    cap("#s3-cap4", 10.8, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 14.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
