<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: -40px; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 0px; width: 700px; font-size: 30px; }
  #s1-c1 .li { padding: 4px 0; }
  #s1-c1 .k { color: #f0f4ff; font-weight: 600; }
  #s1-c2 { left: 1060px; top: 380px; width: 700px; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Как Triton собирает запросы в батч?</div></div>
    <div class="badge">Knowledge Book · Triton</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <text id="s1-cl-lbl" x="20" y="160" fill="#f0f4ff" font-size="26" font-weight="700" opacity="0">клиенты</text>
        <!-- таймер окна ожидания -->
        <text id="s1-tm-lbl" x="290" y="150" fill="#ff7a2f" font-size="24" font-weight="700" opacity="0">окно ожидания ≤ max_queue_delay</text>
        <rect x="290" y="166" width="330" height="22" rx="6" fill="#0f1117" stroke="#2a3140" stroke-width="3"/>
        <rect id="s1-tm" x="291" y="167" width="0" height="20" rx="5" fill="#ff7a2f"/>
        <!-- очередь -->
        <g id="s1-queue" opacity="0">
          <rect x="290" y="210" width="330" height="170" rx="16" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
          <text x="455" y="244" text-anchor="middle" fill="#aab3c2" font-size="24">очередь модели (scheduler)</text>
          <rect x="306" y="265" width="60" height="60" rx="10" fill="none" stroke="#3a4256" stroke-width="3" stroke-dasharray="8 6"/>
          <rect x="382" y="265" width="60" height="60" rx="10" fill="none" stroke="#3a4256" stroke-width="3" stroke-dasharray="8 6"/>
          <rect x="458" y="265" width="60" height="60" rx="10" fill="none" stroke="#3a4256" stroke-width="3" stroke-dasharray="8 6"/>
          <rect x="534" y="265" width="60" height="60" rx="10" fill="none" stroke="#3a4256" stroke-width="3" stroke-dasharray="8 6"/>
        </g>
        <!-- GPU -->
        <text id="s1-gpu-lbl" x="820" y="190" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="700" opacity="0">GPU · один вызов</text>
        <rect id="s1-gpu" x="690" y="200" width="260" height="210" rx="16" fill="#161a24" stroke="#2a3140" stroke-width="4" opacity="0"/>
        <line id="s1-ar" x1="620" y1="295" x2="680" y2="295" stroke="#aab3c2" stroke-width="5" stroke-linecap="butt" stroke-dasharray="0 9999"/>
        <polygon id="s1-ah" points="672,285 688,295 672,305" fill="#aab3c2" opacity="0"/>
        <!-- запросы -->
        <g id="s1-rq1" opacity="0"><rect id="s1-rq1r" x="0" y="0" width="60" height="60" rx="10" fill="#ff7a2f"/><text data-layout-allow-overlap x="30" y="41" text-anchor="middle" font-size="30" font-weight="700" fill="#0f1117">1</text></g>
        <g id="s1-rq2" opacity="0"><rect id="s1-rq2r" x="0" y="0" width="60" height="60" rx="10" fill="#ff7a2f"/><text data-layout-allow-overlap x="30" y="41" text-anchor="middle" font-size="30" font-weight="700" fill="#0f1117">2</text></g>
        <g id="s1-rq3" opacity="0"><rect id="s1-rq3r" x="0" y="0" width="60" height="60" rx="10" fill="#ff7a2f"/><text data-layout-allow-overlap x="30" y="41" text-anchor="middle" font-size="30" font-weight="700" fill="#0f1117">3</text></g>
        <g id="s1-rq4" opacity="0"><rect id="s1-rq4r" x="0" y="0" width="60" height="60" rx="10" fill="#ff7a2f"/><text data-layout-allow-overlap x="30" y="41" text-anchor="middle" font-size="30" font-weight="700" fill="#0f1117">4</text></g>
        <!-- пачка -->
        <rect id="s1-br" x="298" y="257" width="304" height="76" rx="14" fill="none" stroke="#4a9eff" stroke-width="5" opacity="0"/>
        <text id="s1-br-lbl" x="450" y="362" text-anchor="middle" fill="#4a9eff" font-size="22" font-weight="700" opacity="0">пачка B = 4 (иллюстр.)</text>
        <text id="s1-ans" x="800" y="440" text-anchor="middle" fill="#3dba7a" font-size="24" font-weight="700" opacity="0">ответ каждому клиенту</text>
        <!-- сравнение затрат GPU (иллюстративно) -->
        <g transform="translate(0,45)">
        <text id="s1-cost-hd" x="20" y="470" fill="#aab3c2" font-size="24" opacity="0">время GPU на 4 запроса (иллюстративно):
          <tspan fill="#b48ce6" font-weight="700">■ T₀</tspan> overhead, <tspan fill="#4a9eff" font-weight="700">■ t<tspan font-size="18" dy="4">item</tspan></tspan></text>
        <text id="s1-row1-lbl" x="200" y="516" text-anchor="end" fill="#f0f4ff" font-size="24" font-weight="600" opacity="0">по одному</text>
        <text id="s1-row2-lbl" x="200" y="576" text-anchor="end" fill="#f0f4ff" font-size="24" font-weight="600" opacity="0">батчем</text>
        <g id="s1-rows"></g>
        <text id="s1-row1-end" x="520" y="516" fill="#f0f4ff" font-size="24" opacity="0">4 вызова: 4·T₀ + 4·t<tspan font-size="18" dy="4">item</tspan></text>
        <text id="s1-row2-end" x="380" y="576" fill="#3dba7a" font-size="24" font-weight="700" opacity="0">1 вызов: T₀ + 4·t<tspan font-size="18" dy="4">item</tspan> — короче</text>
        </g>
      </svg>
      <div id="s1-c1" class="card"><div class="h">config.pbtxt · dynamic batching</div>
        <div class="li"><span class="k">preferred_batch_size</span> — какую пачку собрать</div>
        <div class="li"><span class="k">max_queue_delay_microseconds</span> — сколько ждать</div>
        <div style="font-size:26px;color:#aab3c2;margin-top:8px">пример из README: детектор, <span class="o">max_queue_delay ~2–5 мс</span></div></div>
      <div id="s1-c2" class="card"><div class="h">Почему пачка быстрее</div>
        <div class="f">T(B) = T<sub>0</sub> + t<sub>item</sub> · B</div>
        <div class="f"><span class="g">throughput</span> ≈ B / T(B)</div>
        <div style="font-size:26px;color:#aab3c2;margin-top:8px">T<sub>0</sub> — фиксированный overhead кернела; цена батча — ожидание в очереди</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Клиенты шлют <b class="o">batch = 1</b>, а GPU любит пачки: у кернела фиксированный overhead</div>
      <div id="s1-cap2" class="cap">Triton ждёт до <b class="o">max_queue_delay_microseconds</b> и собирает пачку до <b class="b">preferred_batch_size</b></div>
      <div id="s1-cap3" class="cap"><b class="b">Один вызов GPU</b> вместо четырёх: throughput растёт, платим небольшой задержкой в очереди</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
    // Полосы затрат: T0 (фиолет) + t_item (синий). Ряд 1: 4 × (T0 + t); ряд 2: T0 + 4 × t.
    const gRows = document.getElementById("s1-rows");
    const T0W = 38, TW = 26, X0 = 215;
    const row1 = [], row2 = [];
    for (let i = 0; i < 4; i++) {
      const x = X0 + i * (T0W + TW + 8);
      const a = mk("rect", { id: `s1-r1a${i}`, x, y: 490, width: 0, height: 34, rx: 4, fill: "#b48ce6" });
      const b = mk("rect", { id: `s1-r1b${i}`, x: x + T0W, y: 490, width: 0, height: 34, rx: 4, fill: "#4a9eff" });
      gRows.appendChild(a); gRows.appendChild(b); row1.push([a, b]);
    }
    row2.push(mk("rect", { id: "s1-r2a", x: X0, y: 550, width: 0, height: 34, rx: 4, fill: "#b48ce6" }));
    gRows.appendChild(row2[0]);
    for (let i = 0; i < 4; i++) {
      const b = mk("rect", { id: `s1-r2b${i}`, x: X0 + T0W + i * (TW + 2), y: 550, width: 0, height: 34, rx: 4, fill: "#4a9eff" });
      gRows.appendChild(b); row2.push(b);
    }

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const show = (id, t, d = 0.4) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    show("#s1-cl-lbl", 0.4); show("#s1-queue", 0.5); show("#s1-gpu", 0.7); show("#s1-gpu-lbl", 0.8);
    cap("#s1-cap1", 0.6, 4.6);
    // «по одному»: 4 вызова, каждый со своим T0
    show("#s1-row1-lbl", 1.4);
    row1.forEach(([a, b], i) => {
      tl.fromTo(a, { attr: { width: 0 } }, { attr: { width: T0W }, duration: 0.3, ease: "none" }, 1.6 + i * 0.4);
      tl.fromTo(b, { attr: { width: 0 } }, { attr: { width: TW }, duration: 0.2, ease: "none" }, 1.9 + i * 0.4);
    });
    // Запросы приходят по одному, нерегулярно (иллюстративно)
    const slotX = [534, 458, 382, 306], yStart = [190, 250, 310, 370], tin = [1.0, 1.9, 2.7, 3.6];
    [1, 2, 3, 4].forEach((n, i) => tl.fromTo(`#s1-rq${n}`, { x: 20, y: yStart[i], opacity: 0 }, { x: slotX[i], y: 265, opacity: 1, duration: 0.8, ease: "power2.out" }, tin[i]));
    // таймер окна
    show("#s1-tm-lbl", 0.9);
    tl.fromTo("#s1-tm", { attr: { width: 0 } }, { attr: { width: 328 }, duration: 3.8, ease: "none" }, 1.0);
    // Пачка собрана
    cap("#s1-cap2", 5.0, 9.0);
    show("#s1-br", 5.0); show("#s1-br-lbl", 5.2);
    tl.fromTo("#s1-ar", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "60 9999" }, duration: 0.4, ease: "power2.inOut" }, 5.8);
    show("#s1-ah", 6.15, 0.2);
    const gx = [740, 820, 740, 820], gy = [250, 250, 320, 320];
    [1, 2, 3, 4].forEach((n, i) => tl.to(`#s1-rq${n}`, { x: gx[i], y: gy[i], duration: 1.0, ease: "power2.inOut" }, 6.3));
    tl.to("#s1-br", { attr: { x: 730, y: 240, width: 160, height: 150 }, duration: 1.0, ease: "power2.inOut" }, 6.3);
    tl.to("#s1-br-lbl", { opacity: 0, duration: 0.3 }, 6.3);
    tl.to("#s1-gpu", { attr: { stroke: "#4a9eff" }, duration: 0.4 }, 7.4);
    [1, 2, 3, 4].forEach(n => tl.to(`#s1-rq${n}r`, { attr: { fill: "#3dba7a" }, duration: 0.5 }, 8.0));
    tl.to("#s1-gpu", { attr: { stroke: "#3dba7a" }, duration: 0.4 }, 8.0);
    show("#s1-ans", 8.2);
    // Сравнение затрат
    cap("#s1-cap3", 9.5, 13.4);
    show("#s1-row1-end", 9.6); show("#s1-cost-hd", 1.2, 0.5);
    show("#s1-row2-lbl", 9.7);
    tl.fromTo(row2[0], { attr: { width: 0 } }, { attr: { width: T0W }, duration: 0.3, ease: "none" }, 9.9);
    row2.slice(1).forEach((b, i) => tl.fromTo(b, { attr: { width: 0 } }, { attr: { width: TW }, duration: 0.2, ease: "none" }, 10.2 + i * 0.12));
    show("#s1-row2-end", 10.9);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.4);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.8);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
