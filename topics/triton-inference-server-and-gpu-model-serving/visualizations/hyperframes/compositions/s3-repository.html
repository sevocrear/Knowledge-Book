<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  .title { font-size: 40px; }
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 0px; width: 700px; font-size: 28px; }
  #s3-c1 .li { padding: 3px 0; }
  #s3-c1 .k { color: #f0f4ff; font-weight: 600; }
  #s3-c2 { left: 1060px; top: 265px; width: 700px; font-size: 26px; }
  #s3-c3 { left: 1060px; top: 435px; width: 700px; font-size: 26px; }
  #s3-c3 .li { padding: 3px 0; }
  #s3-c3 .k { color: #f0f4ff; font-weight: 600; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Как Triton хранит модели и принимает запросы?</div></div>
    <div class="badge">Knowledge Book · Triton</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <!-- model repository -->
        <g id="s3-tree" opacity="0">
          <rect x="0" y="0" width="450" height="400" rx="16" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
          <text x="24" y="50" fill="#aab3c2" font-size="24" font-weight="700" letter-spacing="1.5">MODEL REPOSITORY</text>
          <text x="24" y="110" fill="#f0f4ff" font-size="30" font-weight="700">model_repository/</text>
          <text x="56" y="164" fill="#4a9eff" font-size="30" font-weight="700">model_name/</text>
          <text x="88" y="218" fill="#ff7a2f" font-size="30" font-weight="700" id="s3-cfg">config.pbtxt</text>
          <text x="88" y="272" fill="#f0f4ff" font-size="30">1/model.onnx</text>
          <text x="88" y="326" fill="#f0f4ff" font-size="30">2/</text>
          <text id="s3-canary" x="130" y="326" fill="#3dba7a" font-size="24" font-weight="700" opacity="0">← canary</text>
          <text id="s3-rollback" x="24" y="376" fill="#aab3c2" font-size="24" opacity="0">откат = переключить версию</text>
        </g>
        <line id="s3-tl1" x1="40" y1="122" x2="40" y2="204" stroke="#3a4256" stroke-width="3" stroke-dasharray="0 9999"/>
        <line id="s3-tl2" x1="72" y1="176" x2="72" y2="314" stroke="#3a4256" stroke-width="3" stroke-dasharray="0 9999"/>
        <!-- путь запроса -->
        <g id="s3-p1" opacity="0"><rect x="500" y="0" width="470" height="78" rx="14" fill="#161a24" stroke="#4a9eff" stroke-width="4"/>
          <text x="735" y="34" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700">клиент</text>
          <text x="735" y="64" text-anchor="middle" fill="#aab3c2" font-size="24">HTTP/REST · gRPC · C API</text></g>
        <line id="s3-pa1" x1="735" y1="78" x2="735" y2="118" stroke="#aab3c2" stroke-width="5" stroke-linecap="butt" stroke-dasharray="0 9999"/>
        <polygon id="s3-ph1" points="725,110 735,126 745,110" fill="#aab3c2" opacity="0"/>
        <g id="s3-p2" opacity="0"><rect x="500" y="130" width="470" height="78" rx="14" fill="#161a24" stroke="#ff7a2f" stroke-width="4"/>
          <text x="735" y="164" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700">scheduler модели</text>
          <text x="735" y="194" text-anchor="middle" fill="#aab3c2" font-size="24">опционально батчит</text></g>
        <line id="s3-pa2" x1="735" y1="208" x2="735" y2="248" stroke="#aab3c2" stroke-width="5" stroke-linecap="butt" stroke-dasharray="0 9999"/>
        <polygon id="s3-ph2" points="725,240 735,256 745,240" fill="#aab3c2" opacity="0"/>
        <g id="s3-p3" opacity="0"><rect x="500" y="260" width="470" height="78" rx="14" fill="#161a24" stroke="#2dd4bf" stroke-width="4"/>
          <text x="735" y="294" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700">backend</text>
          <text x="735" y="324" text-anchor="middle" fill="#aab3c2" font-size="24">TensorRT · ONNX · PyTorch …</text></g>
        <line id="s3-pa3" x1="735" y1="338" x2="735" y2="378" stroke="#aab3c2" stroke-width="5" stroke-linecap="butt" stroke-dasharray="0 9999"/>
        <polygon id="s3-ph3" points="725,370 735,386 745,370" fill="#aab3c2" opacity="0"/>
        <g id="s3-p4" opacity="0"><rect x="500" y="390" width="470" height="60" rx="14" fill="#161a24" stroke="#3dba7a" stroke-width="4"/>
          <text x="735" y="430" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700">ответ клиенту</text></g>
        <!-- ensemble -->
        <text id="s3-eh" x="20" y="500" fill="#f0f4ff" font-size="24" font-weight="700" opacity="0">ensemble / BLS: меньше сетевых hop’ов между микросервисами</text>
        <g id="s3-e1" opacity="0"><rect x="10" y="520" width="160" height="84" rx="12" fill="#161a24" stroke="#4a9eff" stroke-width="3"/><text x="90" y="570" text-anchor="middle" fill="#f0f4ff" font-size="18" font-weight="600">decode/resize</text></g>
        <g id="s3-e2" opacity="0"><rect x="210" y="520" width="160" height="84" rx="12" fill="#161a24" stroke="#4a9eff" stroke-width="3"/><text x="290" y="570" text-anchor="middle" fill="#f0f4ff" font-size="20" font-weight="600">YOLO</text></g>
        <g id="s3-e3" opacity="0"><rect x="410" y="520" width="160" height="84" rx="12" fill="#161a24" stroke="#4a9eff" stroke-width="3"/><text x="490" y="570" text-anchor="middle" fill="#f0f4ff" font-size="20" font-weight="600">NMS</text></g>
        <g id="s3-e4" opacity="0"><rect x="610" y="520" width="160" height="84" rx="12" fill="#161a24" stroke="#4a9eff" stroke-width="3"/><text x="690" y="570" text-anchor="middle" fill="#f0f4ff" font-size="20" font-weight="600">crop</text></g>
        <g id="s3-e5" opacity="0"><rect x="810" y="520" width="160" height="84" rx="12" fill="#161a24" stroke="#4a9eff" stroke-width="3"/><text x="890" y="570" text-anchor="middle" fill="#f0f4ff" font-size="20" font-weight="600">embedding</text></g>
        <line id="s3-ea1" x1="172" y1="562" x2="208" y2="562" stroke="#aab3c2" stroke-width="4" stroke-dasharray="0 9999"/>
        <line id="s3-ea2" x1="372" y1="562" x2="408" y2="562" stroke="#aab3c2" stroke-width="4" stroke-dasharray="0 9999"/>
        <line id="s3-ea3" x1="572" y1="562" x2="608" y2="562" stroke="#aab3c2" stroke-width="4" stroke-dasharray="0 9999"/>
        <line id="s3-ea4" x1="772" y1="562" x2="808" y2="562" stroke="#aab3c2" stroke-width="4" stroke-dasharray="0 9999"/>
        <rect id="s3-eframe" x="2" y="510" width="976" height="100" rx="16" fill="none" stroke="#b48ce6" stroke-width="3" stroke-dasharray="12 8" opacity="0"/>
      </svg>
      <div id="s3-c1" class="card"><div class="h">Что задаёт config.pbtxt</div>
        <div class="li"><span class="k">dynamic_batching</span>: max_queue_delay_microseconds, preferred_batch_size</div>
        <div class="li"><span class="k">instance_group</span>: gpus: [0]</div></div>
      <div id="s3-c2" class="card"><div class="h">Наблюдаемость</div>
        <div>метрики Prometheus (очередь, GPU util, latency), health endpoints</div></div>
      <div id="s3-c3" class="card"><div class="h">Полезен ли на 1 GPU?</div>
        <div class="li"><span class="g">да</span>: короткие запросы, N моделей, ensemble</div>
        <div class="li"><span class="o">vLLM / TRT-LLM / SGLang</span>: один LLM-чат</div>
        <div class="li"><span class="r">нет</span>: прототип, 1 RPS — uvicorn + torch</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">Модели лежат в <b class="b">model repository</b>: версии <b>1/</b>, <b>2/</b> и <b class="o">config.pbtxt</b> рядом</div>
      <div id="s3-cap2" class="cap">Запрос по <b class="b">HTTP/REST</b> или <b class="b">gRPC</b>: scheduler модели → backend → ответ</div>
      <div id="s3-cap3" class="cap"><b class="p">Ensemble</b> — граф моделей: decode → YOLO → NMS → crop → embedding в одном сервере</div>
      <div id="s3-cap4" class="cap key"><b>Triton</b> батчит запросы и делит GPU между моделями — <b class="g">GPU меньше простаивает</b></div>
    </div>
  </div>
</div>
<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const show = (id, t, d = 0.4) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);
    const draw = (id, len, t, d = 0.4) => tl.fromTo(id, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": len + " 9999" }, duration: d, ease: "power2.inOut" }, t);
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    // 1. repository
    cap("#s3-cap1", 0.6, 4.2);
    show("#s3-tree", 0.5, 0.6);
    draw("#s3-tl1", 82, 1.4, 0.5); draw("#s3-tl2", 138, 1.9, 0.6);
    show("#s3-canary", 3.0); show("#s3-rollback", 3.4);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.2);
    // 2. путь запроса
    cap("#s3-cap2", 4.5, 7.6);
    ["#s3-p1", "#s3-p2", "#s3-p3", "#s3-p4"].forEach((id, i) => show(id, 4.6 + i * 0.7, 0.4));
    ["#s3-pa1", "#s3-pa2", "#s3-pa3"].forEach((id, i) => { draw(id, 40, 5.0 + i * 0.7, 0.3); show(id.replace("pa", "ph"), 5.25 + i * 0.7, 0.15); });
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.6);
    // 3. ensemble
    cap("#s3-cap3", 7.9, 10.8);
    show("#s3-eh", 8.0);
    ["#s3-e1", "#s3-e2", "#s3-e3", "#s3-e4", "#s3-e5"].forEach((id, i) => show(id, 8.3 + i * 0.35, 0.35));
    ["#s3-ea1", "#s3-ea2", "#s3-ea3", "#s3-ea4"].forEach((id, i) => draw(id, 36, 8.6 + i * 0.35, 0.25));
    show("#s3-eframe", 10.1);
    // итог
    cap("#s3-cap4", 11.1);
    tl.fromTo("#s3-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 11.3);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
