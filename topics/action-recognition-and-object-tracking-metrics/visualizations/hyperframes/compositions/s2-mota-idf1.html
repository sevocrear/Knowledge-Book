<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 10px; width: 700px; }
  #s2-c2 { left: 1060px; top: 330px; width: 700px; }
  .s2-sub { font-size: 28px; color: #aab3c2; margin-top: 8px; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Что считает MOTA, а что — IDF1?</div></div>
    <div class="badge">Knowledge Book · Tracking metrics</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <text x="20" y="46" fill="#aab3c2" font-size="22">та же последовательность (иллюстративно): 6 кадров, GT = 12</text>
        <g id="s2-cols"></g>
        <text x="20" y="128" fill="#3dba7a" font-size="26" font-weight="700">GT A</text>
        <text x="20" y="208" fill="#b48ce6" font-size="26" font-weight="700">GT B</text>
        <g id="s2-cells"></g>
        <text id="s2-fnlbl" x="480" y="209" text-anchor="middle" fill="#ff4d6d" font-size="22" font-weight="700">FN</text>
        <text id="s2-fplbl" x="640" y="284" fill="#ff4d6d" font-size="22" font-weight="700">FP</text>
        <g id="s2-err" opacity="0">
          <circle cx="480" cy="120" r="34" fill="none" stroke="#ff4d6d" stroke-width="4"/>
          <circle cx="480" cy="200" r="34" fill="none" stroke="#ff4d6d" stroke-width="4"/>
          <circle cx="590" cy="272" r="34" fill="none" stroke="#ff4d6d" stroke-width="4"/>
          <text x="20" y="326" fill="#ff4d6d" font-size="24" font-weight="700" data-layout-allow-overlap>3 ошибки (IDSW + FN + FP) из 12 GT → MOTA = 1 − 3/12 = 0.75</text>
        </g>
        <g id="s2-wrong" opacity="0">
          <rect x="450" y="88" width="290" height="64" rx="10" fill="none" stroke="#ff7a2f" stroke-width="4" stroke-dasharray="12 8"/>
          <text x="20" y="326" fill="#ff7a2f" font-size="24" font-weight="700" data-layout-allow-overlap>трек A: 3 кадра из 6 под чужим ID → IDP = IDR = 8/12 ≈ 0.67</text>
        </g>
        <!-- столбики -->
        <line x1="20" y1="600" x2="960" y2="600" stroke="#2a3140" stroke-width="3"/>
        <rect id="s2-b1" x="120" y="600" width="150" height="0" rx="10" fill="#4a9eff"/>
        <text id="s2-v1" x="195" y="578" text-anchor="middle" fill="#f0f4ff" font-size="34" font-weight="700" opacity="0">0.75</text>
        <text x="195" y="640" text-anchor="middle" fill="#e6ebf5" font-size="28" font-weight="700">MOTA</text>
        <rect id="s2-b2" x="420" y="600" width="150" height="0" rx="10" fill="#b48ce6"/>
        <text id="s2-v2" x="495" y="578" text-anchor="middle" fill="#f0f4ff" font-size="34" font-weight="700" opacity="0">0.67</text>
        <text id="s2-l2" x="495" y="640" text-anchor="middle" fill="#e6ebf5" font-size="28" font-weight="700" opacity="0">IDF1</text>
        <g id="s2-gap" opacity="0">
          <line x1="700" y1="452" x2="950" y2="452" stroke="#ff7a2f" stroke-width="4" stroke-linecap="round"/>
          <text x="700" y="492" fill="#ff7a2f" font-size="24" font-weight="700">MOTA скрывает</text>
          <text x="700" y="526" fill="#ff7a2f" font-size="24" font-weight="700">потерю identity,</text>
          <text x="700" y="562" fill="#aab3c2" font-size="22">IDF1 её показывает</text>
        </g>
      </svg>
      <div id="s2-c1" class="card"><div class="h">CLEAR MOT · MOTA</div>
        <div class="f">MOTA = 1 − (<span class="r">FN</span> + <span class="r">FP</span> + <span class="o">IDSW</span>) / GT</div>
        <div class="s2-sub">все ошибки складываются с одинаковым весом; IDSW — одна ошибка, сколько бы кадров ни шло под чужим ID</div></div>
      <div id="s2-c2" class="card"><div class="h">Identity-aware · IDF1</div>
        <div class="f">IDF1 = 2 · <span class="p">IDP</span> · <span class="p">IDR</span> / (<span class="p">IDP</span> + <span class="p">IDR</span>)</div>
        <div class="s2-sub">IDP / IDR — precision и recall по identity-сопоставлениям: один GT-трек ↔ один ID предсказания на всей длине</div></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap"><b class="b">MOTA</b> складывает все ошибки в одну сумму: <b class="r">FN</b> + <b class="r">FP</b> + <b class="o">IDSW</b>, делённую на число GT-боксов</div>
      <div id="s2-cap2" class="cap">Переключение ID стоит MOTA <b>одну ошибку</b>, хотя половина трека A идёт под чужим ID — identity потеряна</div>
      <div id="s2-cap3" class="cap"><b class="p">IDF1</b> сопоставляет identity на всей длине трека: здесь <b>0.67 &lt; 0.75</b> — стабильность ID видна лучше, чем по MOTA</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs, parent, text) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (text !== undefined) el.textContent = text; parent.appendChild(el); return el; };
    const CX = [150, 260, 370, 480, 590, 700];
    const ROW = { A: 120, B: 200, F: 272 };
    const GTC = { A: "#3dba7a", B: "#b48ce6" };
    const IDC = { 1: "#4a9eff", 2: "#2dd4bf", 3: "#ff7a2f", 4: "#ff4d6d" };
    const PRED = [["A",0,1],["A",1,1],["A",2,1],["A",3,3],["A",4,3],["A",5,3],["B",0,2],["B",1,2],["B",2,2],["B",4,2],["B",5,2],["F",4,4]];
    const cols = document.getElementById("s2-cols"), cells = document.getElementById("s2-cells");
    CX.forEach((x, i) => mk("text", { x, y: 78, "text-anchor": "middle", fill: "#aab3c2", "font-size": 22 }, cols, `t = ${i + 1}`));
    ["A", "B"].forEach(r => CX.forEach(x => mk("rect", { x: x - 24, y: ROW[r] - 24, width: 48, height: 48, rx: 5, fill: "none", stroke: GTC[r], "stroke-width": 3, "stroke-dasharray": "8 6" }, cells)));
    PRED.forEach(([r, i, id]) => {
      const g = mk("g", { id: `s2-p${r}${i + 1}` }, cells);
      mk("rect", { x: CX[i] - 18, y: ROW[r] - 30, width: 48, height: 48, rx: 5, fill: IDC[id], "fill-opacity": 0.55, stroke: IDC[id], "stroke-width": 3 }, g);
      mk("text", { x: CX[i] + 6, y: ROW[r] + 1, "text-anchor": "middle", fill: "#f0f4ff", "font-size": 18, "font-weight": 700 }, g, `ID ${id}`);
    });
    const H = 260; // px на 1.0

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);
    cap("#s2-cap1", 0.6, 5.0);
    tl.fromTo("#s2-err", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.6);
    // MOTA = 1 − 3/12 = 0.75
    tl.fromTo("#s2-b1", { attr: { y: 600, height: 0 } }, { attr: { y: 600 - 0.75 * H, height: 0.75 * H }, duration: 0.9, ease: "power2.out" }, 2.8);
    tl.fromTo("#s2-v1", { opacity: 0, y: 0 }, { opacity: 1, y: -0.75 * H, duration: 0.9, ease: "power2.out" }, 2.8);
    // IDSW — одна ошибка, но 3 кадра под чужим ID
    cap("#s2-cap2", 5.2, 9.6);
    tl.to("#s2-err", { opacity: 0, duration: 0.4 }, 5.4);
    tl.fromTo("#s2-wrong", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 5.8);
    ["#s2-pA4", "#s2-pA5", "#s2-pA6"].forEach((id, i) => tl.fromTo(id, { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.15, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.2 + 0.15 * i));
    // IDF1 ≈ 0.67
    cap("#s2-cap3", 9.8, 14.4);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.9);
    tl.fromTo("#s2-l2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.2);
    tl.fromTo("#s2-b2", { attr: { y: 600, height: 0 } }, { attr: { y: 600 - 0.67 * H, height: 0.67 * H }, duration: 0.9, ease: "power2.out" }, 10.4);
    tl.fromTo("#s2-v2", { opacity: 0, y: 0 }, { opacity: 1, y: -0.67 * H, duration: 0.9, ease: "power2.out" }, 10.4);
    tl.fromTo("#s2-gap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 11.6);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.45 }, 14.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
