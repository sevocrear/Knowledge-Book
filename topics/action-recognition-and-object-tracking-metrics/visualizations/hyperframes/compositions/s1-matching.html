<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-wrap .title { font-size: 40px; }
  #s1-c1 { left: 1060px; top: 10px; width: 700px; }
  #s1-c2 { left: 1060px; top: 300px; width: 700px; }
  #s1-c2 .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; font-size: 34px; font-weight: 700; }
  #s1-c2 .grid > span { opacity: 0; }
  #s1-c2 .gt { font-size: 26px; color: #aab3c2; margin-top: 10px; font-weight: 400; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Как сопоставляют детекции с GT-треками?</div></div>
    <div class="badge">Knowledge Book · Tracking metrics</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <text id="s1-hdr" x="20" y="62" fill="#aab3c2" font-size="24" opacity="0">кадр t</text>
        <g id="s1-cols"></g>
        <text id="s1-rowA" x="20" y="160" fill="#3dba7a" font-size="30" font-weight="700" opacity="0">GT A</text>
        <text id="s1-rowB" x="20" y="340" fill="#b48ce6" font-size="30" font-weight="700" opacity="0">GT B</text>
        <text id="s1-rowF" x="20" y="510" fill="#aab3c2" font-size="24" opacity="0">без GT</text>
        <g id="s1-gt"></g>
        <g id="s1-pred"></g>
        <text id="s1-fn" x="633" y="341" text-anchor="middle" fill="#ff4d6d" font-size="30" font-weight="700" opacity="0">FN</text>
        <text id="s1-fp" x="771" y="562" text-anchor="middle" fill="#ff4d6d" font-size="26" font-weight="700" opacity="0">FP: пары нет</text>
        <g id="s1-sw" opacity="0">
          <line x1="564" y1="104" x2="564" y2="200" stroke="#ff4d6d" stroke-width="4" stroke-dasharray="10 8"/>
          <line x1="601" y1="206" x2="941" y2="206" stroke="#ff4d6d" stroke-width="4" stroke-linecap="round"/>
          <text x="941" y="238" text-anchor="end" fill="#ff4d6d" font-size="26" font-weight="700">IDSW: тот же GT A, но ID 1 → ID 3</text>
        </g>
        <text id="s1-leg1" x="20" y="612" fill="#aab3c2" font-size="22" opacity="0">пунктир — GT-бокс, заливка — предсказание (цвет = ID трека)</text>
        <text id="s1-leg2" x="20" y="646" fill="#aab3c2" font-size="22" opacity="0">иллюстративно: 6 кадров, 2 объекта → GT = 12 боксов; порог IoU α один и тот же</text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Сопоставление в каждом кадре</div>
        <div class="f">IoU(pred, GT) ≥ <span class="o">α</span> → <span class="g">TP</span></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">α — порог overlap; GT без пары → <span class="r">FN</span>, предсказание без пары → <span class="r">FP</span></div></div>
      <div id="s1-c2" class="card"><div class="h">Итог по 6 кадрам (иллюстративно)</div>
        <div class="grid">
          <span id="s1-n-tp"><span class="g">TP</span> = 11</span><span id="s1-n-fn"><span class="r">FN</span> = 1</span>
          <span id="s1-n-fp"><span class="r">FP</span> = 1</span><span id="s1-n-sw"><span class="o">IDSW</span> = 1</span>
        </div>
        <div class="gt">GT = 12 боксов · TP + FN = GT</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">В каждом кадре предсказанные боксы сопоставляют с GT по <b>IoU ≥ <span class="o">α</span></b>: пара найдена — <b class="g">TP</b></div>
      <div id="s1-cap2" class="cap">GT-бокс без пары — <b class="r">FN</b> (пропуск), предсказание без пары — <b class="r">FP</b> (ложное срабатывание)</div>
      <div id="s1-cap3" class="cap">Тот же GT-трек, но с кадра 4 у него <b>новый ID</b> предсказания — это <b class="o">IDSW</b> (identity switch)</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs, parent, text) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (text !== undefined) el.textContent = text; parent.appendChild(el); return el; };
    const CX = [219, 357, 495, 633, 771, 909];           // центры колонок-кадров t = 1..6
    const ROW = { A: 150, B: 330, F: 500 };              // центры строк
    const GTC = { A: "#3dba7a", B: "#b48ce6" };
    const IDC = { 1: "#4a9eff", 2: "#2dd4bf", 3: "#ff7a2f", 4: "#ff4d6d" };
    // Игрушечная последовательность (иллюстративно): [строка, кадр, ID предсказания]
    const PRED = [["A",0,1],["A",1,1],["A",2,1],["A",3,3],["A",4,3],["A",5,3],["B",0,2],["B",1,2],["B",2,2],["B",4,2],["B",5,2],["F",4,4]];
    const cols = document.getElementById("s1-cols"), gGT = document.getElementById("s1-gt"), gP = document.getElementById("s1-pred");
    const colEls = CX.map((x, i) => mk("text", { id: `s1-t${i + 1}`, x, y: 62, "text-anchor": "middle", fill: "#aab3c2", "font-size": 24, opacity: 0 }, cols, `t = ${i + 1}`));
    const gtEls = [];
    ["A", "B"].forEach(r => CX.forEach((x, i) => gtEls.push(mk("rect", { id: `s1-gt${r}${i + 1}`, x: x - 32, y: ROW[r] - 32, width: 64, height: 64, rx: 6, fill: "none", stroke: GTC[r], "stroke-width": 4, "stroke-dasharray": "10 8", opacity: 0 }, gGT))));
    const predEls = {};
    PRED.forEach(([r, i, id]) => {
      const g = mk("g", { id: `s1-p${r}${i + 1}`, opacity: 0 }, gP);
      mk("rect", { x: CX[i] - 24, y: ROW[r] - 40, width: 64, height: 64, rx: 6, fill: IDC[id], "fill-opacity": 0.55, stroke: IDC[id], "stroke-width": 4 }, g);
      mk("text", { x: CX[i] + 8, y: ROW[r] + 1, "text-anchor": "middle", fill: "#f0f4ff", "font-size": 22, "font-weight": 700 }, g, `ID ${id}`);
      predEls[`${r}${i}`] = g;
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-hdr", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    tl.fromTo(colEls, { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.06 }, 0.3);
    tl.fromTo("#s1-rowA", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
    tl.fromTo("#s1-rowB", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.7);
    tl.fromTo(gtEls, { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.05 }, 0.7);
    tl.fromTo("#s1-leg1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
    cap("#s1-cap1", 0.6, 4.8);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.4);
    // Кадры 1–3: предсказания ID 1 (A) и ID 2 (B) находят пару
    [0, 1, 2].forEach(i => { tl.fromTo(predEls[`A${i}`], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.8 + 0.7 * i);
                            tl.fromTo(predEls[`B${i}`], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 2.0 + 0.7 * i); });
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.6);
    tl.fromTo("#s1-leg2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.8);
    // Кадры 4–6: пропуск B в кадре 4 (FN), лишний бокс в кадре 5 (FP), у A новый ID 3
    cap("#s1-cap2", 5.0, 9.0);
    tl.fromTo("#s1-rowF", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.0);
    [3, 4, 5].forEach(i => tl.fromTo(predEls[`A${i}`], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.2 + 0.7 * (i - 3)));
    [4, 5].forEach(i => tl.fromTo(predEls[`B${i}`], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.4 + 0.7 * (i - 3)));
    tl.fromTo("#s1-fn", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.6);
    tl.fromTo(predEls["F4"], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 6.6);
    tl.fromTo("#s1-fp", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.0);
    tl.fromTo("#s1-n-tp", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.9);
    tl.fromTo("#s1-n-fn", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.3);
    tl.fromTo("#s1-n-fp", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.7);
    // IDSW: тот же GT A, ID 1 → ID 3
    cap("#s1-cap3", 9.2, 13.4);
    tl.fromTo("#s1-sw", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 9.4);
    [3, 4, 5].forEach(i => tl.fromTo(predEls[`A${i}`], { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.12, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 9.6 + 0.15 * (i - 3)));
    tl.fromTo("#s1-n-sw", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.4);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.45 }, 13.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
