<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 0px; width: 700px; }
  #s3-c2 { left: 1060px; top: 246px; width: 700px; }
  #s3-c3 { left: 1060px; top: 474px; width: 700px; }
  #s3-c1 .f { font-size: 31px; }
  #s3-c1 .s3-note { font-size: 25px; }
  .s3-note { font-size: 26px; color: #aab3c2; margin-top: 8px; line-height: 1.3; }
  .s3-src { font-size: 22px; color: #aab3c2; letter-spacing: 0; text-transform: none; }
  #s3-c3 .f { font-style: normal; font-size: 32px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Как считать loss по маске сегментации?</div></div>
    <div class="badge">Knowledge Book · Detection losses</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <!-- Сетка пикселей 10 × 8, клетка 58 px, начало (40, 40) -->
        <g id="s3-cells"></g>
        <g id="s3-G"></g>
        <g id="s3-P" opacity="0"></g>
        <g id="s3-I" opacity="0"></g>
        <g id="s3-FP" opacity="0"></g>
        <g id="s3-FN" opacity="0"></g>
        <text x="40" y="540" fill="#aab3c2" font-size="24">маска 10 × 8 пикселей (иллюстративно)</text>
        <!-- Легенда справа от сетки -->
        <g id="s3-lg-G" opacity="0"><rect x="640" y="60" width="34" height="34" rx="6" fill="#3dba7a" fill-opacity="0.55" stroke="#3dba7a" stroke-width="3"/><text x="692" y="87" fill="#f0f4ff" font-size="28">G = gt: |G| = 20</text></g>
        <g id="s3-lg-P" opacity="0"><rect x="640" y="120" width="34" height="34" rx="6" fill="none" stroke="#4a9eff" stroke-width="4"/><text x="692" y="147" fill="#f0f4ff" font-size="28">P = pred: |P| = 16</text></g>
        <g id="s3-lg-I" opacity="0"><rect x="640" y="180" width="34" height="34" rx="6" fill="#2dd4bf" fill-opacity="0.7"/><text x="692" y="207" fill="#f0f4ff" font-size="28">P∩G = 12</text></g>
        <g id="s3-lg-FP" opacity="0"><rect x="640" y="260" width="34" height="34" rx="6" fill="#ff4d6d" fill-opacity="0.7"/><text x="692" y="287" fill="#f0f4ff" font-size="28">FP = |P ∖ G| = 4</text></g>
        <g id="s3-lg-FN" opacity="0"><rect x="640" y="320" width="34" height="34" rx="6" fill="#ff7a2f" fill-opacity="0.7"/><text x="692" y="347" fill="#f0f4ff" font-size="28">FN = |G ∖ P| = 8</text></g>
        <text id="s3-lg-note" x="640" y="410" fill="#aab3c2" font-size="24" opacity="0">фон (56 пикселей) в Dice</text>
        <text id="s3-lg-note2" x="640" y="442" fill="#aab3c2" font-size="24" opacity="0">не входит вообще</text>
      </svg>
      <div id="s3-c1" class="card"><div class="h">Dice loss (Soft Dice)</div>
        <div class="f">Dice = 2|P∩G| / (|P| + |G|) = 24/36 = <span class="t">0.67</span></div>
        <div class="f" style="margin-top:6px">L<sub>Dice</sub> = 1 − Dice<sub>soft</sub> = 0.33</div>
        <div class="s3-note">soft: вероятности вместо 0/1 · IoU маски = 0.50</div></div>
      <div id="s3-c2" class="card"><div class="h">Tversky loss <span class="s3-src">· в статье Tversky loss (Salehi et al., 2017)</span></div>
        <div class="f">T = |P∩G| / (|P∩G| + α·<span class="r">FP</span> + β·<span class="o">FN</span>)</div>
        <div class="s3-note">разные веса FP и FN; α = β = 0.5 → Dice. Focal-вариант усиливает сложные примеры</div></div>
      <div id="s3-c3" class="card"><div class="h">На практике</div>
        <div class="f">CE + λ·Dice &nbsp;·&nbsp; Focal + Dice / Tversky при сильном дисбалансе</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">Маска — множество пикселей: <b class="g">G</b> (gt) = 20, <b class="b">P</b> (pred) = 16, совпали <b class="t">P∩G</b> = 12 (иллюстративно)</div>
      <div id="s3-cap2" class="cap"><b class="t">Dice</b> = 2|P∩G| / (|P| + |G|), L<sub>Dice</sub> = 1 − Dice<sub>soft</sub>: фон в формулу не входит — маленький объект не тонет в дисбалансе</div>
      <div id="s3-cap3" class="cap key">Loss = класс (CE / Focal) + геометрия: <b class="o">IoU-семейство</b> для боксов, <b class="t">Dice / Tversky</b> для масок — оптимизируем то, что измеряем</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const s = 58, ox = 40, oy = 40, COLS = 10, ROWS = 8;
    const inG = (r, c) => r >= 2 && r <= 5 && c >= 2 && c <= 6;   // 4 × 5 = 20
    const inP = (r, c) => r >= 3 && r <= 6 && c >= 3 && c <= 6;   // 4 × 4 = 16
    const mk = (parent, id, r, c, attrs) => { const el = document.createElementNS(NS, "rect"); el.setAttribute("id", id);
      el.setAttribute("x", ox + c * s); el.setAttribute("y", oy + r * s); el.setAttribute("width", s); el.setAttribute("height", s);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); parent.appendChild(el); return el; };
    const cells = [], gG = [];
    const gCells = document.getElementById("s3-cells"), gGrp = document.getElementById("s3-G"), gP = document.getElementById("s3-P");
    const gI = document.getElementById("s3-I"), gFP = document.getElementById("s3-FP"), gFN = document.getElementById("s3-FN");
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      cells.push(mk(gCells, `s3-x${r}-${c}`, r, c, { fill: "#161a24", stroke: "#2a3140", "stroke-width": 2, opacity: 0 }));
      if (inG(r, c)) gG.push(mk(gGrp, `s3-g${r}-${c}`, r, c, { fill: "#3dba7a", "fill-opacity": 0.55, stroke: "#3dba7a", "stroke-width": 2, opacity: 0 }));
      if (inP(r, c)) mk(gP, `s3-p${r}-${c}`, r, c, { fill: "none", stroke: "#4a9eff", "stroke-width": 5 });
      if (inG(r, c) && inP(r, c)) mk(gI, `s3-i${r}-${c}`, r, c, { fill: "#2dd4bf", "fill-opacity": 0.7 });
      if (inP(r, c) && !inG(r, c)) mk(gFP, `s3-fp${r}-${c}`, r, c, { fill: "#ff4d6d", "fill-opacity": 0.7 });
      if (inG(r, c) && !inP(r, c)) mk(gFN, `s3-fn${r}-${c}`, r, c, { fill: "#ff7a2f", "fill-opacity": 0.7 });
    }

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    cells.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.2 + 0.008 * i));
    gG.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.0 + 0.03 * i));
    tl.fromTo("#s3-lg-G", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
    cap("#s3-cap1", 0.6, 4.6);
    tl.fromTo("#s3-P", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.2);
    tl.fromTo("#s3-lg-P", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.4);
    tl.fromTo("#s3-I", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.2);
    tl.fromTo("#s3-lg-I", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.4);
    // Dice
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.8);
    tl.fromTo("#s3-lg-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.4);
    tl.fromTo("#s3-lg-note2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.4);
    cap("#s3-cap2", 4.8, 8.8);
    // Tversky: FP и FN раскрашиваем отдельно
    tl.fromTo("#s3-FP", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.6);
    tl.fromTo("#s3-lg-FP", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.7);
    tl.fromTo("#s3-FN", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 7.0);
    tl.fromTo("#s3-lg-FN", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.1);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.2);
    // Итог
    tl.fromTo("#s3-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.0);
    cap("#s3-cap3", 9.0, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 12.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
