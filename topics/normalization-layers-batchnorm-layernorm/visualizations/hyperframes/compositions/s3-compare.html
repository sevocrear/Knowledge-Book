<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-wrap .title { font-size: 42px; }
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-tbl { left: 1060px; top: 0px; width: 700px; font-size: 24px; padding: 20px 28px; }
  #s3-tbl .row { display: grid; grid-template-columns: 0.9fr 1.55fr 1.55fr; gap: 10px; padding: 9px 6px; border-bottom: 1px solid #2a3140; align-items: start; line-height: 1.25; opacity: 0; }
  #s3-tbl .row:last-child { border-bottom: 0; }
  #s3-tbl .hd { color: #aab3c2; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; }
  #s3-tbl .hd b { font-size: 26px; text-transform: none; letter-spacing: 0; }
  #s3-tbl .k { color: #aab3c2; }
  #s3-rms { left: 1060px; top: 458px; width: 700px; font-size: 25px; padding: 18px 28px; line-height: 1.35; }
  #s3-svg .chip { fill: #161a24; stroke: #2a3140; stroke-width: 2; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Что выбрать: BatchNorm или LayerNorm?</div></div>
    <div class="badge">Knowledge Book · Normalization</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <line x1="490" y1="30" x2="490" y2="620" stroke="#2a3140" stroke-width="2"/>
        <!-- BatchNorm: столбец канала -->
        <g id="s3-bn" opacity="0">
          <text x="260" y="52" text-anchor="middle" fill="#4a9eff" font-size="32" font-weight="700">BatchNorm</text>
          <g id="s3-bn-cells"></g>
          <text x="260" y="410" text-anchor="middle" fill="#aab3c2" font-size="22"><tspan x="260" dy="0">по столбцу: батч N и H × W,</tspan><tspan x="260" dy="28">одна пара μ, σ² на канал</tspan></text>
        </g>
        <rect id="s3-bn-hl" x="200" y="70" width="120" height="304" rx="12" fill="rgba(255,122,47,0.10)" stroke="#ff7a2f" stroke-width="5" stroke-dasharray="0 9999" opacity="0"/>
        <g id="s3-bn-b1" opacity="0"><rect class="chip" x="60" y="480" width="110" height="52" rx="12"/><text x="115" y="514" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="600">Conv</text></g>
        <path id="s3-bn-a1" d="M 176 506 L 202 506" stroke="#4a9eff" stroke-width="4" stroke-linecap="butt" stroke-dasharray="0 9999"/>
        <g id="s3-bn-b2" opacity="0"><rect class="chip" x="208" y="480" width="104" height="52" rx="12" stroke="#4a9eff"/><text x="260" y="514" text-anchor="middle" fill="#4a9eff" font-size="26" font-weight="700">BN</text></g>
        <path id="s3-bn-a2" d="M 318 506 L 344 506" stroke="#4a9eff" stroke-width="4" stroke-linecap="butt" stroke-dasharray="0 9999"/>
        <g id="s3-bn-b3" opacity="0"><rect class="chip" x="350" y="480" width="110" height="52" rx="12"/><text x="405" y="514" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="600">ReLU</text></g>
        <text id="s3-bn-use" x="260" y="588" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">ResNet, EfficientNet · большие батчи</text>
        <!-- LayerNorm: строка объекта -->
        <g id="s3-ln" opacity="0">
          <text x="747" y="52" text-anchor="middle" fill="#b48ce6" font-size="32" font-weight="700">LayerNorm</text>
          <g id="s3-ln-cells"></g>
          <text x="747" y="410" text-anchor="middle" fill="#aab3c2" font-size="22"><tspan x="747" dy="0">по строке: d признаков объекта,</tspan><tspan x="747" dy="28">своя пара μ, σ² на объект</tspan></text>
        </g>
        <rect id="s3-ln-hl" x="555" y="144" width="384" height="82" rx="12" fill="rgba(255,122,47,0.10)" stroke="#ff7a2f" stroke-width="5" stroke-dasharray="0 9999" opacity="0"/>
        <g id="s3-ln-b1" opacity="0"><rect class="chip" x="530" y="480" width="60" height="52" rx="12"/><text x="560" y="514" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="600">x</text></g>
        <path id="s3-ln-a1" d="M 596 506 L 622 506" stroke="#b48ce6" stroke-width="4" stroke-linecap="butt" stroke-dasharray="0 9999"/>
        <g id="s3-ln-b2" opacity="0"><rect class="chip" x="628" y="480" width="84" height="52" rx="12" stroke="#b48ce6"/><text x="670" y="514" text-anchor="middle" fill="#b48ce6" font-size="26" font-weight="700">LN</text></g>
        <path id="s3-ln-a2" d="M 718 506 L 744 506" stroke="#b48ce6" stroke-width="4" stroke-linecap="butt" stroke-dasharray="0 9999"/>
        <g id="s3-ln-b3" opacity="0"><rect class="chip" x="750" y="480" width="210" height="52" rx="12"/><text x="855" y="514" text-anchor="middle" fill="#f0f4ff" font-size="22" font-weight="600">Attention / MLP</text></g>
        <text id="s3-ln-use" x="747" y="588" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">BERT, GPT, ViT · любой batch size</text>
      </svg>
      <div id="s3-tbl" class="card">
        <div id="s3-r0" class="row hd"><span></span><span><b class="b">BatchNorm</b></span><span><b class="p">LayerNorm</b></span></div>
        <div id="s3-r1" class="row"><span class="k">ось</span><span>столбец: батч + H×W, на канал</span><span>строка: d признаков объекта</span></div>
        <div id="s3-r2" class="row"><span class="k">batch size</span><span>зависит: малый батч → шум</span><span>не зависит, ok при N = 1</span></div>
        <div id="s3-r3" class="row"><span class="k">где</span><span>CNN: Conv → BN → ReLU</span><span>Transformer, seq2seq, ViT</span></div>
        <div id="s3-r4" class="row"><span class="k">γ, β</span><span>на канал: 2·C</span><span>на компоненту: 2·d</span></div>
        <div id="s3-r5" class="row"><span class="k">бонус</span><span>шум батча ≈ регуляризация</span><span>предсказуем при малых батчах</span></div>
      </div>
      <div id="s3-rms" class="card"><div class="h">В современных LLM</div>
        LLaMA, Mistral, Qwen, Gemma — <b class="t">RMSNorm</b>: упрощённый LayerNorm без вычитания среднего, только деление на RMS вектора и масштаб γ</div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap"><b class="b">CNN</b> (ResNet, EfficientNet): Conv → BN → ReLU, большие батчи; шум статистик батча даёт лёгкую регуляризацию</div>
      <div id="s3-cap2" class="cap"><b class="p">Transformer</b> (BERT, GPT, ViT): LayerNorm до/после attention и MLP; в LLM чаще <b class="t">RMSNorm</b> — без вычитания среднего</div>
      <div id="s3-cap3" class="cap key">Оба слоя: привести активации к нулевому среднему и единичной дисперсии, затем γ·x̂ + β. Разница — ось: BN по батчу, LN по признакам</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const rect = (x, y, w, h, fill, fo) => { const r = document.createElementNS(NS, "rect"); r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", w); r.setAttribute("height", h); r.setAttribute("rx", "8"); r.setAttribute("fill", fill); r.setAttribute("fill-opacity", fo.toFixed(2)); r.setAttribute("stroke", "#2a3140"); r.setAttribute("stroke-width", "2"); return r; };
    // BN: 4 примера × 3 канала (R, G, B), в клетке точки = H × W.
    const bnG = document.getElementById("s3-bn-cells"), bnFill = ["#ff4d6d", "#3dba7a", "#4a9eff"];
    const bnShade = [[0.30, 0.55, 0.42], [0.62, 0.36, 0.50], [0.44, 0.70, 0.33], [0.36, 0.48, 0.66]];
    [80, 154, 228, 302].forEach((y, r) => [90, 210, 330].forEach((x, c) => {
      bnG.appendChild(rect(x, y, 100, 62, bnFill[c], bnShade[r][c]));
      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) {
        const d = document.createElementNS(NS, "circle");
        d.setAttribute("cx", (x + 24 + i * 26).toFixed(0)); d.setAttribute("cy", (y + 21 + j * 20).toFixed(0)); d.setAttribute("r", "4");
        d.setAttribute("fill", "#f0f4ff"); d.setAttribute("fill-opacity", ((i + j + r + c) % 3 === 0 ? 0.9 : 0.5).toFixed(1)); bnG.appendChild(d);
      }
    }));
    // LN: 4 объекта × 4 признака.
    const lnG = document.getElementById("s3-ln-cells");
    const lnShade = [[0.28, 0.62, 0.40, 0.72], [0.66, 0.36, 0.52, 0.30], [0.40, 0.70, 0.32, 0.58], [0.54, 0.30, 0.68, 0.42]];
    [80, 154, 228, 302].forEach((y, r) => [565, 659, 753, 847].forEach((x, c) => lnG.appendChild(rect(x, y, 82, 62, "#b48ce6", lnShade[r][c]))));

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-bn", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.3);
    cap("#s3-cap1", 0.6, 4.4);
    tl.fromTo("#s3-bn-hl", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.9);
    tl.fromTo("#s3-bn-hl", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "900 9999" }, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 0.9);
    ["#s3-bn-b1", "#s3-bn-b2", "#s3-bn-b3"].forEach((id, i) => tl.fromTo(id, { opacity: 0, scale: 0.9, svgOrigin: "260 506" }, { opacity: 1, scale: 1, svgOrigin: "260 506", duration: 0.4, ease: "power2.out" }, 1.8 + 0.5 * i));
    ["#s3-bn-a1", "#s3-bn-a2"].forEach((id, i) => tl.to(id, { attr: { "stroke-dasharray": "26 9999" }, duration: 0.3 }, 2.15 + 0.5 * i));
    tl.fromTo("#s3-bn-use", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.3);
    tl.fromTo("#s3-ln", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.4);
    cap("#s3-cap2", 4.6, 8.3);
    tl.fromTo("#s3-ln-hl", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.9);
    tl.fromTo("#s3-ln-hl", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "1000 9999" }, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 4.9);
    ["#s3-ln-b1", "#s3-ln-b2", "#s3-ln-b3"].forEach((id, i) => tl.fromTo(id, { opacity: 0, scale: 0.9, svgOrigin: "747 506" }, { opacity: 1, scale: 1, svgOrigin: "747 506", duration: 0.4, ease: "power2.out" }, 5.6 + 0.5 * i));
    ["#s3-ln-a1", "#s3-ln-a2"].forEach((id, i) => tl.to(id, { attr: { "stroke-dasharray": "26 9999" }, duration: 0.3 }, 5.95 + 0.5 * i));
    tl.fromTo("#s3-ln-use", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.1);
    tl.fromTo("#s3-tbl", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.2);
    ["#s3-r0", "#s3-r1", "#s3-r2", "#s3-r3", "#s3-r4", "#s3-r5"].forEach((id, i) => tl.fromTo(id, { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 6.5 + 0.3 * i));
    tl.fromTo("#s3-rms", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 8.0);
    cap("#s3-cap3", 8.6, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 11.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
