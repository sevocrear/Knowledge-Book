<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-wrap .title { font-size: 42px; }
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 0px; width: 700px; font-size: 30px; }
  #s2-c2 { left: 1060px; top: 268px; width: 700px; font-size: 30px; }
  #s2-c3 { left: 1060px; top: 484px; width: 700px; font-size: 26px; padding: 16px 32px; line-height: 1.3; }
  #s2-wrap .card .f { font-size: 33px; }
  #s2-wrap .card .n { font-size: 26px; color: #aab3c2; margin-top: 8px; line-height: 1.3; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Почему LayerNorm не зависит от батча?</div></div>
    <div class="badge">Knowledge Book · Normalization</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <text id="s2-hdr" x="491" y="40" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0">объект h ∈ ℝ<tspan font-size="20" dy="-12">d</tspan><tspan dy="12">, d = 6 признаков (иллюстративно)</tspan></text>
        <g id="s2-cols"></g>
        <g id="s2-cells"></g>
        <text id="s2-nlab" x="66" y="310" text-anchor="middle" fill="#aab3c2" font-size="26" transform="rotate(-90 66 310)" opacity="0">объекты батча</text>
        <rect id="s2-hlc" x="383" y="100" width="110" height="406" rx="14" fill="rgba(74,158,255,0.10)" stroke="#4a9eff" stroke-width="6" stroke-dasharray="0 9999" opacity="0"/>
        <text id="s2-bnlab" x="438" y="545" text-anchor="middle" fill="#4a9eff" font-size="24" font-weight="700" opacity="0">BN: μ<tspan font-size="17" dy="6">B</tspan><tspan dy="-6">, σ²</tspan><tspan font-size="17" dy="6">B</tspan><tspan dy="-6"> по столбцу</tspan></text>
        <text id="s2-noise" x="491" y="598" text-anchor="middle" fill="#ff4d6d" font-size="27" font-weight="700" opacity="0">маленький батч (N = 2) → статистики шумные</text>
        <rect id="s2-hlr" x="170" y="100" width="642" height="106" rx="14" fill="rgba(255,122,47,0.10)" stroke="#ff7a2f" stroke-width="6" stroke-dasharray="0 9999" opacity="0"/>
        <g id="s2-stats"></g>
        <text id="s2-foot" x="491" y="598" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">каждая строка нормализуется сама по себе, независимо от соседей</text>
      </svg>
      <div id="s2-c1" class="card"><div class="h">LayerNorm: статистики объекта</div>
        <div class="f">μ<sub>L</sub> = (1/d) Σ h<sub>j</sub></div>
        <div class="f">σ²<sub>L</sub> = (1/d) Σ (h<sub>j</sub> − μ<sub>L</sub>)²</div>
        <div class="n">по d признакам одного объекта, например одного токена</div></div>
      <div id="s2-c2" class="card"><div class="h">Нормализация и γ, β</div>
        <div class="f">ĥ<sub>j</sub> = (h<sub>j</sub> − μ<sub>L</sub>) / √(σ²<sub>L</sub> + ε)</div>
        <div class="f">y<sub>j</sub> = <span class="o">γ<sub>j</sub></span> · ĥ<sub>j</sub> + <span class="o">β<sub>j</sub></span></div>
        <div class="n">γ<sub>j</sub>, β<sub>j</sub> — на каждую компоненту, размерность d</div></div>
      <div id="s2-c3" class="card"><div class="h">Где используется</div>
        <div><b class="p">Transformers</b>: BERT, GPT, ViT · seq-модели</div>
        <div>RL и онлайн-обучение — где batch size мал или плавает</div></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Если батч маленький, статистики <b class="b">μ<sub>B</sub>, σ²<sub>B</sub></b> по столбцу <b class="r">шумные</b> — BatchNorm может ухудшать обучение</div>
      <div id="s2-cap2" class="cap">LayerNorm берёт <b>один объект h ∈ ℝ<sup>d</sup></b> и нормализует по его d признакам: <b class="o">μ<sub>L</sub>, σ²<sub>L</sub></b> — по строке</div>
      <div id="s2-cap3" class="cap"><b>ĥ<sub>j</sub> = (h<sub>j</sub> − μ<sub>L</sub>)/√(σ²<sub>L</sub> + ε)</b>, <b>y<sub>j</sub> = γ<sub>j</sub>·ĥ<sub>j</sub> + β<sub>j</sub></b>: γ и β — на каждую из d компонент</div>
      <div id="s2-cap4" class="cap">Статистики не зависят от размера и состава батча: <b>batch size = 1</b> и большой батч работают одинаково</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Сетка N × d: строки — объекты (токены), столбцы — признаки h_j.
    const colX = [180, 286, 392, 498, 604, 710], cellW = 92, cellH = 86, rowY = [110, 214, 318, 422];
    const shade = [[0.28, 0.62, 0.40, 0.72, 0.34, 0.55], [0.66, 0.36, 0.52, 0.30, 0.60, 0.44],
                   [0.40, 0.70, 0.32, 0.58, 0.46, 0.64], [0.54, 0.30, 0.68, 0.42, 0.36, 0.60]];
    const NS = "http://www.w3.org/2000/svg";
    const cols = document.getElementById("s2-cols"), g = document.getElementById("s2-cells"), st = document.getElementById("s2-stats");
    const colLbls = [], rows = [], stats = [];
    colX.forEach((x, j) => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("id", `s2-col${j}`); t.setAttribute("x", (x + cellW / 2).toFixed(0)); t.setAttribute("y", "88");
      t.setAttribute("text-anchor", "middle"); t.setAttribute("fill", "#b48ce6"); t.setAttribute("font-size", "26"); t.setAttribute("font-weight", "700"); t.setAttribute("opacity", "0");
      t.innerHTML = `h<tspan font-size="18" dy="6">${j + 1}</tspan>`; cols.appendChild(t); colLbls.push(t);
    });
    rowY.forEach((y, r) => {
      const rg = document.createElementNS(NS, "g");
      rg.setAttribute("id", `s2-row${r}`); rg.setAttribute("opacity", "0");
      const lab = document.createElementNS(NS, "text");
      lab.setAttribute("x", "156"); lab.setAttribute("y", (y + cellH / 2 + 9).toFixed(0)); lab.setAttribute("text-anchor", "end");
      lab.setAttribute("fill", "#aab3c2"); lab.setAttribute("font-size", "24"); lab.textContent = `n = ${r + 1}`; rg.appendChild(lab);
      colX.forEach((x, j) => {
        const rect = document.createElementNS(NS, "rect");
        rect.setAttribute("x", x); rect.setAttribute("y", y); rect.setAttribute("width", cellW); rect.setAttribute("height", cellH); rect.setAttribute("rx", "10");
        rect.setAttribute("fill", "#b48ce6"); rect.setAttribute("fill-opacity", shade[r][j].toFixed(2)); rect.setAttribute("stroke", "#2a3140"); rect.setAttribute("stroke-width", "2");
        rg.appendChild(rect);
      });
      g.appendChild(rg); rows.push(rg);
      const s = document.createElementNS(NS, "text");
      s.setAttribute("id", `s2-stat${r}`); s.setAttribute("x", "832"); s.setAttribute("y", (y + cellH / 2 + 9).toFixed(0));
      s.setAttribute("fill", "#ff7a2f"); s.setAttribute("font-size", "26"); s.setAttribute("font-weight", "700"); s.setAttribute("opacity", "0");
      s.innerHTML = `μ<tspan font-size="18" dy="6">L</tspan><tspan dy="-6">, σ²</tspan><tspan font-size="18" dy="6">L</tspan>`; st.appendChild(s); stats.push(s);
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-hdr", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.5 }, 0.3);
    colLbls.forEach((el, j) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5 + 0.08 * j));
    rows.forEach((el, r) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.7 + 0.18 * r));
    tl.fromTo("#s2-nlab", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
    // Часть A: BatchNorm по столбцу; батч сжимается до N = 2 — статистики шумные.
    cap("#s2-cap1", 0.6, 4.6);
    tl.fromTo("#s2-hlc", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.5);
    tl.fromTo("#s2-hlc", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "1100 9999" }, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 1.5);
    tl.fromTo("#s2-bnlab", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.1);
    tl.to("#s2-row2", { opacity: 0.12, duration: 0.6 }, 2.6);
    tl.to("#s2-row3", { opacity: 0.12, duration: 0.6 }, 2.8);
    tl.fromTo("#s2-noise", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 3.2);
    // Переход к LayerNorm: батч возвращаем, столбец гасим.
    tl.to(["#s2-hlc", "#s2-bnlab", "#s2-noise"], { opacity: 0, duration: 0.4 }, 4.6);
    tl.to(["#s2-row2", "#s2-row3"], { opacity: 1, duration: 0.5 }, 4.7);
    cap("#s2-cap2", 4.8, 8.6);
    tl.fromTo("#s2-hlr", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 5.0);
    tl.fromTo("#s2-hlr", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "1600 9999" }, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 5.0);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.3);
    tl.fromTo(stats[0], { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4 }, 5.9);
    // Рамка идёт по строкам: каждая строка — свои μ_L, σ²_L.
    [1, 2, 3].forEach(r => {
      tl.to("#s2-hlr", { attr: { y: rowY[r] - 10 }, duration: 0.55, ease: "power2.inOut" }, 6.6 + 0.9 * (r - 1));
      tl.fromTo(stats[r], { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4 }, 7.1 + 0.9 * (r - 1));
    });
    tl.fromTo("#s2-foot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.0);
    cap("#s2-cap3", 8.8, 12.0);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.0);
    cap("#s2-cap4", 12.2, 14.6);
    tl.fromTo("#s2-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 12.4);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 14.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
