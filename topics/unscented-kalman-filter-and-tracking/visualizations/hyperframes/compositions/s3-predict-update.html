<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 10px; width: 700px; }
  #s3-c3 { left: 1060px; top: 10px; width: 700px; }
  #s3-c2 { left: 1060px; top: 290px; width: 700px; }
  .ov { text-decoration: overline; }
  .card sup, .card sub { font-size: 0.6em; }
  .card .f { font-size: 32px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Как UKF ведёт трек: predict → update?</div></div>
    <div class="badge">Knowledge Book · UKF</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <rect x="10" y="20" width="960" height="560" rx="16" fill="#161a24" stroke="#2a3140" stroke-width="2"/>
        <text x="30" y="56" fill="#aab3c2" font-size="24">позиция объекта в кадре (иллюстративно)</text>

        <g id="s3-scene" transform="translate(90 0)">
        <g id="s3-trail" opacity="0">
          <circle cx="72" cy="521" r="8" fill="#aab3c2"/><circle cx="34" cy="543" r="8" fill="#aab3c2"/>
        </g>
        <path id="s3-prev-fill" d="" fill="rgba(74,158,255,0.20)" stroke="none" opacity="0"/>
        <path id="s3-prev-line" d="" fill="none" stroke="#4a9eff" stroke-width="5" stroke-linejoin="round" stroke-dasharray="0 99999"/>
        <circle id="s3-prev-mean" cx="170" cy="470" r="10" fill="#4a9eff" opacity="0"/>
        <text id="s3-prev-lbl" x="170" y="558" text-anchor="middle" fill="#4a9eff" font-size="26" font-weight="700" opacity="0">оценка t−1</text>

        <path id="s3-pred-fill" d="" fill="rgba(180,140,230,0.16)" stroke="none" opacity="0"/>
        <path id="s3-pred-line" d="" fill="none" stroke="#b48ce6" stroke-width="5" stroke-linejoin="round" stroke-dasharray="0 99999"/>
        <text id="s3-pred-lbl" x="440" y="502" text-anchor="middle" fill="#b48ce6" font-size="26" font-weight="700" opacity="0">predict (+Q)</text>

        <circle id="s3-sd0" cx="170" cy="470" r="10" fill="#ff7a2f" opacity="0"/>
        <circle id="s3-sd1" cx="170" cy="470" r="10" fill="#ff7a2f" opacity="0"/>
        <circle id="s3-sd2" cx="170" cy="470" r="10" fill="#ff7a2f" opacity="0"/>
        <circle id="s3-sd3" cx="170" cy="470" r="10" fill="#ff7a2f" opacity="0"/>
        <circle id="s3-sd4" cx="170" cy="470" r="10" fill="#ff7a2f" opacity="0"/>
        <text id="s3-sd-lbl" x="170" y="356" text-anchor="middle" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0">5 sigma points</text>

        <circle id="s3-pred-mean" cx="440" cy="330" r="10" fill="#b48ce6" opacity="0"/>
        <rect id="s3-z" x="514" y="236" width="52" height="52" rx="7" fill="none" stroke="#2dd4bf" stroke-width="6" opacity="0"/>
        <text id="s3-z-lbl" x="636" y="252" fill="#2dd4bf" font-size="26" font-weight="700" opacity="0">детекция z</text>
        <line id="s3-nu" x1="440" y1="330" x2="540" y2="262" stroke="#2dd4bf" stroke-width="5" stroke-dasharray="0 9999"/>
        <text id="s3-nu-lbl" x="474" y="338" fill="#2dd4bf" font-size="30" font-style="italic" font-weight="700" opacity="0">ν</text>

        <path id="s3-upd-fill" d="" fill="rgba(61,186,122,0.22)" stroke="none" opacity="0"/>
        <path id="s3-upd-line" d="" fill="none" stroke="#3dba7a" stroke-width="6" stroke-linejoin="round" stroke-dasharray="0 99999"/>
        <circle id="s3-upd-mean" cx="500" cy="289" r="10" fill="#3dba7a" opacity="0"/>
        <text id="s3-upd-lbl" x="636" y="338" fill="#3dba7a" font-size="26" font-weight="700" opacity="0">update:<tspan x="636" dy="32">сдвиг и сжатие</tspan></text>

        <path id="s3-gate" d="" fill="none" stroke="#dfe6f5" stroke-width="4" stroke-dasharray="14 12" stroke-linejoin="round" opacity="0"/>
        <text id="s3-gate-lbl" x="440" y="160" text-anchor="middle" fill="#dfe6f5" font-size="26" font-weight="700" opacity="0">гейт: χ² ≤ 5.99</text>
        <g id="s3-out" opacity="0">
          <line x1="682" y1="482" x2="718" y2="518" stroke="#ff4d6d" stroke-width="8" stroke-linecap="round"/>
          <line x1="682" y1="518" x2="718" y2="482" stroke="#ff4d6d" stroke-width="8" stroke-linecap="round"/>
        </g>
        <text id="s3-out-lbl" x="700" y="552" text-anchor="middle" fill="#ff4d6d" font-size="26" font-weight="700" opacity="0">χ² &gt; 5.99: выброс</text>

        </g>
        <g id="s3-note" opacity="0">
          <text x="490" y="616" text-anchor="middle" fill="#aab3c2" font-size="24">в SORT / DeepSORT Kalman Filter предсказывает позицию трека,</text>
          <text x="490" y="646" text-anchor="middle" fill="#aab3c2" font-size="24">а венгерский алгоритм связывает детекции с треками</text>
        </g>
      </svg>

      <div id="s3-c1" class="card" data-layout-allow-overlap><div class="h">Predict (time update)</div>
        <div class="f">x̂<sub>t|t−1</sub> = Σ W<sub>i</sub><sup>(m)</sup> χ*<sub>i</sub></div>
        <div class="f">P<sub>t|t−1</sub> = Σ W<sub>i</sub><sup>(c)</sup> (χ*<sub>i</sub> − x̂)(·)<sup>T</sup> <span class="o">+ Q</span></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">χ*<sub>i</sub> = f(χ<sub>i</sub>, u<sub>t</sub>)</div></div>
      <div id="s3-c2" class="card"><div class="h">Update (measurement update)</div>
        <div class="f">K = P<sub>xz</sub> P<sub>zz</sub><sup>−1</sup></div>
        <div class="f">x̂<sub>t|t</sub> = x̂<sub>t|t−1</sub> + K (z − ẑ)</div>
        <div class="f">P<sub>t|t</sub> = P<sub>t|t−1</sub> − K P<sub>zz</sub> K<sup>T</sup></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">Z = h(χ*); P<sub>zz</sub> включает <span class="o">R</span></div></div>
      <div id="s3-c3" class="card" data-layout-allow-overlap><div class="h">χ²-гейт (расстояние Махаланобиса)</div>
        <div class="f">χ² = ν<sup>T</sup> S<sup>−1</sup> ν,&nbsp; ν = z − ẑ</div>
        <div class="f"><span class="r">χ² &gt; 5.99</span> ⇒ выброс</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">m = 2, α = 0.05; на выбросе update пропускаем</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap"><b class="b">Predict</b>: sigma points идут через <b>f</b>, взвешенная сумма даёт x̂ и P на кадр вперёд, а <b class="o">+Q</b> раздувает эллипс</div>
      <div id="s3-cap2" class="cap"><b class="g">Update</b>: sigma points идут через <b>h</b>, Kalman gain <b>K</b> сдвигает оценку к детекции <b class="t">z</b>, а ковариация сжимается</div>
      <div id="s3-cap3" class="cap"><b class="r">χ²-гейт</b>: если <b>ν<sup>T</sup>S<sup>−1</sup>ν &gt; 5.99</b> (m = 2, α = 0.05), детекция — выброс, update пропускаем</div>
      <div id="s3-cap4" class="cap key">UKF: 2n + 1 sigma points вместо якобианов; predict через f, update через h и gain K; χ²-гейт отсекает выбросы в трекинге</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const D2R = Math.PI / 180;
    const N = 72;
    const fmt = (v) => v.toFixed(1);
    const toPath = (pts) => "M " + pts.map(p => fmt(p[0]) + " " + fmt(p[1])).join(" L ") + " Z";
    const perim = (pts) => pts.reduce((s, p, i) => { const q = pts[(i + 1) % pts.length]; return s + Math.hypot(q[0] - p[0], q[1] - p[1]); }, 0);
    const ell = (cx, cy, a, b, rot) => {
      const c = Math.cos(rot * D2R), s = Math.sin(rot * D2R), out = [];
      for (let i = 0; i < N; i++) { const t = 2 * Math.PI * i / N; out.push([cx + a * Math.cos(t) * c - b * Math.sin(t) * s, cy + a * Math.cos(t) * s + b * Math.sin(t) * c]); }
      return out;
    };
    const setPath = (id, pts) => { document.getElementById(id).setAttribute("d", toPath(pts)); return perim(pts).toFixed(1); };
    const axesPts = (cx, cy, a, b, rot) => { const c = Math.cos(rot * D2R), s = Math.sin(rot * D2R);
      return [[cx, cy], [cx + a * c, cy + a * s], [cx - b * s, cy + b * c], [cx - a * c, cy - a * s], [cx + b * s, cy - b * c]]; };

    // оценка в t−1, предсказание, обновление, гейт (иллюстративные размеры)
    const prev = [170, 470], pred = [440, 330], z = [540, 262];
    const upd = [pred[0] + 0.6 * (z[0] - pred[0]), pred[1] + 0.6 * (z[1] - pred[1])];
    const lenPrev = setPath("s3-prev-line", ell(prev[0], prev[1], 80, 46, -30)); setPath("s3-prev-fill", ell(prev[0], prev[1], 80, 46, -30));
    const lenPred = setPath("s3-pred-line", ell(pred[0], pred[1], 150, 86, -28)); setPath("s3-pred-fill", ell(pred[0], pred[1], 150, 86, -28));
    const lenUpd = setPath("s3-upd-line", ell(upd[0], upd[1], 84, 48, -28)); setPath("s3-upd-fill", ell(upd[0], upd[1], 84, 48, -28));
    setPath("s3-gate", ell(pred[0], pred[1], 185, 108, -28));
    const um = document.getElementById("s3-upd-mean"); um.setAttribute("cx", fmt(upd[0])); um.setAttribute("cy", fmt(upd[1]));
    const sFrom = axesPts(prev[0], prev[1], 80, 46, -30);
    const sTo = axesPts(pred[0], pred[1], 120, 66, -28);
    const nuLen = Math.hypot(z[0] - pred[0], z[1] - pred[1]).toFixed(1);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, a, b) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, a); if (b) tl.to(id, { opacity: 0, duration: 0.35 }, b); };
    const draw = (id, len, at, dur) => tl.fromTo(id, { attr: { "stroke-dasharray": "0 99999" } }, { attr: { "stroke-dasharray": len + " 99999" }, duration: dur, ease: "power2.inOut" }, at);
    const show = (id, at, dur = 0.4) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: dur }, at);

    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    // 1. predict
    show("#s3-trail", 0.4, 0.6);
    draw("#s3-prev-line", lenPrev, 0.5, 0.9); show("#s3-prev-fill", 0.9, 0.5); show("#s3-prev-mean", 1.1, 0.3); show("#s3-prev-lbl", 1.2);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.0);
    cap("#s3-cap1", 0.6, 4.3);
    [0, 1, 2, 3, 4].forEach(i => {
      show("#s3-sd" + i, 1.5, 0.3);
      tl.to("#s3-sd" + i, { attr: { cx: fmt(sTo[i][0]), cy: fmt(sTo[i][1]) }, duration: 1.6, ease: "power2.inOut" }, 2.0);
    });
    show("#s3-sd-lbl", 1.6);
    tl.to("#s3-sd-lbl", { opacity: 0, duration: 0.3 }, 3.7);
    draw("#s3-pred-line", lenPred, 3.0, 1.1); show("#s3-pred-fill", 3.6, 0.6); show("#s3-pred-mean", 3.8, 0.3); show("#s3-pred-lbl", 3.9);
    [0, 1, 2, 3, 4].forEach(i => tl.to("#s3-sd" + i, { opacity: 0.35, duration: 0.4 }, 4.2));
    // 2. update
    cap("#s3-cap2", 4.5, 7.4);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.7);
    show("#s3-z", 4.7, 0.4); show("#s3-z-lbl", 4.9);
    tl.fromTo("#s3-nu", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": nuLen + " 9999" }, duration: 0.7, ease: "power2.inOut" }, 5.3);
    show("#s3-nu-lbl", 5.8);
    tl.to("#s3-pred-fill", { opacity: 0.35, duration: 0.5 }, 6.1);
    tl.to("#s3-pred-line", { opacity: 0.35, duration: 0.5 }, 6.1);
    draw("#s3-upd-line", lenUpd, 6.1, 0.9); show("#s3-upd-fill", 6.5, 0.5); show("#s3-upd-mean", 6.6, 0.3); show("#s3-upd-lbl", 6.8);
    // 3. χ²-гейт
    cap("#s3-cap3", 7.6, 10.5);
    tl.to("#s3-c1", { opacity: 0, duration: 0.35 }, 7.4);
    tl.fromTo("#s3-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.9);
    show("#s3-gate", 7.8, 0.6); show("#s3-gate-lbl", 8.0);
    show("#s3-out", 8.8, 0.4); show("#s3-out-lbl", 9.0);
    show("#s3-note", 9.6, 0.5);
    // 4. ключевая идея
    cap("#s3-cap4", 10.7, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
