<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 0px; width: 700px; padding: 18px 28px; }
  #s2-c2 { left: 1060px; top: 200px; width: 700px; padding: 18px 28px; }
  #s2-c3 { left: 1060px; top: 528px; width: 700px; padding: 18px 28px; font-size: 28px; }
  #s2-c1 .h, #s2-c2 .h, #s2-c3 .h { text-transform: none; letter-spacing: 0.02em; }
  .card .s { font-size: 26px; color: #aab3c2; margin-top: 8px; line-height: 1.3; }
  #s2-c2 .row { display: grid; grid-template-columns: 0.9fr 1fr 1fr; gap: 8px; padding: 5px 4px; font-size: 28px; line-height: 1.25; align-items: baseline; border-bottom: 1px solid #2a3140; }
  #s2-c2 .row:last-child { border-bottom: 0; }
  #s2-c2 .hd { font-size: 22px; color: #aab3c2; letter-spacing: 0.02em; }
  #s2-c2 .row span:not(:first-child) { text-align: center; }
  #s2-c2 .row b { font-weight: 700; }
  #s2-c2 .row .ce { color: #4a9eff; } #s2-c2 .row .g1 { color: #2dd4bf; } #s2-c2 .row .g2 { color: #ff7a2f; } #s2-c2 .row .g5 { color: #b48ce6; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Что меняет Focal Loss?</div></div>
    <div class="badge">Knowledge Book · CE / Focal</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <line x1="110" y1="580" x2="940" y2="580" stroke="#aab3c2" stroke-width="3"/>
        <line x1="110" y1="580" x2="110" y2="40" stroke="#aab3c2" stroke-width="3"/>
        <g fill="#aab3c2" font-size="24">
          <text x="110" y="614" text-anchor="middle">0</text>
          <text x="317.5" y="614" text-anchor="middle">0.25</text>
          <text x="525" y="614" text-anchor="middle">0.5</text>
          <text x="732.5" y="614" text-anchor="middle">0.75</text>
          <text x="940" y="614" text-anchor="middle">1</text>
          <text x="92" y="588" text-anchor="end">0</text>
          <text x="92" y="480" text-anchor="end">1</text>
          <text x="92" y="372" text-anchor="end">2</text>
          <text x="92" y="264" text-anchor="end">3</text>
          <text x="92" y="156" text-anchor="end">4</text>
          <text x="92" y="48" text-anchor="end">5</text>
          <text x="525" y="652" text-anchor="middle" font-size="26">p — вероятность правильного класса</text>
          <text x="128" y="28" font-size="26">потеря (α = 1)</text>
        </g>
        <polyline id="s2-cv0" points="" fill="none" stroke="#4a9eff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999"/>
        <polyline id="s2-cv1" points="" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999"/>
        <polyline id="s2-cv2" points="" fill="none" stroke="#ff7a2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999"/>
        <polyline id="s2-cv5" points="" fill="none" stroke="#b48ce6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999"/>
        <g id="s2-lg0" opacity="0"><line x1="660" y1="60" x2="720" y2="60" stroke="#4a9eff" stroke-width="7" stroke-linecap="round"/><text x="736" y="70" fill="#4a9eff" font-size="28" font-weight="700">γ = 0 — это CE</text></g>
        <g id="s2-lg1" opacity="0"><line x1="660" y1="104" x2="720" y2="104" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/><text x="736" y="114" fill="#2dd4bf" font-size="28" font-weight="700">γ = 1</text></g>
        <g id="s2-lg2" opacity="0"><line x1="660" y1="148" x2="720" y2="148" stroke="#ff7a2f" stroke-width="6" stroke-linecap="round"/><text x="736" y="158" fill="#ff7a2f" font-size="28" font-weight="700">γ = 2</text></g>
        <g id="s2-lg5" opacity="0"><line x1="660" y1="192" x2="720" y2="192" stroke="#b48ce6" stroke-width="6" stroke-linecap="round"/><text x="736" y="202" fill="#b48ce6" font-size="28" font-weight="700">γ = 5</text></g>
        <g id="s2-easy" opacity="0">
          <line x1="857" y1="580" x2="857" y2="332" stroke="#3dba7a" stroke-width="3" stroke-dasharray="8 8"/>
          <text x="936" y="282" text-anchor="end" fill="#3dba7a" font-size="26" font-weight="700">лёгкий: p = 0.9</text>
          <text x="936" y="316" text-anchor="end" fill="#3dba7a" font-size="24">CE 0.105 → γ=2: 0.001</text>
        </g>
        <g id="s2-hard" opacity="0">
          <line x1="193" y1="580" x2="193" y2="331.3" stroke="#ff4d6d" stroke-width="3" stroke-dasharray="8 8"/>
          <text x="220" y="296" fill="#ff4d6d" font-size="26" font-weight="700">сложный: p = 0.1</text>
          <text x="220" y="328" fill="#ff4d6d" font-size="24">CE 2.303 → γ=2: 1.865</text>
        </g>
        <circle id="s2-d0" cx="193" cy="331.3" r="10" fill="#4a9eff" stroke="#0f1117" stroke-width="3" opacity="0"/>
        <circle id="s2-d2" cx="193" cy="378.6" r="10" fill="#ff7a2f" stroke="#0f1117" stroke-width="3" opacity="0"/>
        <circle id="s2-d5" cx="193" cy="433.1" r="10" fill="#b48ce6" stroke="#0f1117" stroke-width="3" opacity="0"/>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Focal Loss</div>
        <div class="f">L<sub>FL</sub> = −<span class="g">α</span> <span class="o">(1 − p)<sup>γ</sup></span> log p</div>
        <div class="s">γ ≥ 0 — focusing parameter (обычно 1–5)</div></div>
      <div id="s2-c2" class="card"><div class="h">Модулятор (1 − p)<sup>γ</sup></div>
        <div class="row hd"><span>γ</span><span>лёгкий, p = 0.9</span><span>сложный, p = 0.1</span></div>
        <div class="row"><span class="ce"><b>0</b> (CE)</span><span>1</span><span>1</span></div>
        <div class="row"><span class="g1"><b>1</b></span><span>0.1</span><span>0.9</span></div>
        <div class="row"><span class="g2"><b>2</b></span><span><b>0.01</b></span><span><b>0.81</b></span></div>
        <div class="row"><span class="g5"><b>5</b></span><span>10<sup>−5</sup></span><span>0.59</span></div></div>
      <div id="s2-c3" class="card"><div class="h">α — дисбаланс классов</div>
        <span class="g">α ∈ (0, 1)</span> — вес позитивов vs негативов</div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Focal Loss = CE × модулятор <b class="o">(1 − p)<sup>γ</sup></b>. При <b class="b">γ = 0</b> это обычная кросс-энтропия; чем больше γ, тем сильнее «прижаты» лёгкие</div>
      <div id="s2-cap2" class="cap"><b class="g">Лёгкий пример</b>, p = 0.9: множитель 0.01 при γ = 2 — вклад в потерю в <b>100 раз</b> меньше, чем у CE</div>
      <div id="s2-cap3" class="cap"><b class="r">Сложный пример</b>, p = 0.1: множитель 0.81 — потеря почти как у CE, градиент уходит на трудные примеры</div>
      <div id="s2-cap4" class="cap"><b class="g">α ∈ (0, 1)</b> взвешивает позитивы против негативов — отдельно от γ борется с дисбалансом классов</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Оси как в сцене 1: p → x ∈ [110, 940]; потеря ∈ [0, 5] → y ∈ [580, 40]. FL(p) = (1 − p)^γ · (−log p), α = 1.
    const X = p => 110 + 830 * p, Y = l => 580 - 108 * l;
    const N = 140, P0 = 0.0068;
    const plen = a => { let L = 0; for (let i = 1; i < a.length; i++) L += Math.hypot(a[i][0] - a[i - 1][0], a[i][1] - a[i - 1][1]); return L; };
    const curve = g => { const pts = []; for (let i = 0; i <= N; i++) { const u = i / N; const p = P0 + (1 - P0) * u * u; const l = Math.pow(1 - p, g) * (-Math.log(p)); if (l <= 5) pts.push([X(p), Y(l)]); } return pts; };
    const lens = {};
    [[0, "s2-cv0"], [1, "s2-cv1"], [2, "s2-cv2"], [5, "s2-cv5"]].forEach(([g, id]) => {
      const pts = curve(g);
      document.getElementById(id).setAttribute("points", pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "));
      lens[id] = plen(pts).toFixed(1);
    });
    // Точки при p = 0.1: CE = 2.303, γ=2: 0.81·2.303 = 1.865, γ=5: 0.59·2.303 = 1.360 → y = 331.3 / 378.6 / 433.1.

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const draw = (id, t, d) => tl.fromTo("#" + id, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": lens[id] + " 9999" }, duration: d, ease: "power2.inOut" }, t);
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    draw("s2-cv0", 0.4, 1.2);
    tl.fromTo("#s2-lg0", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);
    cap("#s2-cap1", 0.6, 4.6);
    draw("s2-cv1", 2.0, 1.0); tl.fromTo("#s2-lg1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.4);
    draw("s2-cv2", 2.9, 1.0); tl.fromTo("#s2-lg2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.3);
    draw("s2-cv5", 3.8, 1.0); tl.fromTo("#s2-lg5", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.2);
    // Лёгкий пример.
    cap("#s2-cap2", 4.8, 8.8);
    tl.fromTo("#s2-easy", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 5.0);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.4);
    // Сложный пример.
    cap("#s2-cap3", 9.0, 12.4);
    tl.fromTo("#s2-hard", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 9.2);
    ["#s2-d0", "#s2-d2", "#s2-d5"].forEach((id, i) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.6 + 0.25 * i));
    // α.
    cap("#s2-cap4", 12.6, 15.5);
    tl.fromTo("#s2-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 12.8);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 15.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
