<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 0px; width: 700px; font-size: 28px; }
  #s3-c2 { left: 1060px; top: 296px; width: 700px; font-size: 28px; }
  .card ul { margin: 0; padding-left: 30px; line-height: 1.35; }
  .card li { margin: 2px 0; }
  .card .n { font-size: 24px; color: #aab3c2; margin-top: 8px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Когда CE, а когда Focal Loss?</div></div>
    <div class="badge">Knowledge Book · CE / Focal</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <g id="s3-grid"></g>
        <g id="s3-objs"></g>
        <text id="s3-gl" x="490" y="446" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">anchor'ы детектора: <tspan fill="#4a9eff">■</tspan> фон (лёгкие негативы), <tspan fill="#ff7a2f">■</tspan> объекты — иллюстративно</text>
        <text id="s3-bt" x="200" y="492" fill="#aab3c2" font-size="24" opacity="0">вклад в градиент классификации (иллюстративно)</text>
        <g id="s3-row1" opacity="0"><text x="46" y="536" fill="#f0f4ff" font-size="28" font-weight="700">CE</text></g>
        <g id="s3-row2" opacity="0"><text x="46" y="616" fill="#f0f4ff" font-size="28" font-weight="700">Focal</text></g>
        <rect id="s3-b1bg" x="200" y="504" width="0" height="46" rx="8" fill="#1e3a5f"/>
        <rect id="s3-b1ob" x="200" y="504" width="0" height="46" rx="8" fill="#ff7a2f"/>
        <text id="s3-b1t1" x="216" y="536" fill="#f0f4ff" font-size="24" opacity="0">фон 82 %</text>
        <text id="s3-b1t2" x="924" y="536" text-anchor="end" fill="#0f1117" font-size="24" font-weight="700" opacity="0">18 %</text>
        <rect id="s3-b2bg" x="200" y="584" width="0" height="46" rx="8" fill="#1e3a5f"/>
        <rect id="s3-b2ob" x="200" y="584" width="0" height="46" rx="8" fill="#ff7a2f"/>
        <text id="s3-b2t1" x="216" y="616" fill="#f0f4ff" font-size="24" opacity="0">20 %</text>
        <text id="s3-b2t2" x="924" y="616" text-anchor="end" fill="#0f1117" font-size="24" font-weight="700" opacity="0">объекты 80 %</text>
      </svg>
      <div id="s3-c1" class="card"><div class="h" style="color:#4a9eff">Cross Entropy — когда</div>
        <ul><li>классы <b>сбалансированы</b>: ImageNet, CIFAR, sentiment</li><li>per-pixel сегментация без дисбаланса</li><li>проще и дешевле по вычислениям</li></ul>
        <div class="n">PyTorch: nn.CrossEntropyLoss, nn.BCEWithLogitsLoss</div></div>
      <div id="s3-c2" class="card"><div class="h" style="color:#ff7a2f">Focal Loss — когда</div>
        <ul><li>сильный <b>дисбаланс</b>, много лёгких негативов</li><li>RetinaNet: классификация anchor'ов, dense prediction</li><li>редкие пиксели, fraud, rare events, medical</li></ul>
        <div class="n">регрессия боксов — отдельно: L1 / Smooth L1 / IoU</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">В детекции почти все anchor'ы — <b class="b">фон</b>: лёгкие негативы, которые модель уже классифицирует верно</div>
      <div id="s3-cap2" class="cap">С CE их сумма <b>доминирует</b> в градиенте; Focal гасит лёгкие и учит редкие трудные anchor'ы — так сделано в <b class="o">RetinaNet</b></div>
      <div id="s3-cap3" class="cap key">CE — стандарт для сбалансированной классификации. Focal — при сильном дисбалансе и dense prediction (детекция, сегментация); боксы — L1 / IoU</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; };
    // Сетка anchor'ов 14 × 6, детерминированные позиции объектов.
    const COLS = 14, ROWS = 6, S = 56, G = 8, X0 = 46, Y0 = 20;
    const OBJ = [[0, 11], [1, 3], [2, 8], [4, 5], [4, 12]];
    const gGrid = document.getElementById("s3-grid"), gObj = document.getElementById("s3-objs");
    const cells = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      cells.push(mk("rect", { id: `s3-a${r}-${c}`, x: X0 + c * (S + G), y: Y0 + r * (S + G), width: S, height: S, rx: 8, fill: "#1e3a5f", stroke: "#2a3140", "stroke-width": 2, opacity: 0 }, gGrid));
    }
    const objs = OBJ.map(([r, c], i) => mk("rect", { id: `s3-o${i}`, x: X0 + c * (S + G), y: Y0 + r * (S + G), width: S, height: S, rx: 8, fill: "#ff7a2f", opacity: 0 }, gObj));
    const W = 740; // ширина столбика вклада

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    cells.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3 + 0.018 * i));
    cap("#s3-cap1", 0.6, 4.6);
    objs.forEach((el, i) => { const cx = +el.getAttribute("x") + S / 2, cy = +el.getAttribute("y") + S / 2; tl.fromTo(el, { opacity: 0, scale: 0.3, svgOrigin: `${cx} ${cy}` }, { opacity: 1, scale: 1, svgOrigin: `${cx} ${cy}`, duration: 0.4, ease: "back.out(1.8)" }, 2.2 + 0.15 * i); });
    tl.fromTo("#s3-gl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.6);
    // Вклад в градиент: CE — фон доминирует; Focal — лёгкие негативы прижаты (иллюстративные доли 82/18 и 20/80).
    cap("#s3-cap2", 4.8, 8.8);
    tl.fromTo("#s3-bt", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.9);
    tl.fromTo("#s3-row1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.0);
    tl.to("#s3-b1bg", { attr: { width: 0.82 * W }, duration: 0.9, ease: "power2.out" }, 5.0);
    tl.to("#s3-b1ob", { attr: { x: 200 + 0.82 * W, width: 0.18 * W }, duration: 0.9, ease: "power2.out" }, 5.0);
    tl.fromTo("#s3-b1t1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.7);
    tl.fromTo("#s3-b1t2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.8);
    tl.fromTo("#s3-row2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.4);
    tl.to("#s3-b2bg", { attr: { width: 0.2 * W }, duration: 0.9, ease: "power2.out" }, 6.4);
    tl.to("#s3-b2ob", { attr: { x: 200 + 0.2 * W, width: 0.8 * W }, duration: 0.9, ease: "power2.out" }, 6.4);
    tl.fromTo("#s3-b2t1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.1);
    tl.fromTo("#s3-b2t2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.2);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.4);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 8.0);
    cap("#s3-cap3", 9.0, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 12.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
