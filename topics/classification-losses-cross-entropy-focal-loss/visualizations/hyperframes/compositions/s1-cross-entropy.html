<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  .s1-pipe { position: absolute; top: 0px; width: 196px; height: 78px; display: block; box-sizing: border-box; border-radius: 16px;
    background: #161a24; border: 2px solid #2a3140; font-size: 27px; line-height: 74px; text-align: center; color: #e6ebf5; opacity: 0; }
  .s1-pipe b { font-weight: 700; }
  .s1-arr { position: absolute; top: 14px; width: 56px; text-align: center; font-size: 40px; font-weight: 700; color: #aab3c2; opacity: 0; }
  #s1-c1 { left: 1060px; top: 122px; width: 700px; }
  #s1-c2 { left: 1060px; top: 380px; width: 700px; }
  .card .s { font-size: 26px; color: #aab3c2; margin-top: 10px; line-height: 1.3; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Как считается cross-entropy?</div></div>
    <div class="badge">Knowledge Book · CE / Focal</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <line id="s1-ax-x" x1="110" y1="580" x2="940" y2="580" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999"/>
        <line id="s1-ax-y" x1="110" y1="580" x2="110" y2="40" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999"/>
        <g id="s1-ticks" fill="#aab3c2" font-size="24" opacity="0">
          <text x="110" y="614" text-anchor="middle">0</text>
          <text x="317.5" y="614" text-anchor="middle">0.25</text>
          <text x="525" y="614" text-anchor="middle">0.5</text>
          <text x="732.5" y="614" text-anchor="middle">0.75</text>
          <text x="940" y="614" text-anchor="middle">1</text>
          <text x="92" y="588" text-anchor="end">0</text>
          <text x="92" y="480" text-anchor="end">1</text>
          <text x="92" y="372" text-anchor="end">2</text>
          <text x="92" y="264" text-anchor="end">3</text>
          <text x="92" y="156" text-anchor="end">4</text>
          <text x="92" y="48" text-anchor="end">5</text>
          <text x="525" y="644" text-anchor="middle" font-size="26">p<tspan font-size="18" dy="5">y*</tspan><tspan dy="-5"> — вероятность правильного класса</tspan></text>
          <text x="128" y="28" font-size="26">потеря</text>
        </g>
        <polyline id="s1-curve" points="" fill="none" stroke="#4a9eff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999"/>
        <text id="s1-inf" x="180" y="96" fill="#ff4d6d" font-size="28" font-weight="700" opacity="0">p → 0: потеря → ∞</text>
        <text id="s1-zero" x="930" y="480" text-anchor="end" fill="#3dba7a" font-size="28" font-weight="700" opacity="0">p → 1: потеря → 0</text>
        <g id="s1-m1" opacity="0"><line x1="857" y1="580" x2="857" y2="568.7" stroke="#ff7a2f" stroke-width="3" stroke-dasharray="8 8"/><text x="845" y="520" text-anchor="middle" fill="#ff7a2f" font-size="28" font-weight="700">−log 0.9 = 0.105</text></g>
        <g id="s1-m2" opacity="0"><line x1="525" y1="580" x2="525" y2="505.2" stroke="#ff7a2f" stroke-width="3" stroke-dasharray="8 8"/><text x="548" y="440" fill="#ff7a2f" font-size="28" font-weight="700">−log 0.5 = 0.693</text></g>
        <g id="s1-m3" opacity="0"><line x1="193" y1="580" x2="193" y2="331.3" stroke="#ff7a2f" stroke-width="3" stroke-dasharray="8 8"/><text x="220" y="300" fill="#ff7a2f" font-size="28" font-weight="700">−log 0.1 = 2.303</text></g>
        <circle id="s1-dot" cx="857" cy="568.7" r="13" fill="#ff7a2f" stroke="#0f1117" stroke-width="3" opacity="0"/>
      </svg>
      <div id="s1-p1" class="s1-pipe" style="left:1060px">логиты <b>z<sub>k</sub></b></div>
      <div id="s1-a1" class="s1-arr" style="left:1256px">→</div>
      <div id="s1-p2" class="s1-pipe" style="left:1312px"><b>softmax</b></div>
      <div id="s1-a2" class="s1-arr" style="left:1508px">→</div>
      <div id="s1-p3" class="s1-pipe" style="left:1564px"><b>p<sub>k</sub></b>, Σ p<sub>k</sub> = 1</div>
      <div id="s1-c1" class="card"><div class="h">Softmax</div>
        <div class="f">p<sub>k</sub> = exp(z<sub>k</sub>) / Σ<sub>j</sub> exp(z<sub>j</sub>)</div>
        <div class="s">z = (2.0, 0.5, −1.0) → p = (0.786, 0.175, 0.039) (иллюстративно)</div></div>
      <div id="s1-c2" class="card"><div class="h">Cross-entropy</div>
        <div class="f">L<sub>CE</sub> = −Σ<sub>k</sub> y<sub>k</sub> log p<sub>k</sub> = <span class="b">−log p<sub>y*</sub></span></div>
        <div class="s">y — one-hot: в сумме остаётся только правильный класс y*</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Модель выдаёт логиты <b>z<sub>k</sub></b>; <b class="b">softmax</b> превращает их в вероятности p<sub>k</sub>, сумма которых равна 1</div>
      <div id="s1-cap2" class="cap"><b>Cross-entropy = −log p<sub>y*</sub></b>: из всего распределения смотрим только на вероятность <b class="b">правильного</b> класса</div>
      <div id="s1-cap3" class="cap">p<sub>y*</sub> → 1: потеря → 0. <b class="r">Уверенная ошибка</b> (p<sub>y*</sub> → 0) штрафуется без предела — так CE «сердится» на уверенную глупость</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Оси: p ∈ [0, 1] → x ∈ [110, 940]; потеря ∈ [0, 5] → y ∈ [580, 40].
    const X = p => 110 + 830 * p, Y = l => 580 - 108 * l;
    const N = 140, P0 = 0.0068;
    const pts = [];
    for (let i = 0; i <= N; i++) { const u = i / N; const p = P0 + (1 - P0) * u * u; pts.push([X(p), Y(-Math.log(p))]); }
    const plen = a => { let L = 0; for (let i = 1; i < a.length; i++) L += Math.hypot(a[i][0] - a[i - 1][0], a[i][1] - a[i - 1][1]); return L; };
    document.getElementById("s1-curve").setAttribute("points", pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "));
    const curveLen = plen(pts).toFixed(1);
    // Точка едет по кривой от p = 0.9 к p = 0.1 кусочно-линейно (без MotionPath, детерминированно).
    const path = []; for (let k = 0; k <= 40; k++) { const p = 0.9 - 0.8 * k / 40; path.push([X(p), Y(-Math.log(p))]); }
    const pathLen = plen(path);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-ax-x", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "830 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#s1-ax-y", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "540 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.5);
    tl.fromTo("#s1-ticks", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
    // Пайплайн: логиты → softmax → вероятности.
    ["#s1-p1", "#s1-a1", "#s1-p2", "#s1-a2", "#s1-p3"].forEach((id, i) => tl.fromTo(id, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0.5 + 0.3 * i));
    cap("#s1-cap1", 0.6, 4.6);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.2);
    // Кривая −log p рисуется.
    tl.fromTo("#s1-curve", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": curveLen + " 9999" }, duration: 1.4, ease: "power2.inOut" }, 4.4);
    cap("#s1-cap2", 4.8, 8.8);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.2);
    tl.fromTo("#s1-dot", { opacity: 0, scale: 0.4, svgOrigin: "857 568.7" }, { opacity: 1, scale: 1, svgOrigin: "857 568.7", duration: 0.4, ease: "back.out(1.8)" }, 6.2);
    tl.fromTo("#s1-m1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.5);
    tl.fromTo("#s1-zero", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.2);
    // Точка едет от лёгкого примера к уверенной ошибке.
    cap("#s1-cap3", 9.0, 13.4);
    let t = 9.2; const D = 2.4;
    for (let k = 1; k < path.length; k++) {
      const d = D * Math.hypot(path[k][0] - path[k - 1][0], path[k][1] - path[k - 1][1]) / pathLen;
      tl.to("#s1-dot", { attr: { cx: path[k][0].toFixed(1), cy: path[k][1].toFixed(1) }, duration: d, ease: "none" }, t); t += d;
    }
    tl.fromTo("#s1-m2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.3);
    tl.fromTo("#s1-m3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.6);
    tl.fromTo("#s1-inf", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 12.0);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
