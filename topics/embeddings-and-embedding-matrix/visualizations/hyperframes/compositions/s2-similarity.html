            <line x1="265" y1="20" x2="265" y2="620"/><line x1="490" y1="20" x2="490" y2="620"/><line x1="715" y1="20" x2="715" y2="620"/>

        <text id="s2-l1" x="250" y="330" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0">θ ≈ 11°, cos ≈ 0.98</text>
        <text id="s2-l2" x="380" y="470" fill="#ff4d6d" font-size="26" font-weight="700" opacity="0">θ ≈ 77°, cos ≈ 0.23</text>

      <div id="s2-c1" class="card"><div class="h">Косинусное сходство</div><div class="f">cos(<span class="g">a</span>, <span class="b">b</span>) = <span class="g">a</span> · <span class="b">b</span> / (‖<span class="g">a</span>‖ · ‖<span class="b">b</span>‖)</div><div style="font-size:28px;color:#aab3c2;margin-top:8px">косинус угла между векторами; альтернатива — L2-расстояние</div></div>

      <div id="s2-cap3" class="cap">Между кластерами угол большой: <b class="r">cos ≈ 0.23</b> — «кот» и «Париж» далеки по смыслу (иллюстративно)</div>

<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const cx = 150, cy = 560;
    const pt = (r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy - r * Math.sin(deg * Math.PI / 180)];
    const arc = (r, a0, a1) => { const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1); const sweep = a1 > a0 ? 0 : 1; return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 ${sweep} ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
    const len = (r, a0, a1) => (r * Math.abs(a1 - a0) * Math.PI / 180).toFixed(1);
    // Углы векторов из начала координат: кот 83.7°, кошка 72.8°, Париж 7.0° → θ = 10.9° (cos 0.98) и 76.6° (cos 0.23).
    document.getElementById("s2-arc1").setAttribute("d", arc(150, 72.8, 83.7));
    document.getElementById("s2-arc2").setAttribute("d", arc(230, 7.0, 83.7));
    // [слово, x0, y0 (до обучения), x1, y1 (после), цвет, якорь подписи] — детерминированно.
    const words = [
      ["кот", 700, 200, 200, 110, "#3dba7a", "start"], ["кошка", 300, 480, 280, 140, "#3dba7a", "start"], ["собака", 520, 120, 178, 200, "#3dba7a", "end"],
      ["Париж", 220, 300, 800, 480, "#b48ce6", "start"], ["Москва", 830, 150, 740, 540, "#b48ce6", "start"], ["Лондон", 450, 420, 840, 410, "#b48ce6", "end"],
      ["бежать", 760, 340, 520, 300, "#ff7a2f", "start"], ["идти", 330, 220, 600, 250, "#ff7a2f", "start"], ["плыть", 640, 520, 560, 360, "#ff7a2f", "start"],
    ];
    const g = document.getElementById("s2-pts");
    const nodes = words.map(([w, x0, y0, x1, y1, color, anchor], i) => {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("id", `s2-p${i}`); c.setAttribute("cx", x0); c.setAttribute("cy", y0); c.setAttribute("r", "11"); c.setAttribute("fill", color); c.setAttribute("opacity", "0");
      const t = document.createElementNS(NS, "text");
      t.setAttribute("id", `s2-t${i}`); t.setAttribute("x", anchor === "end" ? x0 - 18 : x0 + 18); t.setAttribute("y", y0 + 9); t.setAttribute("fill", color);
      t.setAttribute("font-size", "26"); t.setAttribute("font-weight", "600"); t.setAttribute("text-anchor", anchor); t.setAttribute("opacity", "0"); t.textContent = w;
      g.appendChild(c); g.appendChild(t);
      return [c, t, x1, y1, anchor];
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-map", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.3);
    nodes.forEach(([c, t], i) => { tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6 + 0.08 * i); tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.7 + 0.08 * i); });
    cap("#s2-cap1", 0.6, 4.6);
    // «Обучение»: точки стягиваются в кластеры по смыслу.
    // Подписи гаснут на время переезда (иначе пересекаются в полёте) и возвращаются на новых местах.
    nodes.forEach(([c, t, x1, y1, anchor]) => {
      tl.to(t, { opacity: 0, duration: 0.3 }, 1.7);
      tl.to(c, { attr: { cx: x1, cy: y1 }, duration: 2.0, ease: "power2.inOut" }, 2.0);
      tl.to(t, { attr: { x: anchor === "end" ? x1 - 18 : x1 + 18, y: y1 + 9 }, duration: 2.0, ease: "power2.inOut" }, 2.0);
      tl.to(t, { opacity: 1, duration: 0.4 }, 4.0);
    });
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.2);
    // Косинус: два вектора из начала координат и угол между ними.
    cap("#s2-cap2", 4.8, 9.0);
    tl.fromTo("#s2-org", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.9);
    tl.fromTo("#s2-v1", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": Math.hypot(50, 450).toFixed(1) + " 9999" }, duration: 0.7, ease: "power2.inOut" }, 5.0);
    tl.fromTo("#s2-v2", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 0.8, attr: { "stroke-dasharray": Math.hypot(130, 420).toFixed(1) + " 9999" }, duration: 0.7, ease: "power2.inOut" }, 5.5);
    tl.fromTo("#s2-arc1", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": len(150, 72.8, 83.7) + " 9999" }, duration: 0.5, ease: "power2.inOut" }, 6.2);
    tl.fromTo("#s2-l1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.6);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.6);
    tl.fromTo("#s2-r1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.0);
    // Далёкий кластер: большой угол, маленький косинус.
    cap("#s2-cap3", 9.2, 13.5);
    tl.fromTo("#s2-v3", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": Math.hypot(650, 80).toFixed(1) + " 9999" }, duration: 0.8, ease: "power2.inOut" }, 9.4);
    tl.fromTo("#s2-arc2", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": len(230, 7.0, 83.7) + " 9999" }, duration: 0.7, ease: "power2.inOut" }, 10.1);
    tl.fromTo("#s2-l2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.6);
    tl.fromTo("#s2-r2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.8);
    tl.fromTo("#s2-r3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.6);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.45 }, 13.55);
    window.__timelines["s2"] = tl;
  })();
</script>
