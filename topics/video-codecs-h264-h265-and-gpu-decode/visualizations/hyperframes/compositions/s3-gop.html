<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 10px; width: 700px; }
  #s3-c2 { left: 1060px; top: 222px; width: 700px; }
  #s3-c3 { left: 1060px; top: 386px; width: 700px; }
  .card .d { font-size: 32px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Что такое GOP: I, P, B?</div></div>
    <div class="badge">Knowledge Book · Видеокодеки</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <g id="s3-gop" opacity="0">
          <text x="424" y="24" text-anchor="middle" fill="#aab3c2" font-size="24">GOP (Group of Pictures): от одного I до следующего I</text>
          <path d="M 2 56 L 2 42 L 846 42 L 846 56" fill="none" stroke="#aab3c2" stroke-width="2"/>
        </g>
        <g id="s3-arrows"></g>
        <g id="s3-cards"></g>
        <g id="s3-bars"></g>
        <text id="s3-bl" x="472" y="504" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">типичный бюджет бит на кадр: I ≫ P &gt; B (иллюстративно)</text>
        <g id="s3-cam"></g>
        <text id="s3-cl" x="472" y="636" text-anchor="middle" fill="#aab3c2" font-size="24" opacity="0">камера: IPPP без B, GOP 1–2 с, или intra-refresh</text>
      </svg>
      <div id="s3-c1" class="card"><div class="h" style="color:#4a9eff">I (IDR)</div><div class="d">intra, точка входа: декод можно начать с этого кадра</div></div>
      <div id="s3-c2" class="card"><div class="h" style="color:#3dba7a">P</div><div class="d">предсказание из прошлого</div></div>
      <div id="s3-c3" class="card"><div class="h" style="color:#b48ce6">B</div><div class="d">из прошлого и будущего: лучше сжатие, выше задержка</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap"><b>GOP</b> — пачка кадров между независимыми якорями: <b class="b">I (IDR)</b> хранит картинку целиком и служит точкой входа</div>
      <div id="s3-cap2" class="cap"><b class="g">P</b> предсказывается из прошлого, <b class="p">B</b> — из прошлого и будущего: сжатие лучше, но задержка выше</div>
      <div id="s3-cap3" class="cap key">I хранит картинку, P и B — только отличие. На камерах ради низкой задержки: IPPP без B и короткий GOP (1–2 с) либо intra-refresh</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; };
    const SEQ = ["I","B","B","P","B","B","P","B","B","I"];
    const COL = { I: "#4a9eff", P: "#3dba7a", B: "#b48ce6" }, FILL = { I: "#1e3a5f", P: "#163a2a", B: "#2c2244" };
    const BITS = { I: 130, P: 62, B: 26 };
    const cxOf = i => i * 96 + 40;
    const gC = document.getElementById("s3-cards"), gA = document.getElementById("s3-arrows"), gB = document.getElementById("s3-bars"), gCam = document.getElementById("s3-cam");
    const cards = SEQ.map((t, i) => {
      const g = mk("g", { id: `s3-fr-${i}`, opacity: 0 }, gC);
      mk("rect", { x: i * 96, y: 130, width: 80, height: 100, rx: 12, fill: FILL[t], stroke: COL[t], "stroke-width": 3 }, g);
      const tx = mk("text", { x: cxOf(i), y: 196, "text-anchor": "middle", fill: COL[t], "font-size": 46, "font-weight": 700 }, g); tx.textContent = t;
      return g;
    });
    // Ссылки: P → предыдущий I/P (снизу); B → предыдущий I/P и следующий P/I (сверху).
    const prevAnchor = i => { for (let k = i - 1; k >= 0; k--) if (SEQ[k] !== "B") return k; return -1; };
    const nextAnchor = i => { for (let k = i + 1; k < SEQ.length; k++) if (SEQ[k] !== "B") return k; return -1; };
    const qlen = (x0, y0, xc, yc, x1, y1) => { let L = 0, px = x0, py = y0; for (let s = 1; s <= 40; s++) { const t = s / 40, u = 1 - t; const x = u*u*x0 + 2*u*t*xc + t*t*x1, y = u*u*y0 + 2*u*t*yc + t*t*y1; L += Math.hypot(x - px, y - py); px = x; py = y; } return L; };
    const arrows = [];
    const addArrow = (from, to, side, color, id) => {
      const x0 = cxOf(from), x1 = cxOf(to), d = Math.abs(from - to);
      const y0 = side === "down" ? 232 : 128, yc = side === "down" ? 232 + 22 + 20 * d : 128 - 22 - 16 * d;
      const xc = (x0 + x1) / 2;
      const p = mk("path", { id, d: `M ${x0} ${y0} Q ${xc} ${yc} ${x1} ${y0}`, fill: "none", stroke: color, "stroke-width": 3.5, "stroke-dasharray": "0 9999" }, gA);
      const a = Math.atan2(y0 - yc, x1 - xc); const pt = (ang, r) => `${(x1 + r * Math.cos(ang)).toFixed(1)},${(y0 + r * Math.sin(ang)).toFixed(1)}`;
      const h = mk("polygon", { id: id + "h", points: `${pt(a, 3)} ${pt(a + 2.6, 13)} ${pt(a - 2.6, 13)}`, fill: color, opacity: 0 }, gA);
      arrows.push({ p, h, len: qlen(x0, y0, xc, yc, x1, y0).toFixed(1), kind: SEQ[from] });
    };
    SEQ.forEach((t, i) => {
      if (t === "P") addArrow(i, prevAnchor(i), "down", COL.P, `s3-ap-${i}`);
      if (t === "B") { addArrow(i, prevAnchor(i), "up", COL.B, `s3-ab-${i}-p`); addArrow(i, nextAnchor(i), "up", COL.B, `s3-ab-${i}-n`); }
    });
    const bars = SEQ.map((t, i) => mk("rect", { id: `s3-bar-${i}`, x: i * 96 + 10, y: 470, width: 60, height: 0, rx: 6, fill: COL[t] }, gB));
    const CAM = ["I","P","P","P","P","P","P","P","P","…"];
    const cam = CAM.map((t, i) => {
      const g = mk("g", { id: `s3-cam-${i}`, opacity: 0 }, gCam);
      if (t !== "…") mk("rect", { x: i * 96 + 10, y: 540, width: 60, height: 50, rx: 8, fill: FILL[t], stroke: COL[t], "stroke-width": 2 }, g);
      const tx = mk("text", { x: cxOf(i), y: 576, "text-anchor": "middle", fill: t === "…" ? "#aab3c2" : COL[t], "font-size": 30, "font-weight": 700 }, g); tx.textContent = t;
      return g;
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    cards.forEach((g, i) => tl.fromTo(g, { opacity: 0, scale: 0.6, svgOrigin: `${cxOf(i)} 180` }, { opacity: 1, scale: 1, svgOrigin: `${cxOf(i)} 180`, duration: 0.4, ease: "back.out(1.6)" }, 0.4 + 0.2 * i));
    cap("#s3-cap1", 0.6, 5.0);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.6);
    tl.fromTo("#s3-gop", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.2);
    cap("#s3-cap2", 5.2, 9.5);
    let tP = 5.4, tB = 6.6;
    arrows.forEach(a => {
      const t0 = a.kind === "P" ? tP : tB; if (a.kind === "P") tP += 0.5; else tB += 0.2;
      tl.fromTo(a.p, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": a.len + " 9999" }, duration: 0.45, ease: "power2.inOut" }, t0);
      tl.fromTo(a.h, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t0 + 0.38);
    });
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.8);
    tl.fromTo("#s3-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.4);
    cap("#s3-cap3", 9.8, 0);
    bars.forEach((b, i) => tl.to(b, { attr: { y: 470 - BITS[SEQ[i]], height: BITS[SEQ[i]] }, duration: 0.5, ease: "power2.out" }, 10.0 + 0.08 * i));
    tl.fromTo("#s3-bl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.9);
    cam.forEach((g, i) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 11.5 + 0.08 * i));
    tl.fromTo("#s3-cl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 12.4);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.45 }, 13.55);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
