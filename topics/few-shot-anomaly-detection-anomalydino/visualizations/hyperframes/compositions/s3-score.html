<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 0px; width: 700px; }
  #s3-c2 { left: 1060px; top: 250px; width: 700px; font-size: 30px; }
  #s3-c2 .row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #2a3140; }
  #s3-c2 .row:last-child { border-bottom: 0; }
  #s3-c2 .nm { color: #f0f4ff; font-weight: 600; }
  #s3-c2 .v { font-size: 34px; font-weight: 700; }
  #s3-c2 .tp { font-size: 24px; color: #aab3c2; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Кадр целиком: OK или defect?</div></div>
    <div class="badge">Knowledge Book · AnomalyDINO</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <g id="s3-axes" opacity="0">
          <line x1="110" y1="560" x2="905" y2="560" stroke="#2a3140" stroke-width="3"/>
          <line x1="110" y1="80" x2="110" y2="560" stroke="#2a3140" stroke-width="3"/>
          <text x="98" y="566" text-anchor="end" fill="#aab3c2" font-size="22">0</text>
          <text x="98" y="429" text-anchor="end" fill="#aab3c2" font-size="22">0.2</text>
          <text x="98" y="292" text-anchor="end" fill="#aab3c2" font-size="22">0.4</text>
          <text x="98" y="155" text-anchor="end" fill="#aab3c2" font-size="22">0.6</text>
          <text x="60" y="70" fill="#aab3c2" font-size="24">d<tspan font-size="18" dy="5">NN</tspan></text>
          <text x="116" y="590" fill="#aab3c2" font-size="22">1</text>
          <text x="891" y="590" text-anchor="end" fill="#aab3c2" font-size="22">64</text>
          <text x="505" y="628" text-anchor="middle" fill="#aab3c2" font-size="22">патчи по убыванию d<tspan font-size="16" dy="4">NN</tspan><tspan dy="-4">, первые 64 из 1024 (иллюстративно)</tspan></text>
        </g>
        <rect id="s3-tail" x="110" y="80" width="124" height="480" fill="rgba(255,122,47,0.16)" opacity="0"/>
        <text id="s3-taillbl" x="246" y="108" fill="#ff7a2f" font-size="24" font-weight="700" opacity="0">← top-1 % = 10 из 1024 патчей</text>
        <polyline id="s3-curveD" opacity="0" points="" fill="none" stroke="#ff4d6d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <polyline id="s3-curveN" opacity="0" points="" fill="none" stroke="#3dba7a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <text id="s3-legD" x="400" y="332" fill="#ff4d6d" font-size="24" font-weight="700" opacity="0">кадр с дефектом</text>
        <text id="s3-legN" x="400" y="540" fill="#3dba7a" font-size="24" font-weight="700" opacity="0">нормальный кадр</text>
        <line id="s3-sD" x1="110" y1="285.7" x2="905" y2="285.7" stroke="#ff4d6d" stroke-width="3" stroke-dasharray="12 10" opacity="0"/>
        <line id="s3-sN" x1="110" y1="470.9" x2="905" y2="470.9" stroke="#3dba7a" stroke-width="3" stroke-dasharray="12 10" opacity="0"/>
        <text id="s3-sDlbl" x="900" y="277" text-anchor="end" fill="#ff4d6d" font-size="26" font-weight="700" opacity="0">s = 0.40</text>
        <text id="s3-sNlbl" x="900" y="462" text-anchor="end" fill="#3dba7a" font-size="26" font-weight="700" opacity="0">s = 0.13</text>
        <line id="s3-thr" x1="110" y1="388.6" x2="905" y2="388.6" stroke="#ff7a2f" stroke-width="4" stroke-dasharray="18 12" opacity="0"/>
        <text id="s3-thrlbl" x="900" y="380" text-anchor="end" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0">порог τ (val)</text>
        <g id="s3-verD" opacity="0"><rect x="520" y="200" width="230" height="46" rx="12" fill="rgba(255,77,109,0.18)" stroke="#ff4d6d" stroke-width="3"/><text x="635" y="232" text-anchor="middle" fill="#ff4d6d" font-size="26" font-weight="700">s &gt; τ → defect</text></g>
        <g id="s3-verN" opacity="0"><rect x="520" y="412" width="230" height="46" rx="12" fill="rgba(61,186,122,0.18)" stroke="#3dba7a" stroke-width="3"/><text x="635" y="444" text-anchor="middle" fill="#3dba7a" font-size="26" font-weight="700">s &lt; τ → OK</text></g>
      </svg>
      <div id="s3-c1" class="card"><div class="h">Image-level score</div>
        <div class="f">s(x) = mean of top-1 % { d<sub>NN</sub>(p<sub>j</sub>; M) }</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">хвост распределения (99 %-квантиль): устойчивее, чем один max</div></div>
      <div id="s3-c2" class="card"><div class="h">MVTec-AD, 1-shot, image AUROC</div>
        <div class="row"><span class="nm">WinCLIP+</span><span class="v" style="color:#aab3c2">~93.1 %</span></div>
        <div class="row"><span class="nm" style="color:#4a9eff">AnomalyDINO-S (672 px)</span><span class="v g">96.6 %</span></div>
        <div class="row"><span class="tp">inference, ViT-S, 448 px</span><span class="tp">~60 ms / кадр</span></div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">Сортируем d<sub>NN</sub> всех патчей. Image score <b class="o">s</b> — среднее по <b>1 %</b> самых больших: хвост устойчивее, чем один max</div>
      <div id="s3-cap2" class="cap"><b class="o">s</b> выше порога → кадр «<b class="r">defect</b>», ниже → «<b class="g">OK</b>». Порог калибруют на валидации (числа на графике иллюстративны)</div>
      <div id="s3-cap3" class="cap key">Без обучения: патчи DINOv2 + ближайший сосед в банке нормы. MVTec-AD 1-shot: 96.6 % AUROC, ~60 мс на кадр</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Иллюстративные профили: norm(i) = 0.05 + 0.09·e^(−i/40); defect(i) = norm(i) + 0.48·e^(−i/7); mean top-10: 0.13 и 0.40; порог τ = 0.25.
    const X = (i) => 110 + i * 12.4, Y = (v) => 560 - v / 0.7 * 480;
    const ptsN = [], ptsD = [];
    for (let i = 0; i < 64; i++) { const n = 0.05 + 0.09 * Math.exp(-i / 40); ptsN.push([X(i), Y(n)]); ptsD.push([X(i), Y(n + 0.48 * Math.exp(-i / 7))]); }
    const polyLen = (p) => { let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return s.toFixed(1); };
    const fmt = (p) => p.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    document.getElementById("s3-curveD").setAttribute("points", fmt(ptsD));
    document.getElementById("s3-curveN").setAttribute("points", fmt(ptsN));

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-axes", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.3);
    cap("#s3-cap1", 0.6, 4.6);
    tl.fromTo("#s3-curveD", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": polyLen(ptsD) + " 9999" }, duration: 1.3, ease: "power1.inOut" }, 0.8);
    tl.fromTo("#s3-legD", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.8);
    tl.fromTo("#s3-curveN", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": polyLen(ptsN) + " 9999" }, duration: 1.3, ease: "power1.inOut" }, 1.4);
    tl.fromTo("#s3-legN", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.4);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.2);
    tl.fromTo("#s3-tail", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.6);
    tl.fromTo("#s3-taillbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.8);
    tl.fromTo("#s3-sD", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.3);
    tl.fromTo("#s3-sDlbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.4);
    tl.fromTo("#s3-sN", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.7);
    tl.fromTo("#s3-sNlbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.8);
    cap("#s3-cap2", 4.8, 8.6);
    tl.fromTo("#s3-thr", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 5.0);
    tl.fromTo("#s3-thrlbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.2);
    tl.fromTo("#s3-verD", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 5.9);
    tl.fromTo("#s3-verN", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 6.3);
    cap("#s3-cap3", 8.9, 0);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.2);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 12.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
