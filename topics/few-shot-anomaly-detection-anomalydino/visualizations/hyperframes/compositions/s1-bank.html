<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 0px; width: 700px; }
  #s1-c2 { left: 1060px; top: 290px; width: 700px; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Как запомнить «норму» без обучения?</div></div>
    <div class="badge">Knowledge Book · AnomalyDINO</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <text x="132" y="62" text-anchor="middle" fill="#aab3c2" font-size="24">эталон 1 (норма)</text>
        <text x="132" y="356" text-anchor="middle" fill="#aab3c2" font-size="24">эталон k (норма)</text>
        <g id="s1-grid1"></g>
        <g id="s1-grid2"></g>
        <text id="s1-patchlbl" x="132" y="312" text-anchor="middle" fill="#4a9eff" font-size="22" opacity="0">патчи 14 × 14 px</text>
        <path id="s1-ar1" opacity="0" d="M 246 180 L 316 280" fill="none" stroke="#4a9eff" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <path id="s1-ar2" opacity="0" d="M 246 480 L 316 380" fill="none" stroke="#4a9eff" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <g id="s1-dino" opacity="0.35">
          <rect x="322" y="248" width="236" height="164" rx="16" fill="#161a24" stroke="#4a9eff" stroke-width="4"/>
          <text x="440" y="290" text-anchor="middle" fill="#f0f4ff" font-size="30" font-weight="700">DINOv2</text>
          <text x="440" y="326" text-anchor="middle" fill="#f0f4ff" font-size="24" font-weight="600">ViT-S/14 (frozen)</text>
          
        </g>
        <path id="s1-ar3" opacity="0" d="M 566 330 L 636 330" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <g id="s1-bank" opacity="0">
          <rect x="650" y="96" width="304" height="470" rx="18" fill="#161a24" stroke="#2dd4bf" stroke-width="4" stroke-dasharray="14 10"/>
          <text x="802" y="140" text-anchor="middle" fill="#2dd4bf" font-size="30" font-weight="700">memory bank M</text>
          <text x="802" y="176" text-anchor="middle" fill="#aab3c2" font-size="22">патч-векторы всех эталонов</text>
        </g>
        <text id="s1-banklbl" x="802" y="606" text-anchor="middle" fill="#2dd4bf" font-size="26" font-weight="600" opacity="0">|M| = k · n (+ повороты)</text>
        <g id="s1-feat"></g>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Экстрактор f</div>
        <div class="f">f(x) = (<span class="t">p<sub>1</sub></span>, …, <span class="t">p<sub>n</sub></span>)</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">DINOv2 ViT-S/14: патч 14 × 14 px, вход 448 или 672 px (сторона кратна 14)</div></div>
      <div id="s1-c2" class="card"><div class="h">Memory bank</div>
        <div class="f">M = ⋃<sub>i</sub> { <span class="t">p<sub>j</sub><sup>(i)</sup></span> : j ∈ [n] }</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">k ∈ {1, 2, 4, 8, 16} эталонов; аугментации (повороты) расширяют M в few-shot режиме</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Дано <b class="b">k = 1…16</b> эталонных «нормальных» кадров и <b>никакого обучения</b>: сеть только извлекает признаки</div>
      <div id="s1-cap2" class="cap"><b class="b">DINOv2 ViT-S/14</b> режет кадр на патчи <b>14 × 14 px</b> и для каждого выдаёт вектор <b class="t">p<sub>j</sub></b></div>
      <div id="s1-cap3" class="cap">Патч-векторы всех эталонов (плюс повороты-аугментации) складываем в <b class="t">memory bank M</b> — это вся «память о норме»</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const shades = ["#1e3a5f", "#24466f", "#1a3352"];
    const N = 6, CELL = 34, GAP = 4;
    const grids = [["s1-grid1", 30, 78], ["s1-grid2", 30, 372]];
    const cells = []; // [id, x, y]
    grids.forEach(([gid, gx, gy], gi) => {
      const g = document.getElementById(gid);
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const x = gx + c * CELL, y = gy + r * CELL;
        const el = document.createElementNS(NS, "rect");
        el.setAttribute("id", `s1-g${gi}-${r * N + c}`);
        el.setAttribute("x", x); el.setAttribute("y", y); el.setAttribute("width", CELL - GAP); el.setAttribute("height", CELL - GAP);
        el.setAttribute("rx", "4"); el.setAttribute("fill", shades[(r * 7 + c * 3 + gi) % 3]); el.setAttribute("opacity", "0");
        g.appendChild(el); cells.push([`#s1-g${gi}-${r * N + c}`, x, y]);
      }
    });
    // Копии-«векторы»: летят из патча в DINOv2, потом в банк (8 колонок × 9 рядов слотов).
    const gf = document.getElementById("s1-feat");
    const feats = cells.map(([_, x, y], i) => {
      const el = document.createElementNS(NS, "rect");
      el.setAttribute("id", `s1-f${i}`); el.setAttribute("x", x); el.setAttribute("y", y);
      el.setAttribute("width", "22"); el.setAttribute("height", "22"); el.setAttribute("rx", "4");
      el.setAttribute("fill", "#2dd4bf"); el.setAttribute("opacity", "0");
      gf.appendChild(el); return el;
    });
    const slot = (i) => [676 + (i % 8) * 32, 200 + Math.floor(i / 8) * 32];
    const pile = (i) => [364 + (i % 12) * 12, 348 + Math.floor(i / 12) * 7];

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    cells.forEach(([id], i) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.4 + 0.02 * i));
    cap("#s1-cap1", 0.6, 4.6);
    tl.fromTo("#s1-ar1", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "122.1 9999" }, duration: 0.5, ease: "power2.inOut" }, 2.0);
    tl.fromTo("#s1-ar2", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "122.1 9999" }, duration: 0.5, ease: "power2.inOut" }, 2.2);
    tl.fromTo("#s1-dino", { opacity: 0.35 }, { opacity: 1, duration: 0.5 }, 2.5);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.8);
    tl.fromTo("#s1-patchlbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.2);
    cap("#s1-cap2", 4.8, 8.6);
    // Фаза A: из патча — в DINOv2 (сжимаются до «вектора»).
    feats.forEach((el, i) => {
      const [px, py] = pile(i), [x0, y0] = [cells[i][1], cells[i][2]];
      tl.fromTo(el, { opacity: 0, attr: { x: x0, y: y0, width: CELL - GAP, height: CELL - GAP } },
        { opacity: 1, attr: { x: px, y: py, width: 22, height: 22 }, duration: 0.7, ease: "power2.in" }, 5.0 + 0.03 * i);
    });
    tl.fromTo("#s1-ar3", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "70 9999" }, duration: 0.4, ease: "power2.inOut" }, 7.6);
    tl.fromTo("#s1-bank", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 7.8);
    cap("#s1-cap3", 8.8, 12.5);
    // Фаза B: из DINOv2 — в слоты банка.
    feats.forEach((el, i) => {
      const [sx, sy] = slot(i);
      tl.to(el, { attr: { x: sx, y: sy }, duration: 0.6, ease: "power2.out" }, 9.0 + 0.03 * i);
    });
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.4);
    tl.fromTo("#s1-banklbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.4);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 12.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
