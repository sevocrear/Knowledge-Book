<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  .title { font-size: 40px; }
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 10px; width: 700px; }
  #s2-c2 { left: 1060px; top: 380px; width: 700px; }
  #s2-svg .box { stroke-width: 3; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Как токены смотрят друг на друга (self-attention)?</div></div>
    <div class="badge">Knowledge Book · ViT</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <defs>
          <marker id="s2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#aab3c2"/></marker>
          <marker id="s2-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3dba7a"/></marker>
        </defs>
        <!-- X → Q, K, V -->
        <g id="s2-x" opacity="0">
          <rect x="30" y="95" width="100" height="64" rx="12" fill="#161a24" stroke="#aab3c2" class="box"/>
          <text x="80" y="138" text-anchor="middle" fill="#f0f4ff" font-size="34" font-weight="700">X</text>
          <text x="80" y="186" text-anchor="middle" fill="#aab3c2" font-size="22">n × d<tspan font-size="16" dy="6">model</tspan></text>
        </g>
        <g id="s2-arrows">
          <line id="s2-a-q" opacity="0" x1="130" y1="118" x2="266" y2="52" stroke="#aab3c2" stroke-width="3" marker-end="url(#s2-arr)" stroke-dasharray="0 9999"/>
          <line id="s2-a-k" opacity="0" x1="130" y1="127" x2="266" y2="127" stroke="#aab3c2" stroke-width="3" marker-end="url(#s2-arr)" stroke-dasharray="0 9999"/>
          <line id="s2-a-v" opacity="0" x1="130" y1="136" x2="266" y2="202" stroke="#aab3c2" stroke-width="3" marker-end="url(#s2-arr)" stroke-dasharray="0 9999"/>
          <text id="s2-al-q" x="188" y="62" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">X·W<tspan font-size="16" dy="6">Q</tspan></text>
          <text id="s2-al-k" x="198" y="116" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">X·W<tspan font-size="16" dy="6">K</tspan></text>
          <text id="s2-al-v" x="188" y="206" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">X·W<tspan font-size="16" dy="6">V</tspan></text>
        </g>
        <g id="s2-q" opacity="0"><rect x="270" y="22" width="140" height="60" rx="12" fill="#1e3a5f" stroke="#4a9eff" class="box"/><text x="340" y="63" text-anchor="middle" fill="#4a9eff" font-size="32" font-weight="700">Q</text><text x="425" y="60" fill="#aab3c2" font-size="21">«что я ищу»</text></g>
        <g id="s2-k" opacity="0"><rect x="270" y="97" width="140" height="60" rx="12" fill="#2a2140" stroke="#b48ce6" class="box"/><text x="340" y="138" text-anchor="middle" fill="#b48ce6" font-size="32" font-weight="700">K</text><text x="425" y="135" fill="#aab3c2" font-size="21">«что у меня есть»</text></g>
        <g id="s2-v" opacity="0"><rect x="270" y="172" width="140" height="60" rx="12" fill="#163526" stroke="#3dba7a" class="box"/><text x="340" y="213" text-anchor="middle" fill="#3dba7a" font-size="32" font-weight="700">V</text><text x="425" y="210" fill="#aab3c2" font-size="20">«что сообщу, если выберут»</text></g>
        <!-- Выход для CLS -->
        <g id="s2-out" opacity="0">
          <rect x="650" y="40" width="310" height="110" rx="14" fill="#163526" stroke="#3dba7a" class="box"/>
          <text x="805" y="86" text-anchor="middle" fill="#f0f4ff" font-size="27" font-weight="700">Y<tspan font-size="20" dy="8">CLS</tspan><tspan dy="-8"> = Σ</tspan><tspan font-size="20" dy="8">j</tspan><tspan dy="-8"> A</tspan><tspan font-size="20" dy="8">CLS,j</tspan><tspan dy="-8"> · V</tspan><tspan font-size="20" dy="8">j</tspan></text>
          <text x="805" y="128" text-anchor="middle" fill="#aab3c2" font-size="20">взвешенная сумма значений</text>
        </g>
        <path id="s2-o1" opacity="0" d="" fill="none" stroke="#3dba7a" stroke-width="3" marker-end="url(#s2-arr-g)" stroke-dasharray="0 9999"/>
        <path id="s2-o2" opacity="0" d="" fill="none" stroke="#3dba7a" stroke-width="3" marker-end="url(#s2-arr-g)" stroke-dasharray="0 9999"/>
        <path id="s2-o3" opacity="0" d="" fill="none" stroke="#3dba7a" stroke-width="3" marker-end="url(#s2-arr-g)" stroke-dasharray="0 9999"/>
        <!-- Столбики весов внимания -->
        <g id="s2-chart" opacity="0">
          <line x1="40" y1="530" x2="940" y2="530" stroke="#2a3140" stroke-width="2"/>
          <text x="40" y="440" fill="#aab3c2" font-size="24">веса внимания A<tspan font-size="17" dy="7">CLS,j</tspan></text>
        </g>
        <g id="s2-bars"></g>
        <g id="s2-vals"></g>
        <text id="s2-sum" x="940" y="356" text-anchor="end" fill="#f0f4ff" font-size="24" font-weight="700" opacity="0">Σ<tspan font-size="17" dy="7">j</tspan><tspan dy="-7"> A</tspan><tspan font-size="17" dy="7">CLS,j</tspan><tspan dy="-7"> = 1.00</tspan></text>
        <g id="s2-tokens"></g>
        <g id="s2-ring" opacity="0">
          <rect x="42" y="554" width="56" height="56" rx="10" fill="none" stroke="#4a9eff" stroke-width="4"/>
          <text x="44" y="642" fill="#4a9eff" font-size="22" font-weight="700">запрос Q<tspan font-size="16" dy="6">CLS</tspan></text>
        </g>
        <text id="s2-tok-lbl" x="940" y="642" text-anchor="end" fill="#aab3c2" font-size="22" opacity="0">ключи K<tspan font-size="16" dy="6">j</tspan><tspan dy="-6"> и значения V</tspan><tspan font-size="16" dy="6">j</tspan><tspan dy="-6"> всех 17 токенов</tspan></text>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Scaled dot-product attention</div>
        <div class="f"><span class="b">Q</span> = X W<sub>Q</sub>,&nbsp; <span class="p">K</span> = X W<sub>K</sub>,&nbsp; <span class="g">V</span> = X W<sub>V</sub></div>
        <div class="f" style="margin-top:6px">S = <span class="b">Q</span> <span class="p">K</span><sup>T</sup> / √d<sub>k</sub></div>
        <div class="f" style="margin-top:6px">A = softmax(S),&nbsp; Σ<sub>j</sub> A<sub>ij</sub> = 1</div>
        <div class="f" style="margin-top:6px">Y = A <span class="g">V</span></div></div>
      <div id="s2-c2" class="card"><div class="h">Multi-head</div>
        <div style="font-size:30px">h голов с меньшей размерностью d<sub>k</sub> → concat → линейный слой W<sub>O</sub></div>
        <div style="font-size:26px;color:#aab3c2;margin-top:8px">каждая голова смотрит на свой аспект структуры</div></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Из X линейно получаем <b class="b">Q</b> («что я ищу»), <b class="p">K</b> («что у меня есть») и <b class="g">V</b> («что сообщу, если меня выберут»)</div>
      <div id="s2-cap2" class="cap"><b>S<sub>ij</sub> = Q<sub>i</sub>K<sub>j</sub> / √d<sub>k</sub></b> — похожесть запроса и ключа; softmax по строке даёт веса, <b>сумма = 1</b></div>
      <div id="s2-cap3" class="cap">Выход <b class="g">Y<sub>i</sub> = Σ<sub>j</sub> A<sub>ij</sub> V<sub>j</sub></b> — взвешенная сумма значений; несколько голов (multi-head) смотрят на разное</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const TOK = 44, ROW_Y = 560, ROW_X0 = 48, STEP = 52, BASE = 530, PX = 1000; // 1000 px на единицу веса
    // Цвета токенов как у патчей сцены 1: небо, трава, 4 патча с оранжевым кругом (6, 7, 10, 11).
    const sky = ["#5aa9ff", "#6cb4ff", "#4f9ef5", "#62adfa", "#74baff", "#5aa9ff", "#6cb4ff", "#7cc0ff"];
    const grass = ["#3dba7a", "#35a86d", "#3dba7a", "#2f9d64", "#2f9d64", "#3dba7a", "#35a86d", "#3dba7a"];
    const blob = new Set([6, 7, 10, 11]);
    // Веса A_CLS,j (детерминированные, сумма 1.00): больше всего на 4 токенах «оранжевого пятна».
    const A = [0.06, 0.02, 0.03, 0.03, 0.02, 0.03, 0.15, 0.17, 0.03, 0.03, 0.14, 0.16, 0.03, 0.03, 0.02, 0.03, 0.02];
    const top3 = [7, 11, 6];
    const gT = document.getElementById("s2-tokens"), gB = document.getElementById("s2-bars"), gV = document.getElementById("s2-vals");
    for (let j = 0; j <= 16; j++) {
      const x = ROW_X0 + STEP * j;
      const g = document.createElementNS(NS, "g"); g.setAttribute("id", `s2-t${j}`); g.setAttribute("opacity", "0");
      const rc = document.createElementNS(NS, "rect");
      rc.setAttribute("x", x); rc.setAttribute("y", ROW_Y); rc.setAttribute("width", TOK); rc.setAttribute("height", TOK); rc.setAttribute("rx", 6);
      let fill = j === 0 ? "#ff7a2f" : (j <= 8 ? sky[j - 1] : grass[j - 9]);
      if (blob.has(j)) fill = "#ffb020";
      rc.setAttribute("fill", fill);
      if (j === 0) { rc.setAttribute("stroke", "#f0f4ff"); rc.setAttribute("stroke-width", "3"); }
      g.appendChild(rc);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", x + TOK / 2); t.setAttribute("y", ROW_Y + 29); t.setAttribute("text-anchor", "middle");
      t.setAttribute("fill", "#0f1117"); t.setAttribute("font-size", j === 0 ? "17" : "20"); t.setAttribute("font-weight", "800");
      t.textContent = j === 0 ? "CLS" : String(j); g.appendChild(t);
      gT.appendChild(g);
      const b = document.createElementNS(NS, "rect"); b.setAttribute("id", `s2-b${j}`);
      b.setAttribute("x", x + 4); b.setAttribute("y", BASE); b.setAttribute("width", TOK - 8); b.setAttribute("height", 0); b.setAttribute("rx", 4);
      b.setAttribute("fill", blob.has(j) ? "#ffb020" : (j === 0 ? "#ff7a2f" : "#4a9eff")); gB.appendChild(b);
      const v = document.createElementNS(NS, "text"); v.setAttribute("id", `s2-v${j}`);
      v.setAttribute("x", x + TOK / 2); v.setAttribute("y", BASE - A[j] * PX - 8); v.setAttribute("text-anchor", "middle");
      v.setAttribute("fill", blob.has(j) ? "#f0f4ff" : "#aab3c2"); v.setAttribute("font-size", blob.has(j) ? "20" : "17"); v.setAttribute("font-weight", "700"); v.setAttribute("opacity", "0");
      v.textContent = A[j].toFixed(2); gV.appendChild(v);
    }
    // Стрелки от трёх самых больших столбиков к выходу Y_CLS.
    const arrowTo = (j, ex) => { const x = ROW_X0 + STEP * j + TOK / 2, y = BASE - A[j] * PX - 30; return `M ${x} ${y} C ${x} ${y - 110}, ${ex} 300, ${ex} 156`; };
    document.getElementById("s2-o1").setAttribute("d", arrowTo(7, 780));
    document.getElementById("s2-o2").setAttribute("d", arrowTo(11, 830));
    document.getElementById("s2-o3").setAttribute("d", arrowTo(6, 730));
    const plen = id => document.getElementById(id).getTotalLength().toFixed(1);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-x", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);
    cap("#s2-cap1", 0.6, 4.8);
    [["#s2-a-q", "#s2-al-q", "#s2-q", 0.9], ["#s2-a-k", "#s2-al-k", "#s2-k", 1.4], ["#s2-a-v", "#s2-al-v", "#s2-v", 1.9]].forEach(([a, l, b, t]) => {
      tl.fromTo(a, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t);
      tl.fromTo(a, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "160 9999" }, duration: 0.5, ease: "power2.inOut", immediateRender: false }, t);
      tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t + 0.2);
      tl.fromTo(b, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, t + 0.35);
    });
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.2);
    // Ряд токенов, запрос CLS и столбики softmax-весов.
    cap("#s2-cap2", 5.0, 9.6);
    for (let j = 0; j <= 16; j++) tl.fromTo(`#s2-t${j}`, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35 }, 5.1 + 0.04 * j);
    tl.fromTo("#s2-tok-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.6);
    tl.fromTo("#s2-ring", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.9);
    tl.fromTo("#s2-chart", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.2);
    for (let j = 0; j <= 16; j++) {
      const h = A[j] * PX;
      tl.fromTo(`#s2-b${j}`, { attr: { y: BASE, height: 0 } }, { attr: { y: BASE - h, height: h }, duration: 0.6, ease: "power2.out" }, 6.4 + 0.06 * j);
      tl.fromTo(`#s2-v${j}`, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.9 + 0.06 * j);
    }
    tl.fromTo("#s2-sum", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.2);
    // Выход Y_CLS: взвешенная сумма V_j, стрелки от трёх самых тяжёлых токенов.
    cap("#s2-cap3", 9.8, 15.5);
    tl.fromTo("#s2-out", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.0);
    ["#s2-o1", "#s2-o2", "#s2-o3"].forEach((id, i) => {
      tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.1 }, 10.3 + 0.25 * i);
      tl.fromTo(id, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": plen(id.slice(1)) + " 9999" }, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 10.3 + 0.25 * i);
    });
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 12.2);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.45 }, 15.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
