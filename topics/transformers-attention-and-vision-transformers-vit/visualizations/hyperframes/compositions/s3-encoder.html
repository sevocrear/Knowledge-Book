<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1040px; top: 10px; width: 720px; }
  #s3-c2 { left: 1040px; top: 330px; width: 720px; }
  #s3-svg .bx { stroke-width: 3; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Откуда берётся класс?</div></div>
    <div class="badge">Knowledge Book · ViT</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <defs>
          <marker id="s3-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#aab3c2"/></marker>
          <marker id="s3-arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7a2f"/></marker>
        </defs>
        <!-- Вход: 17 токенов снизу, выход: 17 токенов сверху -->
        <g id="s3-in"></g>
        <text id="s3-in-lbl" x="724" y="646" fill="#aab3c2" font-size="22" opacity="0">вход: CLS + N патчей</text>
        <g id="s3-outrow"></g>
        <text id="s3-out-lbl" x="740" y="46" fill="#aab3c2" font-size="22" opacity="0">выход: z<tspan font-size="16" dy="6">CLS</tspan><tspan dy="-6">, z₁ … z</tspan><tspan font-size="16" dy="6">N</tspan></text>
        <!-- Блок энкодера (снизу вверх) -->
        <line id="s3-l0" opacity="0" x1="290" y1="596" x2="290" y2="576" stroke="#aab3c2" stroke-width="3" marker-end="url(#s3-arr)" stroke-dasharray="0 9999"/>
        <g id="s3-ln1" opacity="0"><rect x="120" y="530" width="340" height="44" rx="10" fill="#161a24" stroke="#aab3c2" class="bx"/><text x="290" y="560" text-anchor="middle" fill="#f0f4ff" font-size="24">LayerNorm</text></g>
        <line id="s3-l1" opacity="0" x1="290" y1="530" x2="290" y2="516" stroke="#aab3c2" stroke-width="3" marker-end="url(#s3-arr)" stroke-dasharray="0 9999"/>
        <g id="s3-mhsa" opacity="0"><rect x="120" y="458" width="340" height="56" rx="10" fill="#1e3a5f" stroke="#4a9eff" class="bx"/><text x="290" y="493" text-anchor="middle" fill="#f0f4ff" font-size="23" font-weight="700">Multi-Head Self-Attention</text></g>
        <line id="s3-l2" opacity="0" x1="290" y1="458" x2="290" y2="438" stroke="#aab3c2" stroke-width="3" marker-end="url(#s3-arr)" stroke-dasharray="0 9999"/>
        <path id="s3-r1" d="M 120 552 H 100 V 420 H 268" fill="none" stroke="#ff7a2f" stroke-width="3" stroke-dasharray="0 9999"/>
        <polygon id="s3-r1-tip" points="258,412 272,420 258,428" fill="#ff7a2f" opacity="0"/>
        <text id="s3-r1-lbl" x="6" y="500" fill="#ff7d33" font-size="19" opacity="0">residual</text>
        <g id="s3-add1" opacity="0"><circle cx="290" cy="420" r="17" fill="#161a24" stroke="#ff7a2f" stroke-width="3"/><text x="290" y="429" text-anchor="middle" fill="#ff7a2f" font-size="26" font-weight="700">+</text></g>
        <line id="s3-l3" opacity="0" x1="290" y1="402" x2="290" y2="384" stroke="#aab3c2" stroke-width="3" marker-end="url(#s3-arr)" stroke-dasharray="0 9999"/>
        <g id="s3-ln2" opacity="0"><rect x="120" y="338" width="340" height="44" rx="10" fill="#161a24" stroke="#aab3c2" class="bx"/><text x="290" y="368" text-anchor="middle" fill="#f0f4ff" font-size="24">LayerNorm</text></g>
        <line id="s3-l4" opacity="0" x1="290" y1="338" x2="290" y2="324" stroke="#aab3c2" stroke-width="3" marker-end="url(#s3-arr)" stroke-dasharray="0 9999"/>
        <g id="s3-mlp" opacity="0"><rect x="120" y="266" width="340" height="56" rx="10" fill="#163526" stroke="#3dba7a" class="bx"/><text x="290" y="302" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="700">MLP</text></g>
        <line id="s3-l5" opacity="0" x1="290" y1="266" x2="290" y2="246" stroke="#aab3c2" stroke-width="3" marker-end="url(#s3-arr)" stroke-dasharray="0 9999"/>
        <path id="s3-r2" d="M 120 360 H 100 V 228 H 268" fill="none" stroke="#ff7a2f" stroke-width="3" stroke-dasharray="0 9999"/>
        <polygon id="s3-r2-tip" points="258,220 272,228 258,236" fill="#ff7a2f" opacity="0"/>
        <text id="s3-r2-lbl" x="6" y="308" fill="#ff7d33" font-size="19" opacity="0">residual</text>
        <g id="s3-add2" opacity="0"><circle cx="290" cy="228" r="17" fill="#161a24" stroke="#ff7a2f" stroke-width="3"/><text x="290" y="237" text-anchor="middle" fill="#ff7a2f" font-size="26" font-weight="700">+</text></g>
        <line id="s3-l6" opacity="0" x1="290" y1="210" x2="290" y2="150" stroke="#aab3c2" stroke-width="3" marker-end="url(#s3-arr)" stroke-dasharray="0 9999"/>
        <g id="s3-brk" opacity="0">
          <path d="M 480 596 H 492 V 210 H 480" fill="none" stroke="#aab3c2" stroke-width="3"/>
          <text x="506" y="470" fill="#f0f4ff" font-size="28" font-weight="700">× L блоков</text>
        </g>
        <!-- Голова классификации -->
        <g id="s3-clsfly" opacity="0" data-layout-allow-overlap><rect x="40" y="60" width="32" height="32" rx="6" fill="#ff7a2f" stroke="#f0f4ff" stroke-width="2"/><text x="56" y="82" text-anchor="middle" fill="#0f1117" font-size="13" font-weight="800" data-layout-allow-overlap>CLS</text></g>
        <line id="s3-l7" opacity="0" x1="570" y1="182" x2="606" y2="182" stroke="#ff7a2f" stroke-width="3" marker-end="url(#s3-arr-o)" stroke-dasharray="0 9999"/>
        <g id="s3-head" opacity="0">
          <rect x="610" y="150" width="340" height="64" rx="12" fill="#2a2140" stroke="#b48ce6" class="bx"/>
          <text x="780" y="192" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="700">Linear W<tspan font-size="18" dy="7">cls</tspan><tspan dy="-7"> → softmax</tspan></text>
        </g>
        <line id="s3-l8" opacity="0" x1="780" y1="214" x2="780" y2="250" stroke="#aab3c2" stroke-width="3" marker-end="url(#s3-arr)" stroke-dasharray="0 9999"/>
        <g id="s3-cls" opacity="0">
          <text x="700" y="290" text-anchor="end" fill="#f0f4ff" font-size="26">кот</text>
          <rect id="s3-bar0" x="716" y="266" width="0" height="32" rx="6" fill="#ff7a2f"/>
          <text id="s3-val0" x="722" y="290" fill="#f0f4ff" font-size="24" font-weight="700" opacity="0">0.86</text>
          <text x="700" y="342" text-anchor="end" fill="#aab3c2" font-size="26">собака</text>
          <rect id="s3-bar1" x="716" y="318" width="0" height="32" rx="6" fill="#4a9eff"/>
          <text id="s3-val1" x="722" y="342" fill="#aab3c2" font-size="24" font-weight="700" opacity="0">0.09</text>
          <text x="700" y="394" text-anchor="end" fill="#aab3c2" font-size="26">машина</text>
          <rect id="s3-bar2" x="716" y="370" width="0" height="32" rx="6" fill="#4a9eff"/>
          <text id="s3-val2" x="722" y="394" fill="#aab3c2" font-size="24" font-weight="700" opacity="0">0.05</text>
          <text x="716" y="436" fill="#aab3c2" font-size="20">ŷ (иллюстративно)</text>
        </g>
      </svg>
      <div id="s3-c1" class="card"><div class="h">Блок энкодера</div>
        <div style="font-size:28px">LayerNorm → <span class="b">Multi-Head Self-Attention</span> → <span class="o">⊕</span></div>
        <div style="font-size:28px;margin-top:6px">LayerNorm → <span class="g">MLP</span> → <span class="o">⊕</span></div>
        <div style="font-size:26px;color:#aab3c2;margin-top:8px"><span class="o">⊕</span> — residual-связь (вход блока прибавляется к выходу); L одинаковых блоков</div></div>
      <div id="s3-c2" class="card"><div class="h">Голова классификации</div>
        <div class="f">ŷ = softmax(W<sub>cls</sub> · <span class="o">z<sub>CLS</sub></span>)</div>
        <div style="font-size:26px;color:#aab3c2;margin-top:8px">z<sub>CLS</sub> — обновлённый CLS-токен после L блоков; альтернатива без CLS: mean-pooling по всем токенам</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">Энкодер: <b>L одинаковых блоков</b> — <b class="b">Multi-Head Self-Attention</b>, <b class="g">MLP</b>, <b class="o">residual</b>-связи и LayerNorm</div>
      <div id="s3-cap2" class="cap">Для классификации берём обновлённый <b class="o">CLS</b>-токен: <b>ŷ = softmax(W<sub>cls</sub> z<sub>CLS</sub>)</b></div>
      <div id="s3-cap3" class="cap key">ViT = патчи как токены + self-attention между всеми патчами; CLS собирает глобальную информацию о картинке и идёт в голову классификации</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const TOK = 32, STEP = 40, X0 = 40, IN_Y = 610, OUT_Y = 60;
    const sky = ["#5aa9ff", "#6cb4ff", "#4f9ef5", "#62adfa", "#74baff", "#5aa9ff", "#6cb4ff", "#7cc0ff"];
    const grass = ["#3dba7a", "#35a86d", "#3dba7a", "#2f9d64", "#2f9d64", "#3dba7a", "#35a86d", "#3dba7a"];
    const blob = new Set([6, 7, 10, 11]);
    const mkRow = (gid, prefix, y, outMode) => {
      const g = document.getElementById(gid);
      for (let j = 0; j <= 16; j++) {
        const x = X0 + STEP * j;
        const t = document.createElementNS(NS, "g"); t.setAttribute("id", `${prefix}${j}`); t.setAttribute("opacity", "0");
        if (outMode && j === 0) t.setAttribute("data-layout-allow-overlap", "");
        const rc = document.createElementNS(NS, "rect");
        rc.setAttribute("x", x); rc.setAttribute("y", y); rc.setAttribute("width", TOK); rc.setAttribute("height", TOK); rc.setAttribute("rx", 6);
        let fill = j === 0 ? "#ff7a2f" : (j <= 8 ? sky[j - 1] : grass[j - 9]);
        if (blob.has(j)) fill = "#ffb020";
        if (outMode && j > 0) fill = "#2a3140"; // после энкодера токены «перемешаны» — нейтральный цвет с цветной рамкой
        rc.setAttribute("fill", fill);
        if (outMode && j > 0) { rc.setAttribute("stroke", blob.has(j) ? "#ffb020" : (j <= 8 ? "#4a9eff" : "#3dba7a")); rc.setAttribute("stroke-width", "2"); }
        if (j === 0) { rc.setAttribute("stroke", "#f0f4ff"); rc.setAttribute("stroke-width", "2"); }
        t.appendChild(rc);
        const tx = document.createElementNS(NS, "text");
        tx.setAttribute("x", x + TOK / 2); tx.setAttribute("y", y + 22); tx.setAttribute("text-anchor", "middle");
        tx.setAttribute("fill", j === 0 ? "#0f1117" : (outMode ? "#aab3c2" : "#0f1117")); tx.setAttribute("font-size", j === 0 ? "13" : "16"); tx.setAttribute("font-weight", "800");
        tx.textContent = j === 0 ? "CLS" : String(j); if (outMode && j === 0) tx.setAttribute("data-layout-allow-overlap", ""); t.appendChild(tx);
        g.appendChild(t);
      }
    };
    mkRow("s3-in", "s3-i", IN_Y, false);
    mkRow("s3-outrow", "s3-o", OUT_Y, true);
    const plen = id => document.getElementById(id).getTotalLength().toFixed(1);
    const grow = (id, t, d = 0.35) => {
      if (document.getElementById(id.slice(1)).hasAttribute("marker-end")) tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t);
      tl.fromTo(id, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": plen(id.slice(1)) + " 9999" }, duration: d, ease: "power2.inOut", immediateRender: false }, t);
    };
    const show = (id, t, d = 0.4) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    for (let j = 0; j <= 16; j++) tl.fromTo(`#s3-i${j}`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.3 + 0.03 * j);
    show("#s3-in-lbl", 0.6);
    cap("#s3-cap1", 0.6, 5.4);
    // Блок строится снизу вверх.
    grow("#s3-l0", 0.9); show("#s3-ln1", 1.0);
    grow("#s3-l1", 1.3); show("#s3-mhsa", 1.4);
    grow("#s3-r1", 1.7, 0.7); show("#s3-r1-tip", 2.3, 0.2); show("#s3-r1-lbl", 2.0);
    grow("#s3-l2", 2.2); show("#s3-add1", 2.3);
    grow("#s3-l3", 2.6); show("#s3-ln2", 2.7);
    grow("#s3-l4", 3.0); show("#s3-mlp", 3.1);
    grow("#s3-r2", 3.3, 0.7); show("#s3-r2-tip", 3.9, 0.2); show("#s3-r2-lbl", 3.6);
    grow("#s3-l5", 3.8); show("#s3-add2", 3.9);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.6);
    tl.fromTo("#s3-brk", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 4.1);
    grow("#s3-l6", 4.3, 0.5);
    for (let j = 0; j <= 16; j++) tl.fromTo(`#s3-o${j}`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 4.7 + 0.03 * j);
    show("#s3-out-lbl", 5.0);
    // CLS вытягиваем вправо → Linear → softmax → вероятности классов.
    cap("#s3-cap2", 5.6, 9.6);
    tl.fromTo("#s3-clsfly", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 5.8);
    tl.to("#s3-clsfly", { y: -46, duration: 0.35, ease: "power2.out" }, 6.05);
    tl.to("#s3-clsfly", { x: 490, duration: 0.8, ease: "power2.inOut" }, 6.4);
    tl.to("#s3-clsfly", { y: 106, duration: 0.4, ease: "power2.inOut" }, 7.15);
    grow("#s3-l7", 7.55, 0.3);
    tl.fromTo("#s3-head", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 7.65);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.9);
    grow("#s3-l8", 8.2, 0.3);
    show("#s3-cls", 8.4);
    [[0, 0.86], [1, 0.09], [2, 0.05]].forEach(([k, p], i) => {
      tl.fromTo(`#s3-bar${k}`, { attr: { width: 0 } }, { attr: { width: 200 * p }, duration: 0.8, ease: "power2.out" }, 8.6 + 0.2 * i);
      tl.fromTo(`#s3-val${k}`, { opacity: 0, x: 0 }, { opacity: 1, x: 200 * p, duration: 0.8, ease: "power2.out" }, 8.6 + 0.2 * i);
    });
    cap("#s3-cap3", 9.9, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.45 }, 13.55);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
