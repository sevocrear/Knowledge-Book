<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 10px; width: 700px; }
  #s3-c2 { left: 1060px; top: 240px; width: 700px; }
  #s3-c3 { left: 1060px; top: 470px; width: 700px; }
  .card .n { font-size: 28px; color: #aab3c2; margin-top: 8px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Как BPE кодирует новое слово?</div></div>
    <div class="badge">Knowledge Book · Tokenization</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <text id="s3-l0" x="0" y="26" fill="#aab3c2" font-size="24" opacity="0">новое слово, которого в корпусе не было: <tspan fill="#f0f4ff" font-weight="700">«lowest»</tspan> → базовые символы</text>
        <g id="s3-rows"></g>
        <g id="s3-res" opacity="0">
          <text x="330" y="450" fill="#3dba7a" font-size="30" font-weight="700">→ [low, est]: 2 токена вместо 6</text>
        </g>
        <!-- компромисс: размер словаря -->
        <g id="s3-trade" opacity="0">
          <text x="0" y="508" fill="#aab3c2" font-size="24">размер словаря |V| (иллюстративно)</text>
          <text x="0" y="566" fill="#e6ebf5" font-size="24">|V| мал</text>
          <line x1="110" y1="558" x2="470" y2="558" stroke="#2a3140" stroke-width="8" stroke-linecap="round"/>
          <circle id="s3-knob" cx="130" cy="558" r="13" fill="#ff7a2f"/>
          <text x="488" y="566" fill="#e6ebf5" font-size="24">|V| велик</text>
          <text x="640" y="524" fill="#aab3c2" font-size="22">n (длина) → attention O(n²)</text>
          <rect x="640" y="532" width="320" height="24" rx="6" fill="#161a24" stroke="#2a3140" stroke-width="2"/>
          <rect id="s3-barn" x="640" y="532" width="320" height="24" rx="6" fill="#4a9eff"/>
          <text x="640" y="596" fill="#aab3c2" font-size="22">V·d — матрица E (память)</text>
          <rect x="640" y="604" width="320" height="24" rx="6" fill="#161a24" stroke="#2a3140" stroke-width="2"/>
          <rect id="s3-barv" x="640" y="604" width="90" height="24" rx="6" fill="#b48ce6"/>
          <text x="0" y="644" fill="#aab3c2" font-size="22">BPE: min средней длины разметки при заданном |V|</text>
        </g>
      </svg>
      <div id="s3-c1" class="card"><div class="h">Кодирование</div><div class="f">«lowest» → [<span class="o">low</span>, <span class="o">est</span>]</div><div class="n">merges применяются в порядке обучения; новое слово = конкатенация токенов, OOV нет</div></div>
      <div id="s3-c2" class="card"><div class="h">Компромисс</div><div class="f">|V| мал → <span class="b">n ↑</span>, attention <span class="b">O(n²)</span></div><div class="f">|V| велик → <span class="p">E ∈ ℝ<sup style="font-size:22px">V×d</sup> ↑</span></div></div>
      <div id="s3-c3" class="card"><div class="h">Byte-level BPE</div><div class="f">базовые токены — <span class="t">байты 0–255</span></div><div class="n">любой Unicode без OOV: GPT-2, RoBERTa; токенизатор модели менять нельзя</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">Слова «lowest» в корпусе не было: применяем выученные merges <b>в том же порядке</b> → [<b class="o">low</b>, <b class="o">est</b>]: 6 символов, 2 токена</div>
      <div id="s3-cap2" class="cap">Компромисс: маленький словарь → длинные последовательности и дорогой attention <b class="b">O(n²)</b>; большой — растёт матрица <b class="p">E (V×d)</b></div>
      <div id="s3-cap3" class="cap key">BPE — обученное сжатие текста: частое — одним токеном, редкое — по кусочкам. Byte-level BPE (байты 0–255) обходится без OOV</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; };
    const SW = 50, X0 = 330, CH = 48;
    const gr = document.getElementById("s3-rows");
    // Строка трассы: подпись слева + сегментация справа. Слитые токены — оранжевые.
    const rowY = [40, 130, 208, 286, 364];
    const trace = [
      ["", ["l", "o", "w", "e", "s", "t"], []],
      ["merge 1: e + s → es", ["l", "o", "w", "es", "t"], ["es"]],
      ["merge 2: es + t → est", ["l", "o", "w", "est"], ["est"]],
      ["merge 3: l + o → lo", ["lo", "w", "est"], ["lo"]],
      ["merge 4: lo + w → low", ["low", "est"], ["low"]],
    ];
    const rows = trace.map(([lbl, segs, fresh], r) => {
      const g = mk("g", { id: `s3-r${r}`, opacity: 0 }, gr);
      const y = rowY[r];
      if (lbl) { const t = mk("text", { x: 0, y: y + 33, fill: "#aab3c2", "font-size": 24 }, g); t.textContent = lbl; }
      if (r > 0) mk("line", { x1: X0 + 150, y1: y - 26, x2: X0 + 150, y2: y - 8, stroke: "#2a3140", "stroke-width": 3 }, g);
      let slot = 0;
      segs.forEach((s, i) => {
        const merged = s.length > 1, hot = fresh.includes(s);
        const x = X0 + slot * SW, w = s.length * SW - 6;
        mk("rect", { x, y, width: w, height: CH, rx: 10, fill: merged ? "#3a2414" : "#1e3a5f", stroke: hot ? "#ff7a2f" : (merged ? "#8a4a22" : "#4a9eff"), "stroke-width": hot ? 3 : 2 }, g);
        const t = mk("text", { x: x + w / 2, y: y + 33, "text-anchor": "middle", fill: "#f0f4ff", "font-size": 28, "font-weight": 700 }, g);
        t.textContent = s;
        slot += s.length;
      });
      return g;
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-l0", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    tl.fromTo(rows[0], { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, 0.4);
    cap("#s3-cap1", 0.6, 5.4);
    [1, 2, 3, 4].forEach(k => tl.fromTo(rows[k], { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.2 + 0.8 * (k - 1)));
    tl.fromTo("#s3-res", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.5);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.7);
    cap("#s3-cap2", 5.6, 9.6);
    tl.fromTo("#s3-trade", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 5.8);
    // Словарь растёт: ползунок вправо, n падает, V·d растёт (иллюстративно, без чисел).
    tl.to("#s3-knob", { attr: { cx: 450 }, duration: 2.0, ease: "power2.inOut" }, 6.6);
    tl.to("#s3-barn", { attr: { width: 110 }, duration: 2.0, ease: "power2.inOut" }, 6.6);
    tl.to("#s3-barv", { attr: { width: 320 }, duration: 2.0, ease: "power2.inOut" }, 6.6);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.8);
    cap("#s3-cap3", 9.8, 0);
    tl.fromTo("#s3-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 10.2);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 13.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
