<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 10px; width: 700px; }
  #s1-c2 { left: 1060px; top: 226px; width: 700px; }
  #s1-c3 { left: 1060px; top: 442px; width: 700px; }
  .title { font-size: 40px; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Что такое токенизатор и почему это сжатие?</div></div>
    <div class="badge">Knowledge Book · Tokenization</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <!-- исходная строка -->
        <g id="s1-src" opacity="0">
          <text x="0" y="26" fill="#aab3c2" font-size="24">текст (строка Unicode)</text>
          <rect x="0" y="40" width="420" height="56" rx="14" fill="#161a24" stroke="#2a3140" stroke-width="2"/>
          <text x="210" y="79" text-anchor="middle" fill="#f0f4ff" font-size="34" font-weight="700">«Привет, как дела?»</text>
        </g>
        <!-- три способа разрезать -->
        <text id="s1-la" x="0" y="140" fill="#aab3c2" font-size="24" opacity="0">по символам: <tspan fill="#f0f4ff" font-weight="700">17 токенов</tspan> — точно, но очень длинно</text>
        <g id="s1-ga"></g>
        <text id="s1-lb" x="0" y="250" fill="#aab3c2" font-size="24" opacity="0">по словам: <tspan fill="#f0f4ff" font-weight="700">5 токенов</tspan> — но словарь-гигант и OOV</text>
        <g id="s1-gb"></g>
        <text id="s1-oov" x="640" y="290" fill="#ff4d6d" font-size="26" font-weight="700" opacity="0">новое слово → ⟨UNK⟩</text>
        <text id="s1-lc" x="0" y="360" fill="#aab3c2" font-size="24" opacity="0">subword (BPE): <tspan fill="#4a9eff" font-weight="700">7 токенов</tspan> — частое коротко, редкое по кусочкам</text>
        <g id="s1-gc"></g>
        <!-- ID -->
        <text id="s1-ld" x="0" y="562" fill="#aab3c2" font-size="22" opacity="0">↑ ID токенов из словаря (V токенов)</text>
        <g id="s1-gd"></g>
        <!-- строка матрицы эмбеддингов -->
        <g id="s1-emb" opacity="0">
          <text x="0" y="594" fill="#aab3c2" font-size="24">ID 10342 → строка E<tspan font-size="18" dy="6">10342</tspan><tspan dy="-6"> ∈ ℝ</tspan><tspan font-size="18" dy="-10">d</tspan><tspan dy="10">, d = 4096 → Transformer</tspan></text>
          <g id="s1-cells"></g>
          <text x="0" y="654" fill="#aab3c2" font-size="22">длина последовательности n = 7 → стоимость attention O(n²)</text>
        </g>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Словарь</div><div class="f"><span class="b">V</span> токенов (например, 50k)</div><div style="font-size:28px;color:#aab3c2;margin-top:8px">каждому токену — целочисленный ID</div></div>
      <div id="s1-c2" class="card"><div class="h">Эмбеддинги</div><div class="f">E ∈ ℝ<sup style="font-size:24px"><span class="b">V</span>×d</sup>, d = 4096</div><div style="font-size:28px;color:#aab3c2;margin-top:8px">ID i → строка E<sub>i</sub> → вектор → Transformer</div></div>
      <div id="s1-c3" class="card"><div class="h">Сжатие</div><div class="f">частое → <span class="g">мало</span>, редкое → <span class="o">много</span></div><div style="font-size:28px;color:#aab3c2;margin-top:8px">короткий код частым паттернам</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Токенизатор режет строку на токены. По символам — <b>17 ID</b> за короткую фразу; по словам — словарь из миллионов словоформ и <b class="r">OOV</b></div>
      <div id="s1-cap2" class="cap"><b class="b">Subword</b>-токенизатор — компромисс: частые куски — один токен, редкие слова — по кусочкам. Здесь <b>7 токенов</b> вместо 17</div>
      <div id="s1-cap3" class="cap">Каждый ID — строка матрицы <b>E ∈ ℝ<sup>V×d</sup></b>; число токенов <b>n</b> задаёт стоимость attention <b class="o">O(n²)</b>. Токенизация = сжатие текста</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); parent.appendChild(el); return el; };
    // Чип токена: скруглённый прямоугольник + подпись. Ширина — по числу символов.
    const chip = (parent, id, x, y, label, w, fill, stroke, color, fs) => {
      const g = mk("g", { id, opacity: 0 }, parent);
      mk("rect", { x, y, width: w, height: 48, rx: 10, fill, stroke, "stroke-width": 2 }, g);
      const t = mk("text", { x: x + w / 2, y: y + 33, "text-anchor": "middle", fill: color, "font-size": fs, "font-weight": 700 }, g);
      t.textContent = label;
      return g;
    };
    // Пример из README («Что такое токенизатор»): «Привет, как дела?» → 7 сабвордов → ID.
    const chars = ["П","р","и","в","е","т",",","␣","к","а","к","␣","д","е","л","а","?"];
    const words = ["Привет", ",", "как", "дела", "?"];
    const subs  = ["Пр", "ивет", ",", "Ġкак", "Ġдел", "а", "?"];
    const ids   = ["10342", "9121", "11", "845", "12987", "42", "30"];
    const ga = document.getElementById("s1-ga"), gb = document.getElementById("s1-gb"), gc = document.getElementById("s1-gc"), gd = document.getElementById("s1-gd");
    const A = chars.map((c, i) => chip(ga, `s1-a${i}`, i * 54, 152, c, 48, "#161a24", "#2a3140", "#e6ebf5", 26));
    let x = 0; const B = words.map((w, i) => { const wd = Math.max(48, 24 * w.length + 28); const g = chip(gb, `s1-b${i}`, x, 262, w, wd, "#161a24", "#2a3140", "#e6ebf5", 26); x += wd + 10; return g; });
    x = 0; const cx = []; const C = subs.map((s, i) => { const wd = Math.max(56, 30 * s.length + 36); const g = chip(gc, `s1-s${i}`, x, 372, s, wd, "#1e3a5f", "#4a9eff", "#f0f4ff", 26); cx.push(x + wd / 2); x += wd + 10; return g; });
    const D = ids.map((id, i) => { const wd = 15 * id.length + 22; const g = chip(gd, `s1-d${i}`, Math.max(0, cx[i] - wd / 2), 484, id, wd, "#161a24", "#2a3140", "#f0f4ff", 22); return g; });
    const arrows = ids.map((_, i) => { const l = mk("line", { x1: cx[i], y1: 424, x2: cx[i], y2: 480, stroke: "#4a9eff", "stroke-width": 3, "stroke-dasharray": "0 9999" }, gd); return l; });
    // Вектор эмбеддинга (иллюстративный градиент, значения константы)
    const cells = document.getElementById("s1-cells");
    const vals = [0.9, 0.35, 0.6, 0.15, 0.8, 0.45, 0.25, 0.7, 0.5, 0.1, 0.65, 0.3, 0.85, 0.4, 0.2, 0.55];
    const CE = vals.map((v, i) => { const r = Math.round(30 + v * 44), gg = Math.round(40 + v * 118), b = Math.round(60 + v * 195); return mk("rect", { x: i * 34, y: 604, width: 28, height: 28, rx: 5, fill: `rgb(${r},${gg},${b})`, opacity: 0 }, cells); });
    const dots = mk("text", { x: 16 * 34 + 4, y: 627, fill: "#aab3c2", "font-size": 26 }, cells); dots.textContent = "… ×4096";

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-src", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
    cap("#s1-cap1", 0.6, 4.7);
    tl.fromTo("#s1-la", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.0);
    tl.fromTo(A, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.05 }, 1.1);
    tl.fromTo("#s1-lb", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.6);
    tl.fromTo(B, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08 }, 2.7);
    tl.fromTo("#s1-oov", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.4);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.6);
    cap("#s1-cap2", 4.9, 8.7);
    tl.fromTo("#s1-lc", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.0);
    tl.fromTo(C, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08 }, 5.1);
    tl.fromTo("#s1-ld", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.6);
    tl.fromTo(arrows, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "56 9999" }, duration: 0.4, stagger: 0.06 }, 6.7);
    tl.fromTo(D, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.06 }, 6.9);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.6);
    cap("#s1-cap3", 8.9, 12.5);
    tl.fromTo("#s1-emb", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.0);
    tl.fromTo(CE, { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.04 }, 9.2);
    tl.fromTo("#s1-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 10.0);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 12.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
