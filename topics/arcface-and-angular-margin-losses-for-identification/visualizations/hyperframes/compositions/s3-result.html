<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-cmp { left: 1060px; top: 20px; width: 700px; font-size: 30px; }
  #s3-cmp .row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #2a3140; }
  #s3-cmp .row:last-child { border-bottom: 0; }
  #s3-cmp .nm { color: #f0f4ff; font-weight: 600; }
  #s3-cmp .fm { font-style: italic; font-size: 32px; }
  #s3-cmp .tp { font-size: 22px; color: #aab3c2; }
  #s3-state { position: absolute; left: 1060px; top: 420px; width: 700px; font-size: 34px; font-weight: 700; color: #f0f4ff; opacity: 0; }
  #s3-state .st { display: inline-block; min-width: 200px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Как выглядят эмбеддинги после ArcFace?</div></div>
    <div class="badge">Knowledge Book · ArcFace</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <circle cx="430" cy="340" r="290" fill="none" stroke="#1e3a5f" stroke-width="6"/>
        <g id="s3-protos" opacity="0.9">
          <line x1="430" y1="340" x2="710.1" y2="264.9" stroke="#3dba7a" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
          <line x1="430" y1="340" x2="243.6" y2="117.9" stroke="#b48ce6" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
          <line x1="430" y1="340" x2="330.8" y2="612.5" stroke="#ff7a2f" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
          <text x="726" y="262" fill="#3dba7a" font-size="30" font-weight="700">W₁</text>
          <text x="196" y="96" fill="#b48ce6" font-size="30" font-weight="700">W₂</text>
          <text x="300" y="650" fill="#ff7a2f" font-size="30" font-weight="700">W₃</text>
        </g>
        <g id="s3-gaps" opacity="0">
          <path id="s3-gap1" d="" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linecap="round"/>
          <path id="s3-gap2" d="" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linecap="round"/>
          <path id="s3-gap3" d="" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linecap="round"/>
          <text x="507" y="112" text-anchor="middle" fill="#ff4d6d" font-size="26" font-weight="700">зазор ≥ m</text>
        </g>
        <g id="s3-pts"></g>
      </svg>
      <div id="s3-cmp" class="card"><div class="h">Три способа добавить margin</div>
        <div class="row"><span class="nm">SphereFace</span><span class="fm">cos(<span class="o">m</span>·θ)</span><span class="tp">multiplicative angular</span></div>
        <div class="row"><span class="nm">CosFace</span><span class="fm">cos θ <span class="o">− m</span></span><span class="tp">additive cosine</span></div>
        <div class="row"><span class="nm" style="color:#4a9eff">ArcFace</span><span class="fm">cos(θ <span class="o">+ m</span>)</span><span class="tp">additive angular</span></div>
      </div>
      <div id="s3-state"><span class="st" id="s3-before">до обучения: классы перемешаны</span></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap"><b>До</b>: эмбеддинги трёх классов (<b class="g">●</b> <b class="p">●</b> <b class="o">●</b>) разбросаны по сфере и перекрываются у границ</div>
      <div id="s3-cap2" class="cap"><b>После ArcFace</b>: внутри класса — компактно, между классами — угловой запас <b class="r">≥&nbsp;m</b></div>
      <div id="s3-cap3" class="cap key">ArcFace = softmax на сфере + угловой зазор m для своего класса. Де-факто стандарт face recognition и сильная база для re-ID и SKU-retrieval</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const cx = 430, cy = 340, R = 290;
    const pt = (r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy - r * Math.sin(deg * Math.PI / 180)];
    const arc = (r, a0, a1) => { const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1); const sweep = a1 > a0 ? 0 : 1; return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 ${sweep} ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
    // Точки: [класс, угол "до", угол "после"] — детерминированные, без Math.random.
    const protos = { 0: 15, 1: 130, 2: 250 };
    const colors = { 0: "#3dba7a", 1: "#b48ce6", 2: "#ff7a2f" };
    const offsBefore = [-46, -31, -18, -7, 4, 13, 24, 37, 49];
    const offsAfter  = [-9, -6.5, -4, -1.5, 0.5, 2.5, 4.5, 6.5, 9];
    const g = document.getElementById("s3-pts");
    const ids = [];
    [0, 1, 2].forEach(c => offsBefore.forEach((o, i) => {
      const [x, y] = pt(R, protos[c] + o);
      const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      el.setAttribute("id", `s3-p${c}-${i}`); el.setAttribute("cx", x.toFixed(1)); el.setAttribute("cy", y.toFixed(1));
      el.setAttribute("r", "11"); el.setAttribute("fill", colors[c]); el.setAttribute("opacity", "0");
      g.appendChild(el); ids.push([el, c, i]);
    }));
    // Зазоры между кластерами после сходимости (между 24° и 121°, 139° и 241°, 259° и 6°).
    document.getElementById("s3-gap1").setAttribute("d", arc(R + 22, 26, 119));
    document.getElementById("s3-gap2").setAttribute("d", arc(R + 22, 141, 239));
    document.getElementById("s3-gap3").setAttribute("d", arc(R + 22, 261, 364));

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    ids.forEach(([el, c, i]) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4 + 0.04 * (c * 9 + i)));
    tl.fromTo("#s3-state", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
    cap("#s3-cap1", 0.6, 4.4);
    // Обучение: точки стягиваются к прототипам.
    ids.forEach(([el, c, i]) => {
      const [x1, y1] = pt(R, protos[c] + offsAfter[i]);
      tl.to(el, { attr: { cx: x1.toFixed(1), cy: y1.toFixed(1) }, duration: 2.2, ease: "power2.inOut" }, 4.6);
    });
    tl.to("#s3-before", { opacity: 0, duration: 0.3 }, 4.6);
    tl.fromTo("#s3-gaps", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 6.6);
    cap("#s3-cap2", 4.8, 8.6);
    tl.fromTo("#s3-cmp", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.0);
    cap("#s3-cap3", 8.9, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 12.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
