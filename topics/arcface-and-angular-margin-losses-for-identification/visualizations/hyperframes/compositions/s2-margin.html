<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 10px; width: 700px; }
  #s2-bars { position: absolute; left: 1060px; top: 330px; width: 700px; height: 330px; opacity: 0; }
  .bar { position: absolute; bottom: 84px; width: 150px; border-radius: 12px 12px 4px 4px; }
  .bar-lbl { position: absolute; bottom: 6px; width: 210px; font-size: 24px; color: #aab3c2; text-align: center; line-height: 1.2; }
  .bar-val { position: absolute; width: 150px; font-size: 32px; font-weight: 700; text-align: center; color: #f0f4ff; }
  .bar-val:not(.bar-txt)::before { counter-reset: n var(--n); content: "0." counter(n); }
  @property --n { syntax: "<integer>"; inherits: true; initial-value: 0; }
  #s2-bars .axis { position: absolute; left: 0; right: 0; bottom: 82px; height: 2px; background: #2a3140; }
  #s2-bars .ttl { position: absolute; left: 0; top: 0; font-size: 26px; color: #aab3c2; letter-spacing: 0.06em; text-transform: uppercase; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Что делает угловой margin m?</div></div>
    <div class="badge">Knowledge Book · ArcFace</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <circle cx="430" cy="340" r="290" fill="none" stroke="#1e3a5f" stroke-width="6"/>
        <g><line x1="430" y1="340" x2="243.6" y2="117.9" stroke="#b48ce6" stroke-width="9" stroke-linecap="round"/><circle cx="243.6" cy="117.9" r="12" fill="#b48ce6"/><text x="196" y="96" fill="#b48ce6" font-size="34" font-weight="700">W₂</text></g>
        <g><line x1="430" y1="340" x2="710.1" y2="264.9" stroke="#3dba7a" stroke-width="9" stroke-linecap="round"/><circle cx="710.1" cy="264.9" r="12" fill="#3dba7a"/><text x="726" y="262" fill="#3dba7a" font-size="34" font-weight="700">W<tspan font-size="24">y</tspan></text><text x="726" y="300" fill="#3dba7a" font-size="24">истинный класс</text></g>
        <path id="s2-arc-th" d="" fill="none" stroke="#4a9eff" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <path id="s2-arc-m" d="" fill="none" stroke="#ff7a2f" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <text id="s2-lbl-th" x="586" y="292" fill="#4a9eff" font-size="32" font-weight="700" opacity="0">θ<tspan font-size="22">y</tspan></text>
        <text id="s2-lbl-m" x="556" y="170" text-anchor="middle" fill="#ff7a2f" font-size="32" font-weight="700" opacity="0">+ m</text>
        <g id="s2-ghost" opacity="0"><line x1="430" y1="340" x2="535.8" y2="70.0" stroke="#ff7a2f" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/><text x="548" y="62" fill="#ff7a2f" font-size="26">θ<tspan font-size="18">y</tspan> + m</text></g>
        <g id="s2-z"><line x1="430" y1="340" x2="652.2" y2="153.6" stroke="#4a9eff" stroke-width="10" stroke-linecap="round"/><circle cx="652.2" cy="153.6" r="13" fill="#4a9eff"/><text x="664" y="140" fill="#4a9eff" font-size="34" font-weight="700">z</text></g>
        <text id="s2-note" x="430" y="655" text-anchor="middle" fill="#aab3c2" font-size="26" opacity="0">в статье ArcFace: s = 64, m = 0.5 рад ≈ 28.6°</text>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Логиты ArcFace</div>
        <div class="f">logit<sub>y</sub> = s · cos(<span class="b">θ<sub>y</sub></span> <span class="o">+ m</span>)</div>
        <div class="f" style="margin-top:6px">logit<sub>j≠y</sub> = s · cos θ<sub>j</sub></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">s — масштаб логитов, m — угловой зазор только для своего класса</div></div>
      <div id="s2-bars">
        <div class="ttl">косинус для истинного класса</div>
        <div class="axis"></div>
        <div id="s2-bar1" class="bar" style="left:40px;height:0px;background:#4a9eff"></div>
        <div id="s2-val1" class="bar-val" style="left:40px;bottom:94px;--n:906"></div>
        <div class="bar-lbl" style="left:10px">cos θ<sub>y</sub><br/>обычный softmax</div>
        <div id="s2-bar2" class="bar" style="left:270px;height:0px;background:#ff7a2f"></div>
        <div id="s2-val2" class="bar-val" style="left:270px;bottom:94px;--n:593"></div>
        <div class="bar-lbl" style="left:240px">cos(θ<sub>y</sub> + m)<br/>ArcFace</div>
        <div id="s2-bar3" class="bar" style="left:500px;height:0px;background:#b48ce6"></div>
        <div id="s2-val3" class="bar-val bar-txt" style="left:500px;bottom:94px" data-layout-allow-overlap>0.0</div><div id="s2-val3b" class="bar-val bar-txt" style="left:500px;bottom:94px;opacity:0" data-layout-allow-overlap>&lt; 0</div>
        <div class="bar-lbl" style="left:470px">cos θ₂<br/>чужой класс</div>
      </div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Для истинного класса <b class="g">y</b> к углу <b class="b">θ<sub>y</sub></b> прибавляем зазор <b class="o">m</b>: логит считается от «худшего» угла θ<sub>y</sub> + m</div>
      <div id="s2-cap2" class="cap">cos(θ<sub>y</sub> + m) <b>меньше</b>, чем cos θ<sub>y</sub> — правильный класс намеренно «занижен» в softmax</div>
      <div id="s2-cap3" class="cap">Чтобы всё равно выиграть, эмбеддинг должен <b class="b">довернуться к W<sub>y</sub></b> сильнее, чем требует обычный softmax</div>
      <div id="s2-cap4" class="cap">Так классы получают запас <b class="o">≥ m</b> по углу: это и есть additive angular margin</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const cx = 430, cy = 340;
    const pt = (r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy - r * Math.sin(deg * Math.PI / 180)];
    const arc = (r, a0, a1) => { const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1); const sweep = a1 > a0 ? 0 : 1; return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 ${sweep} ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
    const len = (r, a0, a1) => (r * Math.abs(a1 - a0) * Math.PI / 180).toFixed(1);
    const M = 28.65; // m = 0.5 рад
    // Дуга θ_y растёт от W_y (15°) к z (40°); дуга m растёт дальше от z до z+m.
    document.getElementById("s2-arc-th").setAttribute("d", arc(150, 15, 40));
    document.getElementById("s2-arc-m").setAttribute("d", arc(190, 40, 40 + M));
    const H = 150; // px на cos = 1

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-arc-th", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": len(150, 15, 40) + " 9999" }, duration: 0.8, ease: "power2.inOut" }, 0.5);
    tl.fromTo("#s2-lbl-th", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.1);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);
    cap("#s2-cap1", 0.6, 4.6);
    tl.fromTo("#s2-arc-m", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": len(190, 40, 40 + M) + " 9999" }, duration: 0.9, ease: "power2.inOut" }, 1.8);
    tl.fromTo("#s2-lbl-m", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.4);
    tl.fromTo("#s2-ghost", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.6);
    tl.fromTo("#s2-note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.0);
    // Столбики: cos25° = 0.906, cos(25°+28.65°) = 0.593, cos90° = 0 (z ⟂ W₂)
    tl.fromTo("#s2-bars", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 4.7);
    tl.fromTo("#s2-bar1", { height: 0 }, { height: 0.906 * H, duration: 0.8, ease: "power2.out" }, 5.0);
    tl.fromTo("#s2-val1", { y: 0 }, { y: -0.906 * H, duration: 0.8, ease: "power2.out" }, 5.0);
    tl.fromTo("#s2-bar2", { height: 0 }, { height: 0.593 * H, duration: 0.8, ease: "power2.out" }, 5.4);
    tl.fromTo("#s2-val2", { y: 0 }, { y: -0.593 * H, duration: 0.8, ease: "power2.out" }, 5.4);
    tl.fromTo("#s2-bar3", { height: 0 }, { height: 6, duration: 0.6, ease: "power2.out" }, 5.8);
    tl.fromTo("#s2-val3", { y: 0 }, { y: -6, duration: 0.6, ease: "power2.out" }, 5.8);
    tl.fromTo("#s2-val3b", { y: 0 }, { y: -6, duration: 0.6, ease: "power2.out" }, 5.8);
    cap("#s2-cap2", 4.8, 8.8);
    // z доворачивается к W_y: θ_y 25° → 7°; дуги укорачиваются, столбики растут: cos7°=0.993, cos35.65°=0.813
    cap("#s2-cap3", 9.0, 12.4);
    tl.fromTo("#s2-z", { rotation: 0, svgOrigin: "430 340" }, { rotation: 18, svgOrigin: "430 340", duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.fromTo("#s2-ghost", { rotation: 0, svgOrigin: "430 340" }, { rotation: 18, svgOrigin: "430 340", duration: 2.0, ease: "power2.inOut", immediateRender: false }, 9.4);
    tl.to("#s2-arc-m", { rotation: 18, svgOrigin: "430 340", duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s2-lbl-m", { rotation: 18, svgOrigin: "430 340", duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s2-arc-th", { attr: { "stroke-dasharray": len(150, 15, 22) + " 9999" }, duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s2-bar1", { height: 0.993 * H, duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s2-val1", { y: -0.993 * H, "--n": 993, snap: "--n", duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s2-bar2", { height: 0.813 * H, duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s2-val2", { y: -0.813 * H, "--n": 813, snap: "--n", duration: 2.0, ease: "power2.inOut" }, 9.4);
    // z ушёл от W₂: угол 90° → 108°, cos становится отрицательным
    tl.to("#s2-val3", { opacity: 0, duration: 0.4 }, 10.4);
    tl.to("#s2-val3b", { opacity: 1, duration: 0.4 }, 10.4);
    cap("#s2-cap4", 12.6, 15.5);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 15.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
