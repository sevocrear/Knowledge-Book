<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 40px; width: 700px; }
  #s1-c2 { left: 1060px; top: 320px; width: 700px; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Какую разделяющую прямую выбрать?</div></div>
    <div class="badge">Knowledge Book · SVM</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <defs>
          <clipPath id="s1-clip"><rect x="70" y="40" width="860" height="560"/></clipPath>
          <marker id="s1-ah" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#f0f4ff"/></marker>
        </defs>
        <g id="s1-ax" opacity="0">
          <line x1="70" y1="600" x2="930" y2="600" stroke="#2a3140" stroke-width="3"/>
          <line x1="70" y1="40" x2="70" y2="600" stroke="#2a3140" stroke-width="3"/>
          <text x="938" y="609" fill="#aab3c2" font-size="26">x₁</text>
          <text x="40" y="60" fill="#aab3c2" font-size="26">x₂</text>
        </g>
        <!-- Всё, что привязано к разделяющей прямой, лежит в группе, повёрнутой на 45°: в её координатах прямая вертикальна (x = 500). -->
        <g clip-path="url(#s1-clip)" data-layout-allow-overflow>
          <g transform="rotate(45 500 320)">
            <rect id="s1-band" x="410" y="-80" width="180" height="800" fill="#f0f4ff" opacity="0"/>
            <g id="s1-cands">
              <line id="s1-cand1" x1="500" y1="-80" x2="500" y2="720" stroke="#aab3c2" stroke-width="4" stroke-dasharray="0 9999" transform="rotate(12 500 320)"/>
              <line id="s1-cand2" x1="500" y1="-80" x2="500" y2="720" stroke="#aab3c2" stroke-width="4" stroke-dasharray="0 9999" transform="rotate(-18 500 320)"/>
              <line id="s1-cand3" x1="455" y1="-80" x2="455" y2="720" stroke="#aab3c2" stroke-width="4" stroke-dasharray="0 9999"/>
              <line id="s1-cand4" x1="548" y1="-80" x2="548" y2="720" stroke="#aab3c2" stroke-width="4" stroke-dasharray="0 9999"/>
            </g>
            <line id="s1-m1" x1="410" y1="-80" x2="410" y2="720" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999"/>
            <line id="s1-m2" x1="590" y1="-80" x2="590" y2="720" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999"/>
            <line id="s1-bd" x1="500" y1="-80" x2="500" y2="720" stroke="#f0f4ff" stroke-width="6" stroke-dasharray="0 9999"/>
            <line id="s1-arr" x1="410" y1="50" x2="590" y2="50" stroke="#f0f4ff" stroke-width="4" stroke-dasharray="0 9999" opacity="0" marker-start="url(#s1-ah)" marker-end="url(#s1-ah)"/>
            <g id="s1-pts"></g>
            <g id="s1-rings"></g>
          </g>
        </g>
        <g id="s1-cls" opacity="0">
          <text x="112" y="92" fill="#4a9eff" font-size="28" font-weight="700">y = −1</text>
          <text x="812" y="572" fill="#ff7a2f" font-size="28" font-weight="700">y = +1</text>
        </g>
        <text id="s1-arr-lbl" x="790" y="202" fill="#f0f4ff" font-size="30" font-weight="700" opacity="0">2/‖w‖</text>
        <text id="s1-sv-lbl" x="500" y="646" text-anchor="middle" fill="#2dd4bf" font-size="26" opacity="0">◯ опорные векторы — точки на границе полосы, αᵢ &gt; 0</text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Гиперплоскость</div><div class="f">w<sup>ᵀ</sup>x + b = 0</div><div style="font-size:28px;color:#aab3c2;margin-top:8px">ответ: ŷ = sign(w<sup>ᵀ</sup>x + b), метки y<sub>i</sub> ∈ {−1, +1}</div></div>
      <div id="s1-c2" class="card"><div class="h">Максимальный запас</div><div class="f">min <span class="t">½‖w‖²</span></div><div class="f" style="margin-top:4px">при y<sub>i</sub>(w<sup>ᵀ</sup>x<sub>i</sub> + b) ≥ 1</div><div style="font-size:28px;color:#aab3c2;margin-top:8px">границы полосы w<sup>ᵀ</sup>x + b = ±1, ширина полосы 2/‖w‖</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Два класса (<b class="b">y = −1</b>, <b class="o">y = +1</b>) разделимы: подходят многие прямые. Какую выбрать?</div>
      <div id="s1-cap2" class="cap">SVM берёт гиперплоскость <b>w<sup>ᵀ</sup>x + b = 0</b> с <b class="t">максимальным запасом</b> (margin) до ближайших точек обоих классов</div>
      <div id="s1-cap3" class="cap">Границы полосы w<sup>ᵀ</sup>x + b = ±1, ширина <b>2/‖w‖</b> → задача <b>min ½‖w‖²</b>. Точки на границе — <b class="t">опорные векторы</b>: только они задают решение</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Координаты точек: (s, t) — s вдоль нормали к прямой, t вдоль прямой. В повёрнутой группе: x = 500 + s, y = 320 − t.
    const blue = [[-90, -60], [-90, 120], [-140, -180], [-160, 40], [-200, 160], [-210, -80], [-250, 60], [-270, -160], [-230, -250], [-300, -20]];
    const orange = [[90, 30], [90, -140], [150, 130], [170, -40], [210, 220], [230, 40], [250, -100], [280, 160], [300, 260], [320, 60]];
    const NS = "http://www.w3.org/2000/svg";
    const gp = document.getElementById("s1-pts"), gr = document.getElementById("s1-rings");
    const pts = [], rings = [];
    const add = (arr, color, tag) => arr.forEach(([s, t], i) => {
      const el = document.createElementNS(NS, "circle");
      el.setAttribute("id", `s1-p${tag}-${i}`); el.setAttribute("cx", 500 + s); el.setAttribute("cy", 320 - t);
      el.setAttribute("r", "11"); el.setAttribute("fill", color); el.setAttribute("opacity", "0");
      gp.appendChild(el); pts.push(el);
      if (Math.abs(s) === 90) { // опорные векторы лежат ровно на границе полосы
        const rg = document.createElementNS(NS, "circle");
        rg.setAttribute("id", `s1-r${tag}-${i}`); rg.setAttribute("cx", 500 + s); rg.setAttribute("cy", 320 - t);
        rg.setAttribute("r", "20"); rg.setAttribute("fill", "none"); rg.setAttribute("stroke", "#2dd4bf"); rg.setAttribute("stroke-width", "4");
        rg.setAttribute("stroke-dasharray", "0 9999"); gr.appendChild(rg); rings.push(rg);
      }
    });
    add(blue, "#4a9eff", "b"); add(orange, "#ff7a2f", "o");

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const draw = (id, len, t, d) => tl.fromTo(id, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": len + " 9999" }, duration: d, ease: "power2.inOut" }, t);
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-ax", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.2);
    pts.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.4 + 0.05 * i));
    tl.fromTo("#s1-cls", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.4);
    cap("#s1-cap1", 0.6, 4.2);
    ["#s1-cand1", "#s1-cand2", "#s1-cand3", "#s1-cand4"].forEach((id, i) => draw(id, 800, 1.8 + 0.45 * i, 0.7));
    // Выбор: кандидаты гаснут, остаётся прямая с максимальным запасом
    tl.to("#s1-cands", { opacity: 0.22, duration: 0.6 }, 4.4);
    draw("#s1-bd", 800, 4.5, 0.9);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.8);
    cap("#s1-cap2", 4.4, 8.6);
    tl.fromTo("#s1-band", { opacity: 0 }, { opacity: 0.07, duration: 0.8 }, 5.6);
    draw("#s1-m1", 800, 5.6, 0.8); draw("#s1-m2", 800, 5.8, 0.8);
    tl.fromTo("#s1-arr", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.8);
    draw("#s1-arr", 180, 6.8, 0.6);
    tl.fromTo("#s1-arr-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.2);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.3);
    rings.forEach((el, i) => draw(el, 126, 8.9 + 0.2 * i, 0.5));
    tl.fromTo("#s1-sv-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.5);
    cap("#s1-cap3", 8.8, 12.5);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 12.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
