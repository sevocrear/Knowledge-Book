<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1 { left: 1060px; top: 20px; width: 700px; }
  #s2-c2 { left: 1060px; top: 340px; width: 700px; }
  #s2-c2 .row { padding: 8px 0; font-size: 30px; line-height: 1.3; opacity: 0.45; }
  #s2-c2 .row b { font-size: 32px; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Что делать, если данные не разделимы?</div></div>
    <div class="badge">Knowledge Book · SVM</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <defs><clipPath id="s2-clip"><rect x="70" y="40" width="860" height="560"/></clipPath></defs>
        <g id="s2-ax">
          <line x1="70" y1="600" x2="930" y2="600" stroke="#2a3140" stroke-width="3"/>
          <line x1="70" y1="40" x2="70" y2="600" stroke="#2a3140" stroke-width="3"/>
          <text x="938" y="609" fill="#aab3c2" font-size="26">x₁</text>
          <text x="40" y="60" fill="#aab3c2" font-size="26">x₂</text>
        </g>
        <g clip-path="url(#s2-clip)" data-layout-allow-overflow>
          <g transform="rotate(45 500 320)">
            <rect id="s2-band" x="410" y="-80" width="180" height="800" fill="#f0f4ff" opacity="0.07"/>
            <line id="s2-m1" x1="410" y1="-80" x2="410" y2="720" stroke="#aab3c2" stroke-width="3"/>
            <line id="s2-m2" x1="590" y1="-80" x2="590" y2="720" stroke="#aab3c2" stroke-width="3"/>
            <line id="s2-bd" x1="500" y1="-80" x2="500" y2="720" stroke="#f0f4ff" stroke-width="6" stroke-linecap="round"/>
            <!-- slack-отрезки: от точки до «своей» границы полосы вдоль нормали; длина = ξ (в пикселях, иллюстративно) -->
            <line id="s2-x1" x1="535" y1="350" x2="835" y2="350" stroke="#ff4d6d" stroke-width="5" stroke-dasharray="0 9999"/>
            <line id="s2-x2" x1="440" y1="120" x2="740" y2="120" stroke="#ff4d6d" stroke-width="5" stroke-dasharray="0 9999"/>
            <line id="s2-x3" x1="460" y1="520" x2="160" y2="520" stroke="#ff4d6d" stroke-width="5" stroke-dasharray="0 9999"/>
            <line id="s2-x4" x1="410" y1="380" x2="210" y2="380" stroke="#ff4d6d" stroke-width="5" stroke-dasharray="0 9999"/>
            <line id="s2-x5" x1="410" y1="200" x2="210" y2="200" stroke="#ff4d6d" stroke-width="5" stroke-dasharray="0 9999"/>
            <line id="s2-x6" x1="590" y1="290" x2="790" y2="290" stroke="#ff4d6d" stroke-width="5" stroke-dasharray="0 9999"/>
            <line id="s2-x7" x1="590" y1="460" x2="790" y2="460" stroke="#ff4d6d" stroke-width="5" stroke-dasharray="0 9999"/>
            <g id="s2-pts"></g>
            <g id="s2-out"></g>
          </g>
        </g>
        <g id="s2-cls">
          <text x="112" y="92" fill="#4a9eff" font-size="28" font-weight="700">y = −1</text>
          <text x="812" y="572" fill="#ff7a2f" font-size="28" font-weight="700">y = +1</text>
        </g>
        <g id="s2-xl" opacity="0">
          <text id="s2-xl1" fill="#ff4d6d" font-size="28" font-weight="700">ξ₁</text>
          <text id="s2-xl2" fill="#ff4d6d" font-size="28" font-weight="700">ξ₂</text>
          <text id="s2-xl3" fill="#ff4d6d" font-size="28" font-weight="700">ξ₃</text>
        </g>
        <text id="s2-note" x="500" y="646" text-anchor="middle" fill="#aab3c2" font-size="26" opacity="0">ширина полосы и длины ξᵢ при разных C — иллюстративно</text>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Soft margin</div>
        <div class="f">y<sub>i</sub>(w<sup>ᵀ</sup>x<sub>i</sub> + b) ≥ 1 − <span class="r">ξ<sub>i</sub></span>,&nbsp; ξ<sub>i</sub> ≥ 0</div>
        <div class="f" style="margin-top:6px">min ½‖w‖² + <span class="o">C</span> Σ <span class="r">ξ<sub>i</sub></span></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">ξ<sub>i</sub> — насколько точка нарушает запас; в двойственной задаче 0 ≤ α<sub>i</sub> ≤ C</div></div>
      <div id="s2-c2" class="card"><div class="h">Компромисс C</div>
        <div id="s2-rowA" class="row"><b class="o">C большой</b> — узкий запас, мало нарушений, риск переобучения</div>
        <div id="s2-rowB" class="row"><b class="g">C маленький</b> — шире запас, больше ошибок на train, часто лучше обобщение</div></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Реальные данные: выбросы попадают в полосу или на чужую сторону — условие <b>y<sub>i</sub>(w<sup>ᵀ</sup>x<sub>i</sub> + b) ≥ 1</b> выполнить нельзя</div>
      <div id="s2-cap2" class="cap">Вводим slack <b class="r">ξ<sub>i</sub> ≥ 0</b>: ограничение ослабляется до y<sub>i</sub>(w<sup>ᵀ</sup>x<sub>i</sub> + b) ≥ 1 − ξ<sub>i</sub>, а сумма нарушений штрафуется с весом <b class="o">C</b></div>
      <div id="s2-cap3" class="cap"><b class="o">Большой C</b> — узкий запас, мало нарушений, риск переобучения; <b class="g">маленький C</b> — шире запас, больше ошибок на train, часто лучше обобщение</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const blue = [[-90, -60], [-90, 120], [-140, -180], [-160, 40], [-200, 160], [-210, -80], [-250, 60], [-270, -160], [-230, -250], [-300, -20]];
    const orange = [[90, 30], [90, -140], [150, 130], [170, -40], [210, 220], [230, 40], [250, -100], [280, 160], [300, 260], [320, 60]];
    // Выбросы: внутри полосы (ξ < 1) и на чужой стороне (ξ > 1). Экранные координаты: scr(s, t).
    const outs = [[35, -30, "#ff7a2f"], [-60, 200, "#ff7a2f"], [-40, -200, "#4a9eff"]];
    const scr = (s, t) => [500 + 0.7071 * (s + t), 320 + 0.7071 * (s - t)];
    const NS = "http://www.w3.org/2000/svg";
    const gp = document.getElementById("s2-pts"), go = document.getElementById("s2-out");
    const mk = (id, s, t, color, r) => { const el = document.createElementNS(NS, "circle"); el.setAttribute("id", id); el.setAttribute("cx", 500 + s); el.setAttribute("cy", 320 - t); el.setAttribute("r", r); el.setAttribute("fill", color); return el; };
    blue.forEach(([s, t], i) => gp.appendChild(mk(`s2-pb-${i}`, s, t, "#4a9eff", 11)));
    orange.forEach(([s, t], i) => gp.appendChild(mk(`s2-po-${i}`, s, t, "#ff7a2f", 11)));
    const outEls = outs.map(([s, t, c], i) => {
      const g = document.createElementNS(NS, "g"); g.setAttribute("id", `s2-og-${i}`); g.setAttribute("opacity", "0");
      const ring = mk(`s2-or-${i}`, s, t, "none", 19); ring.setAttribute("stroke", "#ff4d6d"); ring.setAttribute("stroke-width", "4");
      g.appendChild(mk(`s2-oc-${i}`, s, t, c, 11)); g.appendChild(ring); go.appendChild(g); return g;
    });
    // Подписи ξ — в экранных координатах рядом с серединой отрезка
    const lbl = [[62, -30, -34, 52], [15, 200, 14, -14], [-65, -200, -60, 26]];
    lbl.forEach(([s, t, dx, dy], i) => { const [x, y] = scr(s, t); const el = document.getElementById(`s2-xl${i + 1}`); el.setAttribute("x", (x + dx).toFixed(1)); el.setAttribute("y", (y + dy).toFixed(1)); });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const dash = (id, len, t, d) => tl.to(id, { attr: { "stroke-dasharray": len + " 9999" }, duration: d, ease: "power2.inOut" }, t);
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    outEls.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8 + 0.3 * i));
    cap("#s2-cap1", 0.6, 4.4);
    // Slack: M = 90 → ξ₁ = 55, ξ₂ = 150, ξ₃ = 50
    dash("#s2-x1", 55, 2.0, 0.6); dash("#s2-x2", 150, 2.3, 0.7); dash("#s2-x3", 50, 2.6, 0.6);
    tl.fromTo("#s2-xl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.0);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.8);
    cap("#s2-cap2", 4.6, 8.8);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 8.6);
    tl.fromTo("#s2-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.2);
    cap("#s2-cap3", 9.0, 13.5);
    // Большой C: полоса сужается до M = 45, нарушения уменьшаются
    tl.to("#s2-rowA", { opacity: 1, duration: 0.4 }, 9.4);
    tl.to("#s2-band", { attr: { x: 455, width: 90 }, duration: 1.2, ease: "power2.inOut" }, 9.4);
    tl.to("#s2-m1", { x: 45, duration: 1.2, ease: "power2.inOut" }, 9.4);
    tl.to("#s2-m2", { x: -45, duration: 1.2, ease: "power2.inOut" }, 9.4);
    dash("#s2-x1", 10, 9.4, 1.2); dash("#s2-x2", 105, 9.4, 1.2); dash("#s2-x3", 5, 9.4, 1.2);
    // Маленький C: полоса расширяется до M = 150, внутрь попадают и бывшие опорные точки
    tl.to("#s2-rowA", { opacity: 0.45, duration: 0.4 }, 11.6);
    tl.to("#s2-rowB", { opacity: 1, duration: 0.4 }, 11.6);
    tl.to("#s2-band", { attr: { x: 350, width: 300 }, duration: 1.2, ease: "power2.inOut" }, 11.6);
    tl.to("#s2-m1", { x: -60, duration: 1.2, ease: "power2.inOut" }, 11.6);
    tl.to("#s2-m2", { x: 60, duration: 1.2, ease: "power2.inOut" }, 11.6);
    dash("#s2-x1", 115, 11.6, 1.2); dash("#s2-x2", 210, 11.6, 1.2); dash("#s2-x3", 110, 11.6, 1.2);
    ["#s2-x4", "#s2-x5", "#s2-x6", "#s2-x7"].forEach(id => dash(id, 60, 11.6, 1.2));
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
