<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-f { left: 1060px; top: 0px; width: 700px; }
  #s3-m1, #s3-m2, #s3-m3 { left: 1060px; top: 330px; width: 700px; }
  #s3-ml { left: 1060px; top: 0px; width: 700px; }
  .s3-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-size: 28px; }
  .s3-frac span:first-child { border-bottom: 2px solid #e6ebf5; padding: 0 6px 2px; }
  .s3-frac span:last-child { padding: 2px 6px 0; }
  .s3-mat { display: inline-grid; grid-template-columns: auto auto; column-gap: 22px; row-gap: 2px; padding: 4px 14px; margin: 0 6px; vertical-align: middle;
    border-left: 3px solid #e6ebf5; border-right: 3px solid #e6ebf5; border-radius: 10px; font-size: 32px; line-height: 1.15; text-align: center; }
  .s3-sig { font-size: 34px; }
  .s3-sub { font-size: 27px; color: #aab3c2; margin-top: 10px; line-height: 1.35; }
  #s3-ml .rw { padding: 8px 0; border-bottom: 1px solid #2a3140; font-size: 28px; line-height: 1.3; opacity: 0.35; }
  #s3-ml .rw:last-child { border-bottom: 0; }
  #s3-ml .rw b { color: #f0f4ff; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Как выглядит гауссиана в d измерениях?</div></div>
    <div class="badge">Knowledge Book · Гауссиана</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <line id="s3-ax" x1="60" y1="340" x2="800" y2="340" stroke="#2a3140" stroke-width="4" stroke-dasharray="0 9999"/>
        <line id="s3-ay" x1="430" y1="640" x2="430" y2="40" stroke="#2a3140" stroke-width="4" stroke-dasharray="0 9999"/>
        <g id="s3-axl" opacity="0" fill="#f0f4ff" font-size="28">
          <text x="812" y="350">x₁</text><text x="444" y="44">x₂</text>
          <text x="436" y="366" fill="#ff7a2f" font-size="26" font-weight="700">μ</text>
          <text x="60" y="648" fill="#aab3c2" font-size="24">эллипсы: (x − μ)ᵀΣ⁻¹(x − μ) = const; точки — иллюстративно</text>
        </g>
        <g id="s3-ell">
          <circle id="s3-e2" cx="430" cy="340" r="180" fill="none" stroke="#4a9eff" stroke-width="3" stroke-dasharray="0 9999" opacity="0.6"/>
          <circle id="s3-e1" cx="430" cy="340" r="90" fill="none" stroke="#4a9eff" stroke-width="5" stroke-dasharray="0 9999"/>
          <g id="s3-pts"></g>
          <circle cx="430" cy="340" r="7" fill="#ff7a2f"/>
        </g>
        <g id="s3-el" opacity="0" fill="#4a9eff" font-size="26" font-weight="700"><text x="500" y="418">1σ</text><text x="563" y="481">2σ</text></g>
      </svg>
      <div id="s3-f" class="card" data-layout-allow-overlap><div class="h">Многомерная гауссиана <span style="text-transform:none">N(μ, Σ)</span></div>
        <div class="f" style="font-size:32px">p(x) = <span class="s3-frac"><span>1</span><span>(2π)<sup>d/2</sup> |Σ|<sup>1/2</sup></span></span> · exp(−½ (x − μ)<sup>T</sup> Σ<sup>−1</sup> (x − μ))</div>
        <div class="s3-sub">μ — вектор средних, Σ — ковариационная матрица (симметричная, положительно определённая)</div></div>
      <div id="s3-m1" class="card" data-layout-allow-overlap><div class="h"><span style="text-transform:none">Σ = σ²I</span> — изотропная</div>
        <div class="s3-sig">Σ = <span class="s3-mat"><span>1</span><span>0</span><span>0</span><span>1</span></span> = I</div>
        <div class="s3-sub">одинаковый разброс во всех направлениях → окружности; стандартная N(0, I)</div></div>
      <div id="s3-m2" class="card" data-layout-allow-overlap><div class="h">Σ диагональная</div>
        <div class="s3-sig">Σ = <span class="s3-mat"><span>4</span><span>0</span><span>0</span><span>1</span></span></div>
        <div class="s3-sub">дисперсии по осям Σ₁₁ = 4, Σ₂₂ = 1 → σ₁ = 2, σ₂ = 1: растяжение вдоль x₁ в 2 раза, поворота нет</div></div>
      <div id="s3-m3" class="card" data-layout-allow-overlap><div class="h">Σ с ковариацией</div>
        <div class="s3-sig">Σ = <span class="s3-mat"><span>1</span><span>0.5</span><span>0.5</span><span>1</span></span></div>
        <div class="s3-sub">Cov(X₁, X₂) = 0.5 → собственные числа λ = 1.5 и 0.5, полуоси √λ ≈ 1.22 и 0.71, поворот на 45°</div></div>
      <div id="s3-ml" class="card" data-layout-allow-overlap><div class="h">Почему гауссиана везде в ML</div>
        <div id="s3-w1" class="rw"><b class="o">ЦПТ</b>: сумма многих независимых величин → нормальное распределение</div>
        <div id="s3-w2" class="rw"><b class="b">Diffusion</b>: q(x<sub>t</sub> | x<sub>t−1</sub>) = N(x<sub>t</sub>; √(1 − β<sub>t</sub>) x<sub>t−1</sub>, β<sub>t</sub>I), старт x<sub>T</sub> ~ N(0, I)</div>
        <div id="s3-w3" class="rw"><b class="p">VAE</b>: latent space моделируется как N(0, I)</div>
        <div id="s3-w4" class="rw"><b class="g">L2-регуляризация</b> = априор весов w ~ N(0, λ<sup>−1</sup>I)</div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">В d измерениях линии равной плотности — <b>эллипсы</b> (x − μ)<sup>T</sup>Σ<sup>−1</sup>(x − μ) = const; при <b class="b">Σ = I</b> это окружности</div>
      <div id="s3-cap2" class="cap"><b>Диагональная Σ</b> = diag(4, 1): дисперсии по осям 4 и 1 → эллипс растянут вдоль x₁ в √4 = 2 раза, без поворота</div>
      <div id="s3-cap3" class="cap"><b>Ковариация 0.5</b>: Σ = [[1, 0.5], [0.5, 1]] → оси эллипса √1.5 и √0.5 повёрнуты на 45°: Σ = масштаб + поворот</div>
      <div id="s3-cap4" class="cap key">Гауссиана = сдвиг μ + масштаб/поворот Σ. Из-за ЦПТ она возникает везде, а суммы и линейные преобразования остаются гауссовыми — основа diffusion, VAE и регуляризации</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const CX = 430, CY = 340, UNIT = 90;
    // Детерминированная выборка из N(0, I) (фиксированная таблица, |z| < 2.3); те же точки преобразуются вместе с эллипсами
    const Z = [[-0.26,0.51],[-0.23,-0.32],[-0.93,-0.21],[1.11,0.42],[1.04,0.25],[0.39,0.19],[-1.67,0.86],[0.51,0.5],[-1.69,-1.74],[-0.89,-0.47],[0.31,-0.05],[0.52,-0.64],[0.31,0.39],[-0.66,1.72],[0.56,1.2],[-0.62,-0.74],[-0.34,-0.11],[0.63,0.25],[-0.45,-0.96],[-0.52,1.22],[-0.81,0.24],[0.43,-1.49],[0.05,1.31],[-2.01,-0.32],[-0.11,-0.82],[0.5,-0.06],[-1.46,0.83],[0.67,0.95],[1.44,0.36],[0.12,-1.3],[0.62,-0.61],[-0.45,-1.26],[-0.97,-0.53],[1.29,-2.03]];
    const g = document.getElementById("s3-pts"), pts = [];
    Z.forEach(([a, b], i) => {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      el.setAttribute("id", `s3-p${i}`); el.setAttribute("cx", (CX + UNIT * a).toFixed(1)); el.setAttribute("cy", (CY - UNIT * b).toFixed(1));
      el.setAttribute("r", "7"); el.setAttribute("fill", "#2dd4bf"); el.setAttribute("opacity", "0"); g.appendChild(el); pts.push(el);
    });
    // Σ = [[1, .5], [.5, 1]]: λ₁ = 1.5 (вдоль (1,1)), λ₂ = 0.5 (вдоль (1,−1)); полуоси √λ, поворот 45° против часовой (экранный rotation −45)
    const S1 = Math.sqrt(1.5), S2 = Math.sqrt(0.5);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-ax", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "740 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.2);
    tl.fromTo("#s3-ay", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "600 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#s3-axl", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.7);
    tl.fromTo("#s3-e1", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "565.5 9999" }, duration: 0.9, ease: "power2.inOut" }, 0.5);
    tl.fromTo("#s3-e2", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "1131 9999" }, duration: 1.1, ease: "power2.inOut" }, 0.7);
    pts.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 0.85, duration: 0.3 }, 0.9 + 0.03 * i));
    tl.fromTo("#s3-el", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.6);
    tl.fromTo("#s3-f", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);
    tl.fromTo("#s3-m1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.4);
    cap("#s3-cap1", 0.6, 4.0);
    // Диагональная Σ = diag(4, 1): растяжение по x₁ в σ₁ = 2 раза
    cap("#s3-cap2", 4.2, 7.4);
    tl.to("#s3-el", { opacity: 0, duration: 0.3 }, 4.2);
    tl.to("#s3-m1", { opacity: 0, duration: 0.4 }, 4.2);
    tl.fromTo("#s3-m2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.5);
    tl.fromTo("#s3-ell", { scaleX: 1, scaleY: 1, rotation: 0, svgOrigin: "430 340" }, { scaleX: 2, scaleY: 1, rotation: 0, svgOrigin: "430 340", duration: 1.4, ease: "power2.inOut" }, 4.4);
    // Σ = [[1, .5], [.5, 1]]: масштаб √λ по собственным осям + поворот 45°
    cap("#s3-cap3", 7.6, 10.6);
    tl.to("#s3-m2", { opacity: 0, duration: 0.4 }, 7.6);
    tl.fromTo("#s3-m3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 7.9);
    tl.to("#s3-ell", { scaleX: S1, scaleY: S2, rotation: -45, svgOrigin: "430 340", duration: 1.6, ease: "power2.inOut" }, 7.8);
    // Где гауссиана в ML (по README): ЦПТ, diffusion forward, VAE latent, L2 как гауссов априор
    tl.to("#s3-f", { opacity: 0, duration: 0.4 }, 10.8);
    tl.to("#s3-m3", { opacity: 0, duration: 0.4 }, 10.8);
    tl.fromTo("#s3-ml", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 11.1);
    ["#s3-w1", "#s3-w2", "#s3-w3", "#s3-w4"].forEach((id, i) => tl.to(id, { opacity: 1, duration: 0.4 }, 11.4 + 0.6 * i));
    cap("#s3-cap4", 10.9, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.45 }, 14.5);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
