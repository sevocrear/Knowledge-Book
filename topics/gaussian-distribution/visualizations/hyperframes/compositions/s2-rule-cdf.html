<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-c1, #s2-c2 { left: 1060px; top: 0px; width: 700px; }
  #s2-c1 .rw { display: flex; justify-content: space-between; padding: 6px 0; font-size: 32px; opacity: 0.45; }
  #s2-c1 .rw b { color: #4a9eff; font-weight: 700; }
  .s2-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-size: 28px; }
  .s2-frac span:first-child { border-bottom: 2px solid #e6ebf5; padding: 0 6px 2px; }
  .s2-frac span:last-child { padding: 2px 6px 0; }
  #s2-cdf { position: absolute; left: 1060px; top: 310px; width: 700px; height: 290px; display: block; opacity: 0; }
  #s2-phi { position: absolute; left: 1060px; top: 604px; width: 700px; height: 56px; font-size: 36px; font-weight: 700; color: #3dba7a; text-align: center; line-height: 56px; opacity: 0; }
  #s2-phi .n::before { counter-reset: n var(--n); content: "0." counter(n, s2-pad3); }
  @property --n { syntax: "<integer>"; inherits: true; initial-value: 1; }
  @counter-style s2-pad3 { system: extends decimal; pad: 3 "0"; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Сколько данных лежит в μ ± kσ?</div></div>
    <div class="badge">Knowledge Book · Гауссиана</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <defs>
          <clipPath id="s2-clipA"><rect id="s2-rectA" x="490" y="0" width="0" height="660"/></clipPath>
          <clipPath id="s2-clipC"><rect id="s2-rectC" x="60" y="0" width="0" height="660"/></clipPath>
        </defs>
        <line id="s2-ax" x1="60" y1="560" x2="920" y2="560" stroke="#2a3140" stroke-width="4" stroke-dasharray="0 9999"/>
        <g id="s2-tk1" opacity="0" fill="#aab3c2" font-size="24" text-anchor="middle">
          <text x="167.5" y="598">μ−3σ</text><text x="275" y="598">μ−2σ</text><text x="382.5" y="598">μ−σ</text>
          <text x="490" y="598" fill="#ff7a2f" font-size="28" font-weight="700">μ</text>
          <text x="597.5" y="598">μ+σ</text><text x="705" y="598">μ+2σ</text><text x="812.5" y="598">μ+3σ</text>
        </g>
        <g id="s2-tk2" opacity="0" fill="#aab3c2" font-size="24" text-anchor="middle">
          <text x="167.5" y="598">−3</text><text x="275" y="598">−2</text><text x="382.5" y="598">−1</text>
          <text x="490" y="598" fill="#f0f4ff" font-size="28" font-weight="700">0</text>
          <text x="597.5" y="598">1</text><text x="705" y="598">2</text><text x="812.5" y="598">3</text>
          <text x="950" y="568" text-anchor="start" font-size="28" fill="#f0f4ff">z</text>
        </g>
        <g id="s2-tkl" fill="#2a3140">
          <rect x="166" y="552" width="3" height="16"/><rect x="273.5" y="552" width="3" height="16"/><rect x="381" y="552" width="3" height="16"/>
          <rect x="488.5" y="552" width="3" height="16"/><rect x="596" y="552" width="3" height="16"/><rect x="703.5" y="552" width="3" height="16"/><rect x="811" y="552" width="3" height="16"/>
        </g>
        <path id="s2-areaA" d="" fill="#4a9eff" opacity="0.45" clip-path="url(#s2-clipA)"/>
        <path id="s2-areaC" d="" fill="#3dba7a" opacity="0.5" clip-path="url(#s2-clipC)"/>
        <path id="s2-pdf" d="" fill="none" stroke="#4a9eff" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <text id="s2-p68" x="490" y="470" text-anchor="middle" fill="#f0f4ff" font-size="44" font-weight="800" opacity="0">68 %</text>
        <text id="s2-p95" x="490" y="470" text-anchor="middle" fill="#f0f4ff" font-size="44" font-weight="800" opacity="0">95 %</text>
        <text id="s2-p997" x="490" y="470" text-anchor="middle" fill="#f0f4ff" font-size="44" font-weight="800" opacity="0">99.7 %</text>
        <g id="s2-zmark" opacity="0">
          <line x1="490" y1="560" x2="490" y2="150" stroke="#3dba7a" stroke-width="5" stroke-dasharray="12 8"/>
          <text x="490" y="128" text-anchor="middle" fill="#3dba7a" font-size="34" font-weight="700">z</text>
        </g>
        <text id="s2-note" x="60" y="60" text-anchor="start" fill="#aab3c2" font-size="26" opacity="0">Φ(z) = площадь под p(z) слева от z</text>
      </svg>
      <div id="s2-c1" class="card" data-layout-allow-overlap><div class="h">Правило 68–95–99.7</div>
        <div id="s2-r1" class="rw"><span>[μ − σ, μ + σ]</span><b>68 % данных</b></div>
        <div id="s2-r2" class="rw"><span>[μ − 2σ, μ + 2σ]</span><b>95 % данных</b></div>
        <div id="s2-r3" class="rw"><span>[μ − 3σ, μ + 3σ]</span><b>99.7 % данных</b></div></div>
      <div id="s2-c2" class="card" data-layout-allow-overlap><div class="h">Стандартизация и CDF</div>
        <div class="f">z = <span class="s2-frac"><span>x − μ</span><span>σ</span></span> ~ N(0, 1)</div>
        <div class="f" style="margin-top:6px">p(z) = <span class="s2-frac"><span>1</span><span>√(2π)</span></span> · exp(−z²/2)</div>
        <div class="f" style="margin-top:6px"><span class="g">Φ(z)</span> = P(Z ≤ z) = ∫<sub>−∞</sub><sup>z</sup> p(t) dt</div></div>
      <svg id="s2-cdf" viewBox="0 0 700 290">
        <line x1="60" y1="250" x2="680" y2="250" stroke="#2a3140" stroke-width="3"/>
        <line x1="60" y1="250" x2="60" y2="20" stroke="#2a3140" stroke-width="3"/>
        <line x1="60" y1="30" x2="680" y2="30" stroke="#2a3140" stroke-width="2" stroke-dasharray="8 8"/>
        <text x="48" y="258" text-anchor="end" fill="#aab3c2" font-size="22">0</text>
        <text x="48" y="38" text-anchor="end" fill="#aab3c2" font-size="22">1</text>
        <text x="370" y="282" text-anchor="middle" fill="#aab3c2" font-size="22">0</text>
        <text x="137.5" y="282" text-anchor="middle" fill="#aab3c2" font-size="22">−3</text>
        <text x="602.5" y="282" text-anchor="middle" fill="#aab3c2" font-size="22">3</text>
        <text x="684" y="258" text-anchor="start" fill="#f0f4ff" font-size="24">z</text>
        <text x="72" y="22" text-anchor="start" fill="#3dba7a" font-size="26" font-weight="700">Φ(z)</text>
        <path id="s2-cdfp" d="" fill="none" stroke="#3dba7a" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <circle id="s2-dot" cx="137.5" cy="249.7" r="10" fill="#3dba7a" opacity="0"/>
      </svg>
      <div id="s2-phi">Φ(z) = <span class="n" style="--n:1"></span></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Правило 68–95–99.7: в <b>μ ± σ</b> лежит <b class="b">68 %</b> данных, в <b>μ ± 2σ</b> — <b class="b">95 %</b>, в <b>μ ± 3σ</b> — <b class="b">99.7 %</b></div>
      <div id="s2-cap2" class="cap">Стандартизация <b>z = (x − μ)/σ</b> переводит любую N(μ, σ²) в <b>N(0, 1)</b>: одна таблица значений Φ на все гауссианы</div>
      <div id="s2-cap3" class="cap">CDF <b class="g">Φ(z) = P(Z ≤ z)</b> — площадь под кривой слева от z: растёт от 0 до 1, Φ(0) = 0.5 по симметрии</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const U = 860 / 8, X0 = 490, YB = 560, H = 800; // z ∈ [−4, 4] → px
    const phi = (x) => Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI);
    // Φ(z) через erf (Abramowitz–Stegun 7.1.26, ошибка < 1.5e-7) — детерминированно, без сети
    const erf = (x) => { const s = x < 0 ? -1 : 1; x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
      const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; };
    const Phi = (z) => 0.5 * (1 + erf(z / Math.SQRT2));
    let d = "", area = "", len = 0, px = 0, py = 0;
    for (let i = 0; i <= 160; i++) {
      const z = -4 + i * 0.05, X = X0 + U * z, Y = YB - H * phi(z);
      d += (i ? " L " : "M ") + X.toFixed(1) + " " + Y.toFixed(1);
      area += (i ? " L " : "M 60 560 L ") + X.toFixed(1) + " " + Y.toFixed(1);
      if (i) len += Math.hypot(X - px, Y - py);
      px = X; py = Y;
    }
    area += " L 920 560 Z";
    document.getElementById("s2-pdf").setAttribute("d", d);
    document.getElementById("s2-areaA").setAttribute("d", area);
    document.getElementById("s2-areaC").setAttribute("d", area);
    // Мини-график CDF: z ∈ [−4, 4] → x 60..680, Φ ∈ [0, 1] → y 250..30
    const cx = (z) => 370 + 77.5 * z, cy = (z) => 250 - 220 * Phi(z);
    let dc = "", lc = 0; px = 0; py = 0;
    for (let i = 0; i <= 80; i++) { const z = -4 + i * 0.1, X = cx(z), Y = cy(z);
      dc += (i ? " L " : "M ") + X.toFixed(1) + " " + Y.toFixed(1); if (i) lc += Math.hypot(X - px, Y - py); px = X; py = Y; }
    document.getElementById("s2-cdfp").setAttribute("d", dc);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-ax", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "860 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.2);
    tl.fromTo("#s2-tk1", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);
    tl.fromTo("#s2-pdf", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": len.toFixed(1) + " 9999" }, duration: 1.2, ease: "power2.inOut" }, 0.5);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);
    cap("#s2-cap1", 0.6, 5.6);
    // Заливка μ ± kσ: прямоугольник клипа растёт симметрично от μ
    const fill = (k, t) => tl.to("#s2-rectA", { attr: { x: X0 - k * U, width: 2 * k * U }, duration: 0.8, ease: "power2.inOut" }, t);
    tl.fromTo("#s2-rectA", { attr: { x: X0, width: 0 } }, { attr: { x: X0 - U, width: 2 * U }, duration: 0.8, ease: "power2.inOut" }, 1.6);
    tl.to("#s2-r1", { opacity: 1, duration: 0.4 }, 1.8);
    tl.fromTo("#s2-p68", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.2);
    fill(2, 3.0); tl.to("#s2-r2", { opacity: 1, duration: 0.4 }, 3.2);
    tl.to("#s2-p68", { opacity: 0, duration: 0.3 }, 3.4); tl.fromTo("#s2-p95", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.6);
    fill(3, 4.4); tl.to("#s2-r3", { opacity: 1, duration: 0.4 }, 4.6);
    tl.to("#s2-p95", { opacity: 0, duration: 0.3 }, 4.8); tl.fromTo("#s2-p997", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.0);
    // Стандартизация: подписи оси μ ± kσ → z, карточка правила → карточка z-score/CDF
    cap("#s2-cap2", 5.8, 8.6);
    tl.to("#s2-p997", { opacity: 0, duration: 0.3 }, 5.8);
    tl.to("#s2-rectA", { attr: { x: X0, width: 0 }, duration: 0.7, ease: "power2.inOut" }, 5.9);
    tl.to("#s2-c1", { opacity: 0, duration: 0.4 }, 5.9);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.2);
    tl.to("#s2-tk1", { opacity: 0, duration: 0.4 }, 6.6);
    tl.fromTo("#s2-tk2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.9);
    // CDF: зелёная площадь слева от z, точка бежит по Φ(z), счётчик Φ
    tl.fromTo("#s2-cdf", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 8.8);
    tl.fromTo("#s2-cdfp", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": lc.toFixed(1) + " 9999" }, duration: 0.9, ease: "power2.inOut" }, 8.9);
    cap("#s2-cap3", 8.9, 13.5);
    tl.fromTo("#s2-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.2);
    tl.fromTo("#s2-zmark", { opacity: 0, x: -3 * U }, { opacity: 1, x: -3 * U, duration: 0.4 }, 9.4);
    tl.fromTo("#s2-dot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.4);
    tl.fromTo("#s2-phi", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.4);
    const T0 = 9.8, DUR = 3.2, N = 24;
    tl.to("#s2-zmark", { x: 3 * U, duration: DUR, ease: "none" }, T0);
    tl.fromTo("#s2-rectC", { attr: { width: U } }, { attr: { width: 7 * U }, duration: DUR, ease: "none" }, T0);
    for (let i = 0; i < N; i++) { // кусочно-линейно по z: Φ нелинейна, MotionPath не используем
      const z1 = -3 + 6 * (i + 1) / N;
      tl.to("#s2-dot", { attr: { cx: cx(z1).toFixed(1), cy: cy(z1).toFixed(1) }, duration: DUR / N, ease: "none" }, T0 + i * DUR / N);
      tl.to("#s2-phi .n", { "--n": Math.round(1000 * Phi(z1)), snap: "--n", duration: DUR / N, ease: "none" }, T0 + i * DUR / N);
    }
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
