<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 0px; width: 700px; }
  #s1-c2 { left: 1060px; top: 330px; width: 700px; }
  .s1-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-size: 30px; }
  .s1-frac span:first-child { border-bottom: 2px solid #e6ebf5; padding: 0 6px 2px; }
  .s1-frac span:last-child { padding: 2px 6px 0; }
  .s1-row { position: relative; height: 52px; font-size: 34px; line-height: 52px; }
  .s1-row .k { position: absolute; left: 0; color: #aab3c2; }
  .s1-row .v { position: absolute; left: 190px; font-weight: 700; color: #f0f4ff; opacity: 0; }
  .s1-row .v.on { opacity: 1; }
  .s1-row .pk::before { counter-reset: n var(--n); content: "0." counter(n); }
  @property --n { syntax: "<integer>"; inherits: true; initial-value: 399; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Что задают μ и σ в гауссиане?</div></div>
    <div class="badge">Knowledge Book · Гауссиана</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <line id="s1-ax" x1="60" y1="560" x2="920" y2="560" stroke="#2a3140" stroke-width="4" stroke-dasharray="0 9999"/>
        <line id="s1-ay" x1="60" y1="560" x2="60" y2="70" stroke="#2a3140" stroke-width="4" stroke-dasharray="0 9999"/>
        <g id="s1-ticks" opacity="0" fill="#aab3c2" font-size="24">
          <text x="60" y="598" text-anchor="middle">−6</text><text x="203.3" y="598" text-anchor="middle">−4</text>
          <text x="346.7" y="598" text-anchor="middle">−2</text><text x="490" y="598" text-anchor="middle">0</text>
          <text x="633.3" y="598" text-anchor="middle">2</text><text x="776.7" y="598" text-anchor="middle">4</text>
          <text x="920" y="598" text-anchor="middle">6</text>
          <text x="958" y="598" text-anchor="start" font-size="28" fill="#f0f4ff">x</text>
          <text x="44" y="456" text-anchor="end">0.2</text><text x="44" y="344" text-anchor="end">0.4</text>
          <text x="44" y="232" text-anchor="end">0.6</text><text x="44" y="120" text-anchor="end">0.8</text>
          <text x="80" y="60" text-anchor="start" font-size="28" fill="#f0f4ff">p(x)</text>
          <line x1="52" y1="448" x2="68" y2="448" stroke="#2a3140" stroke-width="3"/><line x1="52" y1="336" x2="68" y2="336" stroke="#2a3140" stroke-width="3"/>
          <line x1="52" y1="224" x2="68" y2="224" stroke="#2a3140" stroke-width="3"/><line x1="52" y1="112" x2="68" y2="112" stroke="#2a3140" stroke-width="3"/>
        </g>
        <path id="s1-ghost" d="" fill="none" stroke="#4a9eff" stroke-width="4" stroke-dasharray="10 10" opacity="0"/>
        <g id="s1-curve" data-layout-allow-overflow>
          <line id="s1-mu" x1="490" y1="560" x2="490" y2="336.6" stroke="#ff7a2f" stroke-width="4" stroke-dasharray="10 8" opacity="0"/>
          <path id="s1-pdf" d="" fill="none" stroke="#4a9eff" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 9999"/>
        </g>
        <text id="s1-mu-lbl" x="490" y="628" text-anchor="middle" fill="#ff7a2f" font-size="30" font-weight="700" opacity="0">μ</text>
        <g id="s1-sig" opacity="0">
          <line x1="490" y1="640" x2="561.7" y2="640" stroke="#3dba7a" stroke-width="5" stroke-linecap="round"/>
          <line x1="490" y1="630" x2="490" y2="650" stroke="#3dba7a" stroke-width="4"/><line x1="561.7" y1="630" x2="561.7" y2="650" stroke="#3dba7a" stroke-width="4"/>
        </g>
        <text id="s1-sig-lbl" x="600" y="652" text-anchor="start" fill="#3dba7a" font-size="30" font-weight="700" opacity="0">σ</text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Плотность <span style="text-transform:none">N(μ, σ²)</span></div>
        <div class="f">p(x) = <span class="s1-frac"><span>1</span><span>σ√(2π)</span></span> · exp<span style="font-size:40px">(</span>− <span class="s1-frac"><span>(x − μ)²</span><span>2σ²</span></span><span style="font-size:40px">)</span></div>
        <div style="font-size:28px;color:#aab3c2;margin-top:10px"><b class="o">μ</b> — среднее, центр «колокола» · <b class="g">σ</b> — стандартное отклонение, σ² — дисперсия</div></div>
      <div id="s1-c2" class="card"><div class="h">Параметры</div>
        <div class="s1-row"><span class="k">μ =</span>
          <span id="s1-mu0" class="v on o" data-layout-allow-overlap>0</span><span id="s1-mu1" class="v o" data-layout-allow-overlap>−2</span><span id="s1-mu2" class="v o" data-layout-allow-overlap>2</span></div>
        <div class="s1-row"><span class="k">σ =</span>
          <span id="s1-sg0" class="v on g" data-layout-allow-overlap>1</span><span id="s1-sg1" class="v g" data-layout-allow-overlap>0.5</span><span id="s1-sg2" class="v g" data-layout-allow-overlap>2</span></div>
        <div class="s1-row"><span class="k">пик p(μ) =</span><span id="s1-pk" class="v on" style="left:210px">1 / (σ√(2π)) = <span class="pk" style="--n:399"></span></span></div>
      </div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Плотность нормального распределения — «колокол»: центр в <b class="o">μ</b>, ширина задаётся <b class="g">σ</b>, максимум p(μ) = 1/(σ√(2π))</div>
      <div id="s1-cap2" class="cap"><b class="o">μ</b> — среднее: меняем μ, и колокол просто едет вдоль оси, форма не меняется (μ = 0 → −2 → 2)</div>
      <div id="s1-cap3" class="cap"><b class="g">σ</b> — разброс: маленькое σ → узкий высокий пик, большое σ → широкий низкий (σ = 1 → 0.5 → 2)</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const U = 860 / 12, X0 = 490, YB = 560, H = 560; // x ∈ [−6, 6] → px, плотность → px
    const phi = (x) => Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI);
    let d = "", len = 0, px = 0, py = 0;
    for (let i = 0; i <= 240; i++) {
      const x = -6 + i * 0.05, X = X0 + U * x, Y = YB - H * phi(x);
      d += (i ? " L " : "M ") + X.toFixed(1) + " " + Y.toFixed(1);
      if (i) len += Math.hypot(X - px, Y - py);
      px = X; py = Y;
    }
    document.getElementById("s1-pdf").setAttribute("d", d);
    document.getElementById("s1-ghost").setAttribute("d", d);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const swap = (a, b, t) => { tl.to(a, { opacity: 0, duration: 0.3 }, t); tl.to(b, { opacity: 1, duration: 0.3 }, t + 0.1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-ax", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "860 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.2);
    tl.fromTo("#s1-ay", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "490 9999" }, duration: 0.6, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#s1-ticks", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.6);
    tl.fromTo("#s1-pdf", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": len.toFixed(1) + " 9999" }, duration: 1.3, ease: "power2.inOut" }, 0.7);
    tl.fromTo("#s1-mu", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.8);
    tl.fromTo("#s1-mu-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.8);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.0);
    cap("#s1-cap1", 0.6, 4.6);
    // μ: колокол едет по оси (0 → −2 → 2 → 0), пунктирный «призрак» — исходная N(0, 1)
    tl.fromTo("#s1-ghost", { opacity: 0 }, { opacity: 0.35, duration: 0.5 }, 4.4);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.5);
    cap("#s1-cap2", 4.8, 8.6);
    tl.fromTo("#s1-curve", { x: 0 }, { x: -2 * U, duration: 1.2, ease: "power2.inOut" }, 5.0);
    tl.fromTo("#s1-mu-lbl", { x: 0 }, { x: -2 * U, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 5.0);
    swap("#s1-mu0", "#s1-mu1", 5.8);
    tl.to("#s1-curve", { x: 2 * U, duration: 1.2, ease: "power2.inOut" }, 6.6);
    tl.to("#s1-mu-lbl", { x: 2 * U, duration: 1.2, ease: "power2.inOut" }, 6.6);
    swap("#s1-mu1", "#s1-mu2", 7.4);
    tl.to("#s1-curve", { x: 0, duration: 0.8, ease: "power2.inOut" }, 8.2);
    tl.to("#s1-mu-lbl", { x: 0, duration: 0.8, ease: "power2.inOut" }, 8.2);
    swap("#s1-mu2", "#s1-mu0", 8.7);
    // σ: p(x; 0, σ) = φ(x/σ)/σ — растяжение по x в σ раз и сжатие по высоте в 1/σ (точное преобразование кривой)
    cap("#s1-cap3", 8.9, 13.5);
    tl.fromTo("#s1-sig", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.1);
    tl.fromTo("#s1-sig-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.1);
    tl.to("#s1-curve", { scaleX: 0.5, scaleY: 2, svgOrigin: "490 560", duration: 1.2, ease: "power2.inOut" }, 9.4);
    tl.fromTo("#s1-sig", { scaleX: 1, svgOrigin: "490 640" }, { scaleX: 0.5, svgOrigin: "490 640", duration: 1.2, ease: "power2.inOut", immediateRender: false }, 9.4);
    tl.to("#s1-sig-lbl", { x: -0.5 * U, duration: 1.2, ease: "power2.inOut" }, 9.4);
    swap("#s1-sg0", "#s1-sg1", 10.2);
    tl.to("#s1-pk .pk", { "--n": 798, snap: "--n", duration: 0.3 }, 10.2);
    tl.to("#s1-curve", { scaleX: 2, scaleY: 0.5, svgOrigin: "490 560", duration: 1.4, ease: "power2.inOut" }, 11.0);
    tl.to("#s1-sig", { scaleX: 2, svgOrigin: "490 640", duration: 1.4, ease: "power2.inOut" }, 11.0);
    tl.to("#s1-sig-lbl", { x: 1 * U, duration: 1.4, ease: "power2.inOut" }, 11.0);
    swap("#s1-sg1", "#s1-sg2", 12.0);
    tl.to("#s1-pk .pk", { "--n": 199, snap: "--n", duration: 0.3 }, 12.0);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
