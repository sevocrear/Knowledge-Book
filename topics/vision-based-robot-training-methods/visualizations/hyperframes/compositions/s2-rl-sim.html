<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 1760px; height: 660px; display: block; }
  .s2-card { left: 1060px; top: 10px; width: 700px; box-sizing: border-box; }
  .s2-card .row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #2a3140; font-size: 30px; }
  .s2-card .row:last-child { border-bottom: 0; }
  .s2-card .nm { color: #f0f4ff; font-weight: 600; }
  .s2-card .vl { color: #aab3c2; font-size: 26px; text-align: right; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">RL в симуляторе: что с реальностью?</div></div>
    <div class="badge">Knowledge Book · Robot learning</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 1760 660">
        <defs>
          <marker id="s2-ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#aab3c2"/></marker>
          <marker id="s2-ah-r" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#ff4d6d"/></marker>
          <marker id="s2-ah-g" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#3dba7a"/></marker>
        </defs>
        <g id="s2-b-pol" opacity="0"><rect x="90" y="20" width="320" height="110" rx="20" fill="#1e3a5f" stroke="#4a9eff" stroke-width="3"/>
          <text x="250" y="76" text-anchor="middle" fill="#f0f4ff" font-size="34" font-weight="700">Политика π</text>
          <text x="250" y="110" text-anchor="middle" fill="#aab3c2" font-size="26">агент (PPO)</text></g>
        <g id="s2-b-sim" opacity="0"><rect x="20" y="240" width="460" height="140" rx="20" fill="#161a24" stroke="#2dd4bf" stroke-width="3"/>
          <text x="250" y="304" text-anchor="middle" fill="#f0f4ff" font-size="34" font-weight="700">Симулятор</text>
          <text x="250" y="344" text-anchor="middle" fill="#aab3c2" font-size="26">Isaac Sim · MuJoCo · PyBullet</text></g>
        <path id="s2-ar-a" d="M 190 134 L 190 236" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s2-ah)" stroke-dasharray="0 9999" opacity="0"/>
        <text id="s2-ar-a-lbl" x="174" y="192" text-anchor="end" fill="#aab3c2" font-size="26" opacity="0">действие</text>
        <path id="s2-ar-b" d="M 310 236 L 310 134" fill="none" stroke="#ff7a2f" stroke-width="5" stroke-linecap="round" marker-end="url(#s2-ah)" stroke-dasharray="0 9999" opacity="0"/>
        <text id="s2-ar-b-lbl" x="326" y="192" fill="#ff7a2f" font-size="26" opacity="0">кадр + награда r</text>

        <!-- график награды (иллюстративно) -->
        <g id="s2-chart" opacity="0">
          <text x="20" y="428" fill="#aab3c2" font-size="24">награда по ходу обучения (иллюстративно)</text>
          <line x1="20" y1="630" x2="480" y2="630" stroke="#2a3140" stroke-width="3"/>
          <rect id="s2-bar1" x="40" y="630" width="52" height="0" rx="6" fill="#ff7a2f"/>
          <rect id="s2-bar2" x="120" y="630" width="52" height="0" rx="6" fill="#ff7a2f"/>
          <rect id="s2-bar3" x="200" y="630" width="52" height="0" rx="6" fill="#ff7a2f"/>
          <rect id="s2-bar4" x="280" y="630" width="52" height="0" rx="6" fill="#ff7a2f"/>
          <rect id="s2-bar5" x="360" y="630" width="52" height="0" rx="6" fill="#ff7a2f"/>
          <rect id="s2-bar6" x="440" y="630" width="40" height="0" rx="6" fill="#ff7a2f"/>
        </g>

        <!-- реальный робот и разрыв -->
        <g id="s2-b-real" opacity="0"><rect x="550" y="240" width="460" height="140" rx="20" fill="#161a24" stroke="#b48ce6" stroke-width="3"/>
          <text x="780" y="304" text-anchor="middle" fill="#f0f4ff" font-size="34" font-weight="700">Реальный робот</text>
          <text x="780" y="344" text-anchor="middle" fill="#aab3c2" font-size="26">реальная физика и камера</text></g>
        <path id="s2-gap" d="M 484 300 L 546 300" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <text id="s2-gap-lbl" x="515" y="278" text-anchor="middle" fill="#ff4d6d" font-size="26" font-weight="700" opacity="0">gap</text>

        <!-- domain randomization: варианты симулятора (иллюстративно) -->
        <g id="s2-dr" opacity="0">
          <text x="20" y="428" fill="#aab3c2" font-size="24">случайные варианты симулятора</text>
          <rect id="s2-t1" x="20" y="450" width="100" height="100" rx="14" fill="#2b3a4d" stroke="#2dd4bf" stroke-width="3"/>
          <rect id="s2-t2" x="140" y="450" width="100" height="100" rx="14" fill="#3a3a52" stroke="#2dd4bf" stroke-width="3"/>
          <rect id="s2-t3" x="260" y="450" width="100" height="100" rx="14" fill="#45445f" stroke="#2dd4bf" stroke-width="3"/>
          <rect id="s2-t4" x="380" y="450" width="100" height="100" rx="14" fill="#33485a" stroke="#2dd4bf" stroke-width="3"/>
          <text x="70" y="510" text-anchor="middle" fill="#f0f4ff" font-size="24">0.6</text>
          <text x="190" y="510" text-anchor="middle" fill="#f0f4ff" font-size="24">0.9</text>
          <text x="310" y="510" text-anchor="middle" fill="#f0f4ff" font-size="24">1.2</text>
          <text x="430" y="510" text-anchor="middle" fill="#f0f4ff" font-size="24">1.4</text>
          <text x="20" y="592" fill="#aab3c2" font-size="24">яркость света, значения иллюстративно</text>
        </g>
        <path id="s2-go" d="M 484 350 L 546 350" fill="none" stroke="#3dba7a" stroke-width="6" stroke-linecap="round" marker-end="url(#s2-ah-g)" stroke-dasharray="0 9999" opacity="0"/>
        <g id="s2-fine" opacity="0">
          <text x="550" y="430" fill="#3dba7a" font-size="26" font-weight="700">перенос политики в реальность,</text>
          <text x="550" y="466" fill="#3dba7a" font-size="26" font-weight="700">затем fine-tune на реальных данных</text>
          <text x="550" y="504" fill="#aab3c2" font-size="24">в примере README — 100 эпизодов</text>
        </g>
      </svg>
      <div id="s2-cA" class="card s2-card" data-layout-allow-overlap><div class="h">Reinforcement learning</div>
        <div class="f">награда <span class="o">r</span> → политика</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:10px">плюсы: оптимизирует награду, может превзойти демонстрации</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">минусы: много данных, рискованный exploration, сложно задать награду</div></div>
      <div id="s2-cB" class="card s2-card" data-layout-allow-overlap><div class="h">Sim-to-Real gap</div>
        <div class="row"><span class="nm">физика</span><span class="vl">трение, упругость</span></div>
        <div class="row"><span class="nm">картинка</span><span class="vl">рендеринг vs реальность</span></div>
        <div class="row"><span class="nm">сенсоры</span><span class="vl">шум, калибровка</span></div>
        <div class="row"><span class="nm">железо</span><span class="vl">динамика, задержки</span></div></div>
      <div id="s2-cC" class="card s2-card" data-layout-allow-overlap><div class="h">Domain randomization</div>
        <div class="row"><span class="nm">свет</span><span class="vl">0.5 … 1.5</span></div>
        <div class="row"><span class="nm">трение</span><span class="vl">0.3 … 1.5</span></div>
        <div class="row"><span class="nm">масса объекта</span><span class="vl">0.5 … 2.0</span></div>
        <div class="row"><span class="nm">шум камеры</span><span class="vl">0.0 … 0.1</span></div>
        <div class="row"><span class="nm">текстуры</span><span class="vl">smooth / rough / textured</span></div></div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap"><b>RL</b>: политика пробует действия в симуляторе и получает <b class="o">награду</b> за успех</div>
      <div id="s2-cap2" class="cap"><b class="r">Sim-to-Real gap</b>: физика, картинка и сенсоры реальности не совпадают с симулятором</div>
      <div id="s2-cap3" class="cap"><b class="t">Domain randomization</b>: случайные свет, текстуры, трение — затем дообучение на реальных данных</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const draw = (id, len, t, d = 0.5) => tl.fromTo(id, { attr: { "stroke-dasharray": "0 9999" }, opacity: 0 }, { attr: { "stroke-dasharray": len + " 9999" }, opacity: 1, duration: d, ease: "power2.inOut" }, t);
    const fade = (id, t, d = 0.4) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    // 1: RL-петля в симуляторе
    fade("#s2-b-pol", 0.4); fade("#s2-b-sim", 0.7);
    draw("#s2-ar-a", 102, 1.1); fade("#s2-ar-a-lbl", 1.4);
    draw("#s2-ar-b", 102, 1.7); fade("#s2-ar-b-lbl", 2.0);
    tl.fromTo("#s2-cA", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.9);
    fade("#s2-chart", 2.4, 0.3);
    const H = [30, 55, 90, 125, 160, 185];
    H.forEach((h, i) => tl.fromTo("#s2-bar" + (i + 1), { attr: { height: 0, y: 630 } }, { attr: { height: h, y: 630 - h }, duration: 0.6, ease: "power2.out" }, 2.6 + 0.35 * i));
    cap("#s2-cap1", 0.6, 4.8);
    // 2: sim-to-real gap
    tl.to("#s2-cA", { opacity: 0, duration: 0.4 }, 5.0);
    tl.fromTo("#s2-cB", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.4);
    fade("#s2-b-real", 5.4, 0.5);
    draw("#s2-gap", 62, 6.2, 0.5); fade("#s2-gap-lbl", 6.5, 0.3);
    cap("#s2-cap2", 5.0, 8.8);
    // 3: domain randomization + fine-tune
    tl.to("#s2-cB", { opacity: 0, duration: 0.4 }, 9.0);
    tl.to("#s2-chart", { opacity: 0, duration: 0.4 }, 9.0);
    tl.to("#s2-gap", { opacity: 0, duration: 0.3 }, 9.0); tl.to("#s2-gap-lbl", { opacity: 0, duration: 0.3 }, 9.0);
    tl.fromTo("#s2-cC", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.4);
    fade("#s2-dr", 9.5, 0.4);
    ["#s2-t1", "#s2-t2", "#s2-t3", "#s2-t4"].forEach((id, i) => {
      tl.fromTo(id, { attr: { "stroke-width": 3 } }, { attr: { "stroke-width": 9 }, duration: 0.3, ease: "power2.out" }, 10.2 + 0.5 * i);
      tl.to(id, { attr: { "stroke-width": 3 }, duration: 0.3 }, 10.5 + 0.5 * i);
    });
    draw("#s2-go", 62, 12.0, 0.5);
    fade("#s2-fine", 12.4, 0.5);
    cap("#s2-cap3", 9.2, 14.1);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 14.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
