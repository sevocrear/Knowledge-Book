<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const draw = (id, len, t, d = 0.5) => tl.fromTo(id, { attr: { "stroke-dasharray": "0 9999" }, opacity: 0 }, { attr: { "stroke-dasharray": len + " 9999" }, opacity: 1, duration: d, ease: "power2.inOut" }, t);
    const fade = (id, t, d = 0.4) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    // 1: данные многих роботов
    ["#s3-r1", "#s3-r2", "#s3-r3", "#s3-r4"].forEach((id, i) => fade(id, 0.4 + 0.3 * i, 0.4));
    [["#s3-ra1", 158], ["#s3-ra2", 92], ["#s3-ra3", 82], ["#s3-ra4", 165]].forEach(([id, l], i) => draw(id, l, 1.5 + 0.15 * i, 0.5));
    fade("#s3-ds", 2.0, 0.5);
    ["#s3-ds1", "#s3-ds2", "#s3-ds3", "#s3-ds4", "#s3-ds5"].forEach((id, i) => fade(id, 2.4 + 0.4 * i, 0.4));
    cap("#s3-cap1", 0.6, 4.6);
    // 2: VLA
    draw("#s3-a1", 62, 4.9, 0.5);
    fade("#s3-vla", 5.2, 0.5);
    fade("#s3-in1", 5.9, 0.4); draw("#s3-ia1", 42, 6.2, 0.4);
    fade("#s3-in2", 6.4, 0.4); draw("#s3-ia2", 42, 6.7, 0.4);
    draw("#s3-a2", 76, 7.2, 0.5);
    fade("#s3-out", 7.5, 0.5);
    fade("#s3-stats", 8.0, 0.5);
    cap("#s3-cap2", 4.9, 8.9);
    // 3: ключевая идея + гибриды
    fade("#s3-hyb", 9.6, 0.6);
    cap("#s3-cap3", 9.2, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 13.45);
    window.__timelines["s3"] = tl;
  })();
</script>
