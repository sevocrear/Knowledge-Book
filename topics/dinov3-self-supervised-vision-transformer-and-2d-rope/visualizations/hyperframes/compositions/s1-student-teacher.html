<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 0px; width: 700px; }
  #s1-c2 { left: 1060px; top: 206px; width: 700px; }
  #s1-c2 .f2 { font-style: italic; font-size: 29px; margin-top: 4px; }
  #s1-c3 { left: 1060px; top: 440px; width: 700px; height: 166px; }
  #s1-dst { position: absolute; left: 32px; top: 70px; width: 636px; height: 110px; }
  .s1-bar { position: absolute; bottom: 30px; width: 34px; border-radius: 6px 6px 2px 2px; height: 0px; }
  .s1-ax { position: absolute; bottom: 28px; height: 2px; width: 276px; background: #2a3140; }
  .s1-bl { position: absolute; bottom: -6px; width: 276px; text-align: center; font-size: 24px; font-weight: 600; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Как DINOv3 учится без разметки?</div></div>
    <div class="badge">Knowledge Book · DINOv3</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <defs>
          <linearGradient id="s1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15243a"/><stop offset="1" stop-color="#3b7fd0"/></linearGradient>
          <clipPath id="s1-clip"><rect x="20" y="40" width="300" height="300" rx="16"/></clipPath>
        </defs>
        <!-- исходное изображение: собственная графика (небо, солнце, холм, дом) -->
        <g id="s1-img" opacity="0">
          <g clip-path="url(#s1-clip)">
            <rect x="20" y="40" width="300" height="300" fill="url(#s1-sky)"/>
            <circle cx="250" cy="112" r="34" fill="#ff7a2f"/>
            <path d="M 20 262 Q 110 176 210 246 T 320 232 L 320 340 L 20 340 Z" fill="#3dba7a"/>
            <rect x="92" y="204" width="62" height="64" fill="#161a24"/>
            <path d="M 84 206 L 123 172 L 162 206 Z" fill="#ff4d6d"/>
            <rect x="112" y="236" width="20" height="32" fill="#ff7a2f"/>
          </g>
          <rect x="20" y="40" width="300" height="300" rx="16" fill="none" stroke="#2a3140" stroke-width="3"/>
          <text x="170" y="374" text-anchor="middle" fill="#aab3c2" font-size="24">изображение без меток</text>
        </g>
        <!-- кропы -->
        <rect id="s1-g1" x="30" y="50" width="210" height="210" rx="8" fill="none" stroke="#ff7a2f" stroke-width="6" stroke-dasharray="0 9999" opacity="0"/>
        <rect id="s1-g2" x="100" y="120" width="210" height="210" rx="8" fill="none" stroke="#ff7a2f" stroke-width="6" stroke-dasharray="0 9999" opacity="0"/>
        <rect id="s1-l1" x="42" y="238" width="70" height="70" rx="6" fill="none" stroke="#4a9eff" stroke-width="5" stroke-dasharray="0 9999" opacity="0"/>
        <rect id="s1-l2" x="218" y="60" width="70" height="70" rx="6" fill="none" stroke="#4a9eff" stroke-width="5" stroke-dasharray="0 9999" opacity="0"/>
        <rect id="s1-l3" x="150" y="152" width="70" height="70" rx="6" fill="none" stroke="#4a9eff" stroke-width="5" stroke-dasharray="0 9999" opacity="0"/>
        <g id="s1-leg1" opacity="0"><rect x="22" y="404" width="26" height="26" rx="5" fill="none" stroke="#ff7a2f" stroke-width="5"/><text x="62" y="426" fill="#ff7a2f" font-size="26" font-weight="700">2 глобальных кропа</text></g>
        <g id="s1-leg2" opacity="0"><rect x="22" y="446" width="26" height="26" rx="5" fill="none" stroke="#4a9eff" stroke-width="5"/><text x="62" y="468" fill="#4a9eff" font-size="26" font-weight="700">несколько локальных кропов</text></g>
        <!-- стрелки к моделям (d и наконечники задаются в скрипте) -->
        <path id="s1-ar1" d="" fill="none" stroke="#ff7a2f" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s1-ar2" d="" fill="none" stroke="#ff7a2f" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s1-ar3" d="" fill="none" stroke="#4a9eff" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s1-ema" d="" fill="none" stroke="#b48ce6" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <g id="s1-heads"></g>
        <!-- teacher / student -->
        <g id="s1-teacher" opacity="0">
          <rect x="612" y="56" width="340" height="118" rx="16" fill="#161a24" stroke="#b48ce6" stroke-width="4"/>
          <text x="782" y="104" text-anchor="middle" fill="#b48ce6" font-size="34" font-weight="700">teacher</text>
          <text x="782" y="146" text-anchor="middle" fill="#aab3c2" font-size="20">глобальные кропы · без градиента</text>
        </g>
        <g id="s1-student" opacity="0">
          <rect x="612" y="330" width="340" height="118" rx="16" fill="#161a24" stroke="#4a9eff" stroke-width="4"/>
          <text x="782" y="378" text-anchor="middle" fill="#4a9eff" font-size="34" font-weight="700">student</text>
          <text x="782" y="420" text-anchor="middle" fill="#aab3c2" font-size="20">все кропы · учится градиентом</text>
        </g>
        <g id="s1-ema-lbl" opacity="0">
          <text x="684" y="248" text-anchor="end" fill="#b48ce6" font-size="24" font-weight="700">EMA весов</text>
          <text x="684" y="278" text-anchor="end" fill="#b48ce6" font-size="24" font-weight="700">student’а</text>
        </g>
        <!-- выходы -->
        <g id="s1-out" opacity="0">
          <text x="782" y="504" text-anchor="middle" fill="#e6ebf5" font-size="26">teacher → <tspan fill="#b48ce6" font-weight="700">t</tspan>,&#160;&#160; student → <tspan fill="#4a9eff" font-weight="700">s</tspan></text>
          <text x="782" y="540" text-anchor="middle" fill="#aab3c2" font-size="20">центр c = EMA выходов teacher’а</text>
        </g>
        <text id="s1-note" x="490" y="640" text-anchor="middle" fill="#aab3c2" font-size="20" opacity="0">в DINOv2/v3 вместо центра c — Sinkhorn-Knopp; плюс patch-loss в духе iBOT</text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Teacher = EMA student’а</div>
        <div class="f" style="font-size:31px">θ<sub>teacher</sub> ← τ·θ<sub>teacher</sub> + (1 − τ)·θ<sub>student</sub></div>
        <div style="font-size:24px;color:#aab3c2;margin-top:8px">τ ∈ [0, 1) — коэффициент сглаживания</div></div>
      <div id="s1-c2" class="card"><div class="h">Глобальный DINO-loss</div>
        <div class="f">L<sub>DINO</sub> = CE( <span class="p">p<sub>t</sub></span>, <span class="b">p<sub>s</sub></span> )</div>
        <div class="f2"><span class="p">p<sub>t</sub></span> = softmax((t − c) / T<sub>t</sub>), &nbsp;<span class="b">p<sub>s</sub></span> = softmax(s / T<sub>s</sub>)</div>
        <div style="font-size:24px;color:#aab3c2;margin-top:6px">c — центр (EMA выходов teacher’а), T — температуры</div></div>
      <div id="s1-c3" class="card"><div class="h">Выходы p<sub>t</sub> и p<sub>s</sub> (иллюстративно)</div>
        <div id="s1-dst">
          <div class="s1-ax" style="left:0px"></div><div class="s1-ax" style="left:360px"></div>
          <div class="s1-bl" style="left:0px;color:#b48ce6">p<sub>t</sub> teacher</div>
          <div class="s1-bl" style="left:360px;color:#4a9eff">p<sub>s</sub> student → p<sub>t</sub></div>
          <div id="s1-tb0" class="s1-bar" style="left:14px;background:#b48ce6"></div>
          <div id="s1-tb1" class="s1-bar" style="left:60px;background:#b48ce6"></div>
          <div id="s1-tb2" class="s1-bar" style="left:106px;background:#b48ce6"></div>
          <div id="s1-tb3" class="s1-bar" style="left:152px;background:#b48ce6"></div>
          <div id="s1-tb4" class="s1-bar" style="left:198px;background:#b48ce6"></div>
          <div id="s1-tb5" class="s1-bar" style="left:244px;background:#b48ce6"></div>
          <div id="s1-sb0" class="s1-bar" style="left:374px;background:#4a9eff"></div>
          <div id="s1-sb1" class="s1-bar" style="left:420px;background:#4a9eff"></div>
          <div id="s1-sb2" class="s1-bar" style="left:466px;background:#4a9eff"></div>
          <div id="s1-sb3" class="s1-bar" style="left:512px;background:#4a9eff"></div>
          <div id="s1-sb4" class="s1-bar" style="left:558px;background:#4a9eff"></div>
          <div id="s1-sb5" class="s1-bar" style="left:604px;background:#4a9eff"></div>
        </div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Из одного изображения без меток режем <b class="o">2 глобальных кропа</b> и <b class="b">несколько локальных</b> — разные «виды» одного и того же</div>
      <div id="s1-cap2" class="cap"><b class="b">Student</b> видит все кропы, <b class="p">teacher</b> — глобальные. Teacher не учится градиентом: его веса — <b class="p">EMA</b> весов student’а</div>
      <div id="s1-cap3" class="cap">Выходы teacher’а <b>центрируем</b> (c — EMA его выходов) и берём softmax с температурой; student тянется к ним через <b class="o">cross-entropy</b></div>
      <div id="s1-cap4" class="cap">Итог: все виды одного изображения дают <b class="g">согласованные</b> глобальные представления; patch-loss в духе iBOT делает информативными и dense-фичи</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const heads = document.getElementById("s1-heads");
    // Стрелка: линия до точки за 10px до кончика + треугольный наконечник (без marker — детерминированная геометрия).
    const arrows = { "s1-ar1": [334, 130, 606, 112, "#ff7a2f"], "s1-ar2": [334, 200, 606, 372, "#ff7a2f"], "s1-ar3": [334, 270, 606, 404, "#4a9eff"], "s1-ema": [700, 324, 700, 180, "#b48ce6"] };
    const alen = {};
    Object.entries(arrows).forEach(([id, [x1, y1, x2, y2, col]]) => {
      const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
      const ex = x2 - 10 * ux, ey = y2 - 10 * uy;
      document.getElementById(id).setAttribute("d", `M ${x1} ${y1} L ${ex.toFixed(1)} ${ey.toFixed(1)}`);
      alen[id] = (L - 10).toFixed(1);
      const p = document.createElementNS(NS, "polygon");
      const bx = x2 - 16 * ux, by = y2 - 16 * uy, nx = -uy * 8, ny = ux * 8;
      p.setAttribute("id", id + "-h"); p.setAttribute("fill", col); p.setAttribute("opacity", "0");
      p.setAttribute("points", `${x2},${y2} ${(bx + nx).toFixed(1)},${(by + ny).toFixed(1)} ${(bx - nx).toFixed(1)},${(by - ny).toFixed(1)}`);
      heads.appendChild(p);
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const draw = (id, len, t, dur) => tl.fromTo(id, { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": len + " 9999" }, duration: dur, ease: "power2.inOut" }, t);
    const arrow = (id, t, dur) => { draw("#" + id, alen[id], t, dur); tl.fromTo("#" + id + "-h", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t + dur - 0.15); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-img", { opacity: 0, scale: 0.9, svgOrigin: "170 190" }, { opacity: 1, scale: 1, svgOrigin: "170 190", duration: 0.6, ease: "power2.out" }, 0.3);
    cap("#s1-cap1", 0.6, 4.0);
    // кропы: периметры 4·210 = 840 и 4·70 = 280
    draw("#s1-g1", 840, 1.0, 0.7); draw("#s1-g2", 840, 1.4, 0.7);
    tl.fromTo("#s1-leg1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.6);
    draw("#s1-l1", 280, 2.1, 0.4); draw("#s1-l2", 280, 2.35, 0.4); draw("#s1-l3", 280, 2.6, 0.4);
    tl.fromTo("#s1-leg2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.7);
    // teacher / student и стрелки
    tl.fromTo("#s1-teacher", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 3.4);
    tl.fromTo("#s1-student", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 3.7);
    arrow("s1-ar1", 4.0, 0.5); arrow("s1-ar2", 4.3, 0.5); arrow("s1-ar3", 4.6, 0.5);
    cap("#s1-cap2", 4.2, 8.2);
    arrow("s1-ema", 5.4, 0.5);
    tl.fromTo("#s1-ema-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.8);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.0);
    // выходы и DINO-loss
    cap("#s1-cap3", 8.4, 12.0);
    tl.fromTo("#s1-out", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.6);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 8.8);
    tl.fromTo("#s1-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.6);
    const H = 76, pt = [0.12, 0.55, 0.95, 0.38, 0.2, 0.1], ps0 = [0.5, 0.3, 0.42, 0.62, 0.36, 0.48];
    pt.forEach((v, i) => tl.fromTo(`#s1-tb${i}`, { height: 0 }, { height: v * H, duration: 0.5, ease: "power2.out" }, 10.0 + 0.06 * i));
    ps0.forEach((v, i) => tl.fromTo(`#s1-sb${i}`, { height: 0 }, { height: v * H, duration: 0.5, ease: "power2.out" }, 10.4 + 0.06 * i));
    // cross-entropy: student подстраивается под teacher
    pt.forEach((v, i) => tl.to(`#s1-sb${i}`, { height: v * H, duration: 1.6, ease: "power2.inOut" }, 11.4));
    tl.fromTo("#s1-note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 12.0);
    cap("#s1-cap4", 12.2, 15.5);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 15.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
