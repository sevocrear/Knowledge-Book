<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  .pipe { position: absolute; left: 1060px; width: 700px; height: 112px; box-sizing: border-box; padding: 0 28px; border-radius: 20px;
    background: #161a24; border: 2px solid #2a3140; display: flex; align-items: center; gap: 22px; opacity: 0; }
  .pipe .n { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: #1e3a5f; color: #f0f4ff; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .pipe .t { font-size: 31px; line-height: 1.2; color: #f0f4ff; font-weight: 600; }
  .pipe .s { font-size: 24px; color: #aab3c2; margin-top: 4px; font-weight: 400; }
  #s3-b1 { top: 12px; } #s3-b2 { top: 172px; } #s3-b3 { top: 332px; } #s3-b4 { top: 492px; }
  .arr { position: absolute; left: 1392px; width: 36px; height: 44px; font-size: 40px; line-height: 44px; text-align: center; color: #aab3c2; opacity: 0; }
  #s3-a1 { top: 128px; } #s3-a2 { top: 288px; } #s3-a3 { top: 448px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Как это работает в проде?</div></div>
    <div class="badge">Knowledge Book · Metric learning</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <rect x="60" y="20" width="860" height="600" rx="28" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
        <text id="s3-lbl-before" x="490" y="66" text-anchor="middle" fill="#aab3c2" font-size="26" data-layout-allow-overlap>пространство эмбеддингов: до обучения</text>
        <text id="s3-lbl-after" x="490" y="66" text-anchor="middle" fill="#aab3c2" font-size="26" opacity="0" data-layout-allow-overlap>пространство эмбеддингов: после обучения</text>
        <g id="s3-tau" opacity="0">
          <circle id="s3-tau-c" cx="650" cy="300" r="140" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="0 9999"/>
          <g id="s3-tau-lbl"><text x="780" y="100" text-anchor="middle" fill="#2dd4bf" font-size="26" font-weight="700">порог τ</text><text x="780" y="128" text-anchor="middle" fill="#aab3c2" font-size="22">ближе τ — принимаем</text><text x="780" y="154" text-anchor="middle" fill="#aab3c2" font-size="22">дальше — unknown</text></g>
        </g>
        <g id="s3-nn" opacity="0">
          <line id="s3-nn1" x1="650" y1="300" x2="618" y2="213" stroke="#f0f4ff" stroke-width="3" stroke-dasharray="0 9999"/>
          <line id="s3-nn2" x1="650" y1="300" x2="573" y2="212" stroke="#f0f4ff" stroke-width="3" stroke-dasharray="0 9999"/>
          <line id="s3-nn3" x1="650" y1="300" x2="551" y2="238" stroke="#f0f4ff" stroke-width="3" stroke-dasharray="0 9999"/>
        </g>
        <g id="s3-pts"></g>
        <g id="s3-cl" opacity="0">
          <text x="250" y="566" text-anchor="middle" fill="#3dba7a" font-size="28" font-weight="700">сорт A</text>
          <text x="470" y="200" text-anchor="end" fill="#b48ce6" font-size="28" font-weight="700">сорт B</text>
          <text x="730" y="590" text-anchor="middle" fill="#ff7a2f" font-size="28" font-weight="700">сорт C</text>
        </g>
        <g id="s3-q" opacity="0">
          <circle cx="650" cy="300" r="13" fill="none" stroke="#f0f4ff" stroke-width="4"/>
          <text x="672" y="310" fill="#f0f4ff" font-size="24">запрос</text>
        </g>
        <text id="s3-top3" x="650" y="348" text-anchor="middle" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0">top-3 → <tspan fill="#b48ce6">сорт B</tspan></text>
      </svg>
      <div id="s3-b1" class="pipe"><div class="n">1</div><div class="t">эмбеддинг-модель<div class="s">x → f<sub>θ</sub>(x) → ẑ, ‖ẑ‖₂ = 1</div></div></div>
      <div id="s3-a1" class="arr">↓</div>
      <div id="s3-b2" class="pipe"><div class="n">2</div><div class="t">ANN-индекс (FAISS / HNSW)<div class="s">эталоны сортов; новый сорт = новые точки</div></div></div>
      <div id="s3-a2" class="arr">↓</div>
      <div id="s3-b3" class="pipe"><div class="n">3</div><div class="t">top-K + порог τ<div class="s">τ подбираем по validation: контроль FAR и unknown</div></div></div>
      <div id="s3-a3" class="arr">↓</div>
      <div id="s3-b4" class="pipe"><div class="n">4</div><div class="t">мониторинг и дообучение<div class="s">дрейф → replay / fine-tuning → пересчёт индекса</div></div></div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap">После обучения кластеры <b>компактны</b>; новый сорт = новые точки в индексе, <b>без полного переобучения</b></div>
      <div id="s3-cap2" class="cap">Запрос: эмбеддинг → <b>k ближайших соседей</b> → решение по порогу <b class="t">τ</b> (контролируем FAR и unknown)</div>
      <div id="s3-cap3" class="cap key">Похожие — близко, разные — дальше минимум на margin. В проде: эмбеддинг-модель → индекс соседей → порог → мониторинг и дообучение</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Те же точки, что в сцене 1 ("до"), и их позиции "после обучения" — три компактных кластера.
    const BEFORE = [
      [[441,555],[184,490],[629,179],[181,193],[338,392],[160,569],[246,218],[839,102],[654,288]],
      [[264,272],[658,118],[148,114],[202,352],[752,368],[336,93],[808,162],[743,175],[431,308]],
      [[776,94],[484,368],[554,284],[544,100],[709,273],[680,509],[694,397],[618,418],[416,197]]
    ];
    const AFTER = [
      [[267,395],[252,512],[181,444],[245,415],[276,452],[193,487],[280,498],[309,470],[206,431]],
      [[599,128],[500,200],[618,213],[515,130],[577,154],[514,230],[573,212],[493,168],[551,238]],
      [[685,535],[758,472],[746,512],[697,460],[790,462],[671,474],[777,432],[778,516],[721,495]]
    ];
    const colors = ["#3dba7a", "#b48ce6", "#ff7a2f"];
    const g = document.getElementById("s3-pts");
    const pts = [];
    BEFORE.forEach((cls, c) => cls.forEach(([x, y], i) => {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      el.setAttribute("id", `s3-p${c}-${i}`); el.setAttribute("cx", x); el.setAttribute("cy", y);
      el.setAttribute("r", "11"); el.setAttribute("fill", colors[c]);
      g.appendChild(el); pts.push([el, c, i]);
    }));
    // Запрос q = (650, 300); три ближайших соседа — точки сорта B №2, №6, №8 (93, 117, 117 px), 4-й сосед — 153 px > τ = 140 px.
    const Q = [650, 300];
    const NN = [[618, 213], [573, 212], [551, 238]];

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    ["#s3-b1", "#s3-a1", "#s3-b2", "#s3-a2", "#s3-b3", "#s3-a3", "#s3-b4"].forEach((id, i) => tl.fromTo(id, { opacity: 0, x: 30 }, { opacity: 0.35, x: 0, duration: 0.5, ease: "power2.out" }, 0.6 + 0.12 * i));
    cap("#s3-cap1", 0.6, 5.0);
    // Обучение: точки стягиваются в кластеры.
    pts.forEach(([el, c, i]) => tl.to(el, { attr: { cx: AFTER[c][i][0], cy: AFTER[c][i][1] }, duration: 2.4, ease: "power2.inOut" }, 1.0 + 0.02 * i));
    tl.to("#s3-lbl-before", { opacity: 0, duration: 0.4 }, 1.6);
    tl.to("#s3-lbl-after", { opacity: 1, duration: 0.4 }, 1.6);
    tl.fromTo("#s3-cl", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.5);
    // Пайплайн загорается по шагам.
    const light = (id, t) => { tl.fromTo(id, { opacity: 0.35, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, t); tl.to(id, { borderColor: "#4a9eff", duration: 0.4 }, t); };
    light("#s3-b1", 4.2);
    tl.fromTo("#s3-a1", { opacity: 0.35 }, { opacity: 1, duration: 0.3, immediateRender: false }, 4.6);
    light("#s3-b2", 5.0);
    // Запрос → k ближайших соседей → порог τ.
    cap("#s3-cap2", 5.2, 9.6);
    tl.fromTo("#s3-q", { opacity: 0, scale: 0.4, svgOrigin: Q[0] + " " + Q[1] }, { opacity: 1, scale: 1, svgOrigin: Q[0] + " " + Q[1], duration: 0.5, ease: "back.out(2)" }, 5.6);
    tl.fromTo("#s3-nn", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.4);
    NN.forEach(([x, y], i) => tl.fromTo(`#s3-nn${i + 1}`, { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": Math.hypot(x - Q[0], y - Q[1]).toFixed(1) + " 9999" }, duration: 0.5, ease: "power2.out" }, 6.5 + 0.3 * i));
    tl.fromTo("#s3-top3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 7.5);
    tl.fromTo("#s3-a2", { opacity: 0.35 }, { opacity: 1, duration: 0.3, immediateRender: false }, 7.6);
    light("#s3-b3", 8.0);
    tl.fromTo("#s3-tau", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 8.2);
    tl.fromTo("#s3-tau-c", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": (2 * Math.PI * 140).toFixed(1) + " 9999" }, duration: 0.9, ease: "power2.inOut" }, 8.2);
    tl.fromTo("#s3-tau-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.0);
    tl.fromTo("#s3-a3", { opacity: 0.35 }, { opacity: 1, duration: 0.3, immediateRender: false }, 10.0);
    light("#s3-b4", 10.4);
    cap("#s3-cap3", 9.8, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.45 }, 13.55);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
