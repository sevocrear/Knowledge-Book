<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 40px; width: 700px; }
  #s1-c2 { left: 1060px; top: 330px; width: 700px; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Зачем эмбеддинги, а не классификатор?</div></div>
    <div class="badge">Knowledge Book · Metric learning</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <rect id="s1-panel" x="60" y="20" width="860" height="600" rx="28" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
        <text id="s1-panel-lbl" x="490" y="66" text-anchor="middle" fill="#aab3c2" font-size="26">пространство эмбеддингов ℝ<tspan font-size="18" dy="-10">d</tspan><tspan dy="10"> (2D-проекция, до обучения)</tspan></text>
        <g id="s1-pts"></g>
        <g id="s1-legend" opacity="0">
          <circle cx="250" cy="641" r="10" fill="#3dba7a"/><text x="268" y="650" fill="#aab3c2" font-size="26">сорт A</text>
          <circle cx="430" cy="641" r="10" fill="#b48ce6"/><text x="448" y="650" fill="#aab3c2" font-size="26">сорт B</text>
          <circle cx="610" cy="641" r="10" fill="#ff7a2f"/><text x="628" y="650" fill="#aab3c2" font-size="26">сорт C</text>
        </g>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Эмбеддинг</div>
        <div class="f">z = f<sub>θ</sub>(x) ∈ ℝ<sup>d</sup>,&nbsp;&nbsp; ẑ = z / ‖z‖₂</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">f<sub>θ</sub> — сеть, ẑ — L2-нормированный вектор объекта x</div></div>
      <div id="s1-c2" class="card"><div class="h">Сходство и расстояние</div>
        <div class="f">s(ẑ<sub>i</sub>, ẑ<sub>j</sub>) = ẑ<sub>i</sub><sup>ᵀ</sup> ẑ<sub>j</sub> <span style="font-style:normal;font-size:28px;color:#aab3c2">(cosine)</span></div>
        <div class="f" style="margin-top:6px">d = 1 − s &nbsp;или&nbsp; ‖ẑ<sub>i</sub> − ẑ<sub>j</sub>‖₂</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">для единичных векторов ‖ẑ<sub>i</sub> − ẑ<sub>j</sub>‖₂² = 2 − 2s</div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap"><b>Fine-grained</b>: 15 сортов яблок отличаются мелкими деталями — жёсткая классификация ломается на новых сортах и дисбалансе</div>
      <div id="s1-cap2" class="cap"><b>Metric learning</b> учит карту: похожие объекты — <b class="g">близко</b>, разные — <b class="r">далеко</b> по cosine / L2</div>
      <div id="s1-cap3" class="cap">До обучения точки разных сортов <b>перемешаны</b> — соседи по карте ничего не значат</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Точки "до обучения": 3 сорта × 9 точек, перемешаны (детерминированные координаты, без Math.random).
    const BEFORE = [
      [[441,555],[184,490],[629,179],[181,193],[338,392],[160,569],[246,218],[839,102],[654,288]],
      [[264,272],[658,118],[148,114],[202,352],[752,368],[336,93],[808,162],[743,175],[431,308]],
      [[776,94],[484,368],[554,284],[544,100],[709,273],[680,509],[694,397],[618,418],[416,197]]
    ];
    const colors = ["#3dba7a", "#b48ce6", "#ff7a2f"];
    const g = document.getElementById("s1-pts");
    const pts = [];
    BEFORE.forEach((cls, c) => cls.forEach(([x, y], i) => {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      el.setAttribute("id", `s1-p${c}-${i}`); el.setAttribute("cx", x); el.setAttribute("cy", y);
      el.setAttribute("r", "11"); el.setAttribute("fill", colors[c]); el.setAttribute("opacity", "0");
      g.appendChild(el); pts.push([el, c, i]);
    }));

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-panel", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.2);
    tl.fromTo("#s1-panel-lbl", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
    // Точки появляются вперемешку: порядок по индексу, классы чередуются.
    pts.forEach(([el, c, i]) => tl.fromTo(el, { opacity: 0, attr: { r: 3 } }, { opacity: 1, attr: { r: 11 }, duration: 0.35, ease: "back.out(2)" }, 0.8 + 0.06 * (i * 3 + c)));
    tl.fromTo("#s1-legend", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.4);
    cap("#s1-cap1", 0.6, 4.8);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.2);
    cap("#s1-cap2", 5.0, 8.8);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.4);
    cap("#s1-cap3", 9.0, 12.5);
    // Подсветка: соседи разных сортов "пульсируют" — соседство ничего не значит.
    tl.fromTo("#s1-p1-8", { attr: { r: 11 } }, { attr: { r: 17 }, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 9.4);
    tl.fromTo("#s1-p2-1", { attr: { r: 11 } }, { attr: { r: 17 }, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 9.4);
    tl.fromTo("#s1-p0-4", { attr: { r: 11 } }, { attr: { r: 17 }, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 9.4);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.45 }, 12.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
