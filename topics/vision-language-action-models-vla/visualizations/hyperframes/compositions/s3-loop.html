    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <defs>
          <marker id="s3-ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 z" fill="#aab3c2"/></marker>

        <path id="s3-ar1" d="M 396 115 L 582 115" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah)" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s3-ar2" d="M 770 186 L 770 442" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah)" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s3-ar3" d="M 584 515 L 398 515" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah)" stroke-dasharray="0 9999" opacity="0"/>
        <path id="s3-ar4" d="M 210 442 L 210 186" fill="none" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" marker-end="url(#s3-ah)" stroke-dasharray="0 9999" opacity="0"/>
        <circle id="s3-dot1" cx="396" cy="115" r="14" fill="#ff7a2f" opacity="0"/>

        <circle id="s3-dot3" cx="584" cy="515" r="14" fill="#ff7a2f" opacity="0"/>
        <circle id="s3-dot4" cx="210" cy="442" r="14" fill="#ff7a2f" opacity="0"/>
      </svg>
      <div id="s3-n1" class="s3-n"><div class="big">Наблюдение</div><div class="sm">кадр + инструкция</div></div>

    <div class="caps">

      <div id="s3-cap3" class="cap key">VLA = кадр + инструкция → действие робота в одной модели, по кругу; учится на демонстрациях</div>
    </div>
  </div>

<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const draw = (id, len, t, d = 0.5) => tl.fromTo(id, { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": len + " 9999" }, duration: d, ease: "power2.inOut" }, t);
    const lit = (id, t) => tl.fromTo(id, { opacity: 0.35, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, t);
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    cap("#s3-cap1", 0.6, 5.6);
    // Узлы цикла загораются по очереди, точка-«такт» обходит контур
    lit("#s3-n1", 0.6);
    draw("#s3-ar1", 186, 1.2, 0.6);
    lit("#s3-n2", 1.7);
    draw("#s3-ar2", 256, 2.3, 0.6);
    lit("#s3-n3", 2.8);
    draw("#s3-ar3", 186, 3.4, 0.6);
    lit("#s3-n4", 3.9);
    draw("#s3-ar4", 256, 4.4, 0.6);
    tl.fromTo("#s3-mid", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 4.6);
    // «Такт»: точка обходит цикл по стрелкам N1 → N2 → N3 → N4 → N1 (по одной точке на стрелку)
    const seg = (id, x0, y0, x1, y1, t) => {
      tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.15 }, t);
      tl.to(id, { attr: { cx: x1, cy: y1 }, duration: 0.6, ease: "none" }, t + 0.1);
      tl.to(id, { opacity: 0, duration: 0.15 }, t + 0.7);
    };
    seg("#s3-dot1", 396, 115, 582, 115, 4.9);
    seg("#s3-dot2", 770, 186, 770, 442, 5.5);
    seg("#s3-dot3", 584, 515, 398, 515, 6.1);
    seg("#s3-dot4", 210, 442, 210, 186, 6.7);
    // Данные
    cap("#s3-cap2", 5.9, 9.4);
    tl.fromTo("#s3-data", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.9);
    ["#s3-r1", "#s3-r2", "#s3-r3", "#s3-r4"].forEach((id, i) => tl.fromTo(id, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 }, 6.4 + 0.9 * i));
    cap("#s3-cap3", 9.8, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 12.45);
    window.__timelines["s3"] = tl;
  })();
</script>
