<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-mini { position: absolute; left: 1060px; top: 10px; width: 700px; height: 270px; display: block; opacity: 0; }
  #s2-c1 { left: 1060px; top: 320px; width: 700px; }
  #s2-c1 .row { position: relative; display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #2a3140; }
  #s2-c1 .row:last-child { border-bottom: 0; }
  #s2-c1 .fm { font-size: 32px; }
  #s2-c1 .val { font-size: 40px; font-weight: 700; min-width: 120px; text-align: right; }
  #s2-c1 .one { position: absolute; right: 0; top: 8px; opacity: 0; }
  #s2-c1 .val:not(.one)::before { counter-reset: n var(--n); content: "0." counter(n, decimal-leading-zero); }
  @property --n { syntax: "<integer>"; inherits: true; initial-value: 0; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Как из порогов получается ROC-кривая?</div></div>
    <div class="badge">Knowledge Book · ROC-AUC</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <line id="s2-ax-x" x1="120" y1="600" x2="680" y2="600" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999"/>
        <line id="s2-ax-y" x1="120" y1="600" x2="120" y2="40" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999"/>
        <g id="s2-ticks" opacity="0" fill="#aab3c2" font-size="24">
          <text x="120" y="632" text-anchor="middle">0</text><text x="400" y="632" text-anchor="middle">0.5</text><text x="680" y="632" text-anchor="middle">1</text>
          <text x="104" y="608" text-anchor="end">0</text><text x="104" y="328" text-anchor="end">0.5</text><text x="104" y="48" text-anchor="end">1</text>
          <text x="740" y="608" fill="#ff4d6d" font-size="30" font-weight="700">FPR</text>
          <text x="52" y="320" text-anchor="middle" fill="#ff7a2f" font-size="30" font-weight="700" transform="rotate(-90 52 320)">TPR</text>
        </g>
        <g id="s2-diag" opacity="0">
          <line x1="120" y1="600" x2="680" y2="40" stroke="#aab3c2" stroke-width="3" stroke-dasharray="14 12"/>
          <text x="620" y="190" text-anchor="middle" fill="#aab3c2" font-size="24" transform="rotate(-45 620 190)">монетка: AUC = 0.5</text>
        </g>
        <g id="s2-ideal" opacity="0">
          <circle cx="120" cy="40" r="9" fill="#3dba7a"/>
          <text x="140" y="34" fill="#3dba7a" font-size="26" font-weight="700">идеал (0, 1)</text>
        </g>
        <path id="s2-roc" d="" fill="none" stroke="#4a9eff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999"/>
        <g id="s2-m1" opacity="0"><circle cx="126.2" cy="441.0" r="9" fill="#f0f4ff"/><text x="146" y="450" fill="#e6ebf5" font-size="26">t = 0.7</text></g>
        <g id="s2-m2" opacity="0"><circle cx="229.6" cy="149.6" r="9" fill="#f0f4ff"/><text x="250" y="144" fill="#e6ebf5" font-size="26">t = 0.5</text></g>
        <g id="s2-m3" opacity="0"><circle cx="521.0" cy="46.2" r="9" fill="#f0f4ff"/><text x="541" y="78" fill="#e6ebf5" font-size="26">t = 0.3</text></g>
        <g id="s2-youden" opacity="0">
          <line x1="229.6" y1="490.4" x2="229.6" y2="160" stroke="#b48ce6" stroke-width="5" stroke-dasharray="10 8"/>
          <text x="250" y="300" fill="#b48ce6" font-size="26" font-weight="700">J = TPR − FPR = 0.61</text>
          <text x="250" y="336" fill="#b48ce6" font-size="26">t* = argmax J = 0.5</text>
        </g>
        <circle id="s2-dot" cx="120" cy="600" r="13" fill="#ff7a2f" stroke="#0f1117" stroke-width="3" opacity="0"/>
        <text id="s2-hint" x="120" y="655" fill="#aab3c2" font-size="24" opacity="0">по X — FPR(t), по Y — TPR(t); один порог = одна точка</text>
      </svg>
      <svg id="s2-mini" viewBox="0 0 700 270">
        <path id="s2-mneg-fill" d="" fill="#4a9eff" fill-opacity="0.16"/>
        <path id="s2-mpos-fill" d="" fill="#ff7a2f" fill-opacity="0.16"/>
        <path id="s2-mneg" d="" fill="none" stroke="#4a9eff" stroke-width="4"/>
        <path id="s2-mpos" d="" fill="none" stroke="#ff7a2f" stroke-width="4"/>
        <line x1="40" y1="225" x2="660" y2="225" stroke="#aab3c2" stroke-width="2"/>
        <text x="40" y="255" text-anchor="middle" fill="#aab3c2" font-size="22">0</text>
        <text x="660" y="255" text-anchor="middle" fill="#aab3c2" font-size="22">1</text>
        <text x="350" y="255" text-anchor="middle" fill="#aab3c2" font-size="22">скор s(x)</text>
        <text x="140" y="120" text-anchor="middle" fill="#4a9eff" font-size="24" font-weight="700">класс 0</text>
        <text x="560" y="120" text-anchor="middle" fill="#ff7a2f" font-size="24" font-weight="700">класс 1</text>
        <g id="s2-mthr">
          <line x1="629" y1="30" x2="629" y2="225" stroke="#f0f4ff" stroke-width="3" stroke-dasharray="10 8"/>
          <text x="629" y="22" text-anchor="middle" fill="#f0f4ff" font-size="26" font-weight="700">t</text>
        </g>
      </svg>
      <div id="s2-c1" class="card"><div class="h">Точка ROC для порога t (иллюстративно)</div>
        <div class="row"><span class="fm">порог t</span><span id="s2-vt" class="val" style="--n:95"></span></div>
        <div class="row"><span class="fm"><span class="r">FPR</span>(t) = FP / (FP + TN)</span><span id="s2-vfpr" class="val r" style="--n:0" data-layout-allow-overlap></span><span id="s2-vfpr1" class="val r one" data-layout-allow-overlap>1.00</span></div>
        <div class="row"><span class="fm"><span class="o">TPR</span>(t) = TP / (TP + FN)</span><span id="s2-vtpr" class="val o" style="--n:1" data-layout-allow-overlap></span><span id="s2-vtpr1" class="val o one" data-layout-allow-overlap>1.00</span></div>
      </div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Перебираем пороги от <b>+∞</b> к <b>−∞</b> (на практике — все уникальные скоры) и для каждого t считаем пару <b class="r">FPR(t)</b>, <b class="o">TPR(t)</b></div>
      <div id="s2-cap2" class="cap">Каждый порог — одна точка (<b class="r">FPR</b>, <b class="o">TPR</b>). Опуская t, точка едет из (0, 0) в (1, 1) и прочерчивает <b class="b">ROC-кривую</b></div>
      <div id="s2-cap3" class="cap"><b class="g">Идеальная</b> модель уходит в левый верхний угол (0, 1); <b>монетка</b> — диагональ; кривая ниже диагонали — классы перепутаны</div>
      <div id="s2-cap4" class="cap">Один порог для внедрения: <b class="p">Youden’s J = TPR − FPR</b>, t* = argmax J — точка, самая высокая над диагональю (здесь t* = 0.5)</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // ROC для тех же иллюстративных холмов (N(0.38, 0.14²) / N(0.62, 0.14²)): пороги t = 0.95 … 0.05 шагом 0.025,
    // (FPR, TPR) = (1 − Φ((t−0.38)/σ), 1 − Φ((t−0.62)/σ)) — посчитано заранее, без случайности.
    const PTS = [[0,0],[0,0.0092],[0,0.0147],[0.0001,0.0228],[0.0002,0.0343],[0.0004,0.0502],[0.0007,0.0716],[0.0013,0.0993],[0.0024,0.1341],[0.0041,0.1766],[0.0069,0.2266],[0.0111,0.2839],[0.0176,0.3472],[0.0269,0.4152],[0.0401,0.4858],[0.058,0.5568],[0.0818,0.6261],[0.1123,0.6915],[0.1502,0.7513],[0.1957,0.8043],[0.2487,0.8498],[0.3085,0.8877],[0.3739,0.9182],[0.4432,0.942],[0.5142,0.9599],[0.5848,0.9731],[0.6528,0.9824],[0.7161,0.9889],[0.7734,0.9931],[0.8234,0.9959],[0.8659,0.9976],[0.9007,0.9987],[0.9284,0.9993],[0.9498,0.9996],[0.9657,0.9998],[0.9772,0.9999],[0.9853,1],[0.9908,1],[1,1]];
    const PX = f => 120 + f * 560, PY = t => 600 - t * 560;
    const P = PTS.map(([f, t]) => [PX(f), PY(t)]);
    document.getElementById("s2-roc").setAttribute("d", "M " + P.map(([x, y]) => x.toFixed(1) + " " + y.toFixed(1)).join(" L "));
    const cum = [0]; for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
    // Мини-холмы справа.
    const X = s => 40 + s * 620, BASE = 225, K = 55, SIG = 0.14;
    const pdf = (x, mu) => Math.exp(-0.5 * ((x - mu) / SIG) ** 2) / (SIG * Math.sqrt(2 * Math.PI));
    const curve = mu => { const p = []; for (let i = 0; i <= 100; i++) { const s = i / 100; p.push([X(s), BASE - K * pdf(s, mu)]); } return p; };
    const line = p => "M " + p.map(([x, y]) => x.toFixed(1) + " " + y.toFixed(1)).join(" L ");
    const area = p => line(p) + ` L ${X(1)} ${BASE} L ${X(0)} ${BASE} Z`;
    const neg = curve(0.38), pos = curve(0.62);
    document.getElementById("s2-mneg").setAttribute("d", line(neg)); document.getElementById("s2-mneg-fill").setAttribute("d", area(neg));
    document.getElementById("s2-mpos").setAttribute("d", line(pos)); document.getElementById("s2-mpos-fill").setAttribute("d", area(pos));

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s2-ax-x", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "560 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#s2-ax-y", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "560 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.5);
    tl.fromTo("#s2-ticks", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.0);
    tl.fromTo("#s2-hint", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
    tl.fromTo("#s2-diag", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.4);
    tl.fromTo("#s2-mini", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.2);
    tl.fromTo("#s2-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.6);
    cap("#s2-cap1", 0.6, 4.4);
    // Проход порога 0.95 → 0.05 за 8 с: точка едет по ломаной, кривая дорисовывается, мини-порог едет, счётчики идут.
    const T0 = 3.0, DUR = 8.0, N = P.length - 1, seg = DUR / N;
    tl.fromTo("#s2-dot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.6);
    for (let i = 1; i <= N; i++) {
      const at = T0 + (i - 1) * seg;
      tl.to("#s2-dot", { attr: { cx: P[i][0].toFixed(1), cy: P[i][1].toFixed(1) }, duration: seg, ease: "none" }, at);
      tl.to("#s2-roc", { attr: { "stroke-dasharray": cum[i].toFixed(1) + " 9999" }, duration: seg, ease: "none" }, at);
      tl.to("#s2-vfpr", { "--n": Math.min(99, Math.round(PTS[i][0] * 100)), snap: "--n", duration: seg, ease: "none" }, at);
      tl.to("#s2-vtpr", { "--n": Math.min(99, Math.round(PTS[i][1] * 100)), snap: "--n", duration: seg, ease: "none" }, at);
    }
    // Счётчики двузначные: когда TPR/FPR достигают 1.00 (вершины 36 и 38), кроссфейд на «1.00».
    tl.to("#s2-vtpr", { opacity: 0, duration: 0.3 }, T0 + 36 * seg); tl.to("#s2-vtpr1", { opacity: 1, duration: 0.3 }, T0 + 36 * seg);
    tl.to("#s2-vfpr", { opacity: 0, duration: 0.3 }, T0 + 38 * seg); tl.to("#s2-vfpr1", { opacity: 1, duration: 0.3 }, T0 + 38 * seg);
    // Порог t линейно 0.95 → 0.05 между вершинами 1 и N−1 (крайние вершины — углы (0,0) и (1,1)).
    tl.to("#s2-mthr", { x: X(0.05) - X(0.95), duration: seg * (N - 2), ease: "none" }, T0 + seg);
    tl.to("#s2-vt", { "--n": 5, snap: "--n", duration: seg * (N - 2), ease: "none" }, T0 + seg);
    // Маркеры t = 0.7 / 0.5 / 0.3 — вершины 11, 19, 27.
    tl.fromTo("#s2-m1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T0 + 11 * seg);
    tl.fromTo("#s2-m2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T0 + 19 * seg);
    tl.fromTo("#s2-m3", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T0 + 27 * seg);
    cap("#s2-cap2", 4.6, 8.6);
    cap("#s2-cap3", 8.8, 12.0);
    tl.fromTo("#s2-ideal", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 9.2);
    tl.fromTo("#s2-youden", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 12.0);
    cap("#s2-cap4", 12.2, 15.5);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 15.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
