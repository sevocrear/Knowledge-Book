<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s3</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s3-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s3-c1 { left: 1060px; top: 0px; width: 700px; padding: 18px 32px; font-size: 30px; }
  #s3-pairs { position: absolute; left: 1060px; top: 214px; width: 700px; height: 150px; display: block; opacity: 0; }
  #s3-c2 { left: 1060px; top: 376px; width: 700px; padding: 16px 32px; }
  #s3-c3 { left: 1060px; top: 556px; width: 700px; padding: 10px 32px; font-size: 24px; }
</style>
<div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
  <div id="s3-wrap" class="wrap">
    <div class="head"><div class="pill">3 / 3</div><div class="title">Что измеряет ROC AUC?</div></div>
    <div class="badge">Knowledge Book · ROC-AUC</div>
    <div class="stage">
      <svg id="s3-svg" viewBox="0 0 980 660">
        <path id="s3-area" d="" fill="#ff7a2f" fill-opacity="0.32" opacity="0"/>
        <line x1="120" y1="600" x2="680" y2="600" stroke="#aab3c2" stroke-width="3"/>
        <line x1="120" y1="600" x2="120" y2="40" stroke="#aab3c2" stroke-width="3"/>
        <g fill="#aab3c2" font-size="24">
          <text x="120" y="632" text-anchor="middle">0</text><text x="400" y="632" text-anchor="middle">0.5</text><text x="680" y="632" text-anchor="middle">1</text>
          <text x="104" y="608" text-anchor="end">0</text><text x="104" y="328" text-anchor="end">0.5</text><text x="104" y="48" text-anchor="end">1</text>
          <text x="740" y="608" fill="#ff4d6d" font-size="30" font-weight="700">FPR</text>
          <text x="52" y="320" text-anchor="middle" fill="#ff7a2f" font-size="30" font-weight="700" transform="rotate(-90 52 320)">TPR</text>
        </g>
        <line x1="120" y1="600" x2="680" y2="40" stroke="#aab3c2" stroke-width="3" stroke-dasharray="14 12"/>
        <text x="620" y="190" text-anchor="middle" fill="#aab3c2" font-size="24" transform="rotate(-45 620 190)">монетка: AUC = 0.5</text>
        <path id="s3-roc" d="" fill="none" stroke="#4a9eff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="s3-auc" opacity="0">
          <text x="400" y="400" text-anchor="middle" fill="#f0f4ff" font-size="44" font-weight="700">AUC = 0.89</text>
          <text x="400" y="438" text-anchor="middle" fill="#e6ebf5" font-size="24">площадь под кривой (иллюстративно)</text>
        </g>
        <text id="s3-note" x="120" y="655" fill="#aab3c2" font-size="24" opacity="0">AUC = ∫₀¹ TPR d(FPR) — одно число за все пороги сразу</text>
      </svg>
      <div id="s3-c1" class="card"><div class="h">Шкала ROC AUC</div>
        <div><b class="g">1.0</b> — идеальный классификатор</div>
        <div><b>0.5</b> — не лучше случайного угадывания</div>
        <div><b class="r">&lt; 0.5</b> — классы перепутаны, инвертируй</div></div>
      <svg id="s3-pairs" viewBox="0 0 700 150">
        <text x="0" y="22" fill="#aab3c2" font-size="22" letter-spacing="1">СЛУЧАЙНАЯ ПАРА x⁺, x⁻ (ИЛЛЮСТРАТИВНО)</text>
        <text x="0" y="64" fill="#ff7a2f" font-size="26" font-weight="700">x⁺</text>
        <text x="0" y="102" fill="#4a9eff" font-size="26" font-weight="700">x⁻</text>
        <line x1="70" y1="118" x2="650" y2="118" stroke="#2a3140" stroke-width="2"/>
        <text x="70" y="141" text-anchor="middle" fill="#aab3c2" font-size="20">0</text>
        <text x="650" y="141" text-anchor="middle" fill="#aab3c2" font-size="20">1</text>
        <g id="s3-pair1" opacity="0">
          <circle cx="487.6" cy="56" r="13" fill="#ff7a2f"/><text x="508" y="64" fill="#ff7a2f" font-size="24">0.72</text>
          <circle cx="249.8" cy="94" r="13" fill="#4a9eff"/><text x="270" y="102" fill="#4a9eff" font-size="24">0.31</text>
          <text x="360" y="141" text-anchor="middle" fill="#3dba7a" font-size="24" font-weight="700">s(x⁺) &gt; s(x⁻) ✓</text>
        </g>
        <g id="s3-pair2" opacity="0">
          <circle cx="389" cy="56" r="13" fill="#ff7a2f"/><text x="409" y="64" fill="#ff7a2f" font-size="24">0.55</text>
          <circle cx="423.8" cy="94" r="13" fill="#4a9eff"/><text x="444" y="102" fill="#4a9eff" font-size="24">0.61</text>
          <text x="360" y="141" text-anchor="middle" fill="#ff4d6d" font-size="24" font-weight="700">s(x⁺) &lt; s(x⁻) ✗</text>
        </g>
        <g id="s3-pair3" opacity="0">
          <circle cx="539.8" cy="56" r="13" fill="#ff7a2f"/><text x="560" y="64" fill="#ff7a2f" font-size="24">0.81</text>
          <circle cx="325.2" cy="94" r="13" fill="#4a9eff"/><text x="346" y="102" fill="#4a9eff" font-size="24">0.44</text>
          <text x="360" y="141" text-anchor="middle" fill="#3dba7a" font-size="24" font-weight="700">s(x⁺) &gt; s(x⁻) ✓</text>
        </g>
      </svg>
      <div id="s3-c2" class="card"><div class="h">Вероятностный смысл</div>
        <div class="f">AUC = P( s(<span class="o">x⁺</span>) &gt; s(<span class="b">x⁻</span>) )</div>
        <div style="font-size:26px;color:#aab3c2;margin-top:6px">метрика ранжирования, а не одного порога</div></div>
      <div id="s3-c3" class="card">vs <b class="t">PR-кривая</b>: X = Recall (= TPR), Y = Precision — чувствительнее к редкому позитиву</div>
    </div>
    <div class="caps">
      <div id="s3-cap1" class="cap"><b class="o">AUC</b> — площадь под ROC-кривой: <b class="g">1.0</b> — идеальный классификатор, <b>0.5</b> — не лучше монетки, <b class="r">&lt; 0.5</b> — классы перепутаны</div>
      <div id="s3-cap2" class="cap">AUC = P(s(<b class="o">x⁺</b>) &gt; s(<b class="b">x⁻</b>)): вероятность, что случайный позитив получит скор выше случайного негатива. Это метрика ранжирования</div>
      <div id="s3-cap3" class="cap key">ROC AUC — про ранжирование при всех порогах. При сильном дисбалансе (1 % позитивов) ROC AUC обманчиво высок — смотри и PR AUC</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Та же иллюстративная ROC, что в сцене 2; AUC = Φ((0.62 − 0.38) / (0.14·√2)) ≈ 0.89.
    const PTS = [[0,0],[0,0.0092],[0,0.0147],[0.0001,0.0228],[0.0002,0.0343],[0.0004,0.0502],[0.0007,0.0716],[0.0013,0.0993],[0.0024,0.1341],[0.0041,0.1766],[0.0069,0.2266],[0.0111,0.2839],[0.0176,0.3472],[0.0269,0.4152],[0.0401,0.4858],[0.058,0.5568],[0.0818,0.6261],[0.1123,0.6915],[0.1502,0.7513],[0.1957,0.8043],[0.2487,0.8498],[0.3085,0.8877],[0.3739,0.9182],[0.4432,0.942],[0.5142,0.9599],[0.5848,0.9731],[0.6528,0.9824],[0.7161,0.9889],[0.7734,0.9931],[0.8234,0.9959],[0.8659,0.9976],[0.9007,0.9987],[0.9284,0.9993],[0.9498,0.9996],[0.9657,0.9998],[0.9772,0.9999],[0.9853,1],[0.9908,1],[1,1]];
    const PX = f => 120 + f * 560, PY = t => 600 - t * 560;
    const P = PTS.map(([f, t]) => [PX(f), PY(t)]);
    const poly = "M " + P.map(([x, y]) => x.toFixed(1) + " " + y.toFixed(1)).join(" L ");
    document.getElementById("s3-roc").setAttribute("d", poly);
    document.getElementById("s3-area").setAttribute("d", poly + ` L ${PX(1)} ${PY(0)} Z`);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s3-area", { opacity: 0, scale: 0.96, svgOrigin: "120 600" }, { opacity: 1, scale: 1, svgOrigin: "120 600", duration: 1.0, ease: "power2.out" }, 0.5);
    tl.fromTo("#s3-auc", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.3);
    tl.fromTo("#s3-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.6);
    tl.fromTo("#s3-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.0);
    cap("#s3-cap1", 0.6, 4.4);
    // Случайные пары: три заранее выбранные пары скоров (без Math.random), сравниваем s(x⁺) и s(x⁻).
    tl.fromTo("#s3-pairs", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.4);
    tl.fromTo("#s3-pair1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.8);
    tl.to("#s3-pair1", { opacity: 0, duration: 0.25 }, 6.3);
    tl.fromTo("#s3-pair2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.5);
    tl.to("#s3-pair2", { opacity: 0, duration: 0.25 }, 8.0);
    tl.fromTo("#s3-pair3", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.2);
    tl.fromTo("#s3-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.2);
    cap("#s3-cap2", 4.6, 8.8);
    tl.fromTo("#s3-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.2);
    cap("#s3-cap3", 9.0, 0);
    tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 12.45);
    window.__timelines["s3"] = tl;
  })();
</script>
</template>
</body></html>
