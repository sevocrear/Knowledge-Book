<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 20px; width: 700px; }
  #s1-c2 { left: 1060px; top: 300px; width: 700px; }
  #s1-c2 .row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #2a3140; }
  #s1-c2 .row:last-child { border-bottom: 0; }
  #s1-c2 .fm { font-size: 32px; }
  #s1-c2 .val { font-size: 40px; font-weight: 700; min-width: 120px; text-align: right; }
  #s1-c2 .val::before { counter-reset: n var(--n); content: "0." counter(n, decimal-leading-zero); }
  @property --n { syntax: "<integer>"; inherits: true; initial-value: 0; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Что меняется, когда двигаем порог t?</div></div>
    <div class="badge">Knowledge Book · ROC-AUC</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <defs><clipPath id="s1-clip"><rect id="s1-cliprect" x="748" y="0" width="172" height="600"/></clipPath></defs>
        <path id="s1-neg-fill" d="" fill="#4a9eff" fill-opacity="0.16" opacity="0"/>
        <path id="s1-pos-fill" d="" fill="#ff7a2f" fill-opacity="0.16" opacity="0"/>
        <g id="s1-shade" clip-path="url(#s1-clip)" opacity="0">
          <path id="s1-tp" d="" fill="#ff7a2f" fill-opacity="0.62"/>
          <path id="s1-fp" d="" fill="#ff4d6d" fill-opacity="0.55"/>
        </g>
        <path id="s1-neg" d="" fill="none" stroke="#4a9eff" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <path id="s1-pos" d="" fill="none" stroke="#ff7a2f" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 9999"/>
        <line id="s1-axis" x1="60" y1="560" x2="920" y2="560" stroke="#aab3c2" stroke-width="3" stroke-dasharray="0 9999"/>
        <g id="s1-ticks" opacity="0" fill="#aab3c2" font-size="24" text-anchor="middle">
          <text x="60" y="596">0</text><text x="490" y="596">0.5</text><text x="920" y="596">1</text>
          <text x="490" y="640" font-size="26">скор модели s(x) — насколько объект похож на класс 1</text>
        </g>
        <text id="s1-lbl-neg" x="215" y="330" text-anchor="middle" fill="#4a9eff" font-size="28" font-weight="700" opacity="0">негативы · класс 0</text>
        <text id="s1-lbl-pos" x="770" y="330" text-anchor="middle" fill="#ff7a2f" font-size="28" font-weight="700" opacity="0">позитивы · класс 1</text>
        <g id="s1-thr" opacity="0">
          <line x1="748" y1="78" x2="748" y2="560" stroke="#f0f4ff" stroke-width="4" stroke-dasharray="12 10"/>
          <text x="748" y="60" text-anchor="middle" fill="#f0f4ff" font-size="32" font-weight="700">t</text>
          <text x="762" y="104" fill="#e6ebf5" font-size="24">→ класс 1 (s ≥ t)</text>
          <text x="734" y="104" text-anchor="end" fill="#aab3c2" font-size="24">класс 0 ←</text>
        </g>
        <text id="s1-lbl-tp" x="766" y="542" fill="#f0f4ff" font-size="30" font-weight="700" opacity="0">TP</text>
        <text id="s1-lbl-fp" x="500" y="542" fill="#f0f4ff" font-size="30" font-weight="700" opacity="0">FP</text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Порог t</div>
        <div class="f">s(x) ≥ <span class="o">t</span> → класс 1,&nbsp; иначе класс 0</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">справа от t: <b class="o">TP</b> — пойманные позитивы, <b class="r">FP</b> — негативы, принятые за позитивы; слева — TN и FN</div></div>
      <div id="s1-c2" class="card"><div class="h">При текущем пороге (иллюстративно)</div>
        <div class="row"><span class="fm">порог t</span><span id="s1-vt" class="val" style="--n:80"></span></div>
        <div class="row"><span class="fm"><span class="o">TPR</span> = TP / (TP + FN)</span><span id="s1-vtpr" class="val o" style="--n:10"></span></div>
        <div class="row"><span class="fm"><span class="r">FPR</span> = FP / (FP + TN)</span><span id="s1-vfpr" class="val r" style="--n:0"></span></div>
      </div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Модель даёт каждому объекту скор <b>s(x)</b>: два холма — скоры <b class="b">негативов</b> (класс 0) и <b class="o">позитивов</b> (класс 1), они перекрываются</div>
      <div id="s1-cap2" class="cap">Справа от порога <b>t</b> — предсказан класс 1. <b class="o">TPR</b> — доля пойманных позитивов, <b class="r">FPR</b> — доля негативов, ошибочно принятых за позитивы</div>
      <div id="s1-cap3" class="cap">Опускаем порог: ловим почти всех позитивов (<b class="o">TPR ↑</b>), но и негативов пропускаем больше (<b class="r">FPR ↑</b>). Каждый t — своя пара (FPR, TPR)</div>
    </div>
  </div>
</div>
<script>
  (() => {
    // Иллюстративные распределения скоров: негативы N(0.38, 0.14²), позитивы N(0.62, 0.14²) — как на roc_curve.png README, но без Math.random.
    const X = s => 60 + s * 860, BASE = 560, K = 126, SIG = 0.14;
    const pdf = (x, mu) => Math.exp(-0.5 * ((x - mu) / SIG) ** 2) / (SIG * Math.sqrt(2 * Math.PI));
    const curve = mu => { const p = []; for (let i = 0; i <= 100; i++) { const s = i / 100; p.push([X(s), BASE - K * pdf(s, mu)]); } return p; };
    const line = p => "M " + p.map(([x, y]) => x.toFixed(1) + " " + y.toFixed(1)).join(" L ");
    const area = p => line(p) + ` L ${X(1)} ${BASE} L ${X(0)} ${BASE} Z`;
    const plen = p => p.reduce((a, [x, y], i) => i ? a + Math.hypot(x - p[i - 1][0], y - p[i - 1][1]) : 0, 0);
    const neg = curve(0.38), pos = curve(0.62);
    document.getElementById("s1-neg").setAttribute("d", line(neg));
    document.getElementById("s1-pos").setAttribute("d", line(pos));
    document.getElementById("s1-neg-fill").setAttribute("d", area(neg));
    document.getElementById("s1-pos-fill").setAttribute("d", area(pos));
    document.getElementById("s1-fp").setAttribute("d", area(neg));
    document.getElementById("s1-tp").setAttribute("d", area(pos));
    // Порог: t = 0.80 → 0.50 → 0.30. TPR/FPR = 1 − Φ((t − μ)/σ): (0.10, 0.00), (0.80, 0.20), (0.99, 0.72).
    const T0 = X(0.8), T1 = X(0.5), T2 = X(0.3);

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-axis", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "860 9999" }, duration: 0.8, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#s1-ticks", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
    tl.fromTo("#s1-neg", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": plen(neg).toFixed(1) + " 9999" }, duration: 1.2, ease: "power2.inOut" }, 0.6);
    tl.fromTo("#s1-neg-fill", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.2);
    tl.fromTo("#s1-lbl-neg", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.4);
    tl.fromTo("#s1-pos", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": plen(pos).toFixed(1) + " 9999" }, duration: 1.2, ease: "power2.inOut" }, 1.1);
    tl.fromTo("#s1-pos-fill", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.7);
    tl.fromTo("#s1-lbl-pos", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.9);
    cap("#s1-cap1", 0.6, 4.5);
    // Порог t = 0.8 и закраска TP/FP справа от него.
    tl.fromTo("#s1-thr", { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.5 }, 2.6);
    tl.fromTo("#s1-shade", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 2.9);
    tl.fromTo("#s1-lbl-tp", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.2);
    tl.fromTo("#s1-lbl-fp", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.3);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.0);
    cap("#s1-cap2", 4.7, 8.6);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.9);
    // Сдвиг порога 0.8 → 0.5: линия едет (x), clip-rect расширяется (attr x/width), счётчики меняются.
    tl.to("#s1-thr", { x: T1 - T0, duration: 2.0, ease: "power2.inOut" }, 5.6);
    tl.to("#s1-cliprect", { attr: { x: T1, width: 920 - T1 }, duration: 2.0, ease: "power2.inOut" }, 5.6);
    tl.to("#s1-vt", { "--n": 50, snap: "--n", duration: 2.0, ease: "power2.inOut" }, 5.6);
    tl.to("#s1-vtpr", { "--n": 80, snap: "--n", duration: 2.0, ease: "power2.inOut" }, 5.6);
    tl.to("#s1-vfpr", { "--n": 20, snap: "--n", duration: 2.0, ease: "power2.inOut" }, 5.6);
    cap("#s1-cap3", 8.8, 12.5);
    // Сдвиг порога 0.5 → 0.3.
    tl.to("#s1-thr", { x: T2 - T0, duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s1-cliprect", { attr: { x: T2, width: 920 - T2 }, duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s1-vt", { "--n": 30, snap: "--n", duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s1-vtpr", { "--n": 99, snap: "--n", duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s1-vfpr", { "--n": 72, snap: "--n", duration: 2.0, ease: "power2.inOut" }, 9.4);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 12.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
