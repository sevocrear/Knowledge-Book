<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 30px; width: 700px; }
  #s1-c2 { left: 1060px; top: 320px; width: 700px; font-size: 31px; }
  #s1-c2 .row { padding: 7px 0; border-bottom: 1px solid #2a3140; opacity: 0; }
  #s1-c2 .row:last-child { border-bottom: 0; }
  #s1-c2 .row .k { color: #aab3c2; font-size: 24px; display: block; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Как окно 3×3 строит карту признаков?</div></div>
    <div class="badge">Knowledge Book · CNN</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <text id="s1-in-lbl" x="248" y="44" text-anchor="middle" fill="#aab3c2" font-size="26" opacity="0">вход 6×6 (иллюстративно)</text>
        <g id="s1-pad" opacity="0"></g>
        <g id="s1-in"></g>
        <text id="s1-pad-lbl" x="248" y="556" text-anchor="middle" fill="#aab3c2" font-size="26" opacity="0">padding P = 1: кайма из нулей</text>
        <rect id="s1-win" x="80" y="120" width="168" height="168" rx="8" fill="rgba(255,122,47,0.22)" stroke="#ff7a2f" stroke-width="6" opacity="0"/>
        <text id="s1-win-lbl" x="248" y="608" text-anchor="middle" fill="#ff7a2f" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>ядро K = 3, stride S = 1</text>
        <text id="s1-win-lbl2" x="248" y="608" text-anchor="middle" fill="#4a9eff" font-size="28" font-weight="700" opacity="0" data-layout-allow-overlap>ядро K = 3, stride S = 2</text>
        <line id="s1-arrow" x1="496" y1="288" x2="546" y2="288" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <polygon id="s1-ah" points="544,278 558,288 544,298" fill="#aab3c2" opacity="0"/>
        <text id="s1-out-lbl4" x="748" y="44" text-anchor="middle" fill="#3dba7a" font-size="26" font-weight="700" opacity="0" data-layout-allow-overlap>выход 4×4</text>
        <text id="s1-out-lbl6" x="748" y="44" text-anchor="middle" fill="#3dba7a" font-size="26" font-weight="700" opacity="0" data-layout-allow-overlap>выход 6×6 — размер сохранён</text>
        <g id="s1-out4"></g>
        <g id="s1-out6" opacity="0"></g>
      </svg>
      <div id="s1-c1" class="card"><div class="h">Размер карты признаков</div>
        <div class="f">H<sub>out</sub> = ⌊(H<sub>in</sub> + 2<span class="p">P</span> − <span class="o">K</span>) / <span class="b">S</span> + 1⌋</div>
        <div style="font-size:28px;color:#aab3c2;margin-top:8px">K — ядро, P — padding, S — stride (dilation D = 1); так же для W и для pooling</div></div>
      <div id="s1-c2" class="card"><div class="h">Пример: вход 6×6, K = 3</div>
        <div id="s1-ex1" class="row"><span class="k">P = 0, S = 1</span>⌊(6 + 0 − 3) / 1 + 1⌋ = <b class="g">4</b></div>
        <div id="s1-ex2" class="row"><span class="k">P = 1, S = 1 — размер сохраняется</span>⌊(6 + 2 − 3) / 1 + 1⌋ = <b class="g">6</b></div>
        <div id="s1-ex3" class="row"><span class="k">P = 1, S = 2 — примерно вдвое меньше</span>⌊(6 + 2 − 3) / 2 + 1⌋ = ⌊3.5⌋ = <b class="g">3</b></div>
      </div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Окно <b class="o">3×3</b> скользит по входу: каждая позиция окна даёт <b class="g">одну клетку</b> карты признаков</div>
      <div id="s1-cap2" class="cap">Размер выхода: <b>⌊(H<sub>in</sub> + 2P − K) / S + 1⌋</b>. Вход 6×6, K = 3, P = 0, S = 1 → <b class="g">4×4</b></div>
      <div id="s1-cap3" class="cap"><b class="p">padding = 1</b> при 3×3 сохраняет размер (6×6 → 6×6); <b class="b">stride = 2</b> уменьшает его примерно вдвое</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const C = 56, X0 = 80, Y0 = 120, X1 = 580;
    const rect = (id, x, y, w, fill, stroke, dash) => {
      const el = document.createElementNS(NS, "rect");
      el.setAttribute("id", id); el.setAttribute("x", x); el.setAttribute("y", y);
      el.setAttribute("width", w); el.setAttribute("height", w); el.setAttribute("rx", "6");
      el.setAttribute("fill", fill); el.setAttribute("stroke", stroke); el.setAttribute("stroke-width", "2");
      if (dash) el.setAttribute("stroke-dasharray", dash);
      return el;
    };
    // Вход 6×6
    const gIn = document.getElementById("s1-in"), inCells = [];
    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
      const el = rect(`s1-in-${r}-${c}`, X0 + c * C + 2, Y0 + r * C + 2, C - 4, "#1e3a5f", "#4a9eff");
      el.setAttribute("opacity", "0"); gIn.appendChild(el); inCells.push(el);
    }
    // Кайма padding (8×8 минус внутренние 6×6)
    const gPad = document.getElementById("s1-pad");
    for (let r = -1; r < 7; r++) for (let c = -1; c < 7; c++) {
      if (r >= 0 && r < 6 && c >= 0 && c < 6) continue;
      const el = rect(`s1-pad-${r + 1}-${c + 1}`, X0 + c * C + 2, Y0 + r * C + 2, C - 4, "#161a24", "#b48ce6", "6 6");
      gPad.appendChild(el);
    }
    // Выход 4×4 (P = 0) и 6×6 (P = 1)
    const gOut4 = document.getElementById("s1-out4"), out4 = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const el = rect(`s1-o4-${r}-${c}`, X1 + c * C + 2, Y0 + C + r * C + 2, C - 4, "#3dba7a", "#3dba7a");
      el.setAttribute("opacity", "0"); gOut4.appendChild(el); out4.push(el);
    }
    const gOut6 = document.getElementById("s1-out6");
    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
      gOut6.appendChild(rect(`s1-o6-${r}-${c}`, X1 + c * C + 2, Y0 + r * C + 2, C - 4, "#3dba7a", "#3dba7a"));
    }

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    tl.fromTo("#s1-in-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    inCells.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3 + i * 0.02));
    tl.fromTo("#s1-win", { opacity: 0, attr: { x: X0, y: Y0 } }, { opacity: 1, duration: 0.4 }, 1.0);
    tl.fromTo("#s1-win-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.1);
    tl.fromTo("#s1-arrow", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "50 9999" }, duration: 0.35, ease: "power2.inOut" }, 1.2);
    tl.fromTo("#s1-ah", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.5);
    tl.fromTo("#s1-out-lbl4", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.5);
    cap("#s1-cap1", 0.6, 5.3);
    // 16 позиций окна (S = 1): каждая зажигает одну клетку выхода 4×4
    for (let i = 0; i < 16; i++) {
      const r = Math.floor(i / 4), c = i % 4, t = 1.5 + i * 0.24;
      tl.to("#s1-win", { attr: { x: X0 + c * C, y: Y0 + r * C }, duration: 0.16, ease: "power2.inOut" }, t);
      tl.fromTo(out4[i], { opacity: 0 }, { opacity: 1, duration: 0.2 }, t + 0.12);
    }
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.5);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 6.2);
    tl.fromTo("#s1-ex1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.6);
    cap("#s1-cap2", 5.5, 9.4);
    // padding = 1: кайма нулей, окно уходит в левый верхний угол каймы, выход становится 6×6
    tl.fromTo("#s1-pad", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 9.5);
    tl.fromTo("#s1-pad-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.7);
    tl.to("#s1-win", { attr: { x: X0 - C, y: Y0 - C }, duration: 0.6, ease: "power2.inOut" }, 9.8);
    tl.to("#s1-out4", { opacity: 0, duration: 0.5 }, 10.3);
    tl.to("#s1-out-lbl4", { opacity: 0, duration: 0.4 }, 10.3);
    tl.fromTo("#s1-out6", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 10.4);
    tl.fromTo("#s1-out-lbl6", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.6);
    tl.fromTo("#s1-ex2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.6);
    tl.fromTo("#s1-ex3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.8);
    // stride 2: окно прыгает через клетку
    tl.to("#s1-win-lbl", { opacity: 0, duration: 0.3 }, 11.8);
    tl.fromTo("#s1-win-lbl2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 11.8);
    tl.to("#s1-win", { attr: { x: X0 + C }, duration: 0.3, ease: "power2.inOut" }, 12.0);
    tl.to("#s1-win", { attr: { x: X0 + 3 * C }, duration: 0.3, ease: "power2.inOut" }, 12.5);
    cap("#s1-cap3", 9.6, 13.5);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
