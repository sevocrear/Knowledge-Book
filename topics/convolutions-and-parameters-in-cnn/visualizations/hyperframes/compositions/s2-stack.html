<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s2</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s2-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s2-bars { position: absolute; left: 1060px; top: 0; width: 700px; height: 300px; display: block; opacity: 0; }
  #s2-c2 { left: 1060px; top: 318px; width: 700px; font-size: 30px; }
  #s2-c2 .row { padding: 5px 0; border-bottom: 1px solid #2a3140; opacity: 0; }
  #s2-c2 .row:last-child { border-bottom: 0; }
  #s2-c2 .row .k { color: #aab3c2; font-size: 24px; display: block; }
</style>
<div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
  <div id="s2-wrap" class="wrap">
    <div class="head"><div class="pill">2 / 3</div><div class="title">Зачем две 3×3 вместо одной 5×5?</div></div>
    <div class="badge">Knowledge Book · CNN</div>
    <div class="stage">
      <svg id="s2-svg" viewBox="0 0 980 660">
        <!-- Ряд A: одна свёртка 5×5 -->
        <text id="s2-a-lbl" x="40" y="46" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0">одна свёртка 5×5</text>
        <g id="s2-a-in"></g>
        <text id="s2-a-in-lbl" x="140" y="300" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">вход 5×5</text>
        <rect id="s2-a-win" x="40" y="70" width="200" height="200" rx="8" fill="rgba(255,122,47,0.22)" stroke="#ff7a2f" stroke-width="6" opacity="0"/>
        <line id="s2-a-ar" x1="258" y1="170" x2="316" y2="170" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <polygon id="s2-a-ah" points="314,160 328,170 314,180" fill="#aab3c2" opacity="0"/>
        <rect id="s2-a-out" x="340" y="150" width="40" height="40" rx="6" fill="#3dba7a" opacity="0"/>
        <text id="s2-a-rf" x="410" y="162" fill="#3dba7a" font-size="26" opacity="0">выход видит область 5×5</text>
        <text id="s2-a-w" x="410" y="200" fill="#ff7a2f" font-size="30" font-weight="700" opacity="0">25 весов</text>
        <!-- Ряд B: две свёртки 3×3 подряд -->
        <text id="s2-b-lbl" x="40" y="356" fill="#f0f4ff" font-size="28" font-weight="700" opacity="0">две свёртки 3×3 подряд</text>
        <g id="s2-b-in"></g>
        <text id="s2-b-in-lbl" x="140" y="610" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">вход 5×5</text>
        <rect id="s2-b-win" x="40" y="380" width="120" height="120" rx="8" fill="rgba(255,122,47,0.22)" stroke="#ff7a2f" stroke-width="6" opacity="0"/>
        <rect id="s2-b-rf" x="40" y="380" width="200" height="200" rx="8" fill="none" stroke="#3dba7a" stroke-width="6" stroke-dasharray="0 9999"/>
        <line id="s2-b-ar1" x1="258" y1="480" x2="316" y2="480" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <polygon id="s2-b-ah1" points="314,470 328,480 314,490" fill="#aab3c2" opacity="0"/>
        <g id="s2-b-mid"></g>
        <text id="s2-b-mid-lbl" x="400" y="570" text-anchor="middle" fill="#aab3c2" font-size="22" opacity="0">промежуточная 3×3</text>
        <rect id="s2-b-win2" x="340" y="420" width="120" height="120" rx="8" fill="rgba(255,122,47,0.22)" stroke="#ff7a2f" stroke-width="6" opacity="0"/>
        <line id="s2-b-ar2" x1="478" y1="480" x2="536" y2="480" stroke="#aab3c2" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <polygon id="s2-b-ah2" points="534,470 548,480 534,490" fill="#aab3c2" opacity="0"/>
        <rect id="s2-b-out" x="560" y="460" width="40" height="40" rx="6" fill="#3dba7a" opacity="0"/>
        <text id="s2-b-rf-lbl" x="630" y="472" fill="#3dba7a" font-size="26" opacity="0">receptive field тоже 5×5</text>
        <text id="s2-b-w" x="630" y="510" fill="#ff7a2f" font-size="30" font-weight="700" opacity="0">9 + 9 = 18 весов</text>
        <g id="s2-relu" opacity="0">
          <rect x="234" y="502" width="108" height="30" rx="8" fill="rgba(180,140,230,0.16)" stroke="#b48ce6" stroke-width="2"/>
          <text x="288" y="524" text-anchor="middle" fill="#b48ce6" font-size="18" font-weight="700">ReLU · BN</text>
        </g>
        <text id="s2-relu-lbl" x="610" y="548" fill="#b48ce6" font-size="22" opacity="0">нелинейность между слоями</text>
      </svg>
      <svg id="s2-bars" viewBox="0 0 700 300">
        <rect x="1" y="1" width="698" height="298" rx="20" fill="#161a24" stroke="#2a3140" stroke-width="2"/>
        <text x="32" y="50" fill="#aab3c2" font-size="24" letter-spacing="1.5">ВЕСОВ В ОДНОМ ЯДРЕ (1 КАНАЛ)</text>
        <text x="32" y="122" fill="#f0f4ff" font-size="30" font-weight="600">3×3</text>
        <rect id="s2-bar1" x="130" y="94" width="0" height="36" rx="8" fill="#4a9eff"/>
        <text id="s2-bv1" x="219" y="123" fill="#4a9eff" font-size="30" font-weight="700" opacity="0">9 = 3²</text>
        <text x="32" y="192" fill="#f0f4ff" font-size="30" font-weight="600">5×5</text>
        <rect id="s2-bar2" x="130" y="164" width="0" height="36" rx="8" fill="#ff7a2f"/>
        <text id="s2-bv2" x="350" y="193" fill="#ff7a2f" font-size="30" font-weight="700" opacity="0">25 = 5²</text>
        <text x="32" y="262" fill="#f0f4ff" font-size="30" font-weight="600">7×7</text>
        <rect id="s2-bar3" x="130" y="234" width="0" height="36" rx="8" fill="#ff4d6d"/>
        <text id="s2-bv3" x="546" y="263" fill="#ff4d6d" font-size="30" font-weight="700" opacity="0">49 = 7²</text>
      </svg>
      <div id="s2-c2" class="card"><div class="h">Стек вместо большого ядра</div>
        <div id="s2-r1" class="row"><span class="k">receptive field ≈ 5×5</span>2 × (3×3): 9 + 9 = <b class="g">18</b> &lt; 25</div>
        <div id="s2-r2" class="row"><span class="k">receptive field ≈ 7×7</span>3 × (3×3): 9 + 9 + 9 = <b class="g">27</b> &lt; 49</div>
        <div id="s2-r3" class="row"><span class="k">плюс нелинейности между слоями</span><b class="p">ReLU / BatchNorm</b> → выразительнее</div>
      </div>
    </div>
    <div class="caps">
      <div id="s2-cap1" class="cap">Стоимость ядра растёт как <b>K²</b>: 3×3 → 9, 5×5 → 25, 7×7 → 49 весов. Одна <b class="o">5×5</b> смотрит на область 5×5</div>
      <div id="s2-cap2" class="cap">Две <b class="o">3×3</b> подряд: receptive field тот же <b class="g">5×5</b>, но весов всего <b class="g">9 + 9 = 18</b> вместо 25</div>
      <div id="s2-cap3" class="cap">Плюс <b class="p">ReLU и BatchNorm</b> между слоями — модель выразительнее. Так строят VGG, ResNet, Inception v3</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    const C = 40;
    const grid = (gid, prefix, n, x0, y0, fill, stroke) => {
      const g = document.getElementById(gid), cells = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        const el = document.createElementNS(NS, "rect");
        el.setAttribute("id", `${prefix}-${r}-${c}`); el.setAttribute("x", x0 + c * C + 2); el.setAttribute("y", y0 + r * C + 2);
        el.setAttribute("width", C - 4); el.setAttribute("height", C - 4); el.setAttribute("rx", "5");
        el.setAttribute("fill", fill); el.setAttribute("stroke", stroke); el.setAttribute("stroke-width", "2"); el.setAttribute("opacity", "0");
        g.appendChild(el); cells.push(el);
      }
      return cells;
    };
    const aIn = grid("s2-a-in", "s2-ai", 5, 40, 70, "#1e3a5f", "#4a9eff");
    const bIn = grid("s2-b-in", "s2-bi", 5, 40, 380, "#1e3a5f", "#4a9eff");
    const bMid = grid("s2-b-mid", "s2-bm", 3, 340, 420, "#2a4a2e", "#3dba7a");

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); if (t1) tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    const arrow = (line, head, t) => {
      tl.fromTo(line, { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": "58 9999" }, duration: 0.35, ease: "power2.inOut" }, t);
      tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t + 0.3);
    };
    tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    // Ряд A
    tl.fromTo("#s2-a-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
    aIn.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3 + i * 0.02));
    tl.fromTo("#s2-a-in-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
    tl.fromTo("#s2-a-win", { opacity: 0, scale: 0.7, svgOrigin: "140 170" }, { opacity: 1, scale: 1, svgOrigin: "140 170", duration: 0.5, ease: "power2.out" }, 1.0);
    arrow("#s2-a-ar", "#s2-a-ah", 1.4);
    tl.fromTo("#s2-a-out", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.8);
    tl.fromTo("#s2-a-rf", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.0);
    tl.fromTo("#s2-a-w", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.4);
    // Столбики K²: 9, 25, 49 (масштаб 8.16 px на вес)
    tl.fromTo("#s2-bars", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.0);
    [["#s2-bar1", "#s2-bv1", 73], ["#s2-bar2", "#s2-bv2", 204], ["#s2-bar3", "#s2-bv3", 400]].forEach(([bar, val, w], i) => {
      tl.fromTo(bar, { attr: { width: 0 } }, { attr: { width: w }, duration: 0.7, ease: "power2.out" }, 1.5 + i * 0.5);
      tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.0 + i * 0.5);
    });
    cap("#s2-cap1", 0.6, 4.7);
    // Ряд B: окно 3×3 проходит 9 позиций и строит промежуточную карту 3×3
    tl.fromTo("#s2-b-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.9);
    bIn.forEach((el, i) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 4.9 + i * 0.02));
    tl.fromTo("#s2-b-in-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.2);
    tl.fromTo("#s2-b-win", { opacity: 0, attr: { x: 40, y: 380 } }, { opacity: 1, duration: 0.3 }, 5.4);
    arrow("#s2-b-ar1", "#s2-b-ah1", 5.5);
    tl.fromTo("#s2-b-mid-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.9);
    for (let i = 0; i < 9; i++) {
      const r = Math.floor(i / 3), c = i % 3, t = 5.8 + i * 0.22;
      tl.to("#s2-b-win", { attr: { x: 40 + c * C, y: 380 + r * C }, duration: 0.15, ease: "power2.inOut" }, t);
      tl.fromTo(bMid[i], { opacity: 0 }, { opacity: 1, duration: 0.2 }, t + 0.1);
    }
    // Вторая 3×3 на промежуточной карте → один выход
    tl.fromTo("#s2-b-win2", { opacity: 0, scale: 0.7, svgOrigin: "400 480" }, { opacity: 1, scale: 1, svgOrigin: "400 480", duration: 0.4, ease: "power2.out" }, 8.0);
    arrow("#s2-b-ar2", "#s2-b-ah2", 8.3);
    tl.fromTo("#s2-b-out", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.7);
    // Receptive field выхода — вся область 5×5 входа (периметр 800)
    tl.to("#s2-b-win", { opacity: 0.35, duration: 0.3 }, 8.8);
    tl.fromTo("#s2-b-rf", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "800 9999" }, duration: 0.8, ease: "power2.inOut" }, 8.9);
    tl.fromTo("#s2-b-rf-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.3);
    tl.fromTo("#s2-b-w", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.7);
    tl.fromTo("#s2-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 9.4);
    tl.fromTo("#s2-r1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.8);
    tl.fromTo("#s2-r2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.3);
    cap("#s2-cap2", 4.9, 10.6);
    // Нелинейности между слоями
    tl.fromTo("#s2-relu", { opacity: 0, scale: 0.8, svgOrigin: "288 515" }, { opacity: 1, scale: 1, svgOrigin: "288 515", duration: 0.4, ease: "back.out(1.6)" }, 10.9);
    tl.fromTo("#s2-relu-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.1);
    tl.fromTo("#s2-r3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 11.2);
    cap("#s2-cap3", 10.8, 13.5);
    tl.to("#s2-wrap", { opacity: 0, duration: 0.4 }, 13.55);
    window.__timelines["s2"] = tl;
  })();
</script>
</template>
</body></html>
