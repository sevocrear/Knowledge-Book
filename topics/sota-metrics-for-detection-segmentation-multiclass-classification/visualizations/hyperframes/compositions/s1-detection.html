<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><title>s1</title></head>
<body>
<template>
<link rel="stylesheet" href="theme.css" />
<style>
  #s1-svg { position: absolute; left: 0; top: 0; width: 980px; height: 660px; display: block; }
  #s1-c1 { left: 1060px; top: 0px; width: 700px; }
  #s1-c2 { left: 1060px; top: 226px; width: 700px; }
  #s1-c3 { left: 1060px; top: 440px; width: 700px; }
  .s1-sub { font-size: 27px; color: #aab3c2; margin-top: 8px; line-height: 1.3; }
</style>
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div id="s1-wrap" class="wrap">
    <div class="head"><div class="pill">1 / 3</div><div class="title">Как считают COCO AP в детекции?</div></div>
    <div class="badge">Knowledge Book · Metrics</div>
    <div class="stage">
      <svg id="s1-svg" viewBox="0 0 980 660">
        <!-- «картинка» с GT-боксом и предсказанием -->
        <g id="s1-img" opacity="0">
          <rect x="40" y="60" width="420" height="320" rx="14" fill="#161a24" stroke="#2a3140" stroke-width="3"/>
          <text x="52" y="44" fill="#aab3c2" font-size="22">картинка · GT и предсказание</text>
        </g>
        <rect id="s1-inter" x="135" y="135" width="135" height="145" fill="#ff7a2f" opacity="0"/>
        <rect id="s1-gt" x="110" y="120" width="160" height="160" fill="none" stroke="#3dba7a" stroke-width="6" stroke-dasharray="0 9999"/>
        <rect id="s1-pr" x="135" y="135" width="160" height="160" fill="none" stroke="#4a9eff" stroke-width="6" stroke-dasharray="0 9999"/>
        <text id="s1-gt-lbl" x="110" y="108" fill="#3dba7a" font-size="24" font-weight="700" opacity="0">GT</text>
        <text id="s1-pr-lbl" x="300" y="318" fill="#4a9eff" font-size="24" font-weight="700" opacity="0">pred · conf 0.91</text>
        <text id="s1-iou-lbl" x="250" y="362" text-anchor="middle" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0">IoU ≈ 0.62 ≥ τ = 0.5 → match ✓</text>
        <!-- PR-кривая -->
        <g id="s1-axes" opacity="0">
          <line x1="560" y1="380" x2="940" y2="380" stroke="#aab3c2" stroke-width="3"/>
          <line x1="560" y1="380" x2="560" y2="80" stroke="#aab3c2" stroke-width="3"/>
          <text x="940" y="412" text-anchor="end" fill="#aab3c2" font-size="22">recall → 1</text>
          <text x="548" y="72" text-anchor="end" fill="#aab3c2" font-size="22">precision</text>
          <text x="548" y="388" text-anchor="end" fill="#aab3c2" font-size="22">0</text>
          <text x="750" y="44" text-anchor="middle" fill="#aab3c2" font-size="22">кривая precision–recall при τ = 0.5</text>
        </g>
        <polygon id="s1-area" points="" fill="#ff7a2f" opacity="0"/>
        <polyline id="s1-curve" points="" fill="none" stroke="#4a9eff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 9999" opacity="0"/>
        <text id="s1-ap-lbl" x="690" y="300" text-anchor="middle" fill="#ff7a2f" font-size="30" font-weight="700" opacity="0">AP<tspan font-size="20" dy="8">τ</tspan><tspan dy="-8"> = площадь</tspan></text>
        <!-- sweep по порогам IoU -->
        <text id="s1-sw-ttl" x="60" y="452" fill="#aab3c2" font-size="22" opacity="0">AP при каждом пороге IoU τ (иллюстративно)</text>
        <g id="s1-bars"></g>
        <line id="s1-mean" x1="60" y1="565" x2="952" y2="565" stroke="#ff7a2f" stroke-width="4" stroke-dasharray="14 10" opacity="0"/>
        <text id="s1-mean-lbl" x="952" y="500" text-anchor="end" fill="#ff7a2f" font-size="26" font-weight="700" opacity="0">AP@[.50:.95] = 0.50</text>
        <text id="s1-ap50" x="92" y="498" text-anchor="middle" fill="#3dba7a" font-size="22" font-weight="700" opacity="0">AP50</text>
        <text id="s1-ap75" x="552" y="526" text-anchor="middle" fill="#3dba7a" font-size="22" font-weight="700" opacity="0">AP75</text>
      </svg>
      <div id="s1-c1" class="card"><div class="h">IoU и матчинг с GT</div>
        <div class="f">IoU = |B<sub>gt</sub> ∩ B<sub>pred</sub>| / |B<sub>gt</sub> ∪ B<sub>pred</sub>|</div>
        <div class="s1-sub">предсказание засчитано, если IoU ≥ <span class="o">τ</span> (например, 0.5); matching greedy по confidence</div></div>
      <div id="s1-c2" class="card"><div class="h">AP при пороге τ</div>
        <div class="f">AP<sub>τ</sub> = ∫<sub>0</sub><sup>1</sup> p(r) dr</div>
        <div class="s1-sub">площадь под кривой precision–recall: качество ранжирования confidence</div></div>
      <div id="s1-c3" class="card"><div class="h">COCO AP</div>
        <div class="f">AP = <span class="o">1/10</span> · Σ AP<sub>τ</sub>,&nbsp; τ = 0.50 … 0.95</div>
        <div class="s1-sub">в таблицах: <b>AP</b>, AP50, AP75, AP<sub>S</sub>/AP<sub>M</sub>/AP<sub>L</sub></div></div>
    </div>
    <div class="caps">
      <div id="s1-cap1" class="cap">Бокс совпал с GT, если <b>IoU = |∩| / |∪|</b> ≥ порога <b class="o">τ</b>: здесь IoU ≈ 0.62 ≥ 0.5 — match (иллюстративно)</div>
      <div id="s1-cap2" class="cap">Предсказания ранжируем по confidence → кривая <b class="b">precision–recall</b>; <b class="o">AP<sub>τ</sub></b> — площадь под ней</div>
      <div id="s1-cap3" class="cap"><b>COCO AP</b> — среднее AP по 10 порогам IoU 0.50…0.95. AP50 мягче; <b class="o">AP@[.50:.95]</b> — жёстче и стандарт SOTA</div>
    </div>
  </div>
</div>
<script>
  (() => {
    const NS = "http://www.w3.org/2000/svg";
    // PR-кривая: точки (recall, precision) — иллюстративные константы
    const pr = [[0, 1.0], [0.1, 0.98], [0.2, 0.96], [0.3, 0.92], [0.4, 0.87], [0.5, 0.81], [0.6, 0.72], [0.7, 0.60], [0.8, 0.44], [0.9, 0.24], [1.0, 0.06]];
    const X0 = 560, Y0 = 380, W = 380, H = 300;
    const px = pr.map(([r, p]) => [X0 + r * W, Y0 - p * H]);
    document.getElementById("s1-curve").setAttribute("points", px.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "));
    document.getElementById("s1-area").setAttribute("points", [[X0, Y0], ...px, [X0 + W, Y0]].map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" "));
    let curveLen = 0;
    for (let i = 1; i < px.length; i++) curveLen += Math.hypot(px[i][0] - px[i - 1][0], px[i][1] - px[i - 1][1]);
    // Sweep: AP_τ для τ = 0.50 … 0.95 (иллюстративно), среднее = 0.50
    const taus = ["0.50", "0.55", "0.60", "0.65", "0.70", "0.75", "0.80", "0.85", "0.90", "0.95"];
    const aps = [0.72, 0.70, 0.67, 0.63, 0.58, 0.52, 0.45, 0.36, 0.25, 0.12];
    const BASE = 630, BH = 130, BW = 64, STEP = 92, BX = 60;
    const gB = document.getElementById("s1-bars");
    const bars = [];
    aps.forEach((v, i) => {
      const x = BX + i * STEP, h = v * BH;
      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("id", `s1-bar-${i}`); rect.setAttribute("x", x); rect.setAttribute("y", BASE); rect.setAttribute("width", BW); rect.setAttribute("height", 0);
      rect.setAttribute("rx", 6); rect.setAttribute("fill", i === 0 || i === 5 ? "#3dba7a" : "#4a9eff");
      const lbl = document.createElementNS(NS, "text");
      lbl.setAttribute("id", `s1-tau-${i}`); lbl.setAttribute("x", x + BW / 2); lbl.setAttribute("y", BASE + 26); lbl.setAttribute("text-anchor", "middle");
      lbl.setAttribute("fill", "#aab3c2"); lbl.setAttribute("font-size", "20"); lbl.setAttribute("opacity", "0"); lbl.textContent = taus[i];
      const val = document.createElementNS(NS, "text");
      val.setAttribute("id", `s1-apv-${i}`); val.setAttribute("x", x + BW / 2); val.setAttribute("y", BASE - h - 8); val.setAttribute("text-anchor", "middle");
      val.setAttribute("fill", "#f0f4ff"); val.setAttribute("font-size", "19"); val.setAttribute("opacity", "0"); val.setAttribute("stroke", "#0f1117"); val.setAttribute("stroke-width", "7"); val.setAttribute("paint-order", "stroke"); val.textContent = v.toFixed(2);
      gB.appendChild(rect); gB.appendChild(lbl); gB.appendChild(val); bars.push({ rect, lbl, val, h });
    });

    const tl = gsap.timeline({ paused: true });
    const cap = (id, t0, t1) => { tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, t0); tl.to(id, { opacity: 0, duration: 0.35 }, t1); };
    tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
    // 1. IoU и matching
    tl.fromTo("#s1-img", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.3);
    tl.fromTo("#s1-gt", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "640 9999" }, duration: 0.7, ease: "power2.inOut" }, 0.6);
    tl.fromTo("#s1-gt-lbl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.1);
    tl.fromTo("#s1-pr", { attr: { "stroke-dasharray": "0 9999" } }, { attr: { "stroke-dasharray": "640 9999" }, duration: 0.7, ease: "power2.inOut" }, 1.3);
    tl.fromTo("#s1-pr-lbl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.8);
    tl.fromTo("#s1-inter", { opacity: 0 }, { opacity: 0.45, duration: 0.5 }, 2.2);
    tl.fromTo("#s1-iou-lbl", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4 }, 2.7);
    tl.fromTo("#s1-c1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.4);
    cap("#s1-cap1", 0.6, 5.0);
    // 2. PR-кривая и AP_τ
    tl.fromTo("#s1-axes", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.2);
    tl.fromTo("#s1-curve", { opacity: 0, attr: { "stroke-dasharray": "0 9999" } }, { opacity: 1, attr: { "stroke-dasharray": curveLen.toFixed(1) + " 9999" }, duration: 1.4, ease: "power2.inOut" }, 5.6);
    tl.fromTo("#s1-area", { opacity: 0 }, { opacity: 0.28, duration: 0.6 }, 7.0);
    tl.fromTo("#s1-ap-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.4);
    tl.fromTo("#s1-c2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 5.8);
    cap("#s1-cap2", 5.2, 9.6);
    // 3. Sweep по 10 порогам IoU → среднее
    tl.fromTo("#s1-sw-ttl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.8);
    bars.forEach(({ rect, lbl, val, h }, i) => {
      const t = 10.0 + 0.16 * i;
      tl.fromTo(rect, { attr: { y: BASE, height: 0 } }, { attr: { y: BASE - h, height: h }, duration: 0.4, ease: "power2.out" }, t);
      tl.fromTo(lbl, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t);
      tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t + 0.25);
    });
    tl.fromTo("#s1-ap50", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 10.6);
    tl.fromTo("#s1-ap75", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 11.2);
    tl.fromTo("#s1-mean", { opacity: 0, attr: { x2: 60 } }, { opacity: 1, attr: { x2: 952 }, duration: 0.8, ease: "power2.inOut" }, 11.8);
    tl.fromTo("#s1-mean-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 12.4);
    tl.fromTo("#s1-c3", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 10.2);
    cap("#s1-cap3", 9.8, 14.5);
    tl.to("#s1-wrap", { opacity: 0, duration: 0.4 }, 14.55);
    window.__timelines["s1"] = tl;
  })();
</script>
</template>
</body></html>
