[project]
name = "knowledge-book"
version = "0.1.0"
description = "Книга знаний по Deep Learning и AI с заметками, готовыми для Obsidian/RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]
tools = [
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2026.3.17",
    "secretstorage>=3.3.3",
]

[tool.pytest.ini_options]
markers = [
    "hyperframes: runs `npx hyperframes check` on topic compositions (Node 22+, ffmpeg; enable with KB_RUN_HYPERFRAMES=1)",
]
